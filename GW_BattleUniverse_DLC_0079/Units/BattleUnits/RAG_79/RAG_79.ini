[hiddenAction_EF_AquaMissileLauncher_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and self.resource().EquipmentIndex==0 
and memory.armRBreaked==false 
and eventData("RandomWeapon",type="float")>50 
"""

[hiddenAction_EF_AquaMissileLauncher_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[decal_EF_AquaMissileLauncher]
isVisible:if memory.nowWeaponIndex==0 and self.resource().EquipmentIndex==0 and memory.armRBreaked==false
[decal_EF_AquaMissileLauncher_NotUsing]
