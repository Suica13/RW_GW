name:JotunheimClass

displayText:Jotunheim Class
displayText_zh:尤顿海姆级

displayDescription:"""
\nAn experimental support ship converted from a civilian transport vessel,  
\nused by Zeon's 603rd Technical Evaluation Unit to test various new weapons and Mobile Suits  
\nAdvantages  
\n=High transport capacity=  
\n=Supply unit=  
\n=Allows communication command=  
\n=Auto-repairs when out of combat=  
\n=Transport Capacity: 4x2=  
\n= Can disperse Minovsky particles =
\nDisadvantages  
\n=Extremely large size=  
\n=-200 range to radar stealth=  
\n=Reveals nearby vision when detected=  
\n=Lacks combat ability=  
\n  
\n"All mobile units, launch!"
"""
displayDescription_zh:"""
\n由民用运输舰改造而来的试验型支援舰
\n吉翁军第603技术试验部队用来测试各类新型兵器和MS
\n优势
\n=补给单位=
\n=脱战自动修复=
\n=允许通信指挥=
\n=运输力:4x2=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负200码反侦测=
\n=被发现时暴露视野=
\n=缺乏战斗能力=
\n
\n“现在我会把最后的作战录像发送过去”
"""



