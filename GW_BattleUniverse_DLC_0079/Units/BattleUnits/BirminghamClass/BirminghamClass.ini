tags:BirminghamClass,Unit,CmdUnit,Ship,EFSF,0079,UC,LargeUnit,MpUpUnit_X8
name:BirminghamClass

displayText:Birmingham Class
displayText_zh:伯明翰级

displayDescription:"""
\nA tragic warship that carried the ambition of “big guns and big ships” 
\nAdvantages  
\n=Well-armed=  
\n=Can ReEntry=
\n=Allows command defense=  
\n=Allows communication-based command=
\n=Auto-repairs when out of combat=  
\n= Can disperse Minovsky particles =
\nDisadvantages  
\n=Massive size=  
\n=-250m to stealth detection=  
\n=Reveals vision when detected=  
\n  
\n“If the parade is held as scheduled, then Zeon remnants will no longer be anything to fear.” 
"""
displayDescription_zh:"""
\n承载“大舰巨炮”野心的悲剧战舰
\n优势
\n=火力充沛=
\n=可以打上宇宙=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“阅兵仪式如期举行的话,吉翁残党什么的就已经不足为惧了吧”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:BirminghamClass


displayRadius:50
radius:50

maxHp:225000
maxShield:0

