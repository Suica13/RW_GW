[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:GallopClass_Turret_AA
displayText:GallopClass AA
displayText_zh:盖洛普级 对空炮

maxHp: 10000

@memory GallopClass_Turret_AA_OnCD:bool
@memory GallopClass_Turret_AA_CDTimer:float
@global GallopClass_Turret_AA_CD=2
@global GallopClass_Turret_AA_EN=0.5

@global GallopClass_Turret_AA_Shoot=10
[resource_GallopClass_Turret_AA_ShootTimer]
hidden:true



#AA炮用

[decal_Burned]
imageScale:0.75
[decal_Stun]
imageScale:0.425
[decal_LowHp]
imageScale:0.5
[decal_Marker]
imageScale:0.25



[decal_GallopClass_Turret_AA]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/GallopClass/Image/GallopClass_Turret_AA_1.png
imageScale:0.85
basePositionFromTurret:GallopClass_Turret_AA






[turret_GallopClass_Turret_AA]
x:0
y:0

canShoot:true
onShoot_triggerActions:GallopClass_Turret_AA_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:GallopClass_Turret_AA_Projectile
resourceUsage:GallopClass_Turret_AA_ShootTimer=1

delay:0.15s
canAttackMaxAngle:15
limitingAngle:90
limitingRange:600
barrelX:2
barrelY:6
barrelOffsetX_onOddShots:-4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:6
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_GallopClass_Turret_AA_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:250
    |ShellAPDamage:50
    |DpDamage:5
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=1.25 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:90
    |ProjectileSpread:6
    |ProjectileLife:7.5
)
"""


[hiddenAction_GallopClass_Turret_AA_CDStart]
autoTrigger:"""
if memory.GallopClass_Turret_AA_OnCD==false 
and 
(
    (
        self.resource.GallopClass_Turret_AA_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.GallopClass_Turret_AA_ShootTimer<${GallopClass_Turret_AA_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:GallopClass_Turret_AA_OnCD=true,GallopClass_Turret_AA_CDTimer=self.timeAlive+${GallopClass_Turret_AA_CD}

[hiddenAction_GallopClass_Turret_AA_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.GallopClass_Turret_AA_OnCD==true and self.timeAlive>memory.GallopClass_Turret_AA_CDTimer
setUnitMemory:GallopClass_Turret_AA_OnCD=false
setResourcesWithLogic:GallopClass_Turret_AA_ShootTimer=${GallopClass_Turret_AA_Shoot}

[hiddenAction_GallopClass_Turret_AA_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${GallopClass_Turret_AA_EN}