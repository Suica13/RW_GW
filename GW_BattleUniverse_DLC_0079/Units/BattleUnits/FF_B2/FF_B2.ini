[hiddenAction_Common_DoubleVulcan_FF_B2_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>=0  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and self.resource().EquipmentIndex==0 
and eventData("RandomWeapon",type="float")>=25
"""

[hiddenAction_Common_DoubleVulcan_FF_B2_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0



[hiddenAction_Common_DoubleMS_FF_B2_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>=150   
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and self.resource().EquipmentIndex==0 
and not self.attacking.tags(includes='AirUnit') 
and eventData("RandomWeapon",type="float")<=25
"""

[hiddenAction_Common_DoubleMS_FF_B2_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0


[hiddenAction_Common_Bomb_FF_B2_Trigger]
