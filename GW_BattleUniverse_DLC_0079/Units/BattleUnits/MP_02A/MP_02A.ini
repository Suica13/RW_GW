[hiddenAction_ZN_120mmMG_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and 
(
    self.resource().EquipmentIndex==0 
    or 
    self.resource().EquipmentIndex==2 
) 
and eventData("RandomWeapon",type="float")>=50 
"""

[hiddenAction_ZN_120mmMG_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0


[decal_ZN_120mmMG]
isVisible:if memory.nowWeaponIndex==0 and (self.resource().EquipmentIndex==0 or self.resource().EquipmentIndex==2)
basePositionFromLegEnd:arm2
xOffsetRelative: 12
yOffsetRelative: 0
[turret_ZN_120mmMG]
barrelX:12.5
barrelY:15



