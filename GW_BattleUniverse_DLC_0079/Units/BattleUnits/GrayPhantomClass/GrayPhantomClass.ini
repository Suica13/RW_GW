tags:GrayPhantomClass,Unit,CmdUnit,Ship,EFSF,0079,UC,LargeUnit,MpUpUnit_X16
name:GrayPhantomClass

displayText:GrayPhantom Class
displayText_zh:灰色幽灵级

displayDescription:"""
\nAn improved model of the Pegasus-class, with enhanced overall performance
\nAdvantages  
\n=Powerful firepower=  
\n=High durability=  
\n=Can ReEntry Free=
\n=Allows command defense=  
\n=Allows communication-based command=
\n=Automatic repair when out of combat=  
\n=Transport capacity: 6x2=  
\n= Can disperse Minovsky particles =
\nDisadvantages  
\n=Massive size=  
\n=-200 yards stealth detection=  
\n=Reveals vision when spotted=  
\n  
\n"Scarlet Team, launch!"
"""
displayDescription_zh:"""
\n飞马级的改良型,综合性能有所强化
\n优势
\n=火力充沛=
\n=耐久较高=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=可以自由穿梭大气层=
\n=运输力:8x2=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负200码反侦测=
\n=被发现时暴露视野=
\n
\n“斯卡雷特队,出击!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:GrayPhantomClass


displayRadius:75
radius:75

maxHp:140000
maxShield:0

@global cmdComRangeExtra=150
@global cmdDefRangeExtra=150
