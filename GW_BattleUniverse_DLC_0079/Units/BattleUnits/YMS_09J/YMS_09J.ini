name:YMS_09J

displayText:Dom High Speed Experimental Type
displayText_zh:大魔高速实验型

displayDescription:"""
\nHigh-mobility prototype of the Dom, equipped with a large heat axe
\nAdvantages
\n=Excels at hit-and-run tactics=
\n=High resistance to ballistic weapons=
\n=High speed=
\nDisadvantages
\n=Unable to move at combat speed if legs are damaged=
\n=Combat speed consumes more supplies=
\n=Weak structural integrity=
\n=Prone to losing balance=
\n=Poor reaction time=
\n
\n“I'll head to the frontlines to fight.”
"""
displayDescription_zh:"""
\n大魔的高机动试作型,装备了大型电热斧
\n优势
\n=擅长一击脱离=
\n=实弹抗性较高=
\n=速度较快=
\n劣势
\n=腿部损坏时无法以战时速度移动=
\n=战时速度消耗补给量提升=
\n=结构强度较差=
\n=容易失衡=
\n=反应较差=
\n
\n“我去前线战斗”
"""

