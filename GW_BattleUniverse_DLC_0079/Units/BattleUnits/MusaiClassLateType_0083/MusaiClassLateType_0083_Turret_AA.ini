[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:MusaiClassLateType_0083_Turret_AA
displayText:MusaiClassLateType_0083 AA
displayText_zh:姆塞级后期型 对空炮

maxHp: 6500


@memory MusaiClassLateType_0083_Turret_AA_OnCD:bool
@memory MusaiClassLateType_0083_Turret_AA_CDTimer:float
@global MusaiClassLateType_0083_Turret_AA_CD=2
@global MusaiClassLateType_0083_Turret_AA_EN=0.5

@global MusaiClassLateType_0083_Turret_AA_Shoot=10
[resource_MusaiClassLateType_0083_Turret_AA_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2



[decal_MusaiClassLateType_0083_Turret_AA]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/MusaiClassLateType_0083/Image/MusaiClassLateType_0083_Turret_AA_1.png
imageScale:1
basePositionFromTurret:MusaiClassLateType_0083_Turret_AA






[turret_MusaiClassLateType_0083_Turret_AA]
x:0
y:0

canShoot:true
onShoot_triggerActions:MusaiClassLateType_0083_Turret_AA_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:MusaiClassLateType_0083_Turret_AA_Projectile
resourceUsage:MusaiClassLateType_0083_Turret_AA_ShootTimer=1

delay:0.15s
canAttackMaxAngle:60
limitingAngle:120
limitingRange:600
barrelX:2
barrelY:6
barrelOffsetX_onOddShots:-4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_MusaiClassLateType_0083_Turret_AA_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:200
    |ShellAPDamage:75
    |DpDamage:5
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1.5
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:90
    |ProjectileSpread:6
    |ProjectileLife:7.5
)
"""


[hiddenAction_MusaiClassLateType_0083_Turret_AA_CDStart]
autoTrigger:"""
if memory.MusaiClassLateType_0083_Turret_AA_OnCD==false 
and 
(
    (
        self.resource.MusaiClassLateType_0083_Turret_AA_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.MusaiClassLateType_0083_Turret_AA_ShootTimer<${MusaiClassLateType_0083_Turret_AA_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:MusaiClassLateType_0083_Turret_AA_OnCD=true,MusaiClassLateType_0083_Turret_AA_CDTimer=self.timeAlive+${MusaiClassLateType_0083_Turret_AA_CD}

[hiddenAction_MusaiClassLateType_0083_Turret_AA_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.MusaiClassLateType_0083_Turret_AA_OnCD==true and self.timeAlive>memory.MusaiClassLateType_0083_Turret_AA_CDTimer
setUnitMemory:MusaiClassLateType_0083_Turret_AA_OnCD=false
setResourcesWithLogic:MusaiClassLateType_0083_Turret_AA_ShootTimer=${MusaiClassLateType_0083_Turret_AA_Shoot}

[hiddenAction_MusaiClassLateType_0083_Turret_AA_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${MusaiClassLateType_0083_Turret_AA_EN}