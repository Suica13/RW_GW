tags:GawClass,Unit,CmdUnit,Ship,ZEON,0079,UC,LargeUnit,MpUpUnit_X6
name:GawClass

displayText:Gaw Class
displayText_zh:加乌级

displayDescription:"""
\nA large aircraft carrier built by Zeon, also usable for bombing operations  
\nAdvantages  
\n=Powerful firepower=  
\n=High durability=  
\n=Allows communication command=  
\n=Automatic repair out of combat=  
\n=Transport capacity: 6+3x2=  
\n=25% reduced damage from buildings=  
\n=Equipped with a large number of bombs for bombing=  
\n=Can disperse Minovsky particles=  
\nDisadvantages  
\n=Extremely large size=  
\n=-200 range to anti-detection=  
\n=Reveals vision when discovered=  
\n  
\n"Char, you set me up! Char!"
"""
displayDescription_zh:"""
\n吉翁军所建造的大型空母,亦可用于轰炸计划
\n优势
\n=火力充沛=
\n=耐久较高=
\n=允许通信指挥=
\n=脱战自动修复=
\n=运输力:6+3x2=
\n=受到建筑伤害减少35%=
\n=装备大量炸弹用于轰炸=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负200码反侦测=
\n=被发现时暴露视野=
\n
\n“夏亚,你算计我!夏亚!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:GawClass


displayRadius:75
radius:75

maxHp:60000
maxShield:0

@global cmdComRangeExtra=150
@global supplyPointRangeExtra=150

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/GawClass.png
drawLayer:air

[attack]
isFixedFiring:false
turretMultiTargeting:true


[movement]
movementType: AIR
moveDecelerationSpeed: 0.035
reverseSpeedPercentage:0.0

