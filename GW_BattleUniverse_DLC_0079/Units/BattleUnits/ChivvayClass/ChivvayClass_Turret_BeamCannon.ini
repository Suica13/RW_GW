[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Yellow.gw
"""

name:ChivvayClass_Turret_BeamCannon
displayText:ChivvayClass BeamCannon
displayText_zh:契贝级 光束炮

maxHp: 13500

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory ChivvayClass_Turret_BeamCannon_OnCD:bool
@memory ChivvayClass_Turret_BeamCannon_CDTimer:float
@global ChivvayClass_Turret_BeamCannon_CD=4
@global ChivvayClass_Turret_BeamCannon_EN=60

@global ChivvayClass_Turret_BeamCannon_Shoot=3
[resource_ChivvayClass_Turret_BeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground



[decal_ChivvayClass_Turret_BeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/ChivvayClass/Image/ChivvayClass_Turret_BeamCannon_1.png
imageScale:1.25
basePositionFromTurret:ChivvayClass_Turret_BeamCannon






[turret_ChivvayClass_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,ChivvayClass_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:ChivvayClass_Turret_BeamCannon_Projectile
resourceUsage:ChivvayClass_Turret_BeamCannon_ShootTimer=1

delay:0.0s
canAttackMaxAngle:15
limitingAngle:95
limitingRange:1200
barrelX:3
barrelY:12
barrelOffsetX_onOddShots:-6
turnSpeed:0.75

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Yellow




[projectile_ChivvayClass_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_AP_BeamRifle_Yellow*1
(
    addResources=
    BeamDamage:5500
    |DpDamage:100
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.5
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.5
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:45
    |ProjectileSpread:2
    |ProjectileLife:50

    |ProjectileAttackTimes:2
    |ProjectileAttackTimesDamageModifier:0.5
)
"""


[hiddenAction_ChivvayClass_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.ChivvayClass_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.ChivvayClass_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.ChivvayClass_Turret_BeamCannon_ShootTimer<${ChivvayClass_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:ChivvayClass_Turret_BeamCannon_OnCD=true,ChivvayClass_Turret_BeamCannon_CDTimer=self.timeAlive+${ChivvayClass_Turret_BeamCannon_CD}

[hiddenAction_ChivvayClass_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.ChivvayClass_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.ChivvayClass_Turret_BeamCannon_CDTimer
setUnitMemory:ChivvayClass_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:ChivvayClass_Turret_BeamCannon_ShootTimer=${ChivvayClass_Turret_BeamCannon_Shoot}

[hiddenAction_ChivvayClass_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${ChivvayClass_Turret_BeamCannon_EN}