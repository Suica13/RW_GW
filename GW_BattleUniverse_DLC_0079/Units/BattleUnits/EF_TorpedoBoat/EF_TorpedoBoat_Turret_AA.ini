[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanNotBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:EF_TorpedoBoat_Turret_AA
displayText:EF_TorpedoBoat_Turret_AA
displayText_zh:EF_TorpedoBoat_Turret_AA

maxHp: 10000


@memory EF_TorpedoBoat_Turret_AA_OnCD:bool
@memory EF_TorpedoBoat_Turret_AA_CDTimer:float
@global EF_TorpedoBoat_Turret_AA_CD=3
@global EF_TorpedoBoat_Turret_AA_EN=0

@global EF_TorpedoBoat_Turret_AA_Shoot=10
[resource_EF_TorpedoBoat_Turret_AA_ShootTimer]
hidden:true



[decal_EF_TorpedoBoat_Turret_AA]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/EF_TorpedoBoat/Image/EF_TorpedoBoat_Turret_AA_1.png
imageScale:0.65
basePositionFromTurret:EF_TorpedoBoat_Turret_AA



[turret_EF_TorpedoBoat_Turret_AA]
x:0
y:0

canShoot:true
onShoot_triggerActions:EF_TorpedoBoat_Turret_AA_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:EF_TorpedoBoat_Turret_AA_Projectile
resourceUsage:EF_TorpedoBoat_Turret_AA_ShootTimer=1

delay:0.1s
canAttackMaxAngle:3
limitingAngle:360
limitingRange:400
barrelX:0
barrelY:4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_EF_TorpedoBoat_Turret_AA_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:50
    |DpDamage:1.5
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=2
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2.0
    |HeightHitRange=25
    |ProjectileSpeed:100
    |ProjectileSpread:6
    |ProjectileLife:8
)
"""


[hiddenAction_EF_TorpedoBoat_Turret_AA_CDStart]
autoTrigger:"""
if memory.EF_TorpedoBoat_Turret_AA_OnCD==false 
and 
(
    (
        self.resource.EF_TorpedoBoat_Turret_AA_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.EF_TorpedoBoat_Turret_AA_ShootTimer<${EF_TorpedoBoat_Turret_AA_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:EF_TorpedoBoat_Turret_AA_OnCD=true,EF_TorpedoBoat_Turret_AA_CDTimer=self.timeAlive+${EF_TorpedoBoat_Turret_AA_CD}

[hiddenAction_EF_TorpedoBoat_Turret_AA_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.EF_TorpedoBoat_Turret_AA_OnCD==true and self.timeAlive>memory.EF_TorpedoBoat_Turret_AA_CDTimer
setUnitMemory:EF_TorpedoBoat_Turret_AA_OnCD=false
setResourcesWithLogic:EF_TorpedoBoat_Turret_AA_ShootTimer=${EF_TorpedoBoat_Turret_AA_Shoot}

[hiddenAction_EF_TorpedoBoat_Turret_AA_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${EF_TorpedoBoat_Turret_AA_EN}