[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:PegasusClass_Turret_Cannon_S
displayText:PegasusClass MainCannon
displayText_zh:飞马级 主炮

maxHp: 15000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory PegasusClass_Turret_Cannon_S_OnCD:bool
@memory PegasusClass_Turret_Cannon_S_CDTimer:float
@global PegasusClass_Turret_Cannon_S_CD=8
@global PegasusClass_Turret_Cannon_S_EN=40

@global PegasusClass_Turret_Cannon_S_Shoot=2
[resource_PegasusClass_Turret_Cannon_S_ShootTimer]
hidden:true


[graphics]
drawLayer:ground2


[decal_PegasusClass_Turret_Cannon_S]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/PegasusClass/Image/PegasusClass_Turret_Cannon_1.png
imageScale:0.90
basePositionFromTurret:PegasusClass_Turret_Cannon_S




[turret_PegasusClass_Turret_Cannon_S]
x:0
y:0

canShoot:false
onShoot_triggerActions:SendEnemyTryAttack_Shoot,PegasusClass_Turret_Cannon_S_Send_UseEN
canOnlyAttackUnitsWithoutTags:AirUnit
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false 
and memory.onSkill==false 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:PegasusClass_Turret_Cannon_S_Projectile
resourceUsage:PegasusClass_Turret_Cannon_S_ShootTimer=1

delay:3s
canAttackMaxAngle:3
limitingAngle:120
limitingMinRange:150
limitingRange:1200
barrelX:0
barrelY:35
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:420
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/ShellCannon_5.ogg
shoot_sound_vol:0.6
shoot_flame:BZ_Fire_1
[turret_PegasusClass_Turret_Cannon_S_L]
@copyFromSection:turret_PegasusClass_Turret_Cannon_S
attachedTo:PegasusClass_Turret_Cannon_S
x:4
canShoot:true
limitingAngle:15
[turret_PegasusClass_Turret_Cannon_S_R]
@copyFromSection:turret_PegasusClass_Turret_Cannon_S
attachedTo:PegasusClass_Turret_Cannon_S
x:-4
canShoot:true
limitingAngle:15



[projectile_PegasusClass_Turret_Cannon_S_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Mortar_L*1
(
    addResources=
    ShellDamage:8000
    |DpDamage:500
    |WeaponAccuracy=75
    |PartBreakModifier=0.5
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1.5
    |AntiAqua=0.75
    |AntiAir=0.5 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=0.5
    |HeightHitRange=10
    |ProjectileSpeed:40
    |ProjectileSpread:0
    |ProjectileExplosionRange:75
    |ProjectileLife:50
)
"""


[hiddenAction_PegasusClass_Turret_Cannon_S_CDStart]
autoTrigger:"""
if memory.PegasusClass_Turret_Cannon_S_OnCD==false 
and 
(
    (
        self.resource.PegasusClass_Turret_Cannon_S_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.PegasusClass_Turret_Cannon_S_ShootTimer<${PegasusClass_Turret_Cannon_S_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:PegasusClass_Turret_Cannon_S_OnCD=true,PegasusClass_Turret_Cannon_S_CDTimer=self.timeAlive+${PegasusClass_Turret_Cannon_S_CD}

[hiddenAction_PegasusClass_Turret_Cannon_S_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.PegasusClass_Turret_Cannon_S_OnCD==true and self.timeAlive>memory.PegasusClass_Turret_Cannon_S_CDTimer
setUnitMemory:PegasusClass_Turret_Cannon_S_OnCD=false
setResourcesWithLogic:PegasusClass_Turret_Cannon_S_ShootTimer=${PegasusClass_Turret_Cannon_S_Shoot}



[hiddenAction_PegasusClass_Turret_Cannon_S_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${PegasusClass_Turret_Cannon_S_EN}


