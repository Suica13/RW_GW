[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Yellow.gw
"""

name:FalmerClass_Turret_BeamCannon
displayText:FalmerClass BeamCannon
displayText_zh:法梅尔级 光束炮

maxHp: 7500


isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory FalmerClass_Turret_BeamCannon_OnCD:bool
@memory FalmerClass_Turret_BeamCannon_CDTimer:float
@global FalmerClass_Turret_BeamCannon_CD=7
@global FalmerClass_Turret_BeamCannon_EN=30

@global FalmerClass_Turret_BeamCannon_Shoot=2
[resource_FalmerClass_Turret_BeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground



[decal_FalmerClass_Turret_BeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/FalmerClass/Image/FalmerClass_Turret_BeamCannon_1.png
imageScale:1.15
basePositionFromTurret:FalmerClass_Turret_BeamCannon






[turret_FalmerClass_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,FalmerClass_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:FalmerClass_Turret_BeamCannon_Projectile
resourceUsage:FalmerClass_Turret_BeamCannon_ShootTimer=1

delay:0.0s
canAttackMaxAngle:15
limitingAngle:95
limitingRange:1200
barrelX:3
barrelY:12
barrelOffsetX_onOddShots:-6
turnSpeed:0.75

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Yellow




[projectile_FalmerClass_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamRifle_Yellow*1
(
    addResources=
    BeamDamage:4250
    |DpDamage:150
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:45
    |ProjectileSpread:3
    |ProjectileLife:50
)
"""


[hiddenAction_FalmerClass_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.FalmerClass_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.FalmerClass_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.FalmerClass_Turret_BeamCannon_ShootTimer<${FalmerClass_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:FalmerClass_Turret_BeamCannon_OnCD=true,FalmerClass_Turret_BeamCannon_CDTimer=self.timeAlive+${FalmerClass_Turret_BeamCannon_CD}

[hiddenAction_FalmerClass_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.FalmerClass_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.FalmerClass_Turret_BeamCannon_CDTimer
setUnitMemory:FalmerClass_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:FalmerClass_Turret_BeamCannon_ShootTimer=${FalmerClass_Turret_BeamCannon_Shoot}

[hiddenAction_FalmerClass_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${FalmerClass_Turret_BeamCannon_EN}