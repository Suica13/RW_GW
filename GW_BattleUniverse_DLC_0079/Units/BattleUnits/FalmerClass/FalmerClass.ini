displayText_zh:法梅尔级

displayDescription:"""
\nCommander-type variant of the Musai-class
\nAdvantages  
\n=Strong frontal firepower=  
\n=Auto-repairs when out of combat=  
\n=Allows communication command=  
\n=Transport Capacity: 6=
\n= Can disperse Minovsky particles =
\nDisadvantages  
\n=Extremely large size=  
\n=-200 range to radar stealth=  
\n=Reveals nearby vision when detected=  
\n  
\n"Glory to the Principality of Zeon!"
"""
displayDescription_zh:"""
\n姆塞级的指挥官型号
\n优势
\n=正面火力充足=
\n=脱战自动修复=
\n=允许通信指挥=
\n=运载力:6=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负200码反侦测=
\n=被发现时暴露视野=
\n
\n“吉翁公国万岁!”
"""



