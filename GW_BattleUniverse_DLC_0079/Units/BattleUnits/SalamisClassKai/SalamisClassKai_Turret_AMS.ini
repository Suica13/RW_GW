[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:SalamisClassKai_Turret_AMS
displayText:SalamisClassKai AMS
displayText_zh:萨拉米斯级改 鱼雷

maxHp: 9000



@memory SalamisClassKai_Turret_AMS_OnCD:bool
@memory SalamisClassKai_Turret_AMS_CDTimer:float
@global SalamisClassKai_Turret_AMS_CD=12
@global SalamisClassKai_Turret_AMS_EN=40

@global SalamisClassKai_Turret_AMS_Shoot=2
[resource_SalamisClassKai_Turret_AMS_ShootTimer]
hidden:true




[turret_SalamisClassKai_Turret_AMS]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,SalamisClassKai_Turret_AMS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:SalamisClassKai_Turret_AMS_Projectile
resourceUsage:SalamisClassKai_Turret_AMS_ShootTimer=1

delay:1.0s
canAttackMaxAngle:15
limitingAngle:360
limitingRange:1200
barrelX:0
barrelY:0
turnSpeed:1.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_SalamisClassKai_Turret_AMS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS_L*1
(
    addResources=
    ShellDamage:2000
    |DpDamage:175
    |WeaponAccuracy=85
    |PartBreakModifier=1.0
    |CockpitBreakModifier=1.0
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=0.5
    |AntiAqua=1
    |AntiAir=1
    |AntiLand=1
    |AntiSpace=1
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:20
    |ProjectileTurnspeed:0
    |ProjectileSpread:0
    |ProjectileExplosionRange:55
    |ProjectileLife:70
)
"""


[hiddenAction_SalamisClassKai_Turret_AMS_CDStart]
autoTrigger:"""
if memory.SalamisClassKai_Turret_AMS_OnCD==false 
and 
(
    (
        self.resource.SalamisClassKai_Turret_AMS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.SalamisClassKai_Turret_AMS_ShootTimer<${SalamisClassKai_Turret_AMS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:SalamisClassKai_Turret_AMS_OnCD=true,SalamisClassKai_Turret_AMS_CDTimer=self.timeAlive+${SalamisClassKai_Turret_AMS_CD}

[hiddenAction_SalamisClassKai_Turret_AMS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.SalamisClassKai_Turret_AMS_OnCD==true and self.timeAlive>memory.SalamisClassKai_Turret_AMS_CDTimer
setUnitMemory:SalamisClassKai_Turret_AMS_OnCD=false
setResourcesWithLogic:SalamisClassKai_Turret_AMS_ShootTimer=${SalamisClassKai_Turret_AMS_Shoot}

[hiddenAction_SalamisClassKai_Turret_AMS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${SalamisClassKai_Turret_AMS_EN}