[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:SalamisClassLateType_Turret_MS
displayText:SalamisClassLateType MS
displayText_zh:萨拉米斯级后期型 导弹

maxHp: 10000



@memory SalamisClassLateType_Turret_MS_OnCD:bool
@memory SalamisClassLateType_Turret_MS_CDTimer:float
@global SalamisClassLateType_Turret_MS_CD=12
@global SalamisClassLateType_Turret_MS_EN=12

@global SalamisClassLateType_Turret_MS_Shoot=15
[resource_SalamisClassLateType_Turret_MS_ShootTimer]
hidden:true



[decal_SalamisClassLateType_Turret_MS]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/SalamisClassLateType/Image/SalamisClassLateType_Turret_MS_1.png
imageScale:1
dirOffset:-45
basePositionFromTurret:SalamisClassLateType_Turret_MS


[turret_SalamisClassLateType_Turret_MS]
x:0
y:0

canShoot:true
onShoot_triggerActions:SalamisClassLateType_Turret_MS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.height>=0 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:SalamisClassLateType_Turret_MS_Projectile
resourceUsage:SalamisClassLateType_Turret_MS_ShootTimer=1

delay:0.25s
canAttackMaxAngle:360
limitingAngle:120
limitingRange:1200
barrelX:3
barrelY:0
barrelOffsetX_onOddShots:-6
turnSpeed:0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if false

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_SalamisClassLateType_Turret_MS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS*1
(
    addResources=
    ShellDamage:1250
    |DpDamage:125
    |WeaponAccuracy=85
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:35
    |ProjectileTurnspeed:1.25
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:40
)
"""


[hiddenAction_SalamisClassLateType_Turret_MS_CDStart]
autoTrigger:"""
if memory.SalamisClassLateType_Turret_MS_OnCD==false 
and 
(
    (
        self.resource.SalamisClassLateType_Turret_MS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.SalamisClassLateType_Turret_MS_ShootTimer<${SalamisClassLateType_Turret_MS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:SalamisClassLateType_Turret_MS_OnCD=true,SalamisClassLateType_Turret_MS_CDTimer=self.timeAlive+${SalamisClassLateType_Turret_MS_CD}

[hiddenAction_SalamisClassLateType_Turret_MS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.SalamisClassLateType_Turret_MS_OnCD==true and self.timeAlive>memory.SalamisClassLateType_Turret_MS_CDTimer
setUnitMemory:SalamisClassLateType_Turret_MS_OnCD=false
setResourcesWithLogic:SalamisClassLateType_Turret_MS_ShootTimer=${SalamisClassLateType_Turret_MS_Shoot}

[hiddenAction_SalamisClassLateType_Turret_MS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${SalamisClassLateType_Turret_MS_EN}