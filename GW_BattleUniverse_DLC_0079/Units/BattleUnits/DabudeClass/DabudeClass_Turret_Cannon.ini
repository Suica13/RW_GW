[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw,
ROOT:Units/BattleUnits/Weapon/Shell/Turret/Common_Turret_Mortar_DabudeClass.gw
"""

name:DabudeClass_Turret_Cannon
displayText:Dabude Class MainCannon
displayText_zh:达布德级 主炮

maxHp: 10000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory DabudeClass_Turret_Cannon_OnCD:bool
@memory DabudeClass_Turret_Cannon_CDTimer:float
@global DabudeClass_Turret_Cannon_CD=8
@global DabudeClass_Turret_Cannon_EN=60

@global DabudeClass_Turret_Cannon_Shoot=2
[resource_DabudeClass_Turret_Cannon_ShootTimer]
hidden:true




[decal_DabudeClass_Turret_Cannon]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/DabudeClass/Image/DabudeClass_Turret_1.png
imageScale:1.25
basePositionFromTurret:DabudeClass_Turret_Cannon




[turret_DabudeClass_Turret_Cannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,DabudeClass_Turret_Cannon_Send_UseEN
canOnlyAttackUnitsWithoutTags:AirUnit
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false 
and memory.onSkill==false 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:DabudeClass_Turret_Cannon_Projectile
resourceUsage:DabudeClass_Turret_Cannon_ShootTimer=1

delay:0.1s
canAttackMaxAngle:3
limitingAngle:120
limitingMinRange:150
limitingRange:1200
barrelX:-7
barrelY:80
barrelOffsetX_onOddShots:14
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:420
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\ShellCannon_1.ogg
shoot_sound_vol:0.6
shoot_flame:BZ_Fire_1



[projectile_DabudeClass_Turret_Cannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Mortar_L*1
(
    addResources=
    ShellDamage:7500
    |DpDamage:350
    |WeaponAccuracy=75
    |PartBreakModifier=0.5
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1.5
    |AntiAqua=0.75
    |AntiAir=0.5 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=0.5
    |HeightHitRange=10
    |ProjectileSpeed:30
    |ProjectileSpread:0
    |ProjectileExplosionRange:80
    |ProjectileLife:75
)
"""


[hiddenAction_DabudeClass_Turret_Cannon_CDStart]
autoTrigger:"""
if memory.DabudeClass_Turret_Cannon_OnCD==false 
and 
(
    (
        self.resource.DabudeClass_Turret_Cannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.DabudeClass_Turret_Cannon_ShootTimer<${DabudeClass_Turret_Cannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:DabudeClass_Turret_Cannon_OnCD=true,DabudeClass_Turret_Cannon_CDTimer=self.timeAlive+${DabudeClass_Turret_Cannon_CD}

[hiddenAction_DabudeClass_Turret_Cannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.DabudeClass_Turret_Cannon_OnCD==true and self.timeAlive>memory.DabudeClass_Turret_Cannon_CDTimer
setUnitMemory:DabudeClass_Turret_Cannon_OnCD=false
setResourcesWithLogic:DabudeClass_Turret_Cannon_ShootTimer=${DabudeClass_Turret_Cannon_Shoot}



[hiddenAction_DabudeClass_Turret_Cannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${DabudeClass_Turret_Cannon_EN}




[turret_Common_Turret_Mortar_DabudeClass]
barrelX:0
barrelY:37.5