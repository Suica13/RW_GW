tags:MA_08,Unit,MA,ZEON,0079,UC,LargeUnit
name:MA_08

displayText:Big Zam
displayText_zh:大扎姆

displayDescription:"""
\nA gigantic MA developed to exalt the Principality of Zeon’s prestige, designed for fortress assaults
\nAdvantages
\n=Capable of firing a MEGA particle cannon=
\n=Capable of firing anti-air beam cannons=
\n=Equipped with an I-Field=
\n=High resistance=
\n=Relatively fast=
\nDisadvantages
\n=Poor endurance=
\n=Low responsiveness=
\n
\n"War is won by numbers, brother!"
"""
displayDescription_zh:"""
\n以宏扬吉翁军的威信而开发的对要塞攻击用巨大MA
\n优势
\n=可以发射MEGA粒子炮=
\n=可以发射对空光束炮=
\n=装备I立场=
\n=抗性较高=
\n=速度较快=
\n劣势
\n=续航较差=
\n=反应较差=
\n
\n“战争靠数量啊,大哥!”
"""

showActionsWithMixedSelectionIfOtherUnitsHaveTag:MA_08


maxHp:175000
maxShield:0

@global I_FieldHpMax=250000
@global I_FieldRecoverSpeed=500
