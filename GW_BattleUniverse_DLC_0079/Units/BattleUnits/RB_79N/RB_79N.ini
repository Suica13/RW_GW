\nA Ball unit modified for underwater use, equipped with a railgun and giant pincers  
\nAdvantages  
\n=Armor-piercing rounds=  
\nDisadvantages  
\n=Low turning speed=  
\n  
\n"There's a monster in the water!"
"""
