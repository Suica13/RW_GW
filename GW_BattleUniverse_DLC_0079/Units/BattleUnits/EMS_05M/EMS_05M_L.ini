"""




#标签\ID
tags:EMS-05M,Unit,MS
name:EMS-05M_Large
#文本
displayText:Large Agg[MS]
displayText_zh:大型阿格武装型
#混合所选单位所显示的行为
showActionsWithMixedSelectionIfOtherUnitsHaveTag:EMS-05M

displayRadius:30


[movement]
#加速度\减速度
moveAccelerationSpeed: 0.1
moveDecelerationSpeed: 0.005


[hiddenAction_StartSetUnitStats]
setUnitMemory:"""
unitCategory=3,
unitLevel=10,

baseHpMax=20000,
baseMoraleMax=1000,
baseEnergyMax=1000,
baseDpMax=2000,

baseMoveSpeed=0.5,
baseTurnSpeed=1.0,
baseHeight=1,
baseMass=5000,
reverseSpeedMultiplier=0.75,

boostMoveSpeed=1.25,
boostTurnSpeed=1.0,
boostOverHeatMax=50,
boostCoolDownSpeed=1.5,

baseDetectRange=500,
baseFogOfWarSightRange=memory.baseDetectRange/25,
baseShootLevel=100,
baseCqbLevel=100,

baseShellDef=50,
baseBeamDef=50,
baseCqbDef=25,
baseDpDef=50,
baseMoraleDef=50,
baseSpDef=50,

shieldMax=0,
shieldShellDef=75,
shieldBeamDef=75,
shieldCqbDef=75,
shieldDpDef=75,

groundAdaptability=100,
cliftAdaptability=85,
waterAdaptability=115,
skyAdaptability=85,
spaceAdaptability=85,
canEnteringAtmosphere=false,

baseActionPoint=3,
baseMovePoint=7.5,
slgAttackRange=150
"""

[hiddenAction_ExtraBoostSpeed]
autoTrigger:true
setUnitMemory:"""
extraBoostSpeed=
memory.ZN_EMS_05M_L_FlyDrillBoostSpeed
"""

