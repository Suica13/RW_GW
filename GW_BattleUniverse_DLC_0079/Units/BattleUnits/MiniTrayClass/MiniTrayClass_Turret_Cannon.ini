[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:MiniTrayClass_Turret_Cannon
displayText:MiniTrayClass MainCannon
displayText_zh:小托盘级 主炮

maxHp: 5000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory MiniTrayClass_Turret_Cannon_OnCD:bool
@memory MiniTrayClass_Turret_Cannon_CDTimer:float
@global MiniTrayClass_Turret_Cannon_CD=7
@global MiniTrayClass_Turret_Cannon_EN=50

@global MiniTrayClass_Turret_Cannon_Shoot=1
[resource_MiniTrayClass_Turret_Cannon_ShootTimer]
hidden:true




[decal_MiniTrayClass_Turret_Cannon]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/MiniTrayClass/Image/MiniTrayClass_Turret_CN_1.png
imageScale:1
basePositionFromTurret:MiniTrayClass_Turret_Cannon




[turret_MiniTrayClass_Turret_Cannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,MiniTrayClass_Turret_Cannon_Send_UseEN
canOnlyAttackUnitsWithoutTags:AirUnit
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false 
and memory.onSkill==false 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:MiniTrayClass_Turret_Cannon_Projectile
resourceUsage:MiniTrayClass_Turret_Cannon_ShootTimer=1

delay:0.1s
canAttackMaxAngle:3
limitingAngle:120
limitingMinRange:150
limitingRange:1200
barrelX:0
barrelY:12
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:420
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Bazooka_1.ogg
shoot_sound_vol:0.4
shoot_flame:BZ_Fire_1



[projectile_MiniTrayClass_Turret_Cannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Bazooka_S_Target*1
(
    addResources=
    ShellDamage:5000
    |DpDamage:200
    |WeaponAccuracy=80
    |PartBreakModifier=1.25
    |CockpitBreakModifier=0.75
    |PilotDamageModifier=0.75
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=0.75
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:60
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:30
)
"""


[hiddenAction_MiniTrayClass_Turret_Cannon_CDStart]
autoTrigger:"""
if memory.MiniTrayClass_Turret_Cannon_OnCD==false 
and 
(
    (
        self.resource.MiniTrayClass_Turret_Cannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.MiniTrayClass_Turret_Cannon_ShootTimer<${MiniTrayClass_Turret_Cannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:MiniTrayClass_Turret_Cannon_OnCD=true,MiniTrayClass_Turret_Cannon_CDTimer=self.timeAlive+${MiniTrayClass_Turret_Cannon_CD}

[hiddenAction_MiniTrayClass_Turret_Cannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.MiniTrayClass_Turret_Cannon_OnCD==true and self.timeAlive>memory.MiniTrayClass_Turret_Cannon_CDTimer
setUnitMemory:MiniTrayClass_Turret_Cannon_OnCD=false
setResourcesWithLogic:MiniTrayClass_Turret_Cannon_ShootTimer=${MiniTrayClass_Turret_Cannon_Shoot}



[hiddenAction_MiniTrayClass_Turret_Cannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${MiniTrayClass_Turret_Cannon_EN}


