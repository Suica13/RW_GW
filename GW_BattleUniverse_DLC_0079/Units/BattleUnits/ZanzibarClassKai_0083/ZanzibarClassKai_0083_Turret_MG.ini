[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:ZanzibarClassKai_0083_Turret_MG
displayText:ZanzibarClassKai_0083 MG
displayText_zh:桑吉巴尔级改 机炮

maxHp: 15000

@memory ZanzibarClassKai_0083_Turret_MG_OnCD:bool
@memory ZanzibarClassKai_0083_Turret_MG_CDTimer:float
@global ZanzibarClassKai_0083_Turret_MG_CD=2
@global ZanzibarClassKai_0083_Turret_MG_EN=0.5

@global ZanzibarClassKai_0083_Turret_MG_Shoot=10
[resource_ZanzibarClassKai_0083_Turret_MG_ShootTimer]
hidden:true


#AA炮用

[decal_Burned]
imageScale:0.75
[decal_Stun]
imageScale:0.425
[decal_LowHp]
imageScale:0.5
[decal_Marker]
imageScale:0.25


[graphics]
drawLayer:ground



[decal_ZanzibarClassKai_0083_Turret_MG]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/ZanzibarClassKai_0083/Image/ZanzibarClassKai_0083_Turret_MG_1.png
imageScale:1
basePositionFromTurret:ZanzibarClassKai_0083_Turret_MG






[turret_ZanzibarClassKai_0083_Turret_MG]
x:0
y:0

canShoot:true
onShoot_triggerActions:ZanzibarClassKai_0083_Turret_MG_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:ZanzibarClassKai_0083_Turret_MG_Projectile
resourceUsage:ZanzibarClassKai_0083_Turret_MG_ShootTimer=1

delay:0.1s
canAttackMaxAngle:60
limitingAngle:120
limitingRange:600
barrelX:2
barrelY:8
barrelOffsetX_onOddShots:-4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0 


shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_ZanzibarClassKai_0083_Turret_MG_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0
sweepOffset:10
lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:375
    |ShellAPDamage:125
    |DpDamage:15
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1.5 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:80
    |ProjectileSpread:8
    |ProjectileLife:7.5
)
"""


[hiddenAction_ZanzibarClassKai_0083_Turret_MG_CDStart]
autoTrigger:"""
if memory.ZanzibarClassKai_0083_Turret_MG_OnCD==false 
and 
(
    (
        self.resource.ZanzibarClassKai_0083_Turret_MG_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.ZanzibarClassKai_0083_Turret_MG_ShootTimer<${ZanzibarClassKai_0083_Turret_MG_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:ZanzibarClassKai_0083_Turret_MG_OnCD=true,ZanzibarClassKai_0083_Turret_MG_CDTimer=self.timeAlive+${ZanzibarClassKai_0083_Turret_MG_CD}

[hiddenAction_ZanzibarClassKai_0083_Turret_MG_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.ZanzibarClassKai_0083_Turret_MG_OnCD==true and self.timeAlive>memory.ZanzibarClassKai_0083_Turret_MG_CDTimer
setUnitMemory:ZanzibarClassKai_0083_Turret_MG_OnCD=false
setResourcesWithLogic:ZanzibarClassKai_0083_Turret_MG_ShootTimer=${ZanzibarClassKai_0083_Turret_MG_Shoot}

[hiddenAction_ZanzibarClassKai_0083_Turret_MG_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${ZanzibarClassKai_0083_Turret_MG_EN}