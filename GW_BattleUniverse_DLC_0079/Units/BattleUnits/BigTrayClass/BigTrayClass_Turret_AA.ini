[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:BigTrayClass_Turret_AA
displayText:BigTrayClass AA
displayText_zh:大托盘级 对空炮

maxHp: 5000

@memory BigTrayClass_Turret_AA_OnCD:bool
@memory BigTrayClass_Turret_AA_CDTimer:float
@global BigTrayClass_Turret_AA_CD=2
@global BigTrayClass_Turret_AA_EN=0.5

@global BigTrayClass_Turret_AA_Shoot=10
[resource_BigTrayClass_Turret_AA_ShootTimer]
hidden:true



#AA炮用

[decal_Burned]
imageScale:0.75
[decal_Stun]
imageScale:0.425
[decal_LowHp]
imageScale:0.5
[decal_Marker]
imageScale:0.25



[decal_BigTrayClass_Turret_AA]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/BigTrayClass/Image/BigTrayClass_Turret_AA_1.png
imageScale:1.25
basePositionFromTurret:BigTrayClass_Turret_AA






[turret_BigTrayClass_Turret_AA]
x:0
y:0

canShoot:true
onShoot_triggerActions:BigTrayClass_Turret_AA_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:BigTrayClass_Turret_AA_Projectile
resourceUsage:BigTrayClass_Turret_AA_ShootTimer=1

delay:0.15s
canAttackMaxAngle:15
limitingAngle:180
limitingRange:600
barrelX:2
barrelY:6
barrelOffsetX_onOddShots:-4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_BigTrayClass_Turret_AA_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:175
    |ShellAPDamage:75
    |DpDamage:5
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=1.25 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:90
    |ProjectileSpread:6
    |ProjectileLife:7.5
)
"""


[hiddenAction_BigTrayClass_Turret_AA_CDStart]
autoTrigger:"""
if memory.BigTrayClass_Turret_AA_OnCD==false 
and 
(
    (
        self.resource.BigTrayClass_Turret_AA_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.BigTrayClass_Turret_AA_ShootTimer<${BigTrayClass_Turret_AA_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:BigTrayClass_Turret_AA_OnCD=true,BigTrayClass_Turret_AA_CDTimer=self.timeAlive+${BigTrayClass_Turret_AA_CD}

[hiddenAction_BigTrayClass_Turret_AA_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.BigTrayClass_Turret_AA_OnCD==true and self.timeAlive>memory.BigTrayClass_Turret_AA_CDTimer
setUnitMemory:BigTrayClass_Turret_AA_OnCD=false
setResourcesWithLogic:BigTrayClass_Turret_AA_ShootTimer=${BigTrayClass_Turret_AA_Shoot}

[hiddenAction_BigTrayClass_Turret_AA_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${BigTrayClass_Turret_AA_EN}