\nA special amphibious MS designed for covert operations, excels at reconnaissance and sabotage  
\nAdvantages  
\n=Well-armed=  
\n=Stealthy underwater=  
\n=Equipped with sonar=  
\n=Detection-resistant within 100 meters=  
\n=Slightly elevated vision=  
\n=High mobility=  
\nDisadvantages  
\n=Weak armor=  
\n=Average performance in MS combat=  
\n  
\n"Good thing they mistook us for rocks"
"""
