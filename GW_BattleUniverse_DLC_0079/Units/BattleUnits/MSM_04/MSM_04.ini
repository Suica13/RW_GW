\n用于隐秘作战的特种两栖MS,擅长侦察与破坏
\n优势
\n=武装丰富=
\n=水中匿踪=
\n=装备声纳=
\n=视野稍高=
\n=100码反侦测=
\n=机动性较高=
\n=对建筑伤害增加25%=
\n=受到建筑伤害减少35%=
\n劣势
\n=装甲薄弱=
\n=对MS战性能一般=
\n
\n“还好他们把我们当石头”
