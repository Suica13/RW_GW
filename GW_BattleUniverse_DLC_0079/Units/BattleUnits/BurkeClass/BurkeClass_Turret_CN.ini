[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:BurkeClass_Turret_CN
displayText:BurkeClass MainCannon
displayText_zh:伯克级 主炮

maxHp: 6000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory BurkeClass_Turret_CN_OnCD:bool
@memory BurkeClass_Turret_CN_CDTimer:float
@global BurkeClass_Turret_CN_CD=3
@global BurkeClass_Turret_CN_EN=40

@global BurkeClass_Turret_CN_Shoot=1
[resource_BurkeClass_Turret_CN_ShootTimer]
hidden:true


[decal_BurkeClass_Turret_MG]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/BurkeClass/Image/BurkeClass_Turret_CN_1.png
imageScale:1.25
basePositionFromTurret:BurkeClass_Turret_CN


[turret_BurkeClass_Turret_CN]
x:0
y:0

canShoot:true
canOnlyAttackUnitsWithoutTags:AirUnit
onShoot_triggerActions:BurkeClass_Turret_CN_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:BurkeClass_Turret_CN_Projectile
resourceUsage:BurkeClass_Turret_CN_ShootTimer=1

delay:1s
canAttackMaxAngle:3
limitingAngle:90
limitingRange:600
barrelX:0
barrelY:8
turnSpeed:1.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Bazooka_1.ogg
shoot_sound_vol:0.4
shoot_flame:BZ_Fire_1




[projectile_BurkeClass_Turret_CN_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Bazooka*1
(
    addResources=
    ShellDamage:4500
    |DpDamage:300
    |WeaponAccuracy=75
    |PartBreakModifier=1.25
    |CockpitBreakModifier=0.75
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiAqua=0.75
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1.0
    |HeightChangeSpeed=2
    |HeightHitRange=20
    |ProjectileSpeed:50
    |ProjectileSpread:1
    |ProjectileExplosionRange:45
    |ProjectileLife:35
)
"""


[hiddenAction_BurkeClass_Turret_CN_CDStart]
autoTrigger:"""
if memory.BurkeClass_Turret_CN_OnCD==false 
and 
(
    (
        self.resource.BurkeClass_Turret_CN_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.BurkeClass_Turret_CN_ShootTimer<${BurkeClass_Turret_CN_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:BurkeClass_Turret_CN_OnCD=true,BurkeClass_Turret_CN_CDTimer=self.timeAlive+${BurkeClass_Turret_CN_CD}

[hiddenAction_BurkeClass_Turret_CN_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.BurkeClass_Turret_CN_OnCD==true and self.timeAlive>memory.BurkeClass_Turret_CN_CDTimer
setUnitMemory:BurkeClass_Turret_CN_OnCD=false
setResourcesWithLogic:BurkeClass_Turret_CN_ShootTimer=${BurkeClass_Turret_CN_Shoot}

[hiddenAction_BurkeClass_Turret_CN_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${BurkeClass_Turret_CN_EN}