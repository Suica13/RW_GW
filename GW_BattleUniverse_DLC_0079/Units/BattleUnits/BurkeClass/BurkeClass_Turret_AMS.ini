[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:BurkeClass_Turret_AMS
displayText:BurkeClass AMS
displayText_zh:伯克级 鱼雷

maxHp: 6000



@memory BurkeClass_Turret_AMS_OnCD:bool
@memory BurkeClass_Turret_AMS_CDTimer:float
@global BurkeClass_Turret_AMS_CD=5
@global BurkeClass_Turret_AMS_EN=40

@global BurkeClass_Turret_AMS_Shoot=2
[resource_BurkeClass_Turret_AMS_ShootTimer]
hidden:true




[turret_BurkeClass_Turret_AMS]
x:0
y:0

canShoot:true
canAttackNotTouchingWaterUnits:false
canOnlyAttackUnitsWithoutTags:AirUnit
onShoot_triggerActions:SendEnemyTryAttack_Shoot,BurkeClass_Turret_AMS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:BurkeClass_Turret_AMS_Projectile
resourceUsage:BurkeClass_Turret_AMS_ShootTimer=1

delay:1.5s
canAttackMaxAngle:15
limitingAngle:360
limitingRange:600
barrelX:0
barrelY:0
turnSpeed:1.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_BurkeClass_Turret_AMS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS_Aqua_L*1
(
    addResources=
    ShellDamage:3500
    |DpDamage:250
    |WeaponAccuracy=85
    |PartBreakModifier=1.0
    |CockpitBreakModifier=1.0
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=0.5
    |AntiAqua=2
    |AntiAir=0.25 
    |AntiLand=1
    |AntiSpace=1
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:30
    |ProjectileTurnspeed:0
    |ProjectileSpread:0
    |ProjectileExplosionRange:55
    |ProjectileLife:70
)
"""


[hiddenAction_BurkeClass_Turret_AMS_CDStart]
autoTrigger:"""
if memory.BurkeClass_Turret_AMS_OnCD==false 
and 
(
    (
        self.resource.BurkeClass_Turret_AMS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.BurkeClass_Turret_AMS_ShootTimer<${BurkeClass_Turret_AMS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:BurkeClass_Turret_AMS_OnCD=true,BurkeClass_Turret_AMS_CDTimer=self.timeAlive+${BurkeClass_Turret_AMS_CD}

[hiddenAction_BurkeClass_Turret_AMS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.BurkeClass_Turret_AMS_OnCD==true and self.timeAlive>memory.BurkeClass_Turret_AMS_CDTimer
setUnitMemory:BurkeClass_Turret_AMS_OnCD=false
setResourcesWithLogic:BurkeClass_Turret_AMS_ShootTimer=${BurkeClass_Turret_AMS_Shoot}

[hiddenAction_BurkeClass_Turret_AMS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${BurkeClass_Turret_AMS_EN}