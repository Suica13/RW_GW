[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:BurkeClass_Turret_MG
displayText:BurkeClass MG
displayText_zh:伯克级 机炮

maxHp: 5000



@memory BurkeClass_Turret_MG_OnCD:bool
@memory BurkeClass_Turret_MG_CDTimer:float
@global BurkeClass_Turret_MG_CD=1
@global BurkeClass_Turret_MG_EN=0.5

@global BurkeClass_Turret_MG_Shoot=10
[resource_BurkeClass_Turret_MG_ShootTimer]
hidden:true



[decal_BurkeClass_Turret_MG]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/BurkeClass/Image/BurkeClass_Turret_MG_1.png
imageScale:1.25
basePositionFromTurret:BurkeClass_Turret_MG





[turret_BurkeClass_Turret_MG]
x:0
y:0

canShoot:true
onShoot_triggerActions:BurkeClass_Turret_MG_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:BurkeClass_Turret_MG_Projectile
resourceUsage:BurkeClass_Turret_MG_ShootTimer=1

delay:0.15s
canAttackMaxAngle:3
limitingAngle:360
limitingRange:600
barrelX:0
barrelY:2
turnSpeed:2.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1




[projectile_BurkeClass_Turret_MG_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:200
    |ShellAPDamage:50
    |DpDamage:10
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=1.25
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2.0
    |HeightHitRange=25
    |ProjectileSpeed:100
    |ProjectileSpread:6
    |ProjectileLife:8
)
"""


[hiddenAction_BurkeClass_Turret_MG_CDStart]
autoTrigger:"""
if memory.BurkeClass_Turret_MG_OnCD==false 
and 
(
    (
        self.resource.BurkeClass_Turret_MG_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.BurkeClass_Turret_MG_ShootTimer<${BurkeClass_Turret_MG_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:BurkeClass_Turret_MG_OnCD=true,BurkeClass_Turret_MG_CDTimer=self.timeAlive+${BurkeClass_Turret_MG_CD}

[hiddenAction_BurkeClass_Turret_MG_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.BurkeClass_Turret_MG_OnCD==true and self.timeAlive>memory.BurkeClass_Turret_MG_CDTimer
setUnitMemory:BurkeClass_Turret_MG_OnCD=false
setResourcesWithLogic:BurkeClass_Turret_MG_ShootTimer=${BurkeClass_Turret_MG_Shoot}

[hiddenAction_BurkeClass_Turret_MG_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${BurkeClass_Turret_MG_EN}