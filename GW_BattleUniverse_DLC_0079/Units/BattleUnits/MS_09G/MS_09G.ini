tags:MS_09G,Unit,MS,ZEON,0079,UC
name:MS_09G

displayText:Dowadge
displayText_zh:多瓦吉

displayDescription:"""
\nMeant as the ultimate production model of the Dom, surpassing the original; its endurance and mobility have been improved
\nAdvantages
\n=Excels at hit-and-run tactics=
\n=High resistance to ballistic weapons=
\n=Equipped with Knuckle Shield Missiles=
\n=High speed=
\nDisadvantages
\n=Unable to move at combat speed if legs are damaged=
\n=Combat speed consumes more supplies=
\n=Weak structural integrity=
\n=Prone to losing balance=
\n=Poor reaction time=
\n
\n“I'll head to the frontlines to fight.”
"""
displayDescription_zh:"""
\n意为超越大魔的大魔最终生产型,续航和机动力都得到了提升
\n优势
\n=擅长一击脱离=
\n=实弹抗性较高=
\n=装备甲拳弹=
\n=速度较快=
\n劣势
\n=腿部损坏时无法以战时速度移动=
\n=战时速度消耗补给量提升=
\n=结构强度较差=
\n=容易失衡=
\n=反应较差=
\n
\n“我去前线战斗”
"""

showActionsWithMixedSelectionIfOtherUnitsHaveTag:MS_09G


maxHp:32500
maxShield:0

