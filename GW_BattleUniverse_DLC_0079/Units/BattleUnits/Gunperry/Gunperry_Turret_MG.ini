[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanNotBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:Gunperry_Turret_MG
displayText:Gunperry_Turret_MG
displayText_zh:Gunperry_Turret_MG

maxHp: 10000


@memory Gunperry_Turret_MG_OnCD:bool
@memory Gunperry_Turret_MG_CDTimer:float
@global Gunperry_Turret_MG_CD=1
@global Gunperry_Turret_MG_EN=0.5

@global Gunperry_Turret_MG_Shoot=10
[resource_Gunperry_Turret_MG_ShootTimer]
hidden:true



[decal_Gunperry_Turret_MG]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/Gunperry/Image/Gunperry_Turret_1.png
imageScale:1
basePositionFromTurret:Gunperry_Turret_MG





[turret_Gunperry_Turret_MG]
x:0
y:0

canShoot:true
onShoot_triggerActions:Gunperry_Turret_MG_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:Gunperry_Turret_MG_Projectile
resourceUsage:Gunperry_Turret_MG_ShootTimer=1

delay:0.15s
canAttackMaxAngle:3
limitingAngle:360
limitingRange:600
barrelX:2
barrelY:2
barrelOffsetX_onOddShots:-4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1




[projectile_Gunperry_Turret_MG_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:150
    |DpDamage:10
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=1
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2.0
    |HeightHitRange=25
    |ProjectileSpeed:100
    |ProjectileSpread:6
    |ProjectileLife:8
)
"""


[hiddenAction_Gunperry_Turret_MG_CDStart]
autoTrigger:"""
if memory.Gunperry_Turret_MG_OnCD==false 
and 
(
    (
        self.resource.Gunperry_Turret_MG_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.Gunperry_Turret_MG_ShootTimer<${Gunperry_Turret_MG_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:Gunperry_Turret_MG_OnCD=true,Gunperry_Turret_MG_CDTimer=self.timeAlive+${Gunperry_Turret_MG_CD}

[hiddenAction_Gunperry_Turret_MG_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.Gunperry_Turret_MG_OnCD==true and self.timeAlive>memory.Gunperry_Turret_MG_CDTimer
setUnitMemory:Gunperry_Turret_MG_OnCD=false
setResourcesWithLogic:Gunperry_Turret_MG_ShootTimer=${Gunperry_Turret_MG_Shoot}

[hiddenAction_Gunperry_Turret_MG_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${Gunperry_Turret_MG_EN}