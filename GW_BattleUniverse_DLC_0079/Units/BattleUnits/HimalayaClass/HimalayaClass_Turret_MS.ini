[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:HimalayaClass_Turret_MS
displayText:HimalayaClass MS
displayText_zh:喜马拉雅级 导弹

maxHp: 7500



@memory HimalayaClass_Turret_MS_OnCD:bool
@memory HimalayaClass_Turret_MS_CDTimer:float
@global HimalayaClass_Turret_MS_CD=7
@global HimalayaClass_Turret_MS_EN=12

@global HimalayaClass_Turret_MS_Shoot=8
[resource_HimalayaClass_Turret_MS_ShootTimer]
hidden:true



[decal_HimalayaClass_Turret_MS]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/HimalayaClass/Image/HimalayaClass_Turret_MS_1.png
imageScale:1.25
basePositionFromTurret:HimalayaClass_Turret_MS


[turret_HimalayaClass_Turret_MS]
x:0
y:0

canShoot:true
canOnlyAttackUnitsWithoutTags:AirUnit
onShoot_triggerActions:HimalayaClass_Turret_MS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.height>=0 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:HimalayaClass_Turret_MS_Projectile
resourceUsage:HimalayaClass_Turret_MS_ShootTimer=1

delay:0.75s
canAttackMaxAngle:15
limitingAngle:360
limitingRange:800
barrelX:3
barrelY:0
barrelOffsetX_onOddShots:-6
turnSpeed:1

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_HimalayaClass_Turret_MS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS*1
(
    addResources=
    ShellDamage:1500
    |DpDamage:75
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1.25
    |AntiAir=0.25
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:35
    |ProjectileTurnspeed:1.25
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:40
)
"""


[hiddenAction_HimalayaClass_Turret_MS_CDStart]
autoTrigger:"""
if memory.HimalayaClass_Turret_MS_OnCD==false 
and 
(
    (
        self.resource.HimalayaClass_Turret_MS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.HimalayaClass_Turret_MS_ShootTimer<${HimalayaClass_Turret_MS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:HimalayaClass_Turret_MS_OnCD=true,HimalayaClass_Turret_MS_CDTimer=self.timeAlive+${HimalayaClass_Turret_MS_CD}

[hiddenAction_HimalayaClass_Turret_MS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.HimalayaClass_Turret_MS_OnCD==true and self.timeAlive>memory.HimalayaClass_Turret_MS_CDTimer
setUnitMemory:HimalayaClass_Turret_MS_OnCD=false
setResourcesWithLogic:HimalayaClass_Turret_MS_ShootTimer=${HimalayaClass_Turret_MS_Shoot}

[hiddenAction_HimalayaClass_Turret_MS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${HimalayaClass_Turret_MS_EN}