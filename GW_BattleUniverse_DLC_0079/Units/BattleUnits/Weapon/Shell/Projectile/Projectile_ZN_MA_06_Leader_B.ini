[hiddenAction_StunFrame]
autoTrigger:true
setUnitMemory:"""
stunFrame=
select
    (
        memory.stunFrame>=${decal_Bullet_Stun.total_frames}-0.1,0,memory.stunFrame+0.1
    )
"""
[decal_Bullet_Stun]
