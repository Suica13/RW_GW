
[core]
copyFrom:"""
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw,
ROOT:Template/Unit/Skill/CanBeDetectedAndDetect_Unit.ini,
ROOT:Units/BattleUnits/Weapon/Template/SetUpUnit_Common.ini
"""
name:EF_GP_03D_MSL_AMS


displayText:MSL
displayText_zh:导弹仓

maxHp: 9000

fogOfWarSightRange:1

isUnselectable:false
isUnselectableAsTarget:false
canNotBeDirectlyAttacked:false

@memory shoot:bool

@memory boostFrame:float

[hiddenAction_InitializeStats]
setUnitMemory:"""
lifeTime=10,
baseDetectRange=0,
baseAntiDetectRange=0,

finalAttackRange=customTarget1.readUnitMemory("finalAttackRange",type="float"),

finalShootLevel=customTarget1.readUnitMemory("finalShootLevel",type="float"),
finalCqbLevel=customTarget1.readUnitMemory("finalCqbLevel",type="float"),
finalAccuracyLevel=customTarget1.readUnitMemory("finalAccuracyLevel",type="float"),
finalReactionLevel=customTarget1.readUnitMemory("finalReactionLevel",type="float"),

finalBeamDef=5,
finalShellDef=5,
finalCqbDef=5,

finalBeamDefPlus=25,
finalShellDefPlus=25,
finalCqbDefPlus=25,

extraBuildingDef=1,
extraBuildingAtk=0.5
"""


[hiddenAction_UpdateboostFrame]
autoTrigger:true
setUnitMemory:boostFrame=select(memory.boostFrame>=${decal_Boost.total_frames}-0.05,0,memory.boostFrame+0.05*self.Resource.BulletSpeed)


[decal_Boost]
layer:beforeBody
order:4
isVisible:true
onlyWhileAlive:true
image:ROOT:\Resource\Image\Fx\Unit\Image\Boost_1.png
total_frames:3
frame:memory.boostFrame
xOffsetRelative: -2.5
yOffsetRelative:-12
dirOffset:0
imageScale:2
imageScaleY:1.5
alpha:0.75

[graphics]
drawLayer:bottom

[decal_Body_0]
layer:beforeBody
order:1
onlyWhileAlive:true 
isVisible:if self.timeAlive<1
imageScale:1
yOffsetAbsolute:0
xOffsetAbsolute:0
image:ROOT:Units/BattleUnits/Weapon/Sp/Image/GP_03D_MSL_AMS_0.png
[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true 
isVisible:if self.timeAlive>1
imageScale:1
yOffsetAbsolute:0
xOffsetAbsolute:0
image:ROOT:Units/BattleUnits/Weapon/Sp/Image/GP_03D_MSL_AMS_1.png

[hiddenAction_Move]
autoTrigger:true
teleportTo:self.getOffsetRelative(y=5*self.Resource.BulletSpeed*select(self.timeAlive<1,1,0.15))

[hiddenAction_StartShoot]
autoTrigger:if self.timeAlive>1 and memory.shoot==false
setUnitMemory:shoot=true
alsoTriggerAction:Shoot

[hiddenAction_Shoot]
alsoQueueAction:"""
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2,
MSL,
MSL_R2
"""
[hiddenAction_MSL]
buildSpeed:0.15s
fireTurretXAtGround:MSL
fireTurretXAtGround_withTarget:self.getOffsetRelative(y=-1500,X=1000)
alsoTriggerAction:MSL_L
[hiddenAction_MSL_L]
buildSpeed:0.0s
fireTurretXAtGround:MSL_L
fireTurretXAtGround_withTarget:self.getOffsetRelative(y=-1500,X=-1000)
[hiddenAction_MSL_R2]
buildSpeed:0.15s
fireTurretXAtGround:MSL_R2
fireTurretXAtGround_withTarget:self.getOffsetRelative(y=-1500,X=1000)
alsoTriggerAction:MSL_L2
[hiddenAction_MSL_L2]
buildSpeed:0.0s
fireTurretXAtGround:MSL_L2
fireTurretXAtGround_withTarget:self.getOffsetRelative(y=-1500,X=-1000)




[turret_MSL]
x:0
y:0

canShoot:false
projectile:MSL_Projectile

delay:0.15s
canAttackMaxAngle:15
barrelX:0
barrelY:15
limitingRange:0
idleDir:135

aimOffsetSpread:0
recoilOffset: 0
recoilOutTime: 0
recoilReturnTime: 0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.15
shoot_flame:BZ_Fire_1_S
[turret_MSL_L]
