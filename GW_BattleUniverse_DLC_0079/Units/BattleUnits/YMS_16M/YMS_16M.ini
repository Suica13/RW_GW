\nA long-range attack prototype MS developed by the Zeon forces at the end of the One Year War, operated by both a pilot and a gunner
\nAdvantages
\n= Capable of bombardment =
\n= Very high bombardment damage =
\n= High resistance to live ammunition =
\n= High speed =
\nDisadvantages
\n= Increased supply consumption while moving in combat =
\n= Poor response time =
\n
\n“Do you know what a heavy MS is?” 
"""
displayDescription_zh:"""
\n吉翁军在一年战争末期开发的一款由驾驶员和炮手双人操作的长距离攻击用试作型MS
\n优势
\n=可以进行炮击=
\n=炮击伤害很高=
\n=实弹抗性较高=
\n=速度较快=
\n劣势
\n=战时速度消耗补给量提升=
\n=反应较差=
\n
\n“知道什么是重MS吗?”
"""

