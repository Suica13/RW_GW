[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Beam_Charge_4_Yellow.gw,
ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Beam_Charge_3_Yellow.gw
"""

name:GwanzanClass_Turret_BeamCannon
displayText:GwanzanClass BeamCannon
displayText_zh:格万赞级 光束炮

maxHp: 25000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory GwanzanClass_Turret_BeamCannon_OnCD:bool
@memory GwanzanClass_Turret_BeamCannon_CDTimer:float
@global GwanzanClass_Turret_BeamCannon_CD=5
@global GwanzanClass_Turret_BeamCannon_EN=40

@global GwanzanClass_Turret_BeamCannon_Shoot=1
[resource_GwanzanClass_Turret_BeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground



[decal_GwanzanClass_Turret_BeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/GwanzanClass/Image/GwanzanClass_Turret_BeamCannon_1.png
imageScale:1.25
basePositionFromTurret:GwanzanClass_Turret_BeamCannon






[turret_GwanzanClass_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,GwanzanClass_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:GwanzanClass_Turret_BeamCannon_Projectile
resourceUsage:GwanzanClass_Turret_BeamCannon_ShootTimer=1

delay:2s
canAttackMaxAngle:15
limitingAngle:90
limitingRange:1200
barrelX:0
barrelY:35
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_2.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Charge_3_Yellow

warmup:1s
warmupStartEffect:Beam_Charge_4_Yellow


[projectile_GwanzanClass_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_AP_BeamRifle_Yellow*1
(
    addResources=
    BeamDamage:10000
    |BeamAPDamage:5000
    |DpDamage:300
    |WeaponAccuracy=90
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1 
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1 
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=3
    |HeightHitRange=25
    |ProjectileSpeed:65
    |ProjectileSpread:1
    |ProjectileLife:30

    |ProjectileAttackTimes:2
    |ProjectileAttackTimesDamageModifier:0.75
)
"""


[hiddenAction_GwanzanClass_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.GwanzanClass_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.GwanzanClass_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.GwanzanClass_Turret_BeamCannon_ShootTimer<${GwanzanClass_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:GwanzanClass_Turret_BeamCannon_OnCD=true,GwanzanClass_Turret_BeamCannon_CDTimer=self.timeAlive+${GwanzanClass_Turret_BeamCannon_CD}

[hiddenAction_GwanzanClass_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.GwanzanClass_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.GwanzanClass_Turret_BeamCannon_CDTimer
setUnitMemory:GwanzanClass_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:GwanzanClass_Turret_BeamCannon_ShootTimer=${GwanzanClass_Turret_BeamCannon_Shoot}

[hiddenAction_GwanzanClass_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${GwanzanClass_Turret_BeamCannon_EN}