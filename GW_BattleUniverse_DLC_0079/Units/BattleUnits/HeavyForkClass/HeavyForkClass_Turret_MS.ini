[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:HeavyForkClass_Turret_MS
displayText:HeavyForkClass MS
displayText_zh:重叉级 导弹

maxHp: 10000



@memory HeavyForkClass_Turret_MS_OnCD:bool
@memory HeavyForkClass_Turret_MS_CDTimer:float
@global HeavyForkClass_Turret_MS_CD=12
@global HeavyForkClass_Turret_MS_EN=12

@global HeavyForkClass_Turret_MS_Shoot=5
[resource_HeavyForkClass_Turret_MS_ShootTimer]
hidden:true



[decal_HeavyForkClass_Turret_MS]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/HeavyForkClass/Image/HeavyForkClass_Turret_MS_1.png
imageScale:1.25
basePositionFromTurret:HeavyForkClass_Turret_MS


[turret_HeavyForkClass_Turret_MS]
x:0
y:0

canShoot:true
canOnlyAttackUnitsWithoutTags:AirUnit
onShoot_triggerActions:HeavyForkClass_Turret_MS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.height>=0 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:HeavyForkClass_Turret_MS_Projectile
resourceUsage:HeavyForkClass_Turret_MS_ShootTimer=1

delay:0.5s
canAttackMaxAngle:360
limitingAngle:360
limitingRange:800
barrelX:5
barrelY:5
barrelOffsetX_onOddShots:-10
turnSpeed:0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1




[projectile_HeavyForkClass_Turret_MS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS*1
(
    addResources=
    ShellDamage:1750
    |DpDamage:90
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1.25
    |AntiAir=0.25
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:35
    |ProjectileTurnspeed:1.25
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:40
)
"""


[hiddenAction_HeavyForkClass_Turret_MS_CDStart]
autoTrigger:"""
if memory.HeavyForkClass_Turret_MS_OnCD==false 
and 
(
    (
        self.resource.HeavyForkClass_Turret_MS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.HeavyForkClass_Turret_MS_ShootTimer<${HeavyForkClass_Turret_MS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:HeavyForkClass_Turret_MS_OnCD=true,HeavyForkClass_Turret_MS_CDTimer=self.timeAlive+${HeavyForkClass_Turret_MS_CD}

[hiddenAction_HeavyForkClass_Turret_MS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.HeavyForkClass_Turret_MS_OnCD==true and self.timeAlive>memory.HeavyForkClass_Turret_MS_CDTimer
setUnitMemory:HeavyForkClass_Turret_MS_OnCD=false
setResourcesWithLogic:HeavyForkClass_Turret_MS_ShootTimer=${HeavyForkClass_Turret_MS_Shoot}

[hiddenAction_HeavyForkClass_Turret_MS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${HeavyForkClass_Turret_MS_EN}