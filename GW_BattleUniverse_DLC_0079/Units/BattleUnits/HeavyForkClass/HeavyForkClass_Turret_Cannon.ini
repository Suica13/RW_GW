[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw,
ROOT:Units/BattleUnits/Weapon/Shell/Turret/Common_Turret_Mortar_HeavyForkClass.gw
"""

name:HeavyForkClass_Turret_Cannon
displayText:HeavyForkClass MainCannon
displayText_zh:重叉级 主炮

maxHp: 13500

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory HeavyForkClass_Turret_Cannon_OnCD:bool
@memory HeavyForkClass_Turret_Cannon_CDTimer:float
@global HeavyForkClass_Turret_Cannon_CD=8
@global HeavyForkClass_Turret_Cannon_EN=50

@global HeavyForkClass_Turret_Cannon_Shoot=3
[resource_HeavyForkClass_Turret_Cannon_ShootTimer]
hidden:true




[decal_HeavyForkClass_Turret_Cannon]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/HeavyForkClass/Image/HeavyForkClass_Turret_CN_1.png
imageScale:1.25
basePositionFromTurret:HeavyForkClass_Turret_Cannon




[turret_HeavyForkClass_Turret_Cannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,HeavyForkClass_Turret_Cannon_Send_UseEN
canOnlyAttackUnitsWithoutTags:AirUnit
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false 
and memory.onSkill==false 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:HeavyForkClass_Turret_Cannon_Projectile
resourceUsage:HeavyForkClass_Turret_Cannon_ShootTimer=1

delay:0.1s
canAttackMaxAngle:3
limitingAngle:120
limitingMinRange:150
limitingRange:1200
barrelX:-5
barrelY:37.5
barrelOffsetX_onOddShots:10
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:420
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\ShellCannon_1.ogg
shoot_sound_vol:0.6
shoot_flame:BZ_Fire_1



[projectile_HeavyForkClass_Turret_Cannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Mortar_L*1
(
    addResources=
    ShellDamage:6000
    |DpDamage:250
    |WeaponAccuracy=75
    |PartBreakModifier=0.5
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1.5
    |AntiAqua=0.75
    |AntiAir=0.5 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=0.5
    |HeightHitRange=10
    |ProjectileSpeed:30
    |ProjectileSpread:0
    |ProjectileExplosionRange:80
    |ProjectileLife:75
)
"""


[hiddenAction_HeavyForkClass_Turret_Cannon_CDStart]
autoTrigger:"""
if memory.HeavyForkClass_Turret_Cannon_OnCD==false 
and 
(
    (
        self.resource.HeavyForkClass_Turret_Cannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.HeavyForkClass_Turret_Cannon_ShootTimer<${HeavyForkClass_Turret_Cannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:HeavyForkClass_Turret_Cannon_OnCD=true,HeavyForkClass_Turret_Cannon_CDTimer=self.timeAlive+${HeavyForkClass_Turret_Cannon_CD}

[hiddenAction_HeavyForkClass_Turret_Cannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.HeavyForkClass_Turret_Cannon_OnCD==true and self.timeAlive>memory.HeavyForkClass_Turret_Cannon_CDTimer
setUnitMemory:HeavyForkClass_Turret_Cannon_OnCD=false
setResourcesWithLogic:HeavyForkClass_Turret_Cannon_ShootTimer=${HeavyForkClass_Turret_Cannon_Shoot}



[hiddenAction_HeavyForkClass_Turret_Cannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${HeavyForkClass_Turret_Cannon_EN}




[turret_Common_Turret_Mortar_HeavyForkClass]
barrelX:0
barrelY:37.5