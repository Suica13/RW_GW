[hiddenAction_ZN_120mmMG_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=500 
and eventData("RandomWeapon",type="float")>50 
and self.resource().EquipmentIndex==0 
and memory.armRBreaked==false
"""

[hiddenAction_ZN_120mmMG_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[decal_ZN_120mmMG]
isVisible:if memory.nowWeaponIndex==0 and self.resource().EquipmentIndex==0 and memory.armRBreaked==false
[decal_ZN_120mmMG_NotUsing]
isVisible:if memory.nowWeaponIndex!=0 and self.resource().EquipmentIndex==0 and memory.armRBreaked==false


[hiddenAction_ZN_MS_06K_BigGun_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=500  
and eventData("RandomWeapon",type="float")>50 
and self.resource().EquipmentIndex==1 
and not ( memory.armRBreaked==true and memory.armLBreaked==true )
"""

[hiddenAction_ZN_MS_06K_BigGun_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[decal_ZN_MS_06K_BigGun_L]
isVisible:if memory.nowWeaponIndex==0 and self.resource().EquipmentIndex==1 and memory.armLBreaked==false
[decal_ZN_MS_06K_BigGun_R]
isVisible:if memory.nowWeaponIndex==0 and self.resource().EquipmentIndex==1 and memory.armRBreaked==false
[decal_ZN_MS_06K_BigGun_L_NotUsing]
isVisible:if memory.nowWeaponIndex!=0 and self.resource().EquipmentIndex==1 and memory.armLBreaked==false
[decal_ZN_MS_06K_BigGun_R_NotUsing]
isVisible:if memory.nowWeaponIndex!=0 and self.resource().EquipmentIndex==1 and memory.armRBreaked==false



