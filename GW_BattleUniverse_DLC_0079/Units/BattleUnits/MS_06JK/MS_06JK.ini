[hiddenAction_ZN_120mmMG_AntiAir_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=600  
and self.resource().EquipmentIndex==0 
and eventData("RandomWeapon",type="float")>35 
and memory.armRBreaked==false
"""

[hiddenAction_ZN_120mmMG_AntiAir_SetWeaponIndex]
