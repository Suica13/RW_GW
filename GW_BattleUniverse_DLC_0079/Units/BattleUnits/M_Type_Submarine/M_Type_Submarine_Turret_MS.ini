[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:M_Type_Submarine_Turret_MS
displayText:M-Type Submarine MS
displayText_zh:M型潜水艇 导弹

maxHp: 7500

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory M_Type_Submarine_Turret_MS_OnCD:bool
@memory M_Type_Submarine_Turret_MS_CDTimer:float
@global M_Type_Submarine_Turret_MS_CD=6
@global M_Type_Submarine_Turret_MS_EN=3

@global M_Type_Submarine_Turret_MS_Shoot=4

[resource_M_Type_Submarine_Turret_MS_ShootTimer]
hidden:true



[turret_M_Type_Submarine_Turret_MS]
x:0
y:0

canShoot:true
canOnlyAttackUnitsWithoutTags:AirUnit
canAttackUnderwaterUnits:false
onShoot_triggerActions:M_Type_Submarine_Turret_MS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:M_Type_Submarine_Turret_MS_Projectile
resourceUsage:M_Type_Submarine_Turret_MS_ShootTimer=1

delay:0.75s
canAttackMaxAngle:360
limitingAngle:360
limitingRange:1200
barrelX:35
barrelY:0
barrelOffsetX_onOddShots:-70
turnSpeed:0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_M_Type_Submarine_Turret_MS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS*1
(
    addResources=
    ShellDamage:1200
    |DpDamage:90
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.25
    |AntiAir=0.25
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:35
    |ProjectileTurnspeed:1.25
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:40
)
"""


[hiddenAction_M_Type_Submarine_Turret_MS_CDStart]
autoTrigger:"""
if memory.M_Type_Submarine_Turret_MS_OnCD==false 
and 
(
    (
        self.resource.M_Type_Submarine_Turret_MS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.M_Type_Submarine_Turret_MS_ShootTimer<${M_Type_Submarine_Turret_MS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:M_Type_Submarine_Turret_MS_OnCD=true,M_Type_Submarine_Turret_MS_CDTimer=self.timeAlive+${M_Type_Submarine_Turret_MS_CD}

[hiddenAction_M_Type_Submarine_Turret_MS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.M_Type_Submarine_Turret_MS_OnCD==true and self.timeAlive>memory.M_Type_Submarine_Turret_MS_CDTimer
setUnitMemory:M_Type_Submarine_Turret_MS_OnCD=false
setResourcesWithLogic:M_Type_Submarine_Turret_MS_ShootTimer=${M_Type_Submarine_Turret_MS_Shoot}

[hiddenAction_M_Type_Submarine_Turret_MS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${M_Type_Submarine_Turret_MS_EN}