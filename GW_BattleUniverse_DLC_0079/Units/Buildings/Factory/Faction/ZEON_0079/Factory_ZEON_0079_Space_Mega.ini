AutoProduce_ChivvayClassKai,
AutoProduce_ZanzibarClassKai,
AutoProduce_MA_05,
AutoProduce_MA_08,
AutoProduce_MusaiClassLateType_0083,
AutoProduce_ZanzibarClassKai_0083,
AutoProduce_MA_06,
AutoProduce_AMX_002
"""
[hiddenAction_AutoProduce_T2_HardUnits]
isVisible:false



