
[core]
copyFrom:"""
ROOT:Units/Buildings/Factory/Mod/Factory.ini,
ROOT:Units/Buildings/Factory/UnitList/EFSF_0079/EFSF_0079_UnitList_Mega.ini,
ROOT:Units/Buildings/Factory/UnitList/ZEON_0079/ZEON_0079_UnitList_Mega.ini
"""


tags:Building,SLChangeFaction,CanBeTargetUnit,CanProduceBuilding,Factory_ZEON_0079_Mega,Factory_Mega,Factory,ZEON,0079
name:Factory_ZEON_0079_Mega
displayText:Mega Factory[ZEON][0079]
displayText_zh:巨型工厂[ZEON][0079]

footprint: -4,-3,1,2
constructionFootprint: -4,-3,1,2
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:10

maxHp: 60000

@global Money=750
@global Resource=1500
@global buildTime=20

exit_x:0
exit_y:25
exit_moveAwayAmount:0

[hiddenAction_Building_GetDone]
temporarilyAddTags:Factory_T1

[ai]
buildPriority: 0.05
maxEachBase:1
maxGlobal:2
noneInBaseExtraPriority: 0.15
noneGlobalExtraPriority: 0.15

[placementRule_NearSL]
searchDistance:450

[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Mega.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Light_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Mega_Light.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
teamColors:true
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Work_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:if self.queueSize()>0
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Mega_ON.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Faction_1]
layer:beforeBody
order:2
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Resource/Image/Icon/Faction_ZEON_0079_2.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.2
xOffsetRelative:-55
yOffsetRelative:-41




[hiddenAction_Get_AutoProduce]
requireConditional:if memory.buildDone==true and rnd(0,100)>50
alsoTriggerAction:"""
Get_AutoProduce_T1,
Get_AutoProduce_T2
"""
[hiddenAction_Get_AutoProduce_T1]
requireConditional:"""
if 
self.resource().Money>3000 
and self.resource().Resource>6000 
and not self.globalTeamTags(includes='Tech_ZEON_0079_T2_NewTypeUnderwaterMSDevelopmentPlan') 
"""
alsoTriggerAction:"""
AutoProduce_T1_NormalUnits,
AutoProduce_T1_HardUnits
"""

[hiddenAction_AutoProduce_T1_NormalUnits]
requireConditional:if memory.randomProduceLevel<0.85
alsoTriggerAction:"""
AutoProduce_DabudeClass,
AutoProduce_GawClass
"""
[hiddenAction_AutoProduce_T1_HardUnits]
requireConditional:if memory.randomProduceLevel>0.85
alsoTriggerAction:"""
AutoProduce_ApsarasII
"""

[hiddenAction_AutoProduce_DabudeClass]
@define AutoProduceIndexMin=900
@define AutoProduceIndexMax=1000
@define Number:1
[hiddenAction_AutoProduce_GawClass]
@define AutoProduceIndexMin=700
@define AutoProduceIndexMax=900
@define Number:1

[hiddenAction_AutoProduce_ApsarasII]
@define AutoProduceIndexMin=600
@define AutoProduceIndexMax=700
@define Number:1

[hiddenAction_Get_AutoProduce_T2]
requireConditional:"""
if 
self.resource().Money>4500 
and self.resource().Resource>9000 
and self.globalTeamTags(includes='Tech_ZEON_0079_T2_NewTypeUnderwaterMSDevelopmentPlan') 
"""
alsoTriggerAction:"""
AutoProduce_T2_NormalUnits
"""

[hiddenAction_AutoProduce_T2_NormalUnits]
alsoTriggerAction:"""
AutoProduce_GawClass,
AutoProduce_ZanzibarClass,
AutoProduce_ZanzibarClassKai,
AutoProduce_ZanzibarClassKai_0083
"""

[hiddenAction_AutoProduce_ZanzibarClass]
@define AutoProduceIndexMin=600
@define AutoProduceIndexMax=700
@define Number:2
requireConditional:"""
if self.globalTeamTags(includes='Unlock_${UnitID}') 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMin} 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMax} 
and self.numberOfUnitsInTeam(withTag='${UnitID}')<=${Number} 
and not self.globalTeamTags(includes='Unlock_ZanzibarClassKai') 
"""

[hiddenAction_AutoProduce_ZanzibarClassKai]
@define AutoProduceIndexMin=400
@define AutoProduceIndexMax=500
@define Number:2
requireConditional:"""
if self.globalTeamTags(includes='Unlock_ZanzibarClassKai') 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMin} 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMax} 
and self.numberOfUnitsInTeam(withTag='ZanzibarClassKai')<=${Number} 
and not self.globalTeamTags(includes='Unlock_ZanzibarClassKai_0083') 
"""
[hiddenAction_AutoProduce_ZanzibarClassKai_0083]
@define AutoProduceIndexMin=400
@define AutoProduceIndexMax=500
@define Number:2