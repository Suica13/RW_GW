[core]
dont_load:true


@memory autoProduceCD:float
@memory autoProduceRandom:float

@memory canProduceBuildingList:unit[]
@memory canProduceSlotList:unit[]

@memory canProduceBuildingIndex:float
@memory canProduceSlotIndex:float



#自动生产
[hiddenAction_AutoProduce]
autoTrigger:true
requireConditional:"""
if self.isControlledByAI() and self.timeAlive>memory.autoProduceCD
"""
setUnitMemory:"""
autoProduceCD=self.timeAlive+7.0*select
(
    self.resource().AIHard<=1,
    1,
    select
    (
        self.resource().AIHard>=1.4 and self.resource().AIHard<1.8,
        0.85,
        select
        (
            self.resource().AIHard>=1.8 and self.resource().AIHard<3.7,
            0.75,
            0.50
        )
    )
)
"""
alsoTriggerAction:"""
CanProduceUnitsCheck,
AutoProduceCheck
"""

[hiddenAction_CanProduceUnitsCheck]
shrinkArrays:"""
canProduceBuildingList,
canProduceSlotList
"""
setUnitMemory:"""
canProduceBuildingList=null,
canProduceSlotList=null
"""
alsoTriggerAction:"""
CanProduceBuildingCheck,
CanProduceSlotCheck
"""
[hiddenAction_CanProduceBuildingCheck]
takeResources_includeUnitsWithinRange:99999
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:CanProduceBuilding
takeResources_searchOnly:true
takeResources_maxUnits:1000
takeResources_triggerActionForEach:CanProduceBuildingCheck_Step2
[hiddenAction_CanProduceBuildingCheck_Step2]
requireConditional:if thisActionTarget.hp>0 and thisActionTarget.teamID==self.teamId
setUnitMemory:"""
canProduceBuildingList[memory.canProduceBuildingList.size]=thisActionTarget
"""


[hiddenAction_CanProduceSlotCheck]
takeResources_includeUnitsWithinRange:99999
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:CanProduceSlot
takeResources_searchOnly:true
takeResources_maxUnits:1000
takeResources_triggerActionForEach:CanProduceSlotCheck_Step2
[hiddenAction_CanProduceSlotCheck_Step2]
requireConditional:if thisActionTarget.hp>0 and thisActionTarget.teamID==self.teamId
setUnitMemory:"""
canProduceSlotList[memory.canProduceSlotList.size]=thisActionTarget
"""



[hiddenAction_AutoProduceCheck]
setUnitMemory:"""
autoProduceRandom=rnd(0,100),
canProduceBuildingIndex=int(rnd(0,memory.canProduceBuildingList.size)),
canProduceSlotIndex=int(rnd(0,memory.canProduceSlotList.size))
"""
alsoTriggerAction:"""
AutoProduceBuildingSend,
AutoProduceSlotSend
"""
[hiddenAction_AutoProduceBuildingSend]
requireConditional:if memory.autoProduceRandom<75
alsoTriggerAction:AutoProduceBuildingSend_Step2
alsoTriggerActionRepeat:memory.canProduceBuildingList.size
[hiddenAction_AutoProduceBuildingSend_Step2]
requireConditional:if index==memory.canProduceBuildingIndex
sendMessageTo:memory.canProduceBuildingList[index]
sendMessageWithTags:AutoProduce
sendMessageWithData:AutoProduceIndex=rnd(0,1000)


[hiddenAction_AutoProduceSlotSend]
requireConditional:if memory.autoProduceRandom>75
alsoTriggerAction:AutoProduceSlotSend_Step2
alsoTriggerActionRepeat:memory.canProduceSlotList.size
[hiddenAction_AutoProduceSlotSend_Step2]
requireConditional:if index==memory.canProduceSlotIndex
sendMessageTo:memory.canProduceSlotList[index]
sendMessageWithTags:AutoProduce
sendMessageWithData:AutoProduceIndex=rnd(0,1000)