
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Unit/BattleUnit_Framework.ini
"""

borrowResourcesWhileAlive:Mp=-1

[hiddenAction_BattleUnitCore_Spawn]
attachments_addNewUnits:BattleUnitCore_Tank

[action_Set_AttackMode_Shoot]
autoTrigger:false
isLocked:true
isLockedMessage:No Allow To Change
isLockedMessage_zh:不允许切换

[action_Set_AttackMode_Cqb]
autoTrigger:false
isLocked:true
isLockedMessage:No Allow To Change
isLockedMessage_zh:不允许切换



[hiddenAction_TryAttack]
autoTrigger:"""
if self.attacking!=null and ${onAttacking}==false and ${cantAction}==false and ${onSkill}==false   
and not self.hasActiveWaypoint(type="build") 
and not self.hasActiveWaypoint(type="repair") 
and 
select
(
    self.parent.hp>0,
    select(self.parent.hasTags(includes='inVehicleCanAttack'),true,false),
    true
)
"""
sendMessageTo:self
sendMessageWithTags:Attack
sendMessageWithData:RandomWeapon=rnd(0,100)


[action_Exit]
isLocked:if memory.tileType==2
isLockedMessage:On Water
isLockedMessage_zh:在水面上


[hiddenAction_Set_Get_PlayMoveAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayMoveReversingAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayGuardAnimation]
requireConditional:false
playAnimation:IGNORE


[attack]

isFixedFiring:false

[graphics]
drawLayer:ground2
dustEffect: true
splastEffect:true

[movement]

movementType: OVER_CLIFF
moveSpeed: 0.5
maxTurnSpeed: 0.5

moveAccelerationSpeed: 0.15
moveDecelerationSpeed: 0.5
reverseSpeedPercentage:0.75

turnAcceleration: 0.5

heightChangeRate:1
targetHeight:1

moveSlidingMode:false
moveSlidingDir:0
moveIgnoringBody:false

joinsGroupFormations:true

