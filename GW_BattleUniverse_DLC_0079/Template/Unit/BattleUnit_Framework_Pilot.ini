[hiddenAction_Get_GiveDamageInfoExp]
autoTriggerOnEvent:newMessage(withTag="GiveDamageInfoExp")
@global pilotExpUp=1
setUnitMemory:"""
pilotExpCount=memory.pilotExpCount+
select
(
    eventData("DamagePer",type="float")<=0,
    0,
    eventData("DamagePer",type="float")*2000*(parent.readUnitMemory(name="finalExpSpeed",type="float")+0.001)*
    min(2.5,max(eventData(name="UnitLevel",type="float")/(parent.readUnitMemory(name="UnitLevel",type="float")+0.001),0.25))*
    (1+eventData("PilotLevel",type="float")*0.5)
)*${pilotExpUp}
"""
