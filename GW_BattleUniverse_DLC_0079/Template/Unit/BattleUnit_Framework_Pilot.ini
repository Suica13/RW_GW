setUnitMemory:"""
pilotShootSkill=memory.pilotShootSkill*memory.pilotComprehensionSkill*0.01,
pilotCqbSkill=memory.pilotCqbSkill*memory.pilotComprehensionSkill*0.01,
pilotDefSkill=memory.pilotDefSkill*memory.pilotComprehensionSkill*0.01,
pilotSpeedSkill=memory.pilotSpeedSkill*memory.pilotComprehensionSkill*0.01,
pilotAccuracySkill=memory.pilotAccuracySkill*memory.pilotComprehensionSkill*0.01,
pilotReactionSkill=memory.pilotReactionSkill*memory.pilotComprehensionSkill*0.01,
pilotLeadershipSkill=memory.pilotLeadershipSkill*memory.pilotComprehensionSkill*0.01,
pilotAwakeningSkill=memory.pilotAwakeningSkill*memory.pilotComprehensionSkill*0.01,

pilotLevelCount=memory.pilotLevelCount+1,
pilotExpCount=memory.pilotExpCount-memory.pilotLevelUpExpNeed,
pilotLevelUpExpNeed=memory.pilotLevelUpExpNeed*1.5
"""
