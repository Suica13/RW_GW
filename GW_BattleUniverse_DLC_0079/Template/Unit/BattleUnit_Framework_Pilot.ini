PilotCustomType=
select
(
    parent.hp>0,
    customTarget1.customTarget1.resource.PilotCustomType,
    customTarget1.resource.PilotCustomType
)
"""
setUnitMemory:"""

pilotShootSkill=int(rnd(85,101)),
pilotCqbSkill=int(rnd(85,101)),
pilotDefSkill=int(rnd(85,101)),
pilotSpeedSkill=int(rnd(85,101)),
pilotAccuracySkill=int(rnd(85,101)),
pilotReactionSkill=int(rnd(85,101)),
pilotLeadershipSkill=int(rnd(50,66)),
pilotAwakeningSkill=0
"""
alsoTriggerAction:"""
InitializeStats_PilotSkills_Level,
InitializeStats_PilotSkills_Level_Self,
InitializeStats_PilotSkills_AI,
InitializeStats_PilotSkills_Type
"""
[hiddenAction_InitializeStats_PilotSkills_Level]
requireConditional:if customTarget1.resource.PilotLevel>0 and self.resource.PilotLevel<=0
@define target=customTarget1
@define uplevel=0.025
setUnitMemory:"""
pilotShootSkill=memory.pilotShootSkill+memory.pilotShootSkill*${target}.resource.PilotLevel*${uplevel},
pilotCqbSkill=memory.pilotCqbSkill+memory.pilotCqbSkill*${target}.resource.PilotLevel*${uplevel},
pilotDefSkill=memory.pilotDefSkill+memory.pilotDefSkill*${target}.resource.PilotLevel*${uplevel},
pilotSpeedSkill=memory.pilotSpeedSkill+memory.pilotSpeedSkill*${target}.resource.PilotLevel*${uplevel},
pilotAccuracySkill=memory.pilotAccuracySkill+memory.pilotAccuracySkill*${target}.resource.PilotLevel*${uplevel},
pilotReactionSkill=memory.pilotReactionSkill+memory.pilotReactionSkill*${target}.resource.PilotLevel*${uplevel},
pilotLeadershipSkill=memory.pilotLeadershipSkill+memory.pilotLeadershipSkill*${target}.resource.PilotLevel*${uplevel},
pilotAwakeningSkill=memory.pilotAwakeningSkill+memory.pilotAwakeningSkill*${target}.resource.PilotLevel*${uplevel}
"""
[hiddenAction_InitializeStats_PilotSkills_Level_Self]
@copyFromSection:hiddenAction_InitializeStats_PilotSkills_Level
requireConditional:if self.resource.PilotLevel>0 
@define target=self
@define uplevel=0.025


[hiddenAction_InitializeStats_PilotSkills_AI]
requireConditional:if self.isControlledByAI()
@define uplevel=select(self.resource().AIHard<=1,0,select(self.resource().AIHard>=1.4 and self.resource().AIHard<1.8,2,select(self.resource().AIHard>=1.8 and self.resource().AIHard<3.7,4,6)))
setUnitMemory:"""
pilotShootSkill=memory.pilotShootSkill+${uplevel},
pilotCqbSkill=memory.pilotCqbSkill+${uplevel},
pilotDefSkill=memory.pilotDefSkill+${uplevel},
pilotSpeedSkill=memory.pilotSpeedSkill+${uplevel},
pilotAccuracySkill=memory.pilotAccuracySkill+${uplevel},
pilotReactionSkill=memory.pilotReactionSkill+${uplevel},
pilotLeadershipSkill=memory.pilotLeadershipSkill+${uplevel},
pilotAwakeningSkill=memory.pilotAwakeningSkill+${uplevel}
"""

