
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Unit/BattleUnit_Framework.ini
"""

borrowResourcesWhileAlive:Mp=0
canNotBeGivenOrdersByPlayer:true
isUnselectable:true

[hiddenAction_BattleUnitCore_Spawn]
attachments_addNewUnits:BattleUnitCore_ExitDecoy

[hiddenAction_Set_Get_PlayMoveAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayMoveReversingAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayGuardAnimation]
requireConditional:false
playAnimation:IGNORE




[hiddenAction_Dead_Explode]
fireTurretXAtGround:1
fireTurretXAtGround_withProjectile:Dead_Explode_Projectile
fireTurretXAtGround_withTarget:self.getOffsetRelative()

[projectile_Dead_Explode_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_ExitDecoy*1
(
    addResources=
    ShellDamage:3500
    |DpDamage:1500
    |CantDodge:1
    |WeaponAccuracy=200
    |PartBreakModifier=0.5
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=0.75
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=0.75
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=0.75
    |AntiAqua=0.75
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=0.5
    |HeightHitRange=35
    |ProjectileSpeed:0
    |ProjectileSpread:0
    |ProjectileExplosionRange:60
    |ProjectileLife:7
)
"""









[movement]

movementType: AIR
moveSpeed: 1
maxTurnSpeed: 1

moveAccelerationSpeed: 0.25
moveDecelerationSpeed: 0.125
reverseSpeedPercentage:0.25

turnAcceleration: 1

heightChangeRate:0
targetHeightDrift:0
targetHeight:1

moveSlidingMode:false
moveSlidingDir:360
moveIgnoringBody:false

joinsGroupFormations:true

[graphics]
drawLayer:air
