
[core]
dont_load:true

copyFrom:"""
Transport_Hangar.ini
"""

tags:Hangar,Transport_Hangar,TransportHangar,Transport_Hangar_PilotSlot
name:Transport_Hangar_PilotSlot



showActionsWithMixedSelectionIfOtherUnitsHaveTag:Transport_Hangar_PilotSlot

maxTransportingUnits:8
transportUnitsRequireTag:Pilot

exit_x:0
exit_y:25
exit_moveAwayAmount:50

@memory maxTransportingUnits:float

[action_UnloadAllUnits]
autoTrigger:"""
if false
"""


[hiddenAction_Check_PilotReturnSlot]
autoTrigger:true
alsoTriggerAction:"""
Check_PilotReturnSlot_T,
Check_PilotReturnSlot_F
"""
setUnitMemory:maxTransportingUnits=${core.maxTransportingUnits}

[hiddenAction_Check_PilotReturnSlot_T]
requireConditional:if self.transportingCount<${core.maxTransportingUnits} and not self.tags(includes='PilotReturnSlot')
temporarilyAddTags:PilotReturnSlot

[hiddenAction_Check_PilotReturnSlot_F]
requireConditional:if self.transportingCount>=${core.maxTransportingUnits} and self.tags(includes='PilotReturnSlot')
temporarilyRemoveTags:PilotReturnSlot


[hiddenAction_Get_UnitPilotSpawnDone]
autoTriggerOnEvent:newMessage(withTag="UnitPilotSpawnDone")
requireConditional:if self.transportingCount>0 and not eventData("unitInfo",type="unit").tags(includes='SFS_Neutral')
alsoTriggerAction:"""
Get_UnitPilotSpawnDone_ToTargetPilot,
Get_UnitPilotSpawnDone_ToSlot
"""
[hiddenAction_Get_UnitPilotSpawnDone_ToTargetPilot]
sendMessageTo:eventData("pilotInfo",type="unit")
sendMessageWithTags:DeletePilot
[hiddenAction_Get_UnitPilotSpawnDone_ToSlot]
sendMessageTo:self.transporting(slot=0)
sendMessageWithTags:TryChangePilotWithTarget_BySlot
sendMessageWithData:"""
unitInfo=eventData("unitInfo",type="unit")
"""


[hiddenAction_GetExit]
