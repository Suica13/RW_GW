
[core]
dont_load:false
name:Flamethrower_Fire_1_EffectUnit

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory onPlay:float
@memory flamethrower_Fire_1_effectFrame:float

@memory flamethrower_Fire_1_speed:float

@global flamethrower_Fire_1_total_frames=15

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
UpdateFrame,
EndPlay
"""

[hiddenAction_SetStats]
setUnitMemory:flamethrower_Fire_1_effectFrame=-1

[hiddenAction_PlayOneTime]
autoTriggerOnEvent:newMessage(withTag="PlayOneTime")
setUnitMemory:onPlay=1,flamethrower_Fire_1_effectFrame=0
playSoundAtUnit:ROOT:Resource/Sound/SE/Unit/Burned_1.ogg:1.0

[hiddenAction_UpdateFrame]
requireConditional:if memory.onPlay==1 and memory.flamethrower_Fire_1_effectFrame<=${flamethrower_Fire_1_total_frames}
setUnitMemory:flamethrower_Fire_1_effectFrame=memory.flamethrower_Fire_1_effectFrame+0.009*memory.flamethrower_Fire_1_speed

[hiddenAction_EndPlay]
requireConditional:if memory.flamethrower_Fire_1_effectFrame>${flamethrower_Fire_1_total_frames}
setUnitMemory:onPlay=0,flamethrower_Fire_1_effectFrame=-1

[hiddenAction_SetSpeed]
autoTriggerOnEvent:newMessage(withTag="SetSpeed")
setUnitMemory:flamethrower_Fire_1_speed=eventData("Speed",type="float")*self.Resource.BulletSpeed


[decal_flamethrower_Fire_1]
layer:beforeUI
onlyTeam:any
order:1
image: ROOT:Resource/Image/Fx/Weapon/Sp/Image/Flamethrower_Fire_1.png


total_frames:${flamethrower_Fire_1_total_frames}
frame:memory.flamethrower_Fire_1_effectFrame

imageScale:0.5
alpha:select(memory.flamethrower_Fire_1_effectFrame>=0,1,0)

xOffsetRelative:-7
yOffsetRelative:125

dirOffset:-90

onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if self.timeAlive>0.1



[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:1
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false

