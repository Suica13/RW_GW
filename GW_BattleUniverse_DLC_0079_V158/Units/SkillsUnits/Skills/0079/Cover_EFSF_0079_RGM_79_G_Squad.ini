[core]
dont_load:true

@memory Cover_EFSF_0079_RGM_79_G_Squad_CDTimer:float
@memory Cover_EFSF_0079_RGM_79_G_Squad_Target:unit

[action_Cover_EFSF_0079_RGM_79_G_Squad]
@define WarLevel=1000
@define CD=480
@define Money=6000

pos:100

buildSpeed:0s

highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
ai_isDisabled:true
extraLagHidingInUI:true

displayType:action
isGuiBlinking:"""
if self.timeAlive>memory.Cover_EFSF_0079_RGM_79_G_Squad_CDTimer 
and self.resource().WarLevel>${WarLevel}
"""

text:GM Ground Type [Airborne] %{select(self.timeAlive<=memory.Cover_EFSF_0079_RGM_79_G_Squad_CDTimer,str(int(memory.Cover_EFSF_0079_RGM_79_G_Squad_CDTimer-self.timeAlive))+"s","OK")}
text_zh:陆战型吉姆[空降部队] %{select(self.timeAlive<=memory.Cover_EFSF_0079_RGM_79_G_Squad_CDTimer,str(int(memory.Cover_EFSF_0079_RGM_79_G_Squad_CDTimer-self.timeAlive))+"s","OK")}

description: Call for support troops in the designated area\nMust be deployed near the SL\Airdrop GM Ground Type Squad
description_zh: 在指定区域呼叫部队支援\n必须部署在据点附近\n空降一队陆战型吉姆

showMessageToAllPlayers:[%{self.playerName}]Called Artillery Support
showMessageToAllPlayers_zh:[%{self.playerName}]呼叫了空降部队

iconImage:ROOT:Resource/Image/Units/Button/Cover/Cover_Force_1.png
playSoundGlobally:ROOT:Resource/Sound/SE/Environment/Warning_4.ogg:0.75

isLocked:if self.timeAlive<=memory.Cover_EFSF_0079_RGM_79_G_Squad_CDTimer
isLockedMessage:In CD
isLockedMessage_zh:冷却中
isLockedAlt:if self.resource().WarLevel<${WarLevel}
isLockedAltMessage:WarLevel ${WarLevel}
isLockedAltMessage_zh:激烈度 ${WarLevel}

fireTurretXAtGround:MainTurret
fireTurretXAtGround_count:0

price: Money=${Money}

setUnitMemory:"""
Cover_EFSF_0079_RGM_79_G_Squad_CDTimer=self.timeAlive+${CD}
"""

alsoTriggerAction:"""
Cover_EFSF_0079_RGM_79_G_Squad_Step2,
Cover_EFSF_0079_RGM_79_G_Squad_Send_CV_Ally,
Cover_EFSF_0079_RGM_79_G_Squad_Send_CV_Enemy
"""
[hiddenAction_Cover_EFSF_0079_RGM_79_G_Squad_Step2]
buildSpeed:0s
setUnitMemory:"""
Cover_EFSF_0079_RGM_79_G_Squad_Target=select
(
    self.isControlledByAI==true,
    memory.Cover_EFSF_0079_RGM_79_G_Squad_Target,
    createMarker(teamID=self.teamID,x=thisActionTarget.x,y=thisActionTarget.y)
)
"""
alsoTriggerAction:"""
Cover_EFSF_0079_RGM_79_G_Squad_Step3_A,
Cover_EFSF_0079_RGM_79_G_Squad_Step3_B
"""
[hiddenAction_Cover_EFSF_0079_RGM_79_G_Squad_Step3_A]
requireConditional:"""
if memory.Cover_EFSF_0079_RGM_79_G_Squad_Target.numberOfUnitsInTeam(withTag="StrategicLocation",withinrange=200)>0 or memory.Cover_EFSF_0079_RGM_79_G_Squad_Target.numberOfUnitsInAllyNotOwnTeam(withTag="StrategicLocation",withinrange=200)>0
"""
fireTurretXAtGround:MainTurret
fireTurretXAtGround_withTarget:memory.Cover_EFSF_0079_RGM_79_G_Squad_Target
fireTurretXAtGround_withProjectile:Cover_EFSF_0079_RGM_79_G_Squad_Projectile
[hiddenAction_Cover_EFSF_0079_RGM_79_G_Squad_Step3_B]
requireConditional:"""
if memory.Cover_EFSF_0079_RGM_79_G_Squad_Target.numberOfUnitsInTeam(withTag="StrategicLocation",withinrange=200)<=0 and memory.Cover_EFSF_0079_RGM_79_G_Squad_Target.numberOfUnitsInAllyNotOwnTeam(withTag="StrategicLocation",withinrange=200)<=0
"""
fireTurretXAtGround:MainTurret
fireTurretXAtGround_withTarget:self.getOffsetRelative(x=rnd(-150,150),y=rnd(-150,150))
fireTurretXAtGround_withProjectile:Cover_EFSF_0079_RGM_79_G_Squad_Projectile









[projectile_Cover_EFSF_0079_RGM_79_G_Squad_Projectile]
#炮弹参数
directDamage: 0
life: 1
explodeOnEndOfLife:true
speed: 0
instant:true
#描画参数
effectOnCreate:none
explodeEffect:Cover_EFSF_0079_RGM_79_G_Squad
#生成
spawnUnit:"""
RGM_79_G_WithBackpack*1
(
    offsetHeight=120,
    offsetRandomXY=45,
    offsetRandomDir=30,
    addResources=EquipmentIndex:0
),
RGM_79_G_WithBackpack*1
(
    offsetHeight=120,
    offsetRandomXY=45,
    offsetRandomDir=30,
    addResources=EquipmentIndex:0
),
RGM_79_G_WithBackpack*1
(
    offsetHeight=120,
    offsetRandomXY=45,
    offsetRandomDir=30,
    addResources=EquipmentIndex:1
)
"""





[effect_Cover_EFSF_0079_RGM_79_G_Squad]
image:ROOT:Units/BattleUnits/Medea/Image/Medea_Body_1.png
attachedToUnit:false
life:100
hOffset:150
physics:false
priority:high
liveAfterAttachedDies:true
alpha:1
alwayStartDirAtZero:true
dirOffset:0.1
scaleFrom:0.75
scaleTo:1
xSpeedAbsolute:8
xOffsetAbsolute:-75








[hiddenAction_Cover_EFSF_0079_RGM_79_G_Squad_Send_CV_Ally]
takeResources_includeUnitsWithinRange:10000
takeResources_includeUnitsWithinRange_team:ally
takeResources_excludeUnitsWithoutTags:HQ
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:Cover_EFSF_0079_RGM_79_G_Squad_Send_CV_Ally_Step2
[hiddenAction_Cover_EFSF_0079_RGM_79_G_Squad_Send_CV_Ally_Step2]
sendMessageTo:thisActionTarget.readUnitMemory("cvMarker",type="unit").readUnitMemory('cvUnit',type='unit')
sendMessageWithTags:Play_AllyForce

[hiddenAction_Cover_EFSF_0079_RGM_79_G_Squad_Send_CV_Enemy]
takeResources_includeUnitsWithinRange:10000
takeResources_includeUnitsWithinRange_team:enemy
takeResources_excludeUnitsWithoutTags:HQ
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:Cover_EFSF_0079_RGM_79_G_Squad_Send_CV_Enemy_Step2
[hiddenAction_Cover_EFSF_0079_RGM_79_G_Squad_Send_CV_Enemy_Step2]
sendMessageTo:thisActionTarget.readUnitMemory("cvMarker",type="unit").readUnitMemory('cvUnit',type='unit')
sendMessageWithTags:Play_EnemyForce
