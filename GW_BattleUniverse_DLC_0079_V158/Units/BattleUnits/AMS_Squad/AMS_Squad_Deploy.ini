
[core]


copyFrom:"""
ROOT:Template/Unit/BattleUnit_Framework_Tank.ini,
ROOT:Template/Unit/BattleUnit_Graphics_Tank.ini,

ROOT:Resource/Image/Fx/Unit/Common_Unit_1_S.gw,

ROOT:Template/Unit/Animation/Stats/Common_OnMoving.gw,
