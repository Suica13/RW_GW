ROOT:Units/BattleUnits/Weapon/Shell/EF_AMS_Squad_AMS.gw
"""





tags:AMS_Squad,Unit,Tank,EFSF,0079,UC,SmallUnit
name:AMS_Squad_Deploy

displayText:AMS Squad
displayText_zh:对MS特技兵

displayDescription:"""
\nFederation special forces unit for anti-MS operations, equipped with AMS launcher  
\nStrengths  
\n=Stealth=  
\n=Stealth detection resistance beyond a certain range when deployed=  
\n=Can launch high-powered missiles after deployment=  
\nWeaknesses  
\n=Very low durability=  
\n=Extremely weak combat ability when not deployed=  
\n  
\n"Open fire on that grim reaper!"
"""
displayDescription_zh:"""
\n联邦军对MS特技兵,携带AMS发射器
\n优势
\n=匿踪=
\n=部署后一定范围外反侦测=
\n=部署后可以进行发射大威力导弹=
\n劣势
\n=耐久极低=
\n=非部署状态战斗力极差=
\n
\n“向那死神开火”
"""




showActionsWithMixedSelectionIfOtherUnitsHaveTag:AMS_Squad

showInEditor:false

maxHp:3000
maxShield:0
mass:50000

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/AMS_Squad.png
dustEffect:false

[attack]
isFixedFiring:true

[hiddenAction_InitializeStats]
setUnitMemory:"""
unitLevel=200,
enMax=300,
dpMax=500,

baseHeight=1,

attackMode=0,
baseAttackRange=500,
baseFogOfWarSightRange=20,

baseDetectRange=memory.baseFogOfWarSightRange*18,
baseAntiDetectRange=150,

baseMoveSpeed=0,
boostMoveSpeed=0,
baseTurnSpeed=0.5,

baseShootLevel=115,
baseCqbLevel=100,
cqbModeBuff=1.0,

baseAccuracyLevel=115,
baseReactionLevel=100,

baseBeamDef=5,
baseShellDef=20,
baseCqbDef=5,
baseDpDef=5,
baseSpDef=0,

extraBuildingDef=1,
extraBuildingAtk=1,

groundAdaptability=100,
cliffAdaptability=100,
waterAdaptability=50,
skyAdaptability=10,
spaceAdaptability=10
"""
[hiddenAction_InitializeAddPilot_Default]
addUnitsIntoTransport:Pilot_EFSF_0079_N_C_A*1

[hiddenAction_Set_Get_PlayStartEffect]
[hiddenAction_Set_Get_PlayCloseEffect]


[effect_breakedBody_A]
dirOffsetRandom:30
xSpeedRelativeRandom:0
ySpeedRelativeRandom:0
[effect_breakedBody_B]
dirOffsetRandom:30
xSpeedRelativeRandom:0
ySpeedRelativeRandom:0


[action_EnterDeployMode]
convertTo:AMS_Squad_Deploy

[action_ExitDeployMode]
