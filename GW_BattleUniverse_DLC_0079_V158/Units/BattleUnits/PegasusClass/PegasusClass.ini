tags:PegasusClass,Unit,CmdUnit,Ship,EFSF,0079,UC,LargeUnit,MpUpUnit_X12
name:PegasusClass

displayText:Pegasus Class
displayText_zh:飞马级

displayDescription:"""
\nPegasus-class No. 1 ship, used for deploying and testing MS  
\nAdvantages  
\n=Powerful firepower=  
\n=High durability=  
\n=Can ReEntry Free=
\n=Allows command defense=  
\n=Allows communication-based command=
\n=Automatic repair when out of combat=  
\n=Transport capacity: 6x2=  
\nDisadvantages  
\n=Massive size=  
\n=-250 yards stealth detection=  
\n=Reveals vision when spotted=  
\n= Can disperse Minovsky particles =
\n  
\n"The beginning of the counterattack"
"""
displayDescription_zh:"""
\n飞马级一号舰,用于运用和测试MS
\n优势
\n=火力充沛=
\n=耐久较高=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=可以自由穿梭大气层=
\n=运输力:6x2=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“反击的开始”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:PegasusClass


displayRadius:75
radius:75

maxHp:100000
maxShield:0

@global cmdComRangeExtra=150
@global cmdDefRangeExtra=150
@global supplyPointRangeExtra=150

