[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Beam_Charge_4_Pink.gw,
ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Beam_Charge_3_Pink.gw
"""

name:PegasusClass_Turret_MegaBeamCannon_S
displayText:PegasusClass MEGABeamCannon
displayText_zh:飞马级 MEGA光束炮

maxHp: 15000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory PegasusClass_Turret_MegaBeamCannon_S_OnCD:bool
@memory PegasusClass_Turret_MegaBeamCannon_S_CDTimer:float
@global PegasusClass_Turret_MegaBeamCannon_S_CD=8
@global PegasusClass_Turret_MegaBeamCannon_S_EN=60

@global PegasusClass_Turret_MegaBeamCannon_S_Shoot=2
[resource_PegasusClass_Turret_MegaBeamCannon_S_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2



[decal_PegasusClass_Turret_MegaBeamCannon_S]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/PegasusClass/Image/PegasusClass_Turret_MegaBeamCannon_1.png
imageScale:0.65
basePositionFromTurret:PegasusClass_Turret_MegaBeamCannon_S






[turret_PegasusClass_Turret_MegaBeamCannon_S]
x:0
y:0

canShoot:false
onShoot_triggerActions:SendEnemyTryAttack_Shoot,PegasusClass_Turret_MegaBeamCannon_S_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:PegasusClass_Turret_MegaBeamCannon_S_Projectile
resourceUsage:PegasusClass_Turret_MegaBeamCannon_S_ShootTimer=1

delay:2s
canAttackMaxAngle:15
limitingAngle:90
limitingRange:1200
barrelX:0
barrelY:18
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_2.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Charge_3_Pink

warmup:1s
warmupStartEffect:Beam_Charge_4_Pink
[turret_PegasusClass_Turret_MegaBeamCannon_S_L]
@copyFromSection:turret_PegasusClass_Turret_MegaBeamCannon_S
attachedTo:PegasusClass_Turret_MegaBeamCannon_S
x:5
canShoot:true
limitingAngle:15
[turret_PegasusClass_Turret_MegaBeamCannon_S_R]
@copyFromSection:turret_PegasusClass_Turret_MegaBeamCannon_S
attachedTo:PegasusClass_Turret_MegaBeamCannon_S
x:-5
canShoot:true
limitingAngle:15


[projectile_PegasusClass_Turret_MegaBeamCannon_S_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamCannon_Pink*1
(
    addResources=
    BeamDamage:7500
    |DpDamage:250
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:35
    |ProjectileSpread:4
    |ProjectileExplosionRange:35
    |ProjectileLife:55

    |ProjectileBlastRange:75
    |ProjectileBlastDamageModifier:0.20
    |ProjectileBlastDpModifier:1
)
"""


[hiddenAction_PegasusClass_Turret_MegaBeamCannon_S_CDStart]
autoTrigger:"""
if memory.PegasusClass_Turret_MegaBeamCannon_S_OnCD==false 
and 
(
    (
        self.resource.PegasusClass_Turret_MegaBeamCannon_S_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.PegasusClass_Turret_MegaBeamCannon_S_ShootTimer<${PegasusClass_Turret_MegaBeamCannon_S_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:PegasusClass_Turret_MegaBeamCannon_S_OnCD=true,PegasusClass_Turret_MegaBeamCannon_S_CDTimer=self.timeAlive+${PegasusClass_Turret_MegaBeamCannon_S_CD}

[hiddenAction_PegasusClass_Turret_MegaBeamCannon_S_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.PegasusClass_Turret_MegaBeamCannon_S_OnCD==true and self.timeAlive>memory.PegasusClass_Turret_MegaBeamCannon_S_CDTimer
setUnitMemory:PegasusClass_Turret_MegaBeamCannon_S_OnCD=false
setResourcesWithLogic:PegasusClass_Turret_MegaBeamCannon_S_ShootTimer=${PegasusClass_Turret_MegaBeamCannon_S_Shoot}

[hiddenAction_PegasusClass_Turret_MegaBeamCannon_S_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${PegasusClass_Turret_MegaBeamCannon_S_EN}