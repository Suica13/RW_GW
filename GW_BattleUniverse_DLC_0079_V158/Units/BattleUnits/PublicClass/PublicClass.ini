[hiddenAction_Common_DoubleMS_PublicClass_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>=50    
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and eventData("RandomWeapon",type="float")<=50
"""


[action_EF_PublicClass_AntiShipMS_Trigger]
isVisible:if self.parent.hp<=0 and self.resource().EquipmentIndex==0 
[action_EF_PublicClass_BeamDiffusionMS_Trigger]
isVisible:if self.parent.hp<=0 and self.resource().EquipmentIndex==1



