[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Yellow.gw
"""

name:MAX_03_Turret_BeamCannon
displayText:Adzam BeamCannon
displayText_zh:阿萨姆 光束炮

maxHp: 6000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory MAX_03_Turret_BeamCannon_OnCD:bool
@memory MAX_03_Turret_BeamCannon_CDTimer:float
@global MAX_03_Turret_BeamCannon_CD=8
@global MAX_03_Turret_BeamCannon_EN=15

@global MAX_03_Turret_BeamCannon_Shoot=2
[resource_MAX_03_Turret_BeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2



[decal_MAX_03_Turret_BeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/MAX_03/Image/MAX_03_Turret_BeamCannon_1.png
imageScale:0.75
basePositionFromTurret:MAX_03_Turret_BeamCannon






[turret_MAX_03_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,MAX_03_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:MAX_03_Turret_BeamCannon_Projectile
resourceUsage:MAX_03_Turret_BeamCannon_ShootTimer=1

delay:0.2s
canAttackMaxAngle:15
limitingAngle:60
limitingRange:650
barrelX:1
barrelY:14
barrelOffsetX_onOddShots:-2
turnSpeed:0.75

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Yellow




[projectile_MAX_03_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamRifle_Yellow*1
(
    addResources=
    BeamDamage:2000
    |DpDamage:100
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.5
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.5
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:45
    |ProjectileSpread:4
    |ProjectileLife:50
)
"""


[hiddenAction_MAX_03_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.MAX_03_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.MAX_03_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.MAX_03_Turret_BeamCannon_ShootTimer<${MAX_03_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:MAX_03_Turret_BeamCannon_OnCD=true,MAX_03_Turret_BeamCannon_CDTimer=self.timeAlive+${MAX_03_Turret_BeamCannon_CD}

[hiddenAction_MAX_03_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.MAX_03_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.MAX_03_Turret_BeamCannon_CDTimer
setUnitMemory:MAX_03_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:MAX_03_Turret_BeamCannon_ShootTimer=${MAX_03_Turret_BeamCannon_Shoot}

[hiddenAction_MAX_03_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${MAX_03_Turret_BeamCannon_EN}