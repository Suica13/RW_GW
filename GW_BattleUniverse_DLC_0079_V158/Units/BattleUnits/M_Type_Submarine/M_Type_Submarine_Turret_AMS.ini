[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:M_Type_Submarine_Turret_AMS
displayText:M-Type Submarine AMS
displayText_zh:M型潜水艇 鱼雷

maxHp: 7500



@memory M_Type_Submarine_Turret_AMS_OnCD:bool
@memory M_Type_Submarine_Turret_AMS_CDTimer:float
@global M_Type_Submarine_Turret_AMS_CD=4
@global M_Type_Submarine_Turret_AMS_EN=40

@global M_Type_Submarine_Turret_AMS_Shoot=2
[resource_M_Type_Submarine_Turret_AMS_ShootTimer]
hidden:true




[turret_M_Type_Submarine_Turret_AMS]
x:0
y:0

canShoot:true
canAttackNotTouchingWaterUnits:false
canOnlyAttackUnitsWithoutTags:AirUnit
onShoot_triggerActions:SendEnemyTryAttack_Shoot,M_Type_Submarine_Turret_AMS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:M_Type_Submarine_Turret_AMS_Projectile
resourceUsage:M_Type_Submarine_Turret_AMS_ShootTimer=1

delay:1.5s
canAttackMaxAngle:15
limitingAngle:360
limitingRange:1200
barrelX:0
barrelY:0
turnSpeed:1.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_M_Type_Submarine_Turret_AMS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS_Aqua_L*1
(
    addResources=
    ShellDamage:2500
    |DpDamage:150
    |WeaponAccuracy=85
    |PartBreakModifier=1.0
    |CockpitBreakModifier=1.0
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=0.5
    |AntiAqua=2
    |AntiAir=0.25 
    |AntiLand=1
    |AntiSpace=1
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:30
    |ProjectileTurnspeed:0
    |ProjectileSpread:0
    |ProjectileExplosionRange:55
    |ProjectileLife:70
)
"""


[hiddenAction_M_Type_Submarine_Turret_AMS_CDStart]
autoTrigger:"""
if memory.M_Type_Submarine_Turret_AMS_OnCD==false 
and 
(
    (
        self.resource.M_Type_Submarine_Turret_AMS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.M_Type_Submarine_Turret_AMS_ShootTimer<${M_Type_Submarine_Turret_AMS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:M_Type_Submarine_Turret_AMS_OnCD=true,M_Type_Submarine_Turret_AMS_CDTimer=self.timeAlive+${M_Type_Submarine_Turret_AMS_CD}

[hiddenAction_M_Type_Submarine_Turret_AMS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.M_Type_Submarine_Turret_AMS_OnCD==true and self.timeAlive>memory.M_Type_Submarine_Turret_AMS_CDTimer
setUnitMemory:M_Type_Submarine_Turret_AMS_OnCD=false
setResourcesWithLogic:M_Type_Submarine_Turret_AMS_ShootTimer=${M_Type_Submarine_Turret_AMS_Shoot}

[hiddenAction_M_Type_Submarine_Turret_AMS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${M_Type_Submarine_Turret_AMS_EN}