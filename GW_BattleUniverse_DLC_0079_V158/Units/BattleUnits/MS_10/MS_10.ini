displayText_zh:培曾·多瓦吉

displayDescription:"""
\nOne of the products of the Pezun Project, aimed at enhancing Dom's melee capabilities  
\nAdvantages  
\n=Can equip beam bazooka=  
\n=Excels at hit-and-run tactics=  
\n=High resistance to physical projectiles=  
\n=High resistance to melee attacks=  
\nDisadvantages  
\n=Low reaction speed=  
\n  
\n"The... the firepower gap is too big!"
"""
displayDescription_zh:"""
\n培曾计划的产物之一,皆在强化大魔的格斗性能
\n优势
\n=可装备光束火箭筒=
\n=擅长一击脱离=
\n=实弹抗性较高=
\n=格斗抗性较高=
\n劣势
\n=反应较差=
\n
\n“火..火力相差太大了!”
"""

