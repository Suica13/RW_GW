[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Beam_Charge_4_Pink.gw,
ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Beam_Charge_3_Pink.gw
"""

name:GrayPhantomClass_Turret_MegaBeamCannon
displayText:GrayPhantomClass BeamCannon
displayText_zh:灰色幽灵级 光束炮

maxHp: 20000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory GrayPhantomClass_Turret_MegaBeamCannon_OnCD:bool
@memory GrayPhantomClass_Turret_MegaBeamCannon_CDTimer:float
@global GrayPhantomClass_Turret_MegaBeamCannon_CD=8
@global GrayPhantomClass_Turret_MegaBeamCannon_EN=60

@global GrayPhantomClass_Turret_MegaBeamCannon_Shoot=2
[resource_GrayPhantomClass_Turret_MegaBeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2



[decal_GrayPhantomClass_Turret_MegaBeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/GrayPhantomClass/Image/GrayPhantomClass_Turret_MegaBeamCannon_1.png
imageScale:0.75
basePositionFromTurret:GrayPhantomClass_Turret_MegaBeamCannon






[turret_GrayPhantomClass_Turret_MegaBeamCannon]
x:0
y:0

canShoot:false
onShoot_triggerActions:SendEnemyTryAttack_Shoot,GrayPhantomClass_Turret_MegaBeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:GrayPhantomClass_Turret_MegaBeamCannon_Projectile
resourceUsage:GrayPhantomClass_Turret_MegaBeamCannon_ShootTimer=1

delay:2s
canAttackMaxAngle:15
limitingAngle:90
limitingRange:1200
barrelX:0
barrelY:18
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_2.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Charge_3_Pink

warmup:1s
warmupStartEffect:Beam_Charge_4_Pink
[turret_GrayPhantomClass_Turret_MegaBeamCannon_L]
@copyFromSection:turret_GrayPhantomClass_Turret_MegaBeamCannon
attachedTo:GrayPhantomClass_Turret_MegaBeamCannon
x:5
canShoot:true
limitingAngle:15
[turret_GrayPhantomClass_Turret_MegaBeamCannon_R]
@copyFromSection:turret_GrayPhantomClass_Turret_MegaBeamCannon
attachedTo:GrayPhantomClass_Turret_MegaBeamCannon
x:-5
canShoot:true
limitingAngle:15


[projectile_GrayPhantomClass_Turret_MegaBeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamCannon_Pink*1
(
    addResources=
    BeamDamage:8000
    |DpDamage:450
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:35
    |ProjectileSpread:4
    |ProjectileExplosionRange:35
    |ProjectileLife:55

    |ProjectileBlastRange:75
    |ProjectileBlastDamageModifier:0.20
    |ProjectileBlastDpModifier:1
)
"""


[hiddenAction_GrayPhantomClass_Turret_MegaBeamCannon_CDStart]
autoTrigger:"""
if memory.GrayPhantomClass_Turret_MegaBeamCannon_OnCD==false 
and 
(
    (
        self.resource.GrayPhantomClass_Turret_MegaBeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.GrayPhantomClass_Turret_MegaBeamCannon_ShootTimer<${GrayPhantomClass_Turret_MegaBeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:GrayPhantomClass_Turret_MegaBeamCannon_OnCD=true,GrayPhantomClass_Turret_MegaBeamCannon_CDTimer=self.timeAlive+${GrayPhantomClass_Turret_MegaBeamCannon_CD}

[hiddenAction_GrayPhantomClass_Turret_MegaBeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.GrayPhantomClass_Turret_MegaBeamCannon_OnCD==true and self.timeAlive>memory.GrayPhantomClass_Turret_MegaBeamCannon_CDTimer
setUnitMemory:GrayPhantomClass_Turret_MegaBeamCannon_OnCD=false
setResourcesWithLogic:GrayPhantomClass_Turret_MegaBeamCannon_ShootTimer=${GrayPhantomClass_Turret_MegaBeamCannon_Shoot}

[hiddenAction_GrayPhantomClass_Turret_MegaBeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${GrayPhantomClass_Turret_MegaBeamCannon_EN}