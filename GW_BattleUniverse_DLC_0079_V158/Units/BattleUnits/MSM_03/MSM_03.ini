[hiddenAction_ZN_MSM_03_ChestBeam_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange*0.75  
and eventData("RandomWeapon",type="float")>50 
and memory.backpackBreaked==false 
"""

[hiddenAction_ZN_MSM_03_ChestBeam_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[decal_ZN_MSM_03_ChestBeam]
isVisible:if memory.nowWeaponIndex==0 

