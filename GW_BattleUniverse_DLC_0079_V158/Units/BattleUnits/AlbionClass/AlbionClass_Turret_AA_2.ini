[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Pink.gw
"""

name:AlbionClass_Turret_AA_2
displayText:AlbionClass AA
displayText_zh:阿鲁比昂 对空炮

maxHp: 10000

@memory AlbionClass_Turret_AA_2_OnCD:bool
@memory AlbionClass_Turret_AA_2_CDTimer:float
@global AlbionClass_Turret_AA_2_CD=2
@global AlbionClass_Turret_AA_2_EN=5

@global AlbionClass_Turret_AA_2_Shoot=6
[resource_AlbionClass_Turret_AA_2_ShootTimer]
hidden:true


#AA炮用

[decal_Burned]
imageScale:0.75
[decal_Stun]
imageScale:0.425
[decal_LowHp]
imageScale:0.5
[decal_Marker]
imageScale:0.25


[graphics]
drawLayer:ground



[decal_AlbionClass_Turret_AA_2]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/AlbionClass/Image/AlbionClass_Turret_AA_2.png
imageScale:1.0
basePositionFromTurret:AlbionClass_Turret_AA_2






[turret_AlbionClass_Turret_AA_2]
x:0
y:0

canShoot:true
onShoot_triggerActions:AlbionClass_Turret_AA_2_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:AlbionClass_Turret_AA_2_Projectile
resourceUsage:AlbionClass_Turret_AA_2_ShootTimer=1

delay:0.15s
canAttackMaxAngle:75
limitingAngle:145
limitingRange:600
barrelX:2
barrelY:-2
barrelOffsetX_onOddShots:-4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0 


shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamGun_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Pink_S




[projectile_AlbionClass_Turret_AA_2_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0
sweepOffset:10
lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamGun_Pink*1
(
    addResources=
    BeamDamage:1250
    |DpDamage:75
    |WeaponAccuracy=90
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |PartBreakModifier=1.0
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:80
    |ProjectileSpread:1
    |ProjectileLife:30
)
"""


[hiddenAction_AlbionClass_Turret_AA_2_CDStart]
autoTrigger:"""
if memory.AlbionClass_Turret_AA_2_OnCD==false 
and 
(
    (
        self.resource.AlbionClass_Turret_AA_2_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.AlbionClass_Turret_AA_2_ShootTimer<${AlbionClass_Turret_AA_2_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:AlbionClass_Turret_AA_2_OnCD=true,AlbionClass_Turret_AA_2_CDTimer=self.timeAlive+${AlbionClass_Turret_AA_2_CD}

[hiddenAction_AlbionClass_Turret_AA_2_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.AlbionClass_Turret_AA_2_OnCD==true and self.timeAlive>memory.AlbionClass_Turret_AA_2_CDTimer
setUnitMemory:AlbionClass_Turret_AA_2_OnCD=false
setResourcesWithLogic:AlbionClass_Turret_AA_2_ShootTimer=${AlbionClass_Turret_AA_2_Shoot}

[hiddenAction_AlbionClass_Turret_AA_2_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${AlbionClass_Turret_AA_2_EN}