[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanNotBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Yellow.gw
"""

name:AMX_002_Turret_BeamCannon
displayText:Neue Ziel BeamCannon
displayText_zh:路维·捷露 光束加农

maxHp: 6000

isUnselectable:true
canNotBeGivenOrdersByPlayer:true

@memory AMX_002_Turret_BeamCannon_OnCD:bool
@memory AMX_002_Turret_BeamCannon_CDTimer:float
@global AMX_002_Turret_BeamCannon_CD=7
@global AMX_002_Turret_BeamCannon_EN=25

@global AMX_002_Turret_BeamCannon_Shoot=1
[resource_AMX_002_Turret_BeamCannon_ShootTimer]
hidden:true





[turret_AMX_002_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,AMX_002_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:AMX_002_Turret_BeamCannon_Projectile
resourceUsage:AMX_002_Turret_BeamCannon_ShootTimer=1

delay:0.2s
canAttackMaxAngle:181
limitingAngle:60
limitingRange:650
barrelX:0
barrelY:0
turnSpeed:1

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:5
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Yellow




[projectile_AMX_002_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamRifle_Yellow*1
(
    addResources=
    BeamDamage:5000
    |DpDamage:150
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:50
    |ProjectileSpread:3
    |ProjectileLife:50
)
"""


[hiddenAction_AMX_002_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.AMX_002_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.AMX_002_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.AMX_002_Turret_BeamCannon_ShootTimer<${AMX_002_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:AMX_002_Turret_BeamCannon_OnCD=true,AMX_002_Turret_BeamCannon_CDTimer=self.timeAlive+${AMX_002_Turret_BeamCannon_CD}

[hiddenAction_AMX_002_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.AMX_002_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.AMX_002_Turret_BeamCannon_CDTimer
setUnitMemory:AMX_002_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:AMX_002_Turret_BeamCannon_ShootTimer=${AMX_002_Turret_BeamCannon_Shoot}

[hiddenAction_AMX_002_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${AMX_002_Turret_BeamCannon_EN}