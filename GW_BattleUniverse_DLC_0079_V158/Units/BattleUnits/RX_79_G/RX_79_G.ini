name:RX_79_G

displayText:GroundType Gundam
displayText_zh:陆战型高达

displayDescription:"""
\nGeneral-purpose MS designed and assembled from failed V Project parts  
\nStrengths  
\n=Allows command defense=  
\n=Excellent resistance to ballistic attacks=  
\n=Well-armed=  
\nWeaknesses  
\n=Extremely expensive=  
\n  
\n"I warn you, I absolutely must not die!"
"""
displayDescription_zh:"""
\n由V作战不合格零件设计组装而来的泛用型MS
\n优势
\n=武装丰富=
\n=允许防御指挥=
\n=近乎免疫小口径实弹=
\n=可以使用烟雾弹发射器=
\n劣势
\n=价格极其昂贵=
\n
\n“我有言在先,绝对不能死啊!”
"""


showActionsWithMixedSelectionIfOtherUnitsHaveTag:RX_79_G


maxHp:35000
maxShield:4250

