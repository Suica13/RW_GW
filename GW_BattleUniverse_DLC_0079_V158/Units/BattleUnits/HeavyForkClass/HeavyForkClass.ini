tags:HeavyForkClass,Unit,Ship,CmdUnit,EFSF,0079,UC,LargeUnit,MpUpUnit_X6
name:HeavyForkClass

displayText:HeavyForkClass
displayText_zh:重叉级

displayDescription:"""
\nGiant land battleship equipped with thermonuclear engine, capable of crossing seas  
\n=Highly effective against clustered units and buildings=
\n=Allow Cmmand Communicatio=   
\n=Auto-repairs when out of combat=
\n=Capable of artillery bombardment=
\n= Can disperse Minovsky particles =
\n=Amphibious unit=  
\n=Transport Capacity: 6=
\nWeaknesses  
\n=Massive size=  
\n=-200m to stealth detection=  
\n=Reveals vision when spotted=  
\n=Poor performance against close-range units=  
\n  
\n"Fire, now!"
"""
displayDescription_zh:"""
\n改良型陆上战舰,并加装了导弹发射器
\n优势
\n=受到建筑伤害减少35%=
\n=对建筑伤害增加25%=
\n=允许通信指挥=
\n=脱战自动修复=
\n=可以进行炮击=
\n=两栖单位=
\n=运输力:6=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负200码反侦测=
\n=被发现时暴露视野=
\n=对抗近距离单位不佳=
\n
\n“开火,现在!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:HeavyForkClass


displayRadius:50
radius:35

maxHp:150000
maxShield:0


@global cmdComRangeExtra=150

