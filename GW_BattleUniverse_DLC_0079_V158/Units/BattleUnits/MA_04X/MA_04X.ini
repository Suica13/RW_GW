\nAdvantages
\n=Highly effective against large units=
\n=Excels at hit-and-run tactics=
\n=High resistance to live ammunition=
\n=Relatively fast=
\nDisadvantages
\n=Performs poorly against MS in combat=
\n=Slow reaction speed=
\n
\n“Is this thing a mantis?”
"""
