tags:DabudeClass,Unit,Ship,CmdUnit,ZEON,0079,UC,LargeUnit,MpUpUnit_X8
name:DabudeClass

displayText:Dabude Class
displayText_zh:达布德级

displayDescription:"""
\nGiant Ground Command Ship, provides wide-area command effects
\nAdvantages
\n=Excellent against clustered units and structures=
\n=Allows communication-based command=
\n=Automatically repairs when out of combat=
\n= Can disperse Minovsky particles =
\n=Capable of bombardment=
\n=Transport Capacity: 8=
\nDisadvantages
\n=Enormous size=
\n=-200m stealth detection range=
\n=Reveals vision when detected=
\n=Poor performance against close-range units=
\n
\n"We must hold Odessa!"
"""
displayDescription_zh:"""
\n巨型陆上指挥舰,提供大范围指挥效果
\n优势
\n=受到建筑伤害减少35%=
\n=对建筑伤害增加25%=
\n=允许通信指挥=
\n=脱战自动修复=
\n=可以进行炮击=
\n=运输力:8=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负200码反侦测=
\n=被发现时暴露视野=
\n=对抗近距离单位不佳=
\n
\n“敖德萨一定要守下来!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:DabudeClass


displayRadius:50
radius:35

maxHp:125000
