y:13
idleDir:0
resetRotationWhenNotAttacking:false
lockRotation:true
rotateWithParent:true
canAttack:false
prioritizeParentsMainTarget:false
onlyAttackParentsMainTarget:false

isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:true
isUnselectable:false
showAllActionsFrom:false
smoothlyBlendPositionWhenExistingUnitAdded:false
onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false
[hiddenAction_attachment_SFS01]
autoTriggerOnEvent:newMessage(withTag="UnitTurretSpawn")
attachments_addNewUnits:SFS_X1_SFU_X79
attachments_onlyOnSlots:SFS01


[decal_Crotch]
image:SHARED:blank.png


[decal_Body]
