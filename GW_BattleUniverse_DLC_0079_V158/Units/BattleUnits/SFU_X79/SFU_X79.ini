[hiddenAction_TurnToIdleState]
convertTo:SFU_X79

[hiddenAction_TurnToOverLine_T]
convertTo:SFU_X79_OverLine
[hiddenAction_TurnToOverLine_F]
convertTo:SFU_X79


[hiddenAction_Set_Get_PlayStartEffect]
[hiddenAction_Set_Get_PlayCloseEffect]


[attachment_SFS01]
