tags:MS_09F,Unit,MS,ZEON,0079,UC
name:MS_09F

displayText:Dom F
displayText_zh:大魔F

displayDescription:"""
\nOne of the results of the Unified Maintenance Plan, with improved parts compatibility compared to the Dom
\nAdvantages  
\n=Skilled at hit-and-run attacks=  
\n=High resistance to physical ammo=  
\n=Relatively fast=  
\nDisadvantages  
\n=Cannot move at combat speed if legs are damaged=  
\n=Combat speed increases supply consumption=  
\n=Weak structural integrity=  
\n=Prone to losing balance=  
\n=Poor response time=  
\n  
\n"The one wearing a skirt!"
"""
displayDescription_zh:"""
\n统合整备计划的成果之一,相较于大魔提高了零件通用性
\n优势
\n=擅长一击脱离=
\n=实弹抗性较高=
\n=速度较快=
\n劣势
\n=腿部损坏时无法以战时速度移动=
\n=战时速度消耗补给量提升=
\n=结构强度较差=
\n=容易失衡=
\n=反应较差=
\n
\n“穿裙子的!”
"""

showActionsWithMixedSelectionIfOtherUnitsHaveTag:MS_09F


maxHp:27500
maxShield:0

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/MS_09F.png


