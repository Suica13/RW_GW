[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:SalamisClassKai_Turret_AA
displayText:SalamisClassKai AA
displayText_zh:萨拉米斯级改 对空炮

maxHp: 5500

@memory SalamisClassKai_Turret_AA_OnCD:bool
@memory SalamisClassKai_Turret_AA_CDTimer:float
@global SalamisClassKai_Turret_AA_CD=2
@global SalamisClassKai_Turret_AA_EN=0.5

@global SalamisClassKai_Turret_AA_Shoot=10
[resource_SalamisClassKai_Turret_AA_ShootTimer]
hidden:true



#AA炮用

[decal_Burned]
imageScale:0.75
[decal_Stun]
imageScale:0.425
[decal_LowHp]
imageScale:0.5
[decal_Marker]
imageScale:0.25


[graphics]
drawLayer:ground2



[decal_SalamisClassKai_Turret_AA]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/SalamisClassKai/Image/SalamisClassKai_Turret_AA_1.png
imageScale:0.85
basePositionFromTurret:SalamisClassKai_Turret_AA






[turret_SalamisClassKai_Turret_AA]
x:0
y:0

canShoot:true
onShoot_triggerActions:SalamisClassKai_Turret_AA_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:SalamisClassKai_Turret_AA_Projectile
resourceUsage:SalamisClassKai_Turret_AA_ShootTimer=1

delay:0.2s
canAttackMaxAngle:60
limitingAngle:90
limitingRange:600
barrelX:2
barrelY:6
barrelOffsetX_onOddShots:-4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_SalamisClassKai_Turret_AA_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:200
    |ShellAPDamage:75
    |DpDamage:8
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1.5
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:95
    |ProjectileSpread:6
    |ProjectileLife:7.5
)
"""


[hiddenAction_SalamisClassKai_Turret_AA_CDStart]
autoTrigger:"""
if memory.SalamisClassKai_Turret_AA_OnCD==false 
and 
(
    (
        self.resource.SalamisClassKai_Turret_AA_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.SalamisClassKai_Turret_AA_ShootTimer<${SalamisClassKai_Turret_AA_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:SalamisClassKai_Turret_AA_OnCD=true,SalamisClassKai_Turret_AA_CDTimer=self.timeAlive+${SalamisClassKai_Turret_AA_CD}

[hiddenAction_SalamisClassKai_Turret_AA_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.SalamisClassKai_Turret_AA_OnCD==true and self.timeAlive>memory.SalamisClassKai_Turret_AA_CDTimer
setUnitMemory:SalamisClassKai_Turret_AA_OnCD=false
setResourcesWithLogic:SalamisClassKai_Turret_AA_ShootTimer=${SalamisClassKai_Turret_AA_Shoot}

[hiddenAction_SalamisClassKai_Turret_AA_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${SalamisClassKai_Turret_AA_EN}