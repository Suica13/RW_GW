[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Pink.gw
"""

name:SalamisClassKai_Turret_BeamCannon
displayText:SalamisClassKai BeamCannon
displayText_zh:萨拉米斯级改 光束炮

maxHp: 145000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory SalamisClassKai_Turret_BeamCannon_OnCD:bool
@memory SalamisClassKai_Turret_BeamCannon_CDTimer:float
@global SalamisClassKai_Turret_BeamCannon_CD=7
@global SalamisClassKai_Turret_BeamCannon_EN=40

@global SalamisClassKai_Turret_BeamCannon_Shoot=1
[resource_SalamisClassKai_Turret_BeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2



[decal_SalamisClassKai_Turret_BeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/SalamisClassKai/Image/SalamisClassKai_Turret_BeamCannon_1.png
imageScale:1.25
basePositionFromTurret:SalamisClassKai_Turret_BeamCannon






[turret_SalamisClassKai_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,SalamisClassKai_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:SalamisClassKai_Turret_BeamCannon_Projectile
resourceUsage:SalamisClassKai_Turret_BeamCannon_ShootTimer=1

delay:0.2s
canAttackMaxAngle:15
limitingAngle:150
limitingRange:1200
barrelX:0
barrelY:6
turnSpeed:1.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Pink




[projectile_SalamisClassKai_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamRifle_Pink*1
(
    addResources=
    BeamDamage:5000
    |DpDamage:225
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:50
    |ProjectileSpread:3
    |ProjectileLife:50
)
"""


[hiddenAction_SalamisClassKai_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.SalamisClassKai_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.SalamisClassKai_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.SalamisClassKai_Turret_BeamCannon_ShootTimer<${SalamisClassKai_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:SalamisClassKai_Turret_BeamCannon_OnCD=true,SalamisClassKai_Turret_BeamCannon_CDTimer=self.timeAlive+${SalamisClassKai_Turret_BeamCannon_CD}

[hiddenAction_SalamisClassKai_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.SalamisClassKai_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.SalamisClassKai_Turret_BeamCannon_CDTimer
setUnitMemory:SalamisClassKai_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:SalamisClassKai_Turret_BeamCannon_ShootTimer=${SalamisClassKai_Turret_BeamCannon_Shoot}

[hiddenAction_SalamisClassKai_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${SalamisClassKai_Turret_BeamCannon_EN}