\nA prototype unit specially developed by Zeon for the assault on Jaburo
\nAdvantages
\n=Rich armament=
\n=Underwater stealth=
\n=Equipped with sonar=
\n=100-yard detection resistance=
\nDisadvantages
\n=Thin armor=
\n
\n“Master of tunneling”
"""
displayDescription_zh:"""
\n吉翁为了进行加布罗攻略战而开发出一款特殊工作用的试作型机体
\n优势
\n=武装丰富=
\n=水中匿踪=
\n=装备声纳=
\n=100码反侦测=
\n劣势
\n=装甲薄弱=
\n
\n“打洞高手”
"""
showActionsWithMixedSelectionIfOtherUnitsHaveTag:EMS_05M


maxHp:15000
maxShield:0

[graphics]
