displayText_zh:布劳布罗

displayDescription:"""
\nThe initial mobile weapon developed by the Flanagan Institute employing the Sekimyu System
\nAdvantages
\n=High resistance=
\n=High durability=
\n=Equipped with a large floating cannon=
\nDisadvantages
\n=Requires a pilot with an Awakening value=
\n=No means of self-defense=
\n=Lacks close-combat capability=
\n
\n"How can he be so confident?!"
"""
displayDescription_zh:"""
\n应用了塞可缪系统而由弗拉纳冈机构开发出的最初的机动兵器
\n优势
\n=抗性较高=
\n=耐久值较高=
\n=装备大型浮游炮=
\n劣势
\n=需要具备觉醒值的驾驶员=
\n=没有自卫手段=
\n=缺乏近战手段=
\n
\n“他怎么会如此自信?!”
"""

showActionsWithMixedSelectionIfOtherUnitsHaveTag:MAN_03


maxHp:90000
