name:MagellanClass

displayText:Magellan Class
displayText_zh:麦哲伦级

displayDescription:"""
\nMain battleship of the Earth Federation fleet  
\nAdvantages  
\n=Well-armed=  
\n=Can ReEntry=
\n=Allows command defense=  
\n=Allows communication-based command=
\n=Auto-repairs when out of combat=  
\nDisadvantages  
\n=Massive size=  
\n=-250m to stealth detection=  
\n=Reveals vision when detected=  
\n= Can disperse Minovsky particles =
\n  
\n"E.F.S.F"  
"""
displayDescription_zh:"""
\n地球联邦军舰队重型战列舰
\n优势
\n=火力充沛=
\n=可以打上宇宙=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“E.F.S.F”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:MagellanClass


displayRadius:50
radius:50

maxHp:70000
maxShield:0

@global cmdComRangeExtra=150
@global cmdDefRangeExtra=150

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/MagellanClass.png

