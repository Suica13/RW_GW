name:MusaiClassLateType

displayText:Musai Class LateType
displayText_zh:姆塞级后期型

displayDescription:"""
\nLate-production type of Musai, with improved combat and transport capabilities 
\nAdvantages  
\n=Strong frontal firepower=  
\n=Can ReEntry=
\n=Auto-repairs when out of combat=  
\n=Transport Capacity: 8=
\n= Can disperse Minovsky particles =
\nDisadvantages  
\n=Extremely large size=  
\n=-200 range to radar stealth=  
\n=Reveals nearby vision when detected=  
\n  
\n"Glory to the Principality of Zeon!"
"""
displayDescription_zh:"""
\n姆塞的后期生产型,战斗力与运载力都得到了提升
\n优势
\n=正面火力充足=
\n=脱战自动修复=
\n=运载力:8=
\n=可以打上宇宙=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负200码反侦测=
\n=被发现时暴露视野=
\n
\n“吉翁公国万岁!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:MusaiClassLateType


displayRadius:50
