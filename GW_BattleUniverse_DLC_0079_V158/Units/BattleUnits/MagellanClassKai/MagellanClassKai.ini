name:MagellanClassKai

displayText:Magellan Class Kai
displayText_zh:麦哲伦级改

displayDescription:"""
\nPostwar refit of the Magellan-class, with greatly enhanced firepower  
\nAdvantages  
\n=Well-armed=  
\n=Allows command defense=  
\n=Allows communication-based command=
\n=Auto-repairs when out of combat=  
\n= Transport capacity: 8 =
\n= Can disperse Minovsky particles =
\nDisadvantages  
\n=Massive size=  
\n=-250m to stealth detection=  
\n=Reveals vision when detected=  
\n  
\n“If the parade is held as scheduled, then Zeon remnants will no longer be anything to fear.” 
"""
displayDescription_zh:"""
\n麦哲伦的战后改修型,火力得到了大幅强化
\n优势
\n=火力充沛=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n=运输力:8=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“阅兵仪式如期举行的话,吉翁残党什么的就已经不足为惧了吧”
"""



