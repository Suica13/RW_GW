[hiddenAction_EF_LongRangeBeamSniperRifle_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and memory.attackMode==0 
and memory.armRBreaked==false 
and self.resource().EquipmentIndex==0 
and eventData("RandomWeapon",type="float")>25 
"""

[hiddenAction_EF_LongRangeBeamSniperRifle_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[decal_EF_LongRangeBeamSniperRifle_Idle]
isVisible:if memory.nowWeaponIndex==0 and (self.attacking.hp<=0 and ${onAttacking}==false) and self.resource().EquipmentIndex==0 and memory.armRBreaked==false
[decal_EF_LongRangeBeamSniperRifle_Attack]
isVisible:if memory.nowWeaponIndex==0 and (self.attacking.hp>0 or ${onAttacking}==true) and self.resource().EquipmentIndex==0 and memory.armRBreaked==false
[decal_EF_LongRangeBeamSniperRifle_NotUsing]
isVisible:if memory.nowWeaponIndex!=0 and self.resource().EquipmentIndex==0 and memory.armRBreaked==false

[hiddenAction_EF_LongRangeBeamSniperRifle_Sniper_SetWeaponIndex]
