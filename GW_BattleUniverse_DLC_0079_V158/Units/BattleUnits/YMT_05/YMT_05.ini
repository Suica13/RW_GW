tags:YMT_05,Unit,MS,ZEON,0079,UC
name:YMT_05

displayText:Hildolfr
displayText_zh:斗狼

displayDescription:"""
\nDeveloped by the Zeon forces during the feasibility discussions of the Operation Britain plan, in preparation for the inevitable conventional ground battles
\nA new type of ground-combat-specialized mobile tank developed in parallel with MS
\nAdvantages
\n= Can switch forms =
\n= Extremely rich in fixed armaments =
\n= Reduces damage from structures by 30% =
\nDisadvantages
\n= Almost no melee capability =
\n= Extremely expensive =
\n
\n“One shot is enough!”
"""
displayDescription_zh:"""
\n吉翁军于不列颠作战计划的可行性讨论中,为了将来必然会发生的常规陆战而开发的
\n作为与MS平行开发的新型陆战特化兵器机动坦克
\n优势
\n=可以切换形态=
\n=固定武装极其丰富=
\n=减少来自建筑物的伤害30%=
\n劣势
\n=几乎没有格斗能力=
\n=价格极其昂贵=
\n
\n“一发就够了!”
"""


