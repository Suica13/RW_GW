\nStrengths  
\n=Versatile=  
\n=Can eject=  
\n=Can ReEntry FromSpace=
\n=Capable in both shooting and melee=  
\n=Learning computer: +10% experience gain rate=   
\nWeaknesses  
\n=Extremely expensive=  
\n  
\n“Gundam, now can keep up with my reflexes!”
"""
