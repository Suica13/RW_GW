[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanNotBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Yellow.gw
"""

name:MA_08_Turret_BeamGun
displayText:Big Zam BeamGun
displayText_zh:大扎姆 光束炮

maxHp: 6000

isUnselectable:true
canNotBeGivenOrdersByPlayer:true

@memory MA_08_Turret_BeamGun_OnCD:bool
@memory MA_08_Turret_BeamGun_CDTimer:float
@global MA_08_Turret_BeamGun_CD=3.5
@global MA_08_Turret_BeamGun_EN=3

@global MA_08_Turret_BeamGun_Shoot=1
[resource_MA_08_Turret_BeamGun_ShootTimer]
hidden:true





[turret_MA_08_Turret_BeamGun]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,MA_08_Turret_BeamGun_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:MA_08_Turret_BeamGun_Projectile
resourceUsage:MA_08_Turret_BeamGun_ShootTimer=1

delay:0.2s
canAttackMaxAngle:181
limitingAngle:60
limitingRange:650
barrelX:0
barrelY:0
turnSpeed:1

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:5
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamGun_1.ogg
shoot_sound_vol:0.35
shoot_flame:Beam_Fire_1_Yellow_S




[projectile_MA_08_Turret_BeamGun_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamGun_Yellow*1
(
    addResources=
    BeamDamage:2500
    |DpDamage:80
    |WeaponAccuracy=90
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.0
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1.0
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:45
    |ProjectileSpread:6
    |ProjectileLife:50
)
"""


[hiddenAction_MA_08_Turret_BeamGun_CDStart]
autoTrigger:"""
if memory.MA_08_Turret_BeamGun_OnCD==false 
and 
(
    (
        self.resource.MA_08_Turret_BeamGun_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.MA_08_Turret_BeamGun_ShootTimer<${MA_08_Turret_BeamGun_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:MA_08_Turret_BeamGun_OnCD=true,MA_08_Turret_BeamGun_CDTimer=self.timeAlive+${MA_08_Turret_BeamGun_CD}

[hiddenAction_MA_08_Turret_BeamGun_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.MA_08_Turret_BeamGun_OnCD==true and self.timeAlive>memory.MA_08_Turret_BeamGun_CDTimer
setUnitMemory:MA_08_Turret_BeamGun_OnCD=false
setResourcesWithLogic:MA_08_Turret_BeamGun_ShootTimer=${MA_08_Turret_BeamGun_Shoot}

[hiddenAction_MA_08_Turret_BeamGun_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${MA_08_Turret_BeamGun_EN}