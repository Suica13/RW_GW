name:ZanzibarClass

displayText:Zanzibar Class
displayText_zh:桑吉巴尔级

displayDescription:"""
\nZeon Army cruiser for both atmosphere and space operations
\nAdvantages
\n= Ample firepower =
\n= High durability =
\n=Can ReEntry=
\n=Can ReEntry FromSpace=
\n=Allows command defense=  
\n=Allows communication-based command=
\n= Automatic repair when out of combat =
\n= Transport capacity: 6x2 =
\n= Can disperse Minovsky particles =
\nDisadvantages
\n= Enormous size =
\n= -250 yards to anti-detection =
\n= Reveals vision when spotted =
\n
\n"Who uses a battleship as a hospital ship?"
"""
displayDescription_zh:"""
\n吉翁军大气圈与宇宙两用巡洋舰
\n优势
\n=火力充沛=
\n=耐久较高=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=可以打上宇宙=
\n=可以突入大气层=
\n=运输力:6x2=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“哪有人把战舰当伤员舰的?”
"""



