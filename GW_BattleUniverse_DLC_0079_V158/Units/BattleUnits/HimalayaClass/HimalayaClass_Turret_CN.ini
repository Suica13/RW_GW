[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:HimalayaClass_Turret_CN
displayText:HimalayaClass MainCannon
displayText_zh:喜马拉雅级 主炮

maxHp: 10000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory HimalayaClass_Turret_CN_OnCD:bool
@memory HimalayaClass_Turret_CN_CDTimer:float
@global HimalayaClass_Turret_CN_CD=4
@global HimalayaClass_Turret_CN_EN=40

@global HimalayaClass_Turret_CN_Shoot=4
[resource_HimalayaClass_Turret_CN_ShootTimer]
hidden:true


[decal_HimalayaClass_Turret_CN]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/HimalayaClass/Image/HimalayaClass_Turret_CN_1.png
imageScale:1.25
basePositionFromTurret:HimalayaClass_Turret_CN


[turret_HimalayaClass_Turret_CN]
x:0
y:0

canShoot:true
canOnlyAttackUnitsWithoutTags:AirUnit
onShoot_triggerActions:SendEnemyTryAttack_Shoot,HimalayaClass_Turret_CN_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:HimalayaClass_Turret_CN_Projectile
resourceUsage:HimalayaClass_Turret_CN_ShootTimer=1

delay:0.1s
canAttackMaxAngle:3
limitingAngle:120
limitingRange:800
barrelX:5
barrelY:15
barrelOffsetX_onOddShots:-10
turnSpeed:1.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:340
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Bazooka_1.ogg
shoot_sound_vol:0.4
shoot_flame:BZ_Fire_1




[projectile_HimalayaClass_Turret_CN_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Bazooka*1
(
    addResources=
    ShellDamage:3500
    |DpDamage:150
    |WeaponAccuracy=75
    |PartBreakModifier=1.25
    |CockpitBreakModifier=0.75
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiAqua=0.75
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1.0
    |HeightChangeSpeed=2
    |HeightHitRange=20
    |ProjectileSpeed:50
    |ProjectileSpread:1
    |ProjectileExplosionRange:45
    |ProjectileLife:35
)
"""


[hiddenAction_HimalayaClass_Turret_CN_CDStart]
autoTrigger:"""
if memory.HimalayaClass_Turret_CN_OnCD==false 
and 
(
    (
        self.resource.HimalayaClass_Turret_CN_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.HimalayaClass_Turret_CN_ShootTimer<${HimalayaClass_Turret_CN_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:HimalayaClass_Turret_CN_OnCD=true,HimalayaClass_Turret_CN_CDTimer=self.timeAlive+${HimalayaClass_Turret_CN_CD}

[hiddenAction_HimalayaClass_Turret_CN_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.HimalayaClass_Turret_CN_OnCD==true and self.timeAlive>memory.HimalayaClass_Turret_CN_CDTimer
setUnitMemory:HimalayaClass_Turret_CN_OnCD=false
setResourcesWithLogic:HimalayaClass_Turret_CN_ShootTimer=${HimalayaClass_Turret_CN_Shoot}

[hiddenAction_HimalayaClass_Turret_CN_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${HimalayaClass_Turret_CN_EN}