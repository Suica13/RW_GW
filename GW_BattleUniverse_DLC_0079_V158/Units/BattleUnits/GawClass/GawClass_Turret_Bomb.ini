[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:GawClass_Turret_Bomb
displayText:GawClass Bomb
displayText_zh:加乌级 炸弹

maxHp: 7500



@memory GawClass_Turret_Bomb_OnCD:bool
@memory GawClass_Turret_Bomb_CDTimer:float
@global GawClass_Turret_Bomb_CD=12
@global GawClass_Turret_Bomb_EN=12

@global GawClass_Turret_Bomb_Shoot=10
[resource_GawClass_Turret_Bomb_ShootTimer]
hidden:true



[turret_GawClass_Turret_Bomb]
x:0
y:0

canShoot:true
onShoot_triggerActions:GawClass_Turret_Bomb_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.height>=0 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:GawClass_Turret_Bomb_Projectile
resourceUsage:GawClass_Turret_Bomb_ShootTimer=1

delay:0.2s
canAttackMaxAngle:360
limitingAngle:360
limitingRange:60
barrelX:0
barrelY:0
turnSpeed:0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if false

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/Bomb_1.ogg
shoot_sound_vol:0.15
shoot_flame:none




[projectile_GawClass_Turret_Bomb_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Bomb*1
(
    addResources=
    ShellDamage:1250
    |DpDamage:75
    |WeaponAccuracy=85
    |PartBreakModifier=0.5
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1.0
    |AntiAqua=0.5
    |AntiAir=0.25 
    |AntiLand=1
    |AntiSpace=1

    |HeightHitRange=20
    |ProjectileSpeed:1
    |ProjectileSpread:5
    |ProjectileExplosionRange:80
    |ProjectileLife:8
)
"""


[hiddenAction_GawClass_Turret_Bomb_CDStart]
autoTrigger:"""
if memory.GawClass_Turret_Bomb_OnCD==false 
and 
(
    (
        self.resource.GawClass_Turret_Bomb_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.GawClass_Turret_Bomb_ShootTimer<${GawClass_Turret_Bomb_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:GawClass_Turret_Bomb_OnCD=true,GawClass_Turret_Bomb_CDTimer=self.timeAlive+${GawClass_Turret_Bomb_CD}

[hiddenAction_GawClass_Turret_Bomb_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.GawClass_Turret_Bomb_OnCD==true and self.timeAlive>memory.GawClass_Turret_Bomb_CDTimer
setUnitMemory:GawClass_Turret_Bomb_OnCD=false
setResourcesWithLogic:GawClass_Turret_Bomb_ShootTimer=${GawClass_Turret_Bomb_Shoot}

[hiddenAction_GawClass_Turret_Bomb_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${GawClass_Turret_Bomb_EN}