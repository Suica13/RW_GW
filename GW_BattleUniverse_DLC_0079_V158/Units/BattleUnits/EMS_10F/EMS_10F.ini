[hiddenAction_ZN_360mmBazooka_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and self.resource().EquipmentIndex==0 
and memory.armRBreaked==false 
and eventData("RandomWeapon",type="float")>50 
"""

[hiddenAction_ZN_360mmBazooka_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[decal_ZN_360mmBazooka]
isVisible:if memory.nowWeaponIndex==0 and self.resource().EquipmentIndex==0 and memory.armRBreaked==false
[decal_ZN_360mmBazooka_NotUsing]
isVisible:if memory.nowWeaponIndex!=0 and self.resource().EquipmentIndex==0 and memory.armRBreaked==false





[hiddenAction_ZN_135mmAntiShipSniper_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and memory.armRBreaked==false 
and self.resource().EquipmentIndex==1 
and eventData("RandomWeapon",type="float")>50 
"""

[hiddenAction_ZN_135mmAntiShipSniper_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[decal_ZN_135mmAntiShipSniper_Idle]
isVisible:if memory.nowWeaponIndex==0 and (self.attacking.hp<=0 and ${onAttacking}==false) and self.resource().EquipmentIndex==1 and memory.armRBreaked==false
[decal_ZN_135mmAntiShipSniper_Attack]
isVisible:if memory.nowWeaponIndex==0 and (self.attacking.hp>0 or ${onAttacking}==true) and self.resource().EquipmentIndex==1 and memory.armRBreaked==false
[decal_ZN_135mmAntiShipSniper_NotUsing]
isVisible:if memory.nowWeaponIndex!=0 and self.resource().EquipmentIndex==1 and memory.armRBreaked==false

[hiddenAction_ZN_135mmAntiShipSniper_Sniper_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

@global ZN_135mmAntiShipSniper_Sniper_CanUse=(self.resource().EquipmentIndex==1)

[action_ZN_135mmAntiShipSniper_Sniper_Trigger]
requireConditional:if parent.hp<=0 and self.resource().EquipmentIndex==1
isVisible:if self.parent.hp<=0 and self.resource().EquipmentIndex==1




