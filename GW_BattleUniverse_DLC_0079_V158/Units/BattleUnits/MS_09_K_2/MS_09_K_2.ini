\nA Dom unit equipped with a cannon, though its balance is not very good  
\nAdvantages  
\n= Excels at hit-and-run attacks =  
\n= High resistance to solid ammunition =  
\n= Capable of bombardment =  
\n= Relatively fast =  
\nDisadvantages  
\n= Unable to move at combat speed if legs are damaged =  
\n= High supply consumption at combat speed =  
\n= Weak structural integrity =  
\n= Easily loses balance =  
\n= Poor reaction time =  
\n  
\n“Dom Cannon 2”  
"""
