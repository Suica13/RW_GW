\n通过重新设计后得到优化的大魔加农,性能有所提升
\n优势
\n=擅长一击脱离=
\n=实弹抗性较高=
\n=可以炮击=
\n=速度较快=
\n劣势
\n=腿部损坏时无法以战时速度移动=
\n=战时速度消耗补给量提升=
\n=结构强度较差=
\n=容易失衡=
\n=反应较差=
\n
\n“德姆大炮2”
