
[core]
copyFrom:"""
ROOT:Template/Building/Skill/SupplyPoint.gw,
ROOT:Units/Buildings/Factory/Mod/Factory.ini,
ROOT:Units/Buildings/Factory/UnitList/ZEON_0079/ZEON_0079_UnitList_Aqua.ini,
ROOT:Units/Buildings/Factory/UnitList/EFSF_0079/EFSF_0079_UnitList_Aqua.ini
"""


tags:Building,SLChangeFaction,AquaBuilding,CanBeTargetUnit,CanProduceBuilding,Factory_EFSF_0079_Aqua,Factory_Aqua,Factory,EFSF,0079
name:Factory_EFSF_0079_Aqua
displayText:Aqua Factory[EFSF][0079]
displayText_zh:海军工厂[EFSF][0079]

footprint: -2,-1,2,1
constructionFootprint: -2,-1,2,1
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:10

@global Money=500
@global Resource=1500
@global buildTime=15
@global supplyPointHpExtra=0.5
@global supplyPointEnExtra=0.5
@global supplyPointShieldExtra=0.5
@global supplyPointSkillExtra=0.5

exit_x:0
exit_y:25
exit_moveAwayAmount:0

[hiddenAction_Building_GetDone]
temporarilyAddTags:Factory_T1

[ai]
buildPriority: 0.05
maxEachBase:1
maxGlobal:4
noneInBaseExtraPriority: 0.15
noneGlobalExtraPriority: 0.15

[movement]
movementType:WATER

[placementRule_NearSL]
searchDistance:600
[hiddenAction_Supply_CheckTags]
requireConditional:false

[hiddenAction_Die]
spawnEffects:Explosion_Water_1

[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Aqua.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.6
xOffsetRelative:8
yOffsetRelative:2
[decal_Light_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Aqua_Light.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
teamColors:true
imageScale:0.6
xOffsetRelative:8
yOffsetRelative:2
[decal_Work_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:if self.queueSize()>0
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Aqua_ON.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.6
xOffsetRelative:8
yOffsetRelative:2
[decal_Faction_1]
layer:beforeBody
order:2
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Resource/Image/Icon/Faction_EFSF_0079_2.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.125
xOffsetRelative:30.5
yOffsetRelative:21




[hiddenAction_Get_AutoProduce]
requireConditional:if memory.buildDone==true and rnd(0,100)>50
alsoTriggerAction:"""
Get_AutoProduce_T1
"""
[hiddenAction_Get_AutoProduce_T1]
requireConditional:"""
if 
self.resource().Money>1000 
and self.resource().Resource>2000
"""
alsoTriggerAction:"""
AutoProduce_T1_NormalUnits
"""
[hiddenAction_AutoProduce_T1_NormalUnits]
requireConditional:if memory.randomProduceLevel<0.85
alsoTriggerAction:"""
AutoProduce_EF_TorpedoBoat,
AutoProduce_RB_79N,
AutoProduce_BurkeClass,
AutoProduce_U_Type_Submarine,
AutoProduce_M_Type_Submarine,
AutoProduce_HimalayaClass
"""

[hiddenAction_AutoProduce_EF_TorpedoBoat]
@define AutoProduceIndexMin=0
@define AutoProduceIndexMax=200
@define Number:3
requireConditional:"""
if self.globalTeamTags(includes='Unlock_${UnitID}') 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMin} 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMax} 
and self.numberOfUnitsInTeam(withTag='${UnitID}')<=${Number} 
and not self.globalTeamTags(includes='Unlock_RB_79N') 
"""
[hiddenAction_AutoProduce_RB_79N]
@define AutoProduceIndexMin=0
@define AutoProduceIndexMax=400
@define Number:3
[hiddenAction_AutoProduce_BurkeClass]
@define AutoProduceIndexMin=400
@define AutoProduceIndexMax=600
@define Number:2
[hiddenAction_AutoProduce_U_Type_Submarine]
@define AutoProduceIndexMin=600
@define AutoProduceIndexMax=700
@define Number:1
[hiddenAction_AutoProduce_M_Type_Submarine]
@define AutoProduceIndexMin=700
@define AutoProduceIndexMax=800
@define Number:1
[hiddenAction_AutoProduce_HimalayaClass]
@define AutoProduceIndexMin=800
@define AutoProduceIndexMax=900
@define Number:1