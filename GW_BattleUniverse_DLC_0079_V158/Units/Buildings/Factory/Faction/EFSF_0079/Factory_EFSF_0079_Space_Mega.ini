
[core]
copyFrom:"""
ROOT:Template/Building/Skill/SupplyPoint.gw,
ROOT:Units/Buildings/Factory/Mod/Factory.ini,
ROOT:Units/Buildings/Factory/UnitList/ZEON_0079/ZEON_0079_UnitList_Space_Mega.ini,
ROOT:Units/Buildings/Factory/UnitList/EFSF_0079/EFSF_0079_UnitList_Space_Mega.ini
"""


tags:Building,SLChangeFaction,CanBeTargetUnit,CanProduceBuilding,Factory_EFSF_0079_Mega,Factory_Mega,Factory,EFSF,0079
name:Factory_EFSF_0079_Space_Mega
displayText:Mega Factory[EFSF][0079][S]
displayText_zh:巨型工厂[EFSF][0079][宇]

footprint: -4,-3,1,2
constructionFootprint: -4,-3,1,2
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:10

maxHp: 60000

@global Money=750
@global Resource=2000
@global buildTime=25
@global supplyPointHpExtra=0.5
@global supplyPointEnExtra=0.5
@global supplyPointShieldExtra=0.5
@global supplyPointSkillExtra=0.5

exit_x:0
exit_y:25
exit_moveAwayAmount:0

[hiddenAction_Building_GetDone]
temporarilyAddTags:Factory_T1

[ai]
buildPriority: 0.1
maxEachBase:1
maxGlobal:3
noneInBaseExtraPriority: 0.15
noneGlobalExtraPriority: 0.35

[placementRule_NearSL]
searchDistance:450

[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Space_Mega.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Light_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Space_Mega_Light.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
teamColors:true
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Work_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:if self.queueSize()>0
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Space_Mega_ON.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Faction_1]
layer:beforeBody
order:2
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Resource/Image/Icon/Faction_EFSF_0079_2.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.2
xOffsetRelative:-55
yOffsetRelative:-34




[hiddenAction_Get_AutoProduce]
requireConditional:if memory.buildDone==true and rnd(0,100)>50 and self.resource().TileMode==1
alsoTriggerAction:"""
Get_AutoProduce_T1,
Get_AutoProduce_T2
"""
[hiddenAction_Get_AutoProduce_T1]
requireConditional:"""
if 
self.resource().Money>3000 
and self.resource().Resource>6000 
and not self.globalTeamTags(includes='Tech_EFSF_0079_T2_GMModularizationPlan') 
"""
alsoTriggerAction:"""
AutoProduce_T1_NormalUnits,
AutoProduce_T1_HardUnits
"""

[hiddenAction_AutoProduce_T1_NormalUnits]
requireConditional:if memory.randomProduceLevel<0.85
alsoTriggerAction:"""
AutoProduce_ColumbusClass,
AutoProduce_SalamisClass,
AutoProduce_MagellanClass,
AutoProduce_MagellanClass_Green,
AutoProduce_PegasusClass
"""
[hiddenAction_AutoProduce_T1_HardUnits]
requireConditional:if memory.randomProduceLevel>0.85




[hiddenAction_AutoProduce_ColumbusClass]
@define AutoProduceIndexMin=50
@define AutoProduceIndexMax=100
@define Number:1
[hiddenAction_AutoProduce_SalamisClass]
@define AutoProduceIndexMin=100
@define AutoProduceIndexMax=400
@define Number:4
[hiddenAction_AutoProduce_MagellanClass]
@define AutoProduceIndexMin=400
@define AutoProduceIndexMax=600
@define Number:2
[hiddenAction_AutoProduce_MagellanClass_Green]
@define AutoProduceIndexMin=600
@define AutoProduceIndexMax=700
@define Number:1
[hiddenAction_AutoProduce_PegasusClass]
@define AutoProduceIndexMin=700
@define AutoProduceIndexMax=900
@define Number:1



[hiddenAction_Get_AutoProduce_T2]
requireConditional:"""
if 
self.resource().Money>4000 
and self.resource().Resource>8000 
and self.globalTeamTags(includes='Tech_EFSF_0079_T2_GMModularizationPlan') 
"""
alsoTriggerAction:"""
AutoProduce_T2_NormalUnits,
AutoProduce_T2_HardUnits
"""

[hiddenAction_AutoProduce_T2_NormalUnits]
alsoTriggerAction:"""
AutoProduce_ColumbusClassKai,
AutoProduce_SalamisClassLateType,
AutoProduce_MagellanClassLateType,
AutoProduce_GrayPhantomClass,
AutoProduce_AlbionClass,
AutoProduce_SalamisClassKai,
AutoProduce_MagellanClassKai,
AutoProduce_RX_78GP03D
"""
[hiddenAction_AutoProduce_T2_HardUnits]
isVisible:false

[hiddenAction_AutoProduce_ColumbusClassKai]
@define AutoProduceIndexMin=50
@define AutoProduceIndexMax=100
@define Number:1
[hiddenAction_AutoProduce_SalamisClassLateType]
@define AutoProduceIndexMin=100
@define AutoProduceIndexMax=400
@define Number:4
requireConditional:"""
if self.globalTeamTags(includes='Unlock_${UnitID}') 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMin} 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMax} 
and self.numberOfUnitsInTeam(withTag='${UnitID}')<=${Number} 
and not self.globalTeamTags(includes='Unlock_SalamisClassKai') 
"""
[hiddenAction_AutoProduce_MagellanClassLateType]
@define AutoProduceIndexMin=400
@define AutoProduceIndexMax=500
@define Number:2
requireConditional:"""
if self.globalTeamTags(includes='Unlock_${UnitID}') 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMin} 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMax} 
and self.numberOfUnitsInTeam(withTag='${UnitID}')<=${Number} 
and not self.globalTeamTags(includes='Unlock_MagellanClassKai') 
"""
[hiddenAction_AutoProduce_GrayPhantomClass]
@define AutoProduceIndexMin=500
@define AutoProduceIndexMax=600
@define Number:2
[hiddenAction_AutoProduce_AlbionClass]
@define AutoProduceIndexMin=600
@define AutoProduceIndexMax=700
@define Number:1
[hiddenAction_AutoProduce_RX_78GP03D]
@define AutoProduceIndexMin=700
@define AutoProduceIndexMax=800
@define Number:1

[hiddenAction_AutoProduce_SalamisClassKai]
@define AutoProduceIndexMin=100
@define AutoProduceIndexMax=400
@define Number:5
[hiddenAction_AutoProduce_MagellanClassKai]
@define AutoProduceIndexMin=400
@define AutoProduceIndexMax=500
@define Number:3