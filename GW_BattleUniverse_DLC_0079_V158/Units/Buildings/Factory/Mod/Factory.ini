
[core]
dont_load:true
copyFrom:"""
ROOT:Template/Building/Common_Buildings_Repair.gw,
ROOT:Template/Building/Common_Buildings.gw,
ROOT:Template/Building/Common_Buildings_ByBuild.gw,
ROOT:Template/Building/Skill/DelSelf.gw,
ROOT:Resource/Image/Fx/Common/Common_Explosion_1.gw
"""


tags:Building,CanBeTargetUnit,Factory,CanProduceBuilding
name: Factory
displayText: Factory
displayText_zh: Factory
displayDescription:Requires 1 Money to maintain
displayDescription_zh:需要1资金以维持


price:Money=${Money},Resource=${Resource}
maxHp: 30000
mass: 50000
armour:60

techLevel: 1
buildSpeed: 0s
radius: 35
isBio: false
isBuilding:true

footprint: -1,-1,1,2
constructionFootprint: -1,-1,1,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:15


disableAllUnitCollisions:true
disableDeathOnZeroHp:true

selfRegenRate:0
fogOfWarSightRange:15

explodeOnDeath:false

showInEditor:true



maxTransportingUnits:0

selfBuildRate:0s

exit_x:7.5
exit_y:40
exit_moveAwayAmount:50

canBuild_1_name: setRally
canBuild_1_pos:  0.1

@global Money=99999
@global Resource=99999


@memory GM:unit
@memory allowAI:bool


@memory repairUnitCD:float
@memory randomProduce:float
@memory randomProduceLevel:float


@memory targetAcademy:unit


[hiddenAction_FindGM]
autoTrigger:if memory.GM.hp<= 0
takeResources_includeUnitsWithinRange:90000
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:GameManager
takeResources_searchOnly:true
takeResources_maxUnits:1
takeResources_triggerActionForEach:FindGM_Step2
[hiddenAction_FindGM_Step2]
setUnitMemory:GM=thisActionTarget




[hiddenAction_Start]
autoTriggerOnEvent:created
sendMessageTo:parent
sendMessageWithTags:SubSpawnDone
sendMessageWithData:unitInfo=self
setUnitMemory:"""
allowAI=false
"""
setResourcesWithLogic:"""
PilotCustom=1
"""

[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
"""




[hiddenAction_InitializeStats]
setUnitMemory:"""
baseDetectRange=${core.fogOfWarSightRange}*18,

finalShootLevel=100,
finalCqbLevel=100,

finalBeamDef=25,
finalShellDef=25,
finalCqbDef=50,

extraBuildingDef=1,
extraBuildingAtk=1
"""
[hiddenAction_Die]
autoTrigger:"""
if self.hp<=0
"""
spawnEffects:Explosion_Ground_1,Crater_1
deleteSelf:true




[hiddenAction_Get_UnitPilotSpawnDone]
autoTriggerOnEvent:newMessage(withTag="UnitPilotSpawnDone")
requireConditional:if memory.targetAcademy.hp>0
sendMessageTo:memory.targetAcademy
sendMessageWithTags:UnitPilotSpawnDone
sendMessageWithData:"""
unitInfo=eventData('unitInfo',type="unit"),
pilotInfo=eventData('pilotInfo',type="unit")
"""




[hiddenAction_Check_Academy]
autoTrigger:true
alsoTriggerAction:"""
Check_GetPilotType,
FindNearestAcademy
"""
[hiddenAction_Check_GetPilotType]
setResourcesWithLogic:"""
PilotCustomType=memory.targetAcademy.resource.PilotCustomType,
PilotLevel=memory.targetAcademy.resource.PilotLevel
"""

[hiddenAction_FindNearestAcademy]
takeResources_includeUnitsWithinRange:450
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:Academy
takeResources_searchOnly:true
takeResources_maxUnits:32
takeResources_triggerActionForEach:FindNearestAcademy_Step2
[hiddenAction_FindNearestAcademy_Step2]
requireConditional:if distanceBetween(self,thisActionTarget)<distanceBetween(self,memory.targetAcadeMy) or memory.targetAcademy.hp<=0
setUnitMemory:targetAcademy=thisActionTarget
[decal_DrawLineTo_Academy_Unit]
layer:shadow
order:1
alpha:0.75
onlyTeam:ally
onlyWhenSelectedByAnyPlayer:true
drawLineTo:memory.targetAcademy
color:#7dffee
imageScale:1
lineWidth:5
xOffsetRelative: 0
yOffsetRelative: 0
onlyOnNonPreview:true
isVisible:if memory.targetAcademy.hp>0
onlyWhileAlive:true



[hiddenAction_Get_AutoProduce]
autoTriggerOnEvent:newMessage(withTag="AutoProduce")
requireConditional:if memory.buildDone==true
setUnitMemory:"""
randomProduce=rnd(0,1000),
randomProduceLevel=rnd(0,1)*select
(
    self.resource().AIHard<=1,
    1,
    select
    (
        self.resource().AIHard>=1.4 and self.resource().AIHard<1.8,
        1.1,
        select
        (
            self.resource().AIHard>=1.8 and self.resource().AIHard<3.7,
            1.2,
            1.3
        )
    )
)
"""







