[core]
dont_load:true

@memory TeamMarkerUnit_08MSTeam:bool
@memory TeamMarkerUnit_08MSTeam_Timer:float

[template_AutoProduce]
@define UnitID=TeamMarkerUnit_08MSTeam
@define AutoProduceIndexMin=0
@define AutoProduceIndexMax=1000
requireConditional:"""
if self.globalTeamTags(includes='Unlock_${UnitID}') 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMin} 
and eventData("AutoProduceIndex",type="float")<${AutoProduceIndexMax} 
and self.numberOfUnitsInTeam(withTag='${UnitID}')<1 
and self.queueSize()<=0
"""

[template_AutoProduce_Step2]
@define Money=0
@define Resource=0
@define MoralPoint=0
addResources: Money=-${Money},Resource=-${Resource},MoralPoint=-${MoralPoint}
alsoQueueAction:IGNORE

[template_Produce_Switch]
@define UnitID=TeamMarkerUnit_08MSTeam
@define Money=0
@define Resource=0
@define MoralPoint=0
@define Time=30
@define TileMode=0
@define FactionVisible= (true)
@define OtherVisible= (true)
pos:100

text:%{select(self.resource.TileMode==0,"[G]","[S]")}
text_zh:%{select(self.resource.TileMode==0,"[G]","[S]")}

tags:${UnitID}

#text:%{self.timeAlive-memory.${UnitID}_Timer}

textAddUnitName:${UnitID}
descriptionAddFromUnit:${UnitID}
unitShownInUI:${UnitID}

onlyOneUnitAtATime:true
allowMultipleInQueue: true
ai_isDisabled:true
displayType:queueUnit
onlyOneUnitAtATime:true

buildSpeed:0s
price:"""
Money=${Money},
Resource=${Resource},
MoralPoint=${MoralPoint}
"""


requireConditional:"""
if memory.buildDone==true 
and 
( 
    (
        self.globalTeamTags(includes='Unlock_${UnitID}') 
        and ${FactionVisible} 
        and ${OtherVisible} 
        and 
        (
            self.resource.TileMode==${TileMode} 
            or 
            ${TileMode}==99
        ) 
        and memory.${UnitID}==false 
        and self.numberOfUnitsInAllTeams(withTag="${UnitID}")<=0
    ) 
)
"""

isVisible:"""
if memory.buildDone==true 
and 
( 
    (
        self.globalTeamTags(includes='Unlock_${UnitID}') 
        and ${FactionVisible} 
        and ${OtherVisible} 
        and 
        (
            self.resource.TileMode==${TileMode} 
            or 
            ${TileMode}==99
        ) 
        and memory.${UnitID}==false 
        and self.numberOfUnitsInAllTeams(withTag="${UnitID}")<=0
    ) 
)
"""


isLocked:"""
if 
(
    self.resource.TileMode!=${TileMode} 
    and 
    ${TileMode}!=99
) 
or 
( 
    self.numberOfUnitsInAllTeams(withTag="${UnitID}")>0 
    or 
    self.queueSize(withActionTag="${UnitID}")>0
)
"""
isLockedMessage:"""
Already in battlefield
"""
isLockedMessage_zh:"""
已存在于战场
"""

setUnitMemory:"""
${UnitID}=true,
${UnitID}_Timer=self.timeAlive+${Time}*select(self.isControlledByAI(),6,1)+select(self.isControlledByAI(),self.teamID*5,0)
"""

setResourcesWithLogic:"""
Money=select(self.isControlledByAI(),self.resource.Money-${Money}*0.5,self.resource.Money),
Resource=select(self.isControlledByAI(),self.resource.Resource-${Resource}*0.5,self.resource.Resource)
"""


[template_Produce_Switch_ON]
@define UnitID=TeamMarkerUnit_08MSTeam
buildSpeed:0s

text:"""
Deploy(%{int(memory.${UnitID}_Timer-self.timeAlive)}s)
"""
text_zh:"""
部署中(%{int(memory.${UnitID}_Timer-self.timeAlive)}s)
"""

descriptionAddFromUnit:${UnitID}
unitShownInUI:${UnitID}
isAlsoViewableByAllies:true

isVisible:"""
if memory.${UnitID}==true
"""

isLocked:"""
if false
"""
setUnitMemory:"""
${UnitID}=false
"""

alsoTriggerAction:template_Produce_F

[template_Produce_Check]
@define UnitID=TeamMarkerUnit_08MSTeam
autoTrigger:"""
if memory.${UnitID}==true 
"""
alsoTriggerAction:"""

"""

[template_Produce_Payback]
@define UnitID=TeamMarkerUnit_08MSTeam
@define Money_G=0
@define Resource_G=0
@define MoralPoint_G=0
@define Money_S=0
@define Resource_S=0
@define MoralPoint_S=0
setResourcesWithLogic:"""
Money=select
(
    self.resource().TileMode==0,
    self.resource().Money+${Money_G},
    self.resource().Money+${Money_S}
),
Resource=select
(
    self.resource().TileMode==0,
    self.resource().Resource+${Resource_G},
    self.resource().Resource+${Resource_S}
),
MoralPoint=select
(
    self.resource().TileMode==0,
    self.resource().MoralPoint+${MoralPoint_G},
    self.resource().MoralPoint+${MoralPoint_S}
)
"""
setUnitMemory:"""
${UnitID}=false
"""

[template_Produce_F]
@define UnitID=TeamMarkerUnit_08MSTeam

requireConditional:"""
if self.numberOfUnitsInAllTeams(withTag="${UnitID}")>0 
"""

showMessageToPlayer:"""
An ACE pilot has stopped training.
"""
showMessageToPlayer_zh:"""
一名ACE驾驶员已停止部署
"""


[template_Produce_T_G]
@define UnitID=TeamMarkerUnit_08MSTeam
requireConditional:"""
if self.numberOfUnitsInAllTeams(withTag="${UnitID}")<1 
and self.resource.TileMode==0 
and self.timeAlive>=memory.${UnitID}_Timer+1 
"""
setUnitMemory:${UnitID}=false
[template_Produce_T_S]
@define UnitID=TeamMarkerUnit_08MSTeam
requireConditional:"""
if self.numberOfUnitsInAllTeams(withTag="${UnitID}")<1 
and self.resource.TileMode==1 
and self.timeAlive>=memory.${UnitID}_Timer+1 
"""
setUnitMemory:${UnitID}=false

[template_Produce_T_M]
highPriorityQueue:true
buildSpeed:0.1s