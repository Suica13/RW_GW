
[core]
copyFrom:"""
ROOT:Units/Buildings/HQ/Mod/HQ.ini
"""
overrideAndReplace:HQ_VS_GE_UC0079_T2
name: HQ_VS_GE_UC0079_T2


[hiddenAction_ChoseFaction_ByAI]
autoTrigger:if self.isControlledByAI()==true and self.resource().FactionIndex==0
alsoTriggerAction:"""
ChoseFaction_ByAI_EFSF_0079,
ChoseFaction_ByAI_ZEON_0079
"""
[hiddenAction_ChoseFaction_ByAI_EFSF_0079]
requireConditional:if numberOfUnitsInEnemyTeam(withTag="ZEON_0079")>0
alsoTriggerAction:ChoseFaction_EFSF_0079

[hiddenAction_ChoseFaction_ByAI_ZEON_0079]
requireConditional:if numberOfUnitsInEnemyTeam(withTag="EFSF_0079")>0
alsoTriggerAction:ChoseFaction_ZEON_0079


[template_ChoseFaction]
attachments_addNewUnits:UnlockedListMarker_0079
attachments_onlyOnSlots:UnlockedListMarkerSlot

[action_ChoseFaction_EFSF_0079]
@copyFromSection:template_ChoseFaction
text:EFSF[0079]
text_zh:地球联邦军[0079]

description:"""
\n"Gihren Zabi speaks of punishing the weakness of the Earth Federation?
\nWhat right does this executioner—who slaughtered four billion innocent civilians—have to speak of justice!"
\n
\n"Citizens of the Earth Federation, hear me—
\nZeon has no forces left to fight!"
\n
\nSuppress the enemy with endless artillery, and advance steadily with heavily armored divisions.
\nStand for order against tyranny, and shatter dictatorship through unity.
\n
\nThe inhumane rule of the Zabi family must come to an end—
\nVictory shall belong to the Earth Federation Forces!
\n
\nDifficulty: Easy
"""
description_zh:"""
\n“基连·扎比说要讨伐地球联邦的软弱?
\n这个残杀四十亿无辜平民的刽子手,有什么资格谈正义!”
\n
\n“地球联邦的国民啊,请听我说——
\n吉翁已无可用之兵!”
\n
\n以无尽的火炮压制敌军,以重装甲部队稳步推进前线。
\n以秩序对抗暴政,以团结粉碎独裁。
\n
\n反人类的扎比家统治必须终结——
\n胜利,必将属于地球联邦军!
\n
\n上手难度:简单
"""

iconImage:ROOT:Resource/Image/Icon/Faction_EFSF_0079_1.png
isVisible:if (memory.readyOK==false or self.resource().FactionIndex==1010101)
playSoundToPlayer:ROOT:Resource/Sound/VC/EF_REVIL/REVIL_Pick.ogg:1.5

highPriorityQueue:true
removeAllQueuedItemsWithoutRefund:true

setResourcesWithLogic:FactionIndex=1010101
temporarilyAddTags:"""
EFSF_0079
"""
addGlobalTeamTags:"""
EFSF_0079,Tech_EFSF_0079_Start,PassT1
"""

[action_ChoseFaction_ZEON_0079]
@copyFromSection:template_ChoseFaction
text:ZEON[0079]
text_zh:吉翁公国军[0079]

description:"""
\n"The chosen people shall obtain dominion in the new era—
\nThis is the inevitability of history!"
\n
\n"Turn your sorrow and indignation into strength—rise up, my people!"
\n
\nWith a weapon of a new age—Mobile Suits—we shall tear apart the decaying old order.
\nLet the people of space be freed from the shackles of gravity.
\n
\nOnly we, the superior, can lead humanity toward its evolutionary future!
\nZick Zeon!
\n
\nDifficulty: Normal
"""
description_zh:"""
\n“被选中的国民,将得到新时代的霸权——
\n这是历史的必然!”
\n
\n“化悲愤为力量吧,站起来吧,国民啊!”
\n
\n以划时代的兵器——机动战士,撕裂腐朽的旧秩序。
\n让宇宙居民从重力的枷锁中解放出来。
\n
\n只有优等的我们,才能引领人类走向进化的未来!
\nZick Zeon!
\n
\n上手难度:普通
"""

iconImage:ROOT:Resource/Image/Icon/Faction_ZEON_0079_1.png
isVisible:if (memory.readyOK==false or self.resource().FactionIndex==1010201)
playSoundToPlayer:ROOT:Resource/Sound/VC/ZN_GIHREN/GIHREN_Pick.ogg:1.5

highPriorityQueue:true
removeAllQueuedItemsWithoutRefund:true

setResourcesWithLogic:FactionIndex=1010201
temporarilyAddTags:"""
ZEON_0079
"""
addGlobalTeamTags:"""
ZEON_0079,Tech_ZEON_0079_Start,PassT1
"""






