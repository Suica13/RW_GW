[core]
copyFrom:ROOT:Template/Unit/BattleUnitCore_Ships.ini
name:BattleUnitCore_Ships_Manual_Salamis
dont_load:false
[hiddenAction_Get_AttackInfo_Bullet]
requireConditional:if not parent.hasTags(includes='ManualControlled') and ((    memory.finalReactionLevel*rnd(0.35,1.35)     >    eventData("accuracy",type="float")*    select    (        distanceBetween(self.getOffsetRelative(y=5), eventData("bulletInfo",type="unit"))>=distanceBetween(self.getOffsetRelative(y=-5), eventData("bulletInfo",type="unit")),        1,        select(memory.pilotAwakeningSkill>=100,1.25,1.5)    )))
