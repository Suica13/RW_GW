[core]
copyFrom:"""
ROOT:Template/Unit/BattleUnit_Framework_MS.ini,
ROOT:Template/Unit/BattleUnit_Graphics_MS.ini,
ROOT:Resource/Image/Fx/Unit/Common_Unit_1.gw,
ROOT:Resource/Image/Fx/Common/Common_ExhaustGas_Double_1.gw,
ROOT:Template/Unit/Animation/Stats/Common_EQPilot_A.gw,
ROOT:Template/Unit/Animation/Stats/Common_Idle_A.gw,
ROOT:Template/Unit/Animation/Stats/Common_Dodge_A.gw,
ROOT:Template/Unit/Animation/Stats/Common_OnMoving.gw,
ROOT:Template/Unit/Animation/Stats/Common_OnMovingWalk.gw,
ROOT:Template/Unit/Animation/Stats/Common_Guard_A_L.gw,
ROOT:Template/Unit/Animation/Stats/Common_Dead_A.gw,
ROOT:Template/Unit/Animation/Stats/Common_Hitrecover_A.gw,
ROOT:Template/Unit/Skill/FlyUnit_Fighter.gw,
ROOT:Template/Unit/Skill/CantDeconstruct.gw,
ROOT:Template/Unit/Skill/ExitUnit.gw,
ROOT:Units/BattleUnits/Weapon/Beam/EF_RGZ_91_BWS_DBC.gw,
ROOT:Units/BattleUnits/Weapon/Beam/EF_RGZ_91_BWS_HighBeamCannon.gw,
ROOT:Units/BattleUnits/Weapon/Shell/EF_RGZ_91_BWS_DMS.gw,
ROOT:Template/Unit/Skill/DogFight_A.gw
"""
name:RGZ_91_MA
tags:RGZ_91_MA,RGZ_91,Unit,MS,Aircraft,EFSF,0093,UC,0093_EFSF
displayText:Re-GZ [BWS]
displayText_zh:灵格斯[BWS]
displayDescription:"""
\nThe Re-GZ with its BWS fitted, emphasizing rapid approach and ranged attacks.
\nAdvantages
\n=Flight capability=
\n=Twin beam cannons, large-caliber mega particle cannon and missiles=
\n=Can discard the BWS=
\nDisadvantages
\n=Cannot reattach the BWS=
\n=No melee weapons=
\n
\n"What is the point of beating such a pathetic mobile suit?"
"""
displayDescription_zh:"""
\n灵格斯搭载BWS后的飞行形态,以高速接近和远程射击为主
\n优势
\n=飞行单位=
\n=双联光束炮、大口径米加粒子炮与导弹=
\n=可以抛弃BWS脱出=
\n劣势
\n=无法重新装回BWS=
\n=不具备格斗武器=
\n
\n“和这种丢人的MS战斗，就算赢了又有什么意义？”
"""
showActionsWithMixedSelectionIfOtherUnitsHaveTag:RGZ_91
maxHp:62500
maxShield:20000
showInEditor:false

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/RGZ_91.png

[attack]
canAttack:true

[hiddenAction_InitializeStats]
setUnitMemory:"""
styleIndex=96,
flyUnit=1,
lowEnDoNotAutoCqb=true,
backSpeed=0.5,
moveHightSpeedModeUseEN=0.2,
unitLevel=6500,


enMax=1350,
dpMax=1250,

baseHeight=35,

attackMode=0,
baseAttackRange=625,
baseFogOfWarSightRange=26,

baseDetectRange=memory.baseFogOfWarSightRange*20,
baseAntiDetectRange=0,

baseMoveSpeed=1.5,
boostMoveSpeed=3.55,
baseTurnSpeed=3.0,

baseShootLevel=185,
baseCqbLevel=185,
cqbModeBuff=1.0,

baseAccuracyLevel=195,
baseReactionLevel=210,
onDodgeBoostSpeed=1.0,

partStructuralStrength=165,
cockpitSafety=165,
repairAllow=true,

baseBeamDef=25,
baseShellDef=30,
baseCqbDef=25,
baseDpDef=25,
baseSpDef=50,

baseBeamDefPlus=400,
baseShellDefPlus=400,
baseCqbDefPlus=800,
baseDpDefPlus=40,
baseSpDefPlus=0,

finalShieldSize=0.75,
finalShieldBlockPR=0.55,
shieldSpeed=0.95,
shieldBeamDef=15,
shieldShellDef=15,
shieldCqbDef=15,
shieldDpDef=15,
shieldBeamDefPlus=350,
shieldShellDefPlus=350,
shieldCqbDefPlus=450,
shieldDpDefPlus=45,

extraBuildingDef=1,
extraBuildingAtk=1,

groundAdaptability=25,
cliffAdaptability=25,
waterAdaptability=25,
skyAdaptability=100,
spaceAdaptability=100
"""

[hiddenAction_InitializeAddPilot_Default]
addUnitsIntoTransport:Pilot_0093_EFSF_N_C_A*1

# [ORDER_DEPENDENT] Keep ExitUnit's TryExitUnit -> convertTo -> TryTransform flow.
[action_ExitUnit]
text:Discard BWS
text_zh:BWS脱出
spawnUnits:Common_ExitDecoy*1

[hiddenAction_ExitUnit_Step2]
convertTo:RGZ_91
teleportTo:self.getOffsetRelative(y=-10)

# Match FA_78_1: restore 35% HP/EN, without refilling the destination shield.
[hiddenAction_Send_TryTransform_ExitUnit]
sendMessageWithData:"""
RecoverHp=0,
RecoverHpPer=0.35,
RecoverShield=0,
RecoverShieldPer=0,
RecoverEn=0,
RecoverEnPer=0.35,
ResetTags=1,
ChangeType=0
"""

[effect_breakedExitUnit0_A]
image:ROOT:Units/BattleUnits/RGZ_91/Image/RGZ_91_BWS_2.png

# MSZ_006-style DedicatedMap adapter, without reversible transformation or SFS actions.
[hiddenAction_TurnToOverLine_T]
autoTrigger:if self.resource().DedicatedMap==1 and memory.styleIndex!=100 and self.timeAlive>0.25
convertTo:RGZ_91_MA_OverLine
convertTo_keepCurrentTags:true
convertTo_keepCurrentFields:"""
selfRegenRate,
shieldRegen,
maxEnergy,
armour,
mass,
movespeed,
maxTurnSpeed,
maxAttackRange,
nanoRange,
fogOfWarSightRange,
nanoFactorySpeed,
targetHeight
"""
setUnitMemory:styleIndex=100

[hiddenAction_TurnToOverLine_F]
autoTrigger:if self.resource().DedicatedMap==0 and memory.styleIndex==100
convertTo:RGZ_91_MA
convertTo_keepCurrentTags:true
convertTo_keepCurrentFields:"""
selfRegenRate,
shieldRegen,
maxEnergy,
armour,
mass,
movespeed,
maxTurnSpeed,
maxAttackRange,
nanoRange,
fogOfWarSightRange,
nanoFactorySpeed,
targetHeight
"""
setUnitMemory:styleIndex=96

[decal_Crotch]
image:SHARED:blank.png
isVisible:false

[decal_Body]
image:SHARED:blank.png
isVisible:false

[decal_ArmL]
image:SHARED:blank.png
isVisible:false

[decal_ArmR]
image:SHARED:blank.png
isVisible:false

[decal_ShoulderL]
image:SHARED:blank.png
isVisible:false

[decal_ShoulderR]
image:SHARED:blank.png
isVisible:false

[decal_Head]
image:SHARED:blank.png
isVisible:false

[decal_Head_Close]
image:SHARED:blank.png
isVisible:false

[decal_Eye]
image:SHARED:blank.png
isVisible:false

[decal_LeftFoot]
image:SHARED:blank.png
isVisible:false

[decal_LeftLeg]
image:SHARED:blank.png
isVisible:false

[decal_RightFoot]
image:SHARED:blank.png
isVisible:false

[decal_RightLeg]
image:SHARED:blank.png
isVisible:false

[decal_Shield]
image:SHARED:blank.png
isVisible:false

[decal_MA]
@copyFromSection:decal_Crotch
image:ROOT:Units/BattleUnits/RGZ_91/Image/RGZ_91_BWS_1.png
basePositionFromLegEnd:arm15
order:2
isVisible:true

[decal_Boost]
order:1.5
isVisible:if memory.moveMode==1
yOffsetRelative:-15
imageScale:2.5
basePositionFromLegEnd:arm15

[decal_Boost_MA]
@copyFromSection:decal_Boost
order:1
isVisible:if memory.moveMode==0
xOffsetRelative:-2
yOffsetRelative:-15
imageScale:1.5

[decal_BoostReversing]
order:1.0
yOffsetRelative:-18
basePositionFromLegEnd:arm15

[effect_Boost_Start]
yOffsetRelative:-35

[hiddenAction_EF_RGZ_91_BWS_DBC_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60 
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and eventData("RandomWeapon",type="float")>25 and eventData("RandomWeapon",type="float")<=65 
"""



[hiddenAction_EF_RGZ_91_BWS_DBC_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0


[hiddenAction_EF_RGZ_91_BWS_DMS_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60 
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and ${onAttacking}==false 
and eventData("RandomWeapon",type="float")<=25 
"""



[hiddenAction_EF_RGZ_91_BWS_DMS_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=2


[hiddenAction_LowPartsForceCqbMode]
requireConditional:"""
if false 
"""


[hiddenAction_EF_RGZ_91_BWS_HighBeamCannon_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and eventData("RandomWeapon",type="float")>65

[hiddenAction_EF_RGZ_91_BWS_HighBeamCannon_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=1
