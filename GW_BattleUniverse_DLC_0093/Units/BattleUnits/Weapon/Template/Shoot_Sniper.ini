
[core]
dont_load:true


name:Shoot_Sniper
tags:ShootBullet

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
ignoreInUnitCapCalculation:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s
autoTriggerCheckRate:every8Frames



@memory finalShootLevel:float
@memory finalCqbLevel:float
@memory finalAccuracyLevel:float
@memory extraBuildingAtk:float

@memory projectileSpeed:float

@memory spawned:bool
@memory target:unit

@memory delTimer:float

@memory sniper_effectFrame:float


@memory attacker:unit


[hiddenAction_Start_SetAttacker]
autoTriggerOnEvent:created
setUnitMemory:attacker=customTarget1.readUnitMemory('attacker',type='unit')


[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""
playSoundAtUnit:ROOT:Resource/Sound/SE/Unit/Warning_1.ogg:0.6

[hiddenAction_Start]
alsoTriggerAction:"""
Start_SetStats,
Start_SetTarget
"""

[hiddenAction_Start_SetTarget]
setUnitMemory:target=self.nearestUnit(withTag='CanBeTargetUnit',withinRange=100,relation='enemy')


[hiddenAction_Start_SetStats]
setUnitMemory:"""
finalShootLevel=customTarget1.readUnitMemory(name="finalShootLevel",type="float"),
finalCqbLevel=customTarget1.readUnitMemory(name="finalCqbLevel",type="float"),
finalAccuracyLevel=customTarget1.readUnitMemory(name="finalAccuracyLevel",type="float"),
extraBuildingAtk=customTarget1.readUnitMemory(name="extraBuildingAtk",type="float"),
projectileSpeed=self.Resource.ProjectileSpeed*self.Resource.BulletSpeed*memory.finalAccuracyLevel*0.005
"""
setBodyRotation:-90


[hiddenAction_Start_SendCustomTarget1]
autoTriggerOnEvent:created
sendMessageTo:customTarget1
sendMessageWithTags:SniperMarker
sendMessageWithData:unitInfo=self

[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
Moving_Forward,
Moving_Rotation,
Moving_Height
"""



[hiddenAction_Moving_Forward]
requireConditional:if memory.target.hp>0 and distanceBetween(self,memory.target)>10
teleportTo:self.getOffsetRelative(y=memory.projectileSpeed)

[hiddenAction_Moving_Rotation]
requireConditional:if memory.target.hp>0
setBodyRotation:directionBetween(self,memory.target)

[hiddenAction_Moving_Height]
requireConditional:if memory.target.hp>0
setHeight:memory.target.height

[hiddenAction_SpawnUnit]
autoTrigger:if memory.sniper_effectFrame>19 and memory.spawned==false
setUnitMemory:spawned=true,delTimer=self.timeAlive+1
sendMessageTo:customTarget1
sendMessageWithTags:SniperAttack

[hiddenAction_DeleteSelf]
autoTrigger:if self.timeAlive>memory.delTimer and memory.spawned==true or customTarget1.hp<=0
deleteSelf:true

[hiddenAction_UpdateFrame]
autoTrigger:if memory.sniper_effectFrame<=19
setUnitMemory:sniper_effectFrame=memory.sniper_effectFrame+0.05*self.resource().BulletSpeed

[decal_SniperMarker]
layer:beforeUI
order:1
image:ROOT:Resource/Image/Fx/Weapon/Sp/Image/LockTarget_1.png
total_frames:20
frame:memory.sniper_effectFrame
imageScale:0.5
xOffsetAbsolute:0
yOffsetAbsolute:0
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.timeAlive>0.1
onlyWhileAlive:true




[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true
showHealthBar:false
showQueueBar:false

disableLowHpFire:true
disableLowHpSmoke:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:0
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false

