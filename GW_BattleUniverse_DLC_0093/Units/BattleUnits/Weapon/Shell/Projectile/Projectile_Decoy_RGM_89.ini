[core]
copyFrom:ROOT:Units/BattleUnits/Weapon/Template/Shoot_ExplosionProjectile_Shell.ini,ROOT:Resource/Image/Fx/Weapon/Shell/Common/Explosion_Hit_1.gw
name:Projectile_Decoy_RGM_89
tags:ShootBullet,CanBeDamaged
@memory sizeFloat:float
@memory dirFloat:float

[hiddenAction_Decoy_Start]
autoTriggerOnEvent:created
setUnitMemory:dirFloat=rnd(0,360)

[hiddenAction_Decoy_Update]
autoTrigger:true
setUnitMemory:sizeFloat=min(0.75,memory.sizeFloat+0.005*self.resource.BulletSpeed),dirFloat=memory.dirFloat+0.5*self.resource.BulletSpeed

# [ORDER_DEPENDENT] Tell the intercepted projectile to resolve its hit before bursting this balloon.
[hiddenAction_Decoy_Intercept]
autoTriggerOnEvent:newMessage(withTag="TryDamage")
requireConditional:if memory.contacted==false
sendMessageTo:eventData("bulletInfo",type="unit")
sendMessageWithTags:DoDamage
alsoTriggerAction:AttackTarget

[decal_Projectile_Image]
layer:beforeUI
order:6
onlyWhileAlive:true
isVisible:true
imageScale:memory.sizeFloat
basePosition:self.getOffsetRelative(dirOffset=memory.dirFloat)
image:ROOT:Resource/Image/Bullet/Sp/EF_Decoy_RGM_89.png

[hiddenAction_SpawnHitEffect]
spawnEffects:Explosion_Hit_1

[projectile_Hit_Effect]
pushForce:3000
