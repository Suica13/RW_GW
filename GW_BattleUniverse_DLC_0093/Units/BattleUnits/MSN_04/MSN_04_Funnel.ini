
[core]
copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Funnel/Mod/Funnel_TypeA.gw,
ROOT:Units/BattleUnits/Weapon/Funnel/NZN_MSN_04_Funnel_BeamGun.gw
"""

tags:Funnel
name:MSN_04_Funnel
dont_load:false

maxHp:1000
maxShield:0

[hiddenAction_InitializeStats]
setUnitMemory:"""


baseAttackRange=450,
baseFogOfWarSightRange=10,
baseDetectRange=${core.fogOfWarSightRange}*18,
baseAntiDetectRange=0,

enMax=200,

baseShootLevel=customTarget1.readUnitMemory("finalShootLevel",type="float"),
baseCqbLevel=customTarget1.readUnitMemory("finalCqbLevel",type="float"),

baseAccuracyLevel=customTarget1.readUnitMemory("finalAccuracyLevel",type="float"),
baseReactionLevel=customTarget1.readUnitMemory("finalReactionLevel",type="float"),

baseBeamDef=10,
baseShellDef=10,
baseCqbDef=10,

baseBeamDefPlus=50,
baseShellDefPlus=50,
baseCqbDefPlus=50,

extraBuildingDef=1,
extraBuildingAtk=1,

baseMoveSpeed=5,
baseTurnSpeed=5,

baseHeight=10
"""
setUnitStats:"""
hp=self.maxHp*customTarget1.hp/customTarget1.maxHp
"""

[decal_Body]
image:ROOT:Units/BattleUnits/Weapon/Funnel/Image/Funnel_MSN_04.png
imageScale:1



[decal_Boost]
xOffsetRelative: 0
yOffsetRelative:-3
imageScale:0.75
imageScaleY:1.25
alpha:0.75


[hiddenAction_Send_FunnelSpawn]
sendMessageWithTags:FunnelSpawn_NZN_MSN_04_Funnel

@global lifeTime=15
@global turnTimerMax=15

[hiddenAction_Die]
sendMessageTo:customTarget1
#sendMessageWithTags:forceBreakWithOutEffect_ArmL


[hiddenAction_NZN_MSN_04_Funnel_BeamGun_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if self.timeAlive>1 and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
"""

[hiddenAction_OrdinaryFunnel_InvalidOwner]
autoTrigger:if customTarget1.hp<=0 or self.teamId!=customTarget1.teamId
deleteSelf:true



