"""
dont_load:false
# [PLACEHOLDER] RGZ_91 MS-derived base panel; own artwork and dedicated weapons. Funnel data temporarily follows MSN_04.
tags:MSN_03,Unit,MS,NZN,0093,UC,0093_NZN
name:MSN_03
displayText:Jagd Doga
displayText_zh:乍得多加
displayDescription:"""
\nA Newtype-use MS developed from the Geara Doga, combining conventional weapons and funnels.
\nAdvantages
\n=Funnels=
\n=Beam machine gun and rifle grenades=
\n=Shield beam cannon=
\n=Green Lv2 beam saber=
\nDisadvantages
\n=Shield cannon unavailable after shield loss=
\n
\n"They say the Colonel is into little girls."
"""
displayDescription_zh:"""
\n以基拉多加为基础开发的新人类用MS,兼顾常规武装与浮游炮攻击
\n优势
\n=浮游炮=
\n=光束机枪与枪榴弹=
\n=盾牌光束炮=
\n=绿色Lv2光束军刀=
\n劣势
\n=盾牌失效后无法使用盾牌炮=
\n
\n“听说上校是个萝莉控啊。”
"""
showActionsWithMixedSelectionIfOtherUnitsHaveTag:MSN_03
maxHp:65000
maxShield:25000



[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/MSN_03.png



