# [ORDER_DEPENDENT] Unit chooses range/weapon and visuals only; weapon GWs own gates and firing queues.
[hiddenAction_NZN_MSN_03_BR_WGL_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (eventData("RandomWeapon",type="float")>35 or (eventData("RandomWeapon",type="float")<=15 and (self.shield<=0 or memory.armLBreaked==true)))

[hiddenAction_NZN_MSN_03_BR_WGL_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[hiddenAction_NZN_MSN_03_BR_GL_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and eventData("RandomWeapon",type="float")>15 and eventData("RandomWeapon",type="float")<=35

[hiddenAction_NZN_MSN_03_BR_GL_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=2

[hiddenAction_NZN_MSN_03_ShieldBSG_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (eventData("RandomWeapon",type="float")<=15 or memory.armRBreaked==true)

[hiddenAction_NZN_MSN_03_ShieldBSG_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=3

[hiddenAction_NZN_MSN_03_BeamSaber_AF_Green_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if distanceBetween(self,self.attacking)<=60

[hiddenAction_NZN_MSN_03_BeamSaber_AF_Green_A_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=1

[decal_NZN_MSN_03_BR_WGL]
isVisible:if memory.nowWeaponIndex!=1 and memory.armRBreaked==false

[decal_NZN_MSN_03_BeamSaber_AF_Green]
