[hiddenAction_EF_RGZ_91_BWS_DBC_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and (distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and eventData("RandomWeapon",type="float")>25 and eventData("RandomWeapon",type="float")<=65)

[hiddenAction_EF_RGZ_91_BWS_DBC_SetWeaponIndex]
