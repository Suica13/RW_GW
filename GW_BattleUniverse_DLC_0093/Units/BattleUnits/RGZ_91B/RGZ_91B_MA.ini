"""
name:RGZ_91B_MA
tags:RGZ_91B_MA,RGZ_91B,Unit,MS,Aircraft,EFSF,0093,UC,0093_EFSF,ManualControlCapable
displayText:Re_GZ Custom [MA]
displayText_zh:灵格斯改[MA]
displayDescription:"""
\nThe Re-GZ Custom's MA form, combining aerial firepower with a reusable transformation system.
\nAdvantages
\n=Flight capability=
\n=Charged beam cannon=
\n=Large missile payload=
\n=Can return to MS form=
\nDisadvantages
\n=No melee weapons=
\n=Transformation does not restore HP or energy=
\n
\n"Beam AK"
"""
displayDescription_zh:"""
\n灵格斯改的MA形态,保留往返变形能力并强化飞行射击
\n优势
\n=飞行单位=
\n=蓄力光束炮=
\n=搭载大量导弹=
\n=可以变回人形=
\n劣势
\n=不具备格斗武器=
\n=变形不会恢复耐久与能源=
\n
\n“光束AK”
"""
showActionsWithMixedSelectionIfOtherUnitsHaveTag:RGZ_91B
maxHp:75000
maxShield:25000
showInEditor:false

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/RGZ_91B.png

[attack]
canAttack:true

[hiddenAction_InitializeStats]
setUnitMemory:"""
styleIndex=select(self.resource().DedicatedMap==1,100,96),
nowSubWeaponIndex=0,
flyUnit=1,
lowEnDoNotAutoCqb=true,
backSpeed=0.5,
moveHightSpeedModeUseEN=0.2,
unitLevel=7750,


enMax=1400,
dpMax=1250,

baseHeight=35,

attackMode=0,
baseAttackRange=650,
baseFogOfWarSightRange=26,

baseDetectRange=memory.baseFogOfWarSightRange*20,
baseAntiDetectRange=0,

baseMoveSpeed=1.5,
boostMoveSpeed=3.55,
baseTurnSpeed=3.0,

baseShootLevel=195,
baseCqbLevel=195,
cqbModeBuff=1.0,

baseAccuracyLevel=200,
baseReactionLevel=220,
onDodgeBoostSpeed=1.0,

partStructuralStrength=165,
cockpitSafety=165,
repairAllow=true,

baseBeamDef=25,
baseShellDef=30,
baseCqbDef=25,
baseDpDef=25,
baseSpDef=50,

baseBeamDefPlus=450,
baseShellDefPlus=450,
baseCqbDefPlus=900,
baseDpDefPlus=40,
baseSpDefPlus=0,

finalShieldSize=0.75,
finalShieldBlockPR=0.55,
shieldSpeed=0.95,
shieldBeamDef=15,
shieldShellDef=15,
shieldCqbDef=15,
shieldDpDef=15,
shieldBeamDefPlus=400,
shieldShellDefPlus=400,
shieldCqbDefPlus=600,
shieldDpDefPlus=45,

extraBuildingDef=1,
extraBuildingAtk=1,

groundAdaptability=25,
cliffAdaptability=25,
waterAdaptability=25,
skyAdaptability=100,
spaceAdaptability=100
"""

[hiddenAction_InitializeAddPilot_Default]
addUnitsIntoTransport:Pilot_0093_EFSF_N_C_A*1

# [ORDER_DEPENDENT] Reversible native Transform -> TryTransform; no BWS ejection.

[hiddenAction_TurnToOverLine_T]
autoTrigger:if self.resource().DedicatedMap==1 and memory.styleIndex!=100 and self.timeAlive>0.25
convertTo:RGZ_91B_MA_OverLine
convertTo_keepCurrentTags:true
convertTo_keepCurrentFields:"""
selfRegenRate,
shieldRegen,
maxEnergy,
armour,
mass,
movespeed,
maxTurnSpeed,
maxAttackRange,
nanoRange,
fogOfWarSightRange,
nanoFactorySpeed,
targetHeight
"""
setUnitMemory:styleIndex=100

[hiddenAction_TurnToOverLine_F]
autoTrigger:if self.resource().DedicatedMap==0 and memory.styleIndex==100
convertTo:RGZ_91B_MA
convertTo_keepCurrentTags:true
convertTo_keepCurrentFields:"""
selfRegenRate,
shieldRegen,
maxEnergy,
armour,
mass,
movespeed,
maxTurnSpeed,
maxAttackRange,
nanoRange,
fogOfWarSightRange,
nanoFactorySpeed,
targetHeight
"""
setUnitMemory:styleIndex=96

