[core]
copyFrom:ROOT:Units/Buildings/HQ/Mod/HQ.ini
overrideAndReplace:HQ_VS_GE_UC0093
name:HQ_VS_GE_UC0093

[action_ChoseFaction_Info_2]
text:UC 0093
text_zh:宇宙世纪 0093

[template_ChoseFaction]
attachments_addNewUnits:UnlockedListMarker_0093
attachments_onlyOnSlots:UnlockedListMarkerSlot

[action_ChoseFaction_0093_EFSF]
@copyFromSection:template_ChoseFaction
text:EFSF[0093]
text_zh:地球联邦[0093]
description:UC0093 skeleton - no combat roster or research projects yet.
description_zh:0093阵营骨架，战斗单位与科技内容待添加。
iconImage:ROOT:Resource/Image/Icon/Faction_0093_EFSF_1.png
isVisible:if memory.readyOK==false or self.resource().FactionIndex==1030101
setResourcesWithLogic:FactionIndex=1030101
temporarilyAddTags:0093_EFSF,HQ_ResGen
addGlobalTeamTags:0093_EFSF,Tech_0093_EFSF_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2

[action_ChoseFaction_0093_NZN]
@copyFromSection:template_ChoseFaction
text:NZN[0093]
text_zh:新吉翁[0093]
description:UC0093 skeleton - no combat roster or research projects yet.
description_zh:0093阵营骨架，战斗单位与科技内容待添加。
iconImage:ROOT:Resource/Image/Icon/Faction_0093_NZN_1.png
isVisible:if memory.readyOK==false or self.resource().FactionIndex==1030201
setResourcesWithLogic:FactionIndex=1030201
temporarilyAddTags:0093_NZN,HQ_ResGen
addGlobalTeamTags:0093_NZN,Tech_0093_NZN_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2

# Deterministic fallback avoids an all-AI lobby waiting forever.
[hiddenAction_ChoseFaction_ByAI]
autoTrigger:if self.isControlledByAI() and self.resource().FactionIndex==0
alsoTriggerAction:ChoseFaction_ByAI_EFSF,ChoseFaction_ByAI_NZN

[hiddenAction_ChoseFaction_ByAI_EFSF]
requireConditional:if self.resource().FactionIndex==0 and int(self.teamID/2)*2==self.teamID
alsoTriggerAction:ChoseFaction_0093_EFSF
[hiddenAction_ChoseFaction_ByAI_NZN]
requireConditional:if self.resource().FactionIndex==0
alsoTriggerAction:ChoseFaction_0093_NZN

[hiddenAction_ConvertToFaction]
autoTrigger:if self.resource.GameStart==1 and memory.gameStartChangeFaction==false
alsoTriggerAction:ConvertToFaction_0093_EFSF,ConvertToFaction_0093_NZN
setUnitMemory:gameStartChangeFaction=true

[hiddenAction_ConvertToFaction_0093_EFSF]
requireConditional:if self.resource().FactionIndex==1030101
convertTo:HQ_0093_EFSF
attachments_addNewUnits:TechTree_Core_0093
attachments_onlyOnSlots:TechTreeMarkerSlot
# Both ground and space start without combat units.

[hiddenAction_ConvertToFaction_0093_NZN]
requireConditional:if self.resource().FactionIndex==1030201
convertTo:HQ_0093_NZN
attachments_addNewUnits:TechTree_Core_0093
attachments_onlyOnSlots:TechTreeMarkerSlot
# Both ground and space start without combat units.
