[core]
copyFrom:"""
ROOT:Units/Buildings/Factory/Mod/Factory.ini,
ROOT:Units/Buildings/Factory/UnitList/0093_EFSF/0093_EFSF_UnitList_Land.ini
"""


tags:Building,SLChangeFaction,CanBeTargetUnit,CanProduceBuilding,Factory,Factory_0093_EFSF_Land,0093_EFSF,0093,UC
name:Factory_0093_EFSF_Land
displayText:Land Factory[EFSF][0093]
displayText_zh:陆军工厂[EFSF][0093]

footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10

maxHp: 90000

@global Money=1000
@global Resource=2000
@global buildTime=10


exit_x:0
exit_y:25
exit_moveAwayAmount:0

[hiddenAction_Building_GetDone]
temporarilyAddTags:Factory_T1



[ai]
buildPriority: 0.15
maxEachBase:3
maxGlobal:12
noneInBaseExtraPriority: 0.2
noneGlobalExtraPriority: 0.4


[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Light_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Light.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
teamColors:true
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Work_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:if self.queueSize()>0
image:ROOT:Units/Buildings/Factory/Image/Factory_1_ON.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Faction_1]
layer:beforeBody
order:2
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Resource/Image/Icon/Faction_0093_EFSF_2.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.2
xOffsetRelative:-15.5
yOffsetRelative:-9.5


[decal_Body_2]
@copyFromSection:decal_Body_1
xOffsetRelative:15.5
[decal_Light_2]
@copyFromSection:decal_Light_1
xOffsetRelative:15.5
[decal_Work_2]
@copyFromSection:decal_Work_1
xOffsetRelative:15.5
[decal_Faction_2]
@copyFromSection:decal_Faction_1
xOffsetRelative:15.5



# Follow the 0087 factory AI: ordinary production with a 15% specialist attempt.
# [ORDER_DEPENDENT] Failed/locked/capped specialist choices fall back through normal units to the base unit.
# UnitTemplate retains unlock, stock, population and empty-queue checks; do not bypass its production actions.

[hiddenAction_Get_AutoProduce]
alsoTriggerAction:"""
Get_AutoProduce_T1,
Get_AutoProduce_T2
"""


[hiddenAction_Get_AutoProduce_T1]
requireConditional:if self.resource().Money>1000 and self.resource().Resource>2000 and not self.globalTeamTags(includes='Tech_0093_EFSF_Mid03')
alsoTriggerAction:"""
AutoProduce_T1_HardUnits,
AutoProduce_NormalUnits,
AutoProduce_RGM_86R_0093_EFSF
"""


[hiddenAction_AutoProduce_T1_HardUnits]
requireConditional:if memory.randomProduceLevel>=0.85
alsoTriggerAction:"""
AutoProduce_RGZ_91
"""


[hiddenAction_Get_AutoProduce_T2]
requireConditional:if self.resource().Money>1000 and self.resource().Resource>2000 and self.globalTeamTags(includes='Tech_0093_EFSF_Mid03')
alsoTriggerAction:"""
AutoProduce_T2_HardUnits,
AutoProduce_NormalUnits,
AutoProduce_RGM_86R_0093_EFSF
"""


[hiddenAction_AutoProduce_T2_HardUnits]
requireConditional:if memory.randomProduceLevel>=0.85
alsoTriggerAction:"""
AutoProduce_RX_93_Test,
AutoProduce_RX_93,
AutoProduce_RGZ_91
"""


[hiddenAction_AutoProduce_NormalUnits]
requireConditional:if self.queueSize()<=0
alsoTriggerAction:"""
AutoProduce_RGM_89,
AutoProduce_RGC_90,
AutoProduce_MSZ_006A1_0093_EFSF
"""


[hiddenAction_AutoProduce_RGM_86R_0093_EFSF]
@define AutoProduceIndexMin=0
@define AutoProduceIndexMax=1000
@define Number:9


[hiddenAction_AutoProduce_RGM_89]
