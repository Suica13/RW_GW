[hiddenAction_CheckCaptureBar]
setUnitMemory:"""
captureTimer=select
(
    memory.captureTimer>=0,
    select
    (
        numberOfUnitsInEnemyTeam(withTag="CanCaptureUnit",withinrange=150)>0,
        select
        (
            (
                numberOfUnitsInAllyNotOwnTeam(withTag="CanCaptureUnit",withinrange=150)>0 or numberOfUnitsInTeam(withTag='CanCaptureUnit',withinrange=150)>0 
                or 
                numberOfUnitsInAllyNotOwnTeam(withTag="BuildingTurret",withinrange=150)>0 or numberOfUnitsInTeam(withTag='BuildingTurret',withinrange=150)>0 
            ),
            memory.captureTimer,
            memory.captureTimer-0.5
        ),
        select
        (
            memory.captureTimer<memory.captureTimerMax,
            (
                memory.captureTimer+0.5
            ),
            memory.captureTimerMax
        )
    ),
    0
)
"""

[hiddenAction_CheckNearestUnit]
requireConditional:"""
if self.numberOfUnitsInEnemyTeam(withTag="CanCaptureUnit",withinrange=150)>0 
"""
setUnitMemory:nearestUnit=self.nearestUnit(withTag='CanCaptureUnit',withinRange=151,relation='enemy')
[hiddenAction_CheckCaptureBarZero]
requireConditional:"""
if memory.captureTimer<=0 
and memory.nearestUnit.hasTags(includes='CanCaptureUnit')  
and numberOfUnitsInEnemyTeam(withTag="CanCaptureUnit",greaterThan=0,withinrange=150) 
and numberOfUnitsInAllyNotOwnTeam(withTag="CanCaptureUnit",lessThan=1,withinrange=150) 
and numberOfUnitsInTeam(withTag='CanCaptureUnit', lessThan=1,withinrange=150)
"""
switchToTeam:memory.nearestUnit.teamID
spawnEffects:Light_100
alsoTriggerAction:SLChangeFaction
clearAllWaypoints:true





