
[core]
copyFrom:"""
ROOT:Template/DamageChecker/DamageChecker.ini
"""

name:DamageChecker_Funnel

[hiddenAction_Start]
temporarilyAddTags:Funnel

[hiddenAction_CheckCanBeDamagedTrue]
requireConditional:if (parent.parent.hp<=0 or parent.parent.tags(includes="ShowSlot")) and not self.tags(includes='CanBeDamaged') and not parent.tags(includes='UnDetected')
temporarilyAddTags:CanBeDamaged

[hiddenAction_CheckCanBeDamagedFalse]
requireConditional:if parent.parent.hp>0 and not parent.parent.tags(includes="ShowSlot") and self.tags(includes='CanBeDamaged') and parent.tags(includes='UnDetected')
temporarilyRemoveTags:CanBeDamaged