
[core]
copyFrom:"""
ROOT:Template/Unit/BattleUnitCore.ini,
ROOT:Template/Unit/BattleUnitCore_Decal_MS.ini,
ROOT:Template/Unit/BattleUnitCore_AI.ini
"""

dont_load:false

tags:BattleUnitCore

name:BattleUnitCore_MS
displayText: BattleUnitCore_MS
displayText_zh: 战斗单位核心_MS


@memory thisTimeDodgeLR:float
@memory thisTimeDodgeCD:float
@memory ambacTimer:float



[hiddenAction_Check_Pilot_NoPilot_TimeOut]
alsoTriggerAction:Check_Pilot_NoPilot_ChangeTeam,SetClearQueued,Send_WayPoint_Clear,Check_Pilot_GetSkills_NoPilot,PlayQuitPilotAnimation
[hiddenAction_Check_Pilot_HasPilot]
alsoTriggerAction:PlayEnterPilotAnimation

[hiddenAction_Get_Dp]
autoTriggerOnEvent:newMessage(withTag="LastDamageBy")
setUnitMemory:dp=memory.dp+eventData("DpDamage",type="float")
alsoTriggerAction:Dp_AutoClear_Reset


[hiddenAction_Dp_Update]
autoTrigger:true
alsoTriggerAction:"""
Dp_Max,
Dp_Stagger_Check,
Dp_Stagger_Clear,
Dp_Daze_Check,
Dp_Daze_Clear,
Dp_AutoClear
"""

[hiddenAction_Dp_Max]
requireConditional:if memory.dp>parent.readUnitMemory('dpMax',type='float')
setUnitMemory:dp=parent.readUnitMemory('dpMax',type='float')


[hiddenAction_Dp_Daze_Check]
requireConditional:"""
if memory.dp>=parent.readUnitMemory('dpMax',type='float')*0.60 and memory.onDaze==false and memory.onStagger==false and self.timeAlive>0.1
"""
alsoTriggerAction:SetClearQueued,StopLastAnimation,Dp_AutoClear_Reset,Dp_Daze_Set

[hiddenAction_Dp_Daze_Set]
setUnitMemory:onDaze=true,onDazeTimer=self.timeAlive+0.5
sendMessageTo:parent
sendMessageWithTags:PlayDazeAnimation

[hiddenAction_Dp_Daze_Clear]
requireConditional:if memory.onDaze==true and memory.onStagger==false and self.timeAlive>memory.onDazeTimer
alsoTriggerAction:Dp_Clear




[hiddenAction_Dp_Stagger_Check]
requireConditional:"""
if memory.dp>=parent.readUnitMemory('dpMax',type='float')*1.0 and memory.onStagger==false and self.timeAlive>0.1
"""
alsoTriggerAction:SetClearQueued,StopLastAnimation,Dp_AutoClear_Reset,Dp_Stagger_Set

[hiddenAction_Dp_Stagger_Set]
setUnitMemory:onStagger=true,onStaggerTimer=self.timeAlive+1
sendMessageTo:parent
sendMessageWithTags:PlayStaggerAnimation

[hiddenAction_Dp_Stagger_Clear]
requireConditional:if memory.onStagger==true and self.timeAlive>memory.onStaggerTimer
alsoTriggerAction:Dp_Clear


[hiddenAction_Dp_AutoClear]
requireConditional:if self.timeAlive>memory.clearDpTimer and memory.onDaze==false and memory.onStagger==false
alsoTriggerAction:Dp_Clear


[hiddenAction_Dp_AutoClear_Reset]
setUnitMemory:clearDpTimer=self.timeAlive+3


[hiddenAction_Dp_Clear]
autoTriggerOnEvent:newMessage(withTag="ClearDp")
setUnitMemory:dp=0,onDaze=false,onStagger=false,onDazeTimer=0,onStaggerTimer=0





[hiddenAction_Check_Dead_Start]
alsoTriggerAction:Send_DeadUnload_Pilot
playSoundAtUnit:ROOT:Resource/Sound/SE/Unit/Dead_4.ogg



[hiddenAction_Get_AttackInfo_Bullet]
autoTriggerOnEvent:newMessage(withTag="AttackInfo_Bullet")
requireConditional:"""
if 
(
    memory.finalReactionLevel*rnd(0.35,1.35) 
    >
    eventData("accuracy",type="float")*
    select
    (
        distanceBetween(self.getOffsetRelative(y=5), eventData("bulletInfo",type="unit"))>=distanceBetween(self.getOffsetRelative(y=-5), eventData("bulletInfo",type="unit")),
        1,
        select(memory.pilotAwakeningSkill>=100,1.25,1.5)
    )
)
"""
alsoTriggerAction:"""
Get_AttackInfo_Bullet_Step2,
Get_AttackInfo_Bullet_Step3
"""
[hiddenAction_Get_AttackInfo_Bullet_Step2]
requireConditional:if eventData("cantDodge",type="float")==0
sendMessageTo:eventData("bulletInfo",type="unit")
sendMessageWithTags:ThisTimeMissTarget
[hiddenAction_Get_AttackInfo_Bullet_Step3]
requireConditional:"""
if self.timeAlive>memory.thisTimeDodgeCD 
and parent.readUnitMemory("attackRuleMode",type="float")!=1 
"""
setUnitMemory:"""
thisTimeDodgeLR=rnd(0,1),
thisTimeDodgeCD=select
(
    memory.pilotAwakeningSkill>=100,
    self.timeAlive+0.6,
    self.timeAlive+0.8
)-memory.pilotReactionSkill/10*0.01,
onDodgeBoostTimer=self.timeAlive+0.5,
thisTimeWayPoint=
parent.getOffsetRelative
(
    x=select
    (
        memory.thisTimeDodgeLR>=0.5,
        rnd(40,60),
        -rnd(40,60)
    )
    *select(parent.tags(includes='MA'),1.5,1)
    *select(memory.nowMoveSpeed>2.0,1.25,1)
    ,
    y=select
    (
        parent.readUnitMemory('attackMode',type='float')==0,
        rnd(15,25),
        select
        (
            distanceBetween(parent, parent.attacking)>=60,
            rnd(100,200),
            rnd(-20,20)
        )
    )*select(parent.tags(includes='MA'),1.5,1)
)
"""
alsoTriggerAction:Send_WayPoint_Unit_Move_Dodge




[hiddenAction_Send_WayPoint_Unit_Move_Dodge]
requireConditional:"""
if parent.numberOfQueuedWaypoints(type='move')<1 
"""
sendMessageTo:parent
sendMessageWithTags:WayPoint_Unit
sendMessageWithData:"""
WayPoint_Unit=memory.thisTimeWayPoint,
WayPointType=1,
ClearAllWayPoint=0
"""
alsoTriggerAction:PlayDodgeLAnimation,PlayDodgeRAnimation




[hiddenAction_PlayDodgeLAnimation]
requireConditional:if memory.thisTimeDodgeLR<0.5 and memory.onAttacking==false
sendMessageTo:parent
sendMessageWithTags:PlayDodgeLAnimation

[hiddenAction_PlayDodgeRAnimation]
requireConditional:if memory.thisTimeDodgeLR>=0.5 and memory.onAttacking==false
sendMessageTo:parent
sendMessageWithTags:PlayDodgeRAnimation




[hiddenAction_AMBAC]
autoTrigger:"""
if self.timeAlive>memory.ambacTimer 
"""
setUnitMemory:"""
ambacTimer=select
(
    memory.pilotAwakeningSkill>=100,
    self.timeAlive+0.4,
    self.timeAlive+0.8
)
"""
alsoTriggerAction:AMBAC_Step2
[hiddenAction_AMBAC_Step2]
requireConditional:"""
if self.resource().tileMode!=3 
and parent.attacking.hp>0 
and parent.readUnitMemory('attackMode',type='float')==0 
and parent.readUnitMemory("attackRuleMode",type="float")==0 
and not parent.hasActiveWaypoint(type="move") 
and memory.finalReactionLevel>rnd(0,151) 
"""
setUnitMemory:"""
thisTimeDodgeLR=rnd(0,1),
ambacTimer=select
(
    memory.pilotAwakeningSkill>=100,
    self.timeAlive+0.6,
    self.timeAlive+1.2
),
thisTimeWayPoint=
parent.getOffsetRelative
(
    x=select
    (
        memory.thisTimeDodgeLR>=0.5,
        rnd(50,80),
        -rnd(50,80)
    )*select(parent.tags(includes='MA'),1.5,1),
    y=rnd(10,15)*select(parent.tags(includes='MA'),1.5,1)
)
"""
alsoTriggerAction:Send_WayPoint_Unit_Move_AMBAC



[hiddenAction_Send_WayPoint_Unit_Move_AMBAC]
requireConditional:if not parent.hasActiveWaypoint(type="move") and not parent.hasActiveWaypoint(type="loadinto")
sendMessageTo:parent
sendMessageWithTags:WayPoint_Unit
sendMessageWithData:"""
WayPoint_Unit=memory.thisTimeWayPoint,
WayPointType=1,
ClearAllWayPoint=0
"""
alsoTriggerAction:PlayDodgeLAnimation,PlayDodgeRAnimation

