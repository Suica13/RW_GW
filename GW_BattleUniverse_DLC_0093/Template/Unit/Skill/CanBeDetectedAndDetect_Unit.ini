[core]
dont_load:true


@global detectRange=1000

@memory detectCD:float

@memory baseDetectRange:float
@memory baseAntiDetectRange:float

@memory finalDetectRange:float
@memory finalAntiDetectRange:float
@memory selfDetectedTimer:float


[hiddenAction_Check_Detect]
autoTrigger:true
alsoTriggerAction:"""
Check_CanBeDetect,
Check_DetectEnemy,
Check_SelfDetected
"""
[hiddenAction_Check_DetectRange]
autoTrigger:true
setUnitMemory:"""
finalDetectRange=memory.baseDetectRange*select(self.resource().TileMode==0,1,1),
finalAntiDetectRange=memory.baseAntiDetectRange*select(self.resource().TileMode==0,1,1)
"""

[hiddenAction_Start_AddUnDetected]
autoTriggerOnEvent:created
temporarilyAddTags:UnDetected
[hiddenAction_Check_CanBeDetect]
requireConditional:"""
if not self.tags(includes='CanBeDetected') and self.timeAlive>0.5
"""
temporarilyAddTags:CanBeDetected

[hiddenAction_Check_DetectEnemy]
requireConditional:"""
if self.numberOfUnitsInEnemyTeam(withTag="CanBeDetected",withinrange=${detectRange})>0 
and self.numberOfUnitsInEnemyTeam(withTag="UnDetected",withinrange=${detectRange})>0 
and self.timeAlive>memory.detectCD 
and memory.finalDetectRange>0
"""
setUnitMemory:detectCD=self.timeAlive+1
takeResources_includeUnitsWithinRange:${detectRange}
takeResources_includeUnitsWithinRange_team:enemy
takeResources_excludeUnitsWithoutTags:CanBeDetected
takeResources_searchOnly:true
takeResources_maxUnits:100
takeResources_triggerActionForEach:Check_DetectEnemy_Step2
[hiddenAction_Check_DetectEnemy_Step2]
requireConditional:"""
if distanceBetween(self,thisActionTarget)+thisActionTarget.readUnitMemory("finalAntiDetectRange",type="float")<memory.finalDetectRange
*select(self.height>=1 and thisActionTarget.height<1 and not self.tags(includes="Sonar"),0.5,1)
*select(self.height<1 and thisActionTarget.height>=1 and not self.tags(includes="Sonar"),0.5,1)
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:Detected
sendMessageWithData:"""
unitInfo=self
"""
[hiddenAction_Check_SelfDetected]
requireConditional:"""
if self.timeAlive>memory.selfDetectedTimer and not self.tags(includes='UnDetected')
"""
temporarilyAddTags:UnDetected

[hiddenAction_Get_Detected]
autoTriggerOnEvent:newMessage(withTag="Detected")
setUnitMemory:selfDetectedTimer=self.timeAlive+5
temporarilyRemoveTags:UnDetected
alsoTriggerAction:Get_Detected_SpawnMarker
[hiddenAction_Get_Detected_SpawnMarker]
requireConditional:if self.tags(includes='DetectedVisible') or eventData("SpawnMarker",type="bool")==true
spawnUnits:"""
DetectMarker*1
(
    spawnSource=createMarker(teamID=eventData("unitInfo",type="unit").teamID,x=self.x,y=self.y)
)
"""


[decal_Marker]
layer:shadow
onlyTeam:enemy
order:1
image:ROOT:Resource/Image/Units/Hud/Marker/Marker.png
alpha:0.5
imageScale:0.5
xOffsetAbsolute:0
yOffsetAbsolute:0
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.timeAlive>0.1 and not self.tags(includes='UnDetected')
onlyWhileAlive:true

