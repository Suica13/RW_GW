
[core]
dont_load:true

copyFrom:"""
ROOT:Resource/Image/Fx/Common/Common_Explosion_1.gw
"""

tags:UnitTurret
name:Turret_CanNotBeTarget


showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

disableDeathOnZeroHp:true

ignoreInUnitCapCalculation:true

isUnselectableAsTarget:true

showInEditor:false

autoTriggerCooldownTime:0.1s
autoTriggerCheckRate:every8Frames

@global onSkill=parent.readUnitMemory("battleUnitCore",type="unit").readUnitMemory('onSkill',type='bool')
@global onAttacking=parent.readUnitMemory("battleUnitCore",type="unit").readUnitMemory('onAttacking',type='bool')
@global onAttackingCantAim=parent.readUnitMemory("battleUnitCore",type="unit").readUnitMemory('onAttackingCantAim',type='bool')
@global cantAction=parent.readUnitMemory("battleUnitCore",type="unit").readUnitMemory('cantAction',type='bool')
@global tileMode=parent.readUnitMemory("battleUnitCore",type="unit").resource.TileMode
@global allowAI=parent.readUnitMemory("battleUnitCore",type="unit").readUnitMemory('allowAI',type='bool')


@memory coreUnit:unit
@memory battleUnitCore:unit

@memory finalAttackRange:float

@memory finalShootLevel:float
@memory finalCqbLevel:float
@memory finalAccuracyLevel:float
@memory extraBuildingAtk:float

@memory attackRuleMode:float

@memory lastDamageBy:unit

@memory attacker:unit

@memory onSkill:bool

@memory close:bool

@memory breaked:bool

@global onAttackingCantAim=false
@global extraAttackConditionFly=true
@global extraAttackConditionLand=true
@global extraAttackConditionUnder=true
@global extraAttackConditionWater=true

@global attackConditionFly=true
@global attackConditionLand=true
@global attackConditionUnder=true
@global attackConditionWater=true

[hiddenAction_Start_SetAttacker]
autoTriggerOnEvent:created
setUnitMemory:attacker=customTarget1.readUnitMemory('attacker',type='unit')


[hiddenAction_SetCoreUnit]
autoTriggerOnEvent:created
setUnitMemory:coreUnit=parent,battleUnitCore=parent.readUnitMemory('battleUnitCore',type='unit')


[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
GetStats
"""

[hiddenAction_InitializeStats]
autoTriggerOnEvent:created
setUnitMemory:"""
finalShootLevel=100,
finalCqbLevel=100,
finalAccuracyLevel=100,
extraBuildingAtk=1
"""


[hiddenAction_GetStats]
setUnitMemory:"""
attackRuleMode=parent.readUnitMemory("attackRuleMode",type="float"),
close=parent.readUnitMemory("close",type="bool"),

finalAttackRange=parent.readUnitMemory("finalAttackRange",type="float"),

finalShootLevel=parent.readUnitMemory("finalShootLevel",type="float"),
finalCqbLevel=parent.readUnitMemory("finalCqbLevel",type="float"),
finalAccuracyLevel=parent.readUnitMemory("finalAccuracyLevel",type="float"),
extraBuildingAtk=parent.readUnitMemory("extraBuildingAtk",type="float")
"""


[hiddenAction_SendEnemyTryAttack_Shoot]
sendMessageTo:self.attacking.readUnitMemory(name='BattleUnitCore',type='unit')
sendMessageWithTags:EnemyTryAttack
sendMessageWithData:UnitInfo=self




[hiddenAction_Die]
autoTrigger:"""
if parent.hp<=0 and memory.breaked==false
"""
setUnitMemory:breaked=true



[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true
















[graphics]
image:SHARED:blank.png
image_wreak:SHARED:blank.png
image_shadow:auto
image_shield:SHARED:blank.png
icon_build:ROOT:Resource/Image/Units/Icon/Turret_Common.png
icon_zoomed_out_neverShow:false
shadowOffsetX:0
shadowOffsetY:0

total_frames:1

showHealthBar:false
showEnergyBar:false
showShieldBar:false

showQueueBar:false
showShotDelayBar:false
showTransportBar:false
drawLayer:ground

disableLowHpFire:true
disableLowHpSmoke:true

imageScale:1
turretImageScale:1

[attack]
canAttack:true
canAttackFlyingUnits:"""
if ${onAttackingCantAim}==false 
and ${attackConditionFly} 
and ${extraAttackConditionFly} 
and memory.attackRuleMode!=2 
and parent.parent.hp<=0 
and memory.breaked==false 
and self.timeAlive>1 
and ${onSkill}==false
"""
canAttackLandUnits:"""
if ${onAttackingCantAim}==false 
and ${attackConditionLand} 
and ${extraAttackConditionLand} 
and memory.attackRuleMode!=2 
and parent.parent.hp<=0 
and memory.breaked==false 
and self.timeAlive>1 
and ${onSkill}==false
"""
canAttackUnderwaterUnits:"""
if ${onAttackingCantAim}==false 
and ${attackConditionUnder} 
and ${extraAttackConditionUnder} 
and memory.attackRuleMode!=2 
and parent.parent.hp<=0 
and memory.breaked==false 
and self.timeAlive>1 
and ${onSkill}==false
"""
canAttackNotTouchingWaterUnits:"""
if ${onAttackingCantAim}==false 
and ${attackConditionWater} 
and ${extraAttackConditionWater} 
and memory.attackRuleMode!=2 
and parent.parent.hp<=0 
and memory.breaked==false 
and self.timeAlive>1 
and ${onSkill}==false
"""
canOnlyAttackUnitsWithTags:CanBeTargetUnit,CanBeTargetUnitSpace
canOnlyAttackUnitsWithoutTags:UnDetected

isFixedFiring:false

turretMultiTargeting:false

[movement]
movementType: AIR
moveSpeed:0
maxTurnSpeed:100
targetHeight:1
targetHeightDrift:0
turnAcceleration:10


[ai]
useAsTransport:false
useAsBuilder: false

