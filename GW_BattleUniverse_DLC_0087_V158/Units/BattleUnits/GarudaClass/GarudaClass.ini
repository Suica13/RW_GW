tags:GarudaClass,Unit,CmdUnit,Ship,EFSF,0087,UC,LargeUnit,MpUpUnit_X24
name:GarudaClass

displayText:Garuda Class
displayText_zh:迦楼罗级

displayDescription:"""
\nA large transport aircraft developed by the Earth Federation Forces based on Zeon's Gaw-class
\nAdvantages
\n= Extremely high durability =
\n= Allows communication command =
\n= Automatically repairs when out of combat =
\n= Transport capacity: 12x2 =
\n= Equipped with numerous anti-air weapons =
\n= Takes 35% less damage from structures =
\n= Can disperse Minovsky particles =
\nDisadvantages
\n= Massive size =
\n= -250 detection range =
\n= Reveals vision when detected =
\n
\n"Next time, we'll definitely capture it back!"
"""
displayDescription_zh:"""
\n联邦军根据吉翁的加乌级改良而来的大型运输机
\n优势
\n=耐久极高=
\n=允许通信指挥=
\n=脱战自动修复=
\n=运输力:12x2=
\n=装备大量的对空武器=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“下次我们一定会把他缴获回来的!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:GarudaClass


displayRadius:75
radius:75

maxHp:275000
maxShield:0

@global cmdComRangeExtra=250
@global supplyPointRangeExtra=150

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/GarudaClass.png
drawLayer:air

[attack]
