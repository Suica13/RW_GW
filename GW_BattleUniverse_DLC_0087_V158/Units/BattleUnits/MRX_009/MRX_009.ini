\nA prototype Psycommu-system unit developed by the Titans, equipped with overwhelming firepower
\n
\nAdvantages
\n= Can fire a MEGA Particle Cannon =
\n= Equipped with an I-Field =
\n= Extremely high resistance =
\n= Highly effective against units using mass beam weaponry =
\nDisadvantages
\n= -100m anti-detection =
\n= Poor endurance =
\n= Slow responsiveness =
\n
\n“Burning New City”
"""
