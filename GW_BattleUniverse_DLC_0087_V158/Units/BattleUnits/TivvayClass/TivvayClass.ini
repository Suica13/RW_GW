tags:TivvayClass,Unit,Ship,CmdUnit,NEO_ZEON,0087,UC,LargeUnit,MpUpUnit_X12
name:TivvayClass

displayText:Tivvay Class
displayText_zh:提贝级

displayDescription:"""
\nPrincipality of Zeon's Main Fleet Battleship  
\nAdvantages  
\n=Strong frontal firepower=  
\n=Can ReEntry=
\n=Allows command defense=  
\n=Allows communication-based command=
\n=Auto-repairs when out of combat=  
\n=Transport Capacity: 12=
\n= Can disperse Minovsky particles =
\nDisadvantages  
\n=Extremely large size=  
\n=-250 range to radar stealth=  
\n=Reveals nearby vision when detected=  
\n  
\n"Glory to the Principality of Zeon!"
"""
displayDescription_zh:"""
\n契贝级的改良型
\n优势
\n=耐久较高=
\n=可以打上宇宙=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=运载力:12=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“吉翁公国万岁!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:TivvayClass


displayRadius:50
radius:50

maxHp:235000
maxShield:0

@global cmdComRangeExtra=150
@global cmdDefRangeExtra=150
