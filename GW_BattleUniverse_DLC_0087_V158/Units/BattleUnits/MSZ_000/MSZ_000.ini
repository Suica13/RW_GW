\n
\nAdvantages
\n= Versatile =
\n= Well-armed =
\n= Excels in both ranged and melee combat =
\n= Can perform full-power thrust =
\nDisadvantages
\n= Expensive =
\n
\n“I don’t recall asking for the unit to be painted red…”
"""
