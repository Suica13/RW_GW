[hiddenAction_TITANS_ShieldBoostedRifle_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange  
and memory.armRBreaked==false 
and memory.TITANS_ShieldBoostedRifle_Winch_Unit.hp<=0 
and eventData("RandomWeapon",type="float")>50
"""

[hiddenAction_TITANS_ShieldBoostedRifle_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[decal_TITANS_ShieldBoostedRifle]
isVisible:if (memory.nowWeaponIndex==0 or memory.nowWeaponIndex==2) and memory.armRBreaked==false and memory.TITANS_ShieldBoostedRifle_Winch_Unit.hp<=0 




[hiddenAction_TITANS_RX_124_Kehaar2_BeamCannon_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange  
and not 
(
    memory.armRBreaked==true  
    and 
    memory.armLBreaked==true 
) 
and eventData("RandomWeapon",type="float")<=50 
and eventData("RandomWeapon",type="float")>25
"""

