    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:35
    |ProjectileTurnspeed:1.25
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:40
)
"""


[hiddenAction_GrayPhantomClass_0087_Turret_AMS_CDStart]
autoTrigger:"""
if memory.GrayPhantomClass_0087_Turret_AMS_OnCD==false 
and 
(
    (
        self.resource.GrayPhantomClass_0087_Turret_AMS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.GrayPhantomClass_0087_Turret_AMS_ShootTimer<${GrayPhantomClass_0087_Turret_AMS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:GrayPhantomClass_0087_Turret_AMS_OnCD=true,GrayPhantomClass_0087_Turret_AMS_CDTimer=self.timeAlive+${GrayPhantomClass_0087_Turret_AMS_CD}

[hiddenAction_GrayPhantomClass_0087_Turret_AMS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.GrayPhantomClass_0087_Turret_AMS_OnCD==true and self.timeAlive>memory.GrayPhantomClass_0087_Turret_AMS_CDTimer
setUnitMemory:GrayPhantomClass_0087_Turret_AMS_OnCD=false
setResourcesWithLogic:GrayPhantomClass_0087_Turret_AMS_ShootTimer=${GrayPhantomClass_0087_Turret_AMS_Shoot}

[hiddenAction_GrayPhantomClass_0087_Turret_AMS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${GrayPhantomClass_0087_Turret_AMS_EN}