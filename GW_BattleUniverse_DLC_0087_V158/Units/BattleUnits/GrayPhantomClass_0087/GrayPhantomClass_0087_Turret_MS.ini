@memory GrayPhantomClass_0087_Turret_AMS_OnCD:bool
@memory GrayPhantomClass_0087_Turret_AMS_CDTimer:float
@global GrayPhantomClass_0087_Turret_AMS_CD=12
@global GrayPhantomClass_0087_Turret_AMS_EN=12

@global GrayPhantomClass_0087_Turret_AMS_Shoot=8
[resource_GrayPhantomClass_0087_Turret_AMS_ShootTimer]
