spawnUnit:"""
Projectile_MS*1
(
    addResources=
    ShellDamage:1750
    |DpDamage:175
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
