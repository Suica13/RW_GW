[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:GrayPhantomClass_0087_Turret_AA
displayText:GrayPhantomClass_0087 AA
displayText_zh:灰色幽灵级[0087] 对空炮

maxHp: 7500

@memory GrayPhantomClass_0087_Turret_AA_OnCD:bool
@memory GrayPhantomClass_0087_Turret_AA_CDTimer:float
@global GrayPhantomClass_0087_Turret_AA_CD=2
@global GrayPhantomClass_0087_Turret_AA_EN=0.5

@global GrayPhantomClass_0087_Turret_AA_Shoot=10
[resource_GrayPhantomClass_0087_Turret_AA_ShootTimer]
hidden:true


#AA炮用

[decal_Burned]
imageScale:0.75
[decal_Stun]
imageScale:0.425
[decal_LowHp]
imageScale:0.5
[decal_Marker]
imageScale:0.25


[graphics]
drawLayer:ground



[decal_GrayPhantomClass_0087_Turret_AA]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/GrayPhantomClass_0087/Image/GrayPhantomClass_0087_Turret_AA_1.png
imageScale:0.85
basePositionFromTurret:GrayPhantomClass_0087_Turret_AA






[turret_GrayPhantomClass_0087_Turret_AA]
x:0
y:0

canShoot:true
onShoot_triggerActions:GrayPhantomClass_0087_Turret_AA_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:GrayPhantomClass_0087_Turret_AA_Projectile
resourceUsage:GrayPhantomClass_0087_Turret_AA_ShootTimer=1

delay:0.1s
canAttackMaxAngle:60
limitingAngle:120
limitingRange:600
barrelX:0
barrelY:6
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0 


shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_GrayPhantomClass_0087_Turret_AA_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0
sweepOffset:10
lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:200
    |ShellAPDamage:50
    |DpDamage:7
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1.5 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:90
    |ProjectileSpread:8
    |ProjectileLife:7.5
)
"""


[hiddenAction_GrayPhantomClass_0087_Turret_AA_CDStart]
autoTrigger:"""
if memory.GrayPhantomClass_0087_Turret_AA_OnCD==false 
and 
(
    (
        self.resource.GrayPhantomClass_0087_Turret_AA_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.GrayPhantomClass_0087_Turret_AA_ShootTimer<${GrayPhantomClass_0087_Turret_AA_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:GrayPhantomClass_0087_Turret_AA_OnCD=true,GrayPhantomClass_0087_Turret_AA_CDTimer=self.timeAlive+${GrayPhantomClass_0087_Turret_AA_CD}

[hiddenAction_GrayPhantomClass_0087_Turret_AA_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.GrayPhantomClass_0087_Turret_AA_OnCD==true and self.timeAlive>memory.GrayPhantomClass_0087_Turret_AA_CDTimer
setUnitMemory:GrayPhantomClass_0087_Turret_AA_OnCD=false
setResourcesWithLogic:GrayPhantomClass_0087_Turret_AA_ShootTimer=${GrayPhantomClass_0087_Turret_AA_Shoot}

[hiddenAction_GrayPhantomClass_0087_Turret_AA_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${GrayPhantomClass_0087_Turret_AA_EN}