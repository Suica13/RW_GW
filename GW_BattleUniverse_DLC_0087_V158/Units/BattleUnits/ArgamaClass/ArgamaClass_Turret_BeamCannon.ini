[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Pink.gw
"""

name:ArgamaClass_Turret_BeamCannon
displayText:ArgamaClass BeamCannon
displayText_zh:阿伽玛级 主炮

maxHp: 45000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory ArgamaClass_Turret_BeamCannon_OnCD:bool
@memory ArgamaClass_Turret_BeamCannon_CDTimer:float
@global ArgamaClass_Turret_BeamCannon_CD=4.5
@global ArgamaClass_Turret_BeamCannon_EN=40

@global ArgamaClass_Turret_BeamCannon_Shoot=3
[resource_ArgamaClass_Turret_BeamCannon_ShootTimer]
hidden:true


[graphics]
drawLayer:ground2


[decal_ArgamaClass_Turret_BeamCannon]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/ArgamaClass/Image/ArgamaClass_Turret_BeamCannon_1.png
imageScale:1.25
basePositionFromTurret:ArgamaClass_Turret_BeamCannon




[turret_ArgamaClass_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,ArgamaClass_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:ArgamaClass_Turret_BeamCannon_Projectile
resourceUsage:ArgamaClass_Turret_BeamCannon_ShootTimer=1

delay:0.25s
canAttackMaxAngle:15
limitingAngle:120
limitingRange:1200
barrelX:0
barrelY:18
barrelOffsetX_onOddShots:0
turnSpeed:0.75

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Pink




[projectile_ArgamaClass_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_AP_BeamRifle_Pink*1
(
    addResources=
    BeamDamage:9000
    |BeamAPDamage:4500
    |DpDamage:325
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.5
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.5
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:55
    |ProjectileSpread:4
    |ProjectileLife:50

    |ProjectileAttackTimes:2
    |ProjectileAttackTimesDamageModifier:0.5
)
"""


[hiddenAction_ArgamaClass_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.ArgamaClass_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.ArgamaClass_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.ArgamaClass_Turret_BeamCannon_ShootTimer<${ArgamaClass_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:ArgamaClass_Turret_BeamCannon_OnCD=true,ArgamaClass_Turret_BeamCannon_CDTimer=self.timeAlive+${ArgamaClass_Turret_BeamCannon_CD}

[hiddenAction_ArgamaClass_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.ArgamaClass_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.ArgamaClass_Turret_BeamCannon_CDTimer
setUnitMemory:ArgamaClass_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:ArgamaClass_Turret_BeamCannon_ShootTimer=${ArgamaClass_Turret_BeamCannon_Shoot}

[hiddenAction_ArgamaClass_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${ArgamaClass_Turret_BeamCannon_EN}