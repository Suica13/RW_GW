
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Building/Common_AutoProduce.ini,
ROOT:Units/Buildings/HQ/Mod/HQ.ini
"""


isBuilder:true
canRepairBuildings:false


nanoRange: 10000
nanoBuildSpeed:1


showInEditor:false


@memory secTimer:float
@memory genCD:float
@memory autoTechTimer:float


[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
Check_autoTechTimer,
Check_Gen
"""


[hiddenAction_Check_autoTechTimer]
requireConditional:if self.timeAlive>memory.secTimer
setUnitMemory:"""
secTimer=self.timeAlive+1,
autoTechTimer=memory.autoTechTimer+1
"""

[hiddenAction_Check_Gen]
requireConditional:if self.timeAlive>memory.genCD
setUnitMemory:genCD=self.timeAlive+1
alsoTriggerAction:"""
Gen_Money,
Gen_Resource,
Gen_TechPoint,
Gen_Zero,

Get_Money,
Get_Resource,
Get_TechPoint,
Get_WarLevel,
Zero_Money,
Zero_Resource,
Zero_TechPoint,
Check_MpMax
"""
[hiddenAction_Gen_Money]
setResourcesWithLogic:"""
MoneyGen=
(
    60
    +select(self.globalTeamTags(includes='HQ_ResGenLv2'),15,0) 
    +self.numberOfUnitsInTeam(withTag='Refinery_T1')*3.0 
    +self.numberOfUnitsInTeam(withTag='Refinery_T2')*4.5  
    +self.numberOfUnitsInTeam(withTag='Refinery_T3')*6.0 
    +self.numberOfUnitsInTeam(withTag='Refinery_T4')*8.0  
    +self.numberOfUnitsInTeam(withTag='Refinery_T5')*10.0  
    +self.numberOfUnitsInTeam(withTag='Refinery_T6')*15.0  
    +self.numberOfUnitsInTeam(withTag='Refinery_T7')*20.0  
    -select(self.isControlledByAI()==true,0,self.resource().Mp*0.5)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='Factory_T1')*1)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='BuildingTurret_T1')*0.5)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='BuildingTurret_T2')*1)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='SupplyDepot_T1')*1)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='Institute_T1')*2)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='Institute_T2')*3)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='Academy_T1')*2)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='Academy_T2')*4)
)
*memory.resX
*select(self.resource().Mp>self.resource().MpMax,0.5,1)
*select(memory.captured==true,0.75,1)
*select(self.isControlledByAI()==true,2,1)
*select
(
    self.resource().AIHard<=1,
    1,
    select
    (
        self.resource().AIHard>=1.4 and self.resource().AIHard<1.8,
        1.5,
        select
        (
            self.resource().AIHard>=1.8 and self.resource().AIHard<3.7,
            1.75,
            2.5
        )
    )
)
"""
[hiddenAction_Gen_Resource]
setResourcesWithLogic:"""
ResourceGen=
(
    60 
    +select(self.globalTeamTags(includes='HQ_ResGenLv2'),15,0) 
    +self.numberOfUnitsInTeam(withTag='Refinery_T1')*3.0 
    +self.numberOfUnitsInTeam(withTag='Refinery_T2')*4.5 
    +self.numberOfUnitsInTeam(withTag='Refinery_T3')*6.0  
    +self.numberOfUnitsInTeam(withTag='Refinery_T4')*9.0  
    +self.numberOfUnitsInTeam(withTag='Refinery_T5')*12.0  
    +self.numberOfUnitsInTeam(withTag='Refinery_T6')*15.0  
    +self.numberOfUnitsInTeam(withTag='Refinery_T7')*20.0  
    -select(self.isControlledByAI()==true,0,self.resource().Mp*0.5)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='Institute_T1')*4)
    -select(self.isControlledByAI()==true,0,self.numberOfUnitsInTeam(withTag='Institute_T2')*6)
)
*memory.resX
*select(self.resource().Mp>self.resource().MpMax,0.5,1)
*select(memory.captured==true,0.75,1)
*select(self.isControlledByAI()==true,2,1)
*select
(
    self.resource().AIHard<=1,
    1,
    select
    (
        self.resource().AIHard>=1.4 and self.resource().AIHard<1.8,
        1.5,
        select
        (
            self.resource().AIHard>=1.8 and self.resource().AIHard<3.7,
            1.75,
            2.5
        )
    )
)
"""
[hiddenAction_Gen_TechPoint]
setResourcesWithLogic:"""
TechPointGen=
(
    7.5 
    +select(self.globalTeamTags(includes='HQ_TechGenLv2'),1.0,0) 
    +self.numberOfUnitsInTeam(withTag='Institute_T1')*0.75
    +self.numberOfUnitsInTeam(withTag='Institute_T2')*1
)
*memory.techX
*select
(
    self.isControlledByAI()==true,
    0.75,
    1
)
*select
(
    self.resource().AIHard<=1,
    1,
    select
    (
        self.resource().AIHard>=1.4 and self.resource().AIHard<1.8,
        1.1,
        select
        (
            self.resource().AIHard>=1.8 and self.resource().AIHard<3.7,
            1.25,
            1.35
        )
    )
)
"""
[hiddenAction_Gen_Zero]
setResourcesWithLogic:"""
MoneyGen=select(self.resource().MoneyGen>0,self.resource().MoneyGen,0),
ResourceGen=select(self.resource().ResourceGen>0,self.resource().ResourceGen,0),
TechPointGen=select(self.resource().TechPointGen>0,self.resource().TechPointGen,0)
"""

[hiddenAction_Get_Money]
setResourcesWithLogic:"""
Money=self.resource().Money
+
(
    self.resource().MoneyGen
)
"""
[hiddenAction_Get_Resource]
setResourcesWithLogic:"""
Resource=self.resource().Resource
+
(
    self.resource().ResourceGen
)
"""
[hiddenAction_Get_TechPoint]
setResourcesWithLogic:"""
TechPoint=self.resource().TechPoint
+
(
    self.resource().TechPointGen
)
"""
[hiddenAction_Get_WarLevel]
setResourcesWithLogic:"""
WarLevel=
self.resource().WarLevel
+1
*memory.resX
*select
(
    self.numberOfUnitsInAllyTeam(withTag="StrategicLocation")+self.numberOfUnitsInTeam(withTag="StrategicLocation")
    <=
    self.numberOfUnitsInEnemyTeam(withTag="StrategicLocation")-2,
    1.1,
    1
)
*select(memory.captured==true,2,1)
"""

[hiddenAction_Zero_Money]
requireConditional:if self.resource().Money<0
setResourcesWithLogic:"""
Money=0
"""
[hiddenAction_Zero_Resource]
requireConditional:if self.resource().Resource<0
setResourcesWithLogic:"""
Resource=0
"""
[hiddenAction_Zero_TechPoint]
requireConditional:if self.resource().TechPoint<0
setResourcesWithLogic:"""
TechPoint=0
"""

[hiddenAction_Check_MpMax]
setResourcesWithLogic:"""
MpMax=
(
    memory.mpStart
    +(self.numberOfUnitsInTeam(withTag='SupplyDepot_T1')*9)
)
*memory.mpX
*select(memory.captured==true,0.75,1)
"""






[action_BuyRes]
pos:10

text:Buy 2000 Res
text_zh:购买2000物资


highPriorityQueue:true
allowMultipleInQueue: true
ai_isDisabled:true
displayType:action
iconImage:ROOT:Resource/Image/System/Resources/Resource.png
playSoundToPlayer:ROOT:Resource/Sound/SE/System/Button/Info_4.ogg:0.75
buildSpeed:1s
isVisible:true
price: Money=3000
setResourcesWithLogic:Resource=self.resource().Resource+2000
[hiddenAction_BuyRes_ByAI]
autoTrigger:if self.isControlledByAI()==true and self.resource().Money>self.resource().Resource*2.5 and self.resource().Money>12000
setResourcesWithLogic:Money=self.resource().Money-2000
alsoTriggerAction:BuyRes

[action_BuyMoney]
@copyFromSection:action_BuyRes
text:Buy 2000 Money
text_zh:购买2000资金
iconImage:ROOT:Resource/Image/System/Resources/Money.png
price: Resource=3000
setResourcesWithLogic:Money=self.resource().Money+2000
[hiddenAction_BuyMoney_ByAI]
autoTrigger:if self.isControlledByAI()==true and self.resource().Resource>self.resource().Money*2.5 and self.resource().Resource>12000
setResourcesWithLogic:Resource=self.resource().Resource-2000
alsoTriggerAction:BuyMoney











[core]
@memory captured:bool
@memory captureTimer:float
@global captureTimerMax=500

[hiddenAction_CheckCapture]
autoTrigger:true
alsoTriggerAction:"""
CheckCaptureBar_Normal,
CheckCaptureBar_Captured,
CheckCaptureBarZero_Normal,
CheckCaptureBarZero_Captured,

CheckCaptureBar_Tag_T,
CheckCaptureBar_Tag_F,

CheckCaptureBar_HasEnemy,

CheckCaptureBar_Lose
"""

[hiddenAction_CheckCaptureBar_Normal]
requireConditional:if memory.captured==false
setUnitMemory:"""
captureTimer=select
(
    memory.captureTimer>=0,
    select
    (
        numberOfUnitsInEnemyTeam(withTag="CanCaptureUnit",withinrange=200)>0,
        select
        (
            (
                numberOfUnitsInAllyNotOwnTeam(withTag="CanCaptureUnit",withinrange=200)>0 or numberOfUnitsInTeam(withTag='CanCaptureUnit',withinrange=200)>0 
                or 
                numberOfUnitsInAllyNotOwnTeam(withTag="BuildingTurret",withinrange=200)>0 or numberOfUnitsInTeam(withTag='BuildingTurret',withinrange=200)>0 
            ),
            memory.captureTimer,
            memory.captureTimer-0.2
        ),
        select
        (
            memory.captureTimer<${captureTimerMax},
            (
                memory.captureTimer+0.1
            ),
            ${captureTimerMax}
        )
    ),
    0
)
"""
[hiddenAction_CheckCaptureBar_Captured]
requireConditional:if memory.captured==true
setUnitMemory:"""
captureTimer=select
(
    memory.captureTimer>=0,
    select
    (
        numberOfUnitsInAllyNotOwnTeam(withTag="CanCaptureUnit",withinrange=200)>0 or numberOfUnitsInTeam(withTag='CanCaptureUnit',withinrange=200)>0,
        select
        (
            (
                numberOfUnitsInEnemyTeam(withTag="CanCaptureUnit",withinrange=200)>0
            ),
            memory.captureTimer,
            memory.captureTimer+0.3
        ),
        select
        (
            memory.captureTimer<${captureTimerMax},
            (
                memory.captureTimer-0.1
            ),
            ${captureTimerMax}
        )
    ),
    0
)
"""
[hiddenAction_CheckCaptureBarZero_Normal]
requireConditional:"""
if memory.captureTimer<=0 
and memory.captured==false   
and self.numberOfUnitsInEnemyTeam(withTag="CanCaptureUnit",withinrange=200)>0 
and self.numberOfUnitsInAllyNotOwnTeam(withTag="CanCaptureUnit",withinrange=200)<1 
and self.numberOfUnitsInTeam(withTag="CanCaptureUnit",withinrange=200)<1
"""
#spawnEffects:Light_100
setResourcesWithLogic:"""
Money=self.resource().Money*0.5,
Resource=self.resource().Resource*0.5
"""
setUnitMemory:"""
captured=true,
captureTimer=0
"""
showMessageToAllPlayers:%{self.playerName}'s Base has been captured!
showMessageToAllPlayers_zh:%{self.playerName}的基地被镇压了!
[hiddenAction_CheckCaptureBarZero_Captured]
requireConditional:"""
if memory.captureTimer>=${captureTimerMax} 
and memory.captured==true   
and self.numberOfUnitsInEnemyTeam(withTag="CanCaptureUnit",withinrange=200)<1 
and 
(
    self.numberOfUnitsInAllyNotOwnTeam(withTag="CanCaptureUnit",withinrange=200)>0 
    or 
    self.numberOfUnitsInTeam(withTag="CanCaptureUnit",withinrange=200)>0
)
"""
#spawnEffects:Light_100
setUnitMemory:"""
captured=false,
captureTimer=${captureTimerMax}
"""
showMessageToAllPlayers:%{self.playerName}'s Base has been recover!
showMessageToAllPlayers_zh:%{self.playerName}的基地已经恢复运转!


[hiddenAction_CheckCaptureBar_Tag_T]
requireConditional:"""
if memory.captured==true and self.tags(includes='HQ_NotCaptured')
"""
temporarilyRemoveTags:HQ_NotCaptured
[hiddenAction_CheckCaptureBar_Tag_F]
requireConditional:"""
if memory.captured==false and not self.tags(includes='HQ_NotCaptured')
"""
temporarilyAddTags:HQ_NotCaptured


[hiddenAction_CheckCaptureBar_Lose]
requireConditional:"""
if 
(
    self.numberOfUnitsInTeam(withTag="HQ_NotCaptured")
    +
    self.numberOfUnitsInAllyNotOwnTeam(withTag="HQ_NotCaptured")
)<=0
"""
setResourcesWithLogic:hp=-1



[hiddenAction_CheckCaptureBar_HasEnemy]
requireConditional:"""
if memory.captured==false 
and self.numberOfUnitsInEnemyTeam(withTag="CanCaptureUnit",withinrange=200)>0
"""
sendMessageTo:memory.cvMarker.readUnitMemory('cvUnit',type='unit')
sendMessageWithTags:Play_BaseUnderAttack


