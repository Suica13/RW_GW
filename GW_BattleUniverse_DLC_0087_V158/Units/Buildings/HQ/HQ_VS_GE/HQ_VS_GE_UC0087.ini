
[core]
copyFrom:"""
ROOT:Units/Buildings/HQ/Mod/HQ.ini
"""
overrideAndReplace:HQ_VS_GE_UC0087
name: HQ_VS_GE_UC0087


@memory aiChoseFactionStep:float
@memory aiChoseFactionIndex:float
@memory aiChoseFactionCD:float
@memory aiChoseFactionRandom:float


[hiddenAction_ChoseFaction_ByAI]
autoTrigger:if self.isControlledByAI()==true and self.resource().FactionIndex==0
alsoTriggerAction:"""
ChoseFaction_ByAI_Step1,
ChoseFaction_ByAI_Step0
"""

[hiddenAction_ChoseFaction_ByAI_Step0]
requireConditional:if memory.aiChoseFactionStep==0
alsoTriggerAction:"""
ChoseFaction_ByAI_PlayerItsAEUG_Step0,
ChoseFaction_ByAI_PlayerItsTITANS_Step0,
ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step0
"""

[hiddenAction_ChoseFaction_ByAI_PlayerItsAEUG_Step0]
requireConditional:if numberOfUnitsInAllTeams(withTag="AEUG_0087")>0
setUnitMemory:aiChoseFactionStep=1,aiChoseFactionIndex=1,aiChoseFactionCD=self.timeAlive+1+(self.teamID/2)
[hiddenAction_ChoseFaction_ByAI_PlayerItsTITANS_Step0]
requireConditional:if numberOfUnitsInAllTeams(withTag="TITANS_0087")>0
setUnitMemory:aiChoseFactionStep=1,aiChoseFactionIndex=2,aiChoseFactionCD=self.timeAlive+1+(self.teamID/2)
[hiddenAction_ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step0]
requireConditional:if numberOfUnitsInAllTeams(withTag="NEO_ZEON_0087")>0
setUnitMemory:aiChoseFactionStep=1,aiChoseFactionIndex=3,aiChoseFactionCD=self.timeAlive+1+(self.teamID/2)




[hiddenAction_ChoseFaction_ByAI_Step1]
requireConditional:if memory.aiChoseFactionStep==1 and self.timeAlive>memory.aiChoseFactionCD
alsoTriggerAction:"""
ChoseFaction_ByAI_PlayerItsAEUG_Step1,
ChoseFaction_ByAI_PlayerItsTITANS_Step1,
ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1
"""
setUnitMemory:aiChoseFactionRandom=int(rnd(0,100))


[hiddenAction_ChoseFaction_ByAI_PlayerItsAEUG_Step1]
requireConditional:if memory.aiChoseFactionIndex==1
alsoTriggerAction:"""
ChoseFaction_ByAI_PlayerItsAEUG_Step1_AEUG,
ChoseFaction_ByAI_PlayerItsAEUG_Step1_B
"""
[hiddenAction_ChoseFaction_ByAI_PlayerItsAEUG_Step1_AEUG]
requireConditional:if numberOfUnitsInAllyTeam(withTag="AEUG_0087")>0
alsoTriggerAction:ChoseFaction_AEUG_0087
setUnitMemory:aiChoseFactionStep=2
[hiddenAction_ChoseFaction_ByAI_PlayerItsAEUG_Step1_B]
requireConditional:if numberOfUnitsInAllyTeam(withTag="AEUG_0087")<=0
alsoTriggerAction:"""
ChoseFaction_ByAI_PlayerItsAEUG_Step1_B_TITANS,
ChoseFaction_ByAI_PlayerItsAEUG_Step1_B_NEO_ZEON
"""
setUnitMemory:aiChoseFactionStep=2
[hiddenAction_ChoseFaction_ByAI_PlayerItsAEUG_Step1_B_TITANS]
requireConditional:if memory.aiChoseFactionRandom>=30
alsoTriggerAction:ChoseFaction_TITANS_0087
[hiddenAction_ChoseFaction_ByAI_PlayerItsAEUG_Step1_B_NEO_ZEON]
requireConditional:if memory.aiChoseFactionRandom<30
alsoTriggerAction:ChoseFaction_NEO_ZEON_0087



[hiddenAction_ChoseFaction_ByAI_PlayerItsTITANS_Step1]
requireConditional:if memory.aiChoseFactionIndex==2
alsoTriggerAction:"""
ChoseFaction_ByAI_PlayerItsTITANS_Step1_TITANS,
ChoseFaction_ByAI_PlayerItsTITANS_Step1_B
"""
[hiddenAction_ChoseFaction_ByAI_PlayerItsTITANS_Step1_TITANS]
requireConditional:if numberOfUnitsInAllyTeam(withTag="TITANS_0087")>0
alsoTriggerAction:ChoseFaction_TITANS_0087
setUnitMemory:aiChoseFactionStep=2
[hiddenAction_ChoseFaction_ByAI_PlayerItsTITANS_Step1_B]
requireConditional:if numberOfUnitsInAllyTeam(withTag="TITANS_0087")<=0
alsoTriggerAction:"""
ChoseFaction_ByAI_PlayerItsTITANS_Step1_B_AEUG,
ChoseFaction_ByAI_PlayerItsTITANS_Step1_B_NEO_ZEON
"""
setUnitMemory:aiChoseFactionStep=2
[hiddenAction_ChoseFaction_ByAI_PlayerItsTITANS_Step1_B_AEUG]
requireConditional:if memory.aiChoseFactionRandom>=30
alsoTriggerAction:ChoseFaction_AEUG_0087
[hiddenAction_ChoseFaction_ByAI_PlayerItsTITANS_Step1_B_NEO_ZEON]
requireConditional:if memory.aiChoseFactionRandom<30
alsoTriggerAction:ChoseFaction_NEO_ZEON_0087



[hiddenAction_ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1]
requireConditional:if memory.aiChoseFactionIndex==3
alsoTriggerAction:"""
ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1_NEO_ZEON,
ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1_B
"""
[hiddenAction_ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1_NEO_ZEON]
requireConditional:if numberOfUnitsInAllyTeam(withTag="NEO_ZEON_0087")>0
alsoTriggerAction:ChoseFaction_NEO_ZEON_0087
setUnitMemory:aiChoseFactionStep=2
[hiddenAction_ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1_B]
requireConditional:if numberOfUnitsInAllyTeam(withTag="NEO_ZEON_0087")<=0
alsoTriggerAction:"""
ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1_B_AEUG,
ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1_B_TITANS
"""
setUnitMemory:aiChoseFactionStep=2
[hiddenAction_ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1_B_AEUG]
requireConditional:if memory.aiChoseFactionRandom>=50
alsoTriggerAction:ChoseFaction_AEUG_0087
[hiddenAction_ChoseFaction_ByAI_PlayerItsNEO_ZEON_Step1_B_TITANS]
requireConditional:if memory.aiChoseFactionRandom<50
alsoTriggerAction:ChoseFaction_TITANS_0087




[template_ChoseFaction]
attachments_addNewUnits:UnlockedListMarker_0087
attachments_onlyOnSlots:UnlockedListMarkerSlot



[action_ChoseFaction_Info_2]
pos:201
text:UC 0087
text_zh:宇宙世纪 0087\n格里普斯战争

[action_ChoseFaction_AEUG_0087]
@copyFromSection:template_ChoseFaction
text:AEUG[0087]
text_zh:奥古[0087]

description:"""
\n"Right now, because of the desires of a certain few,
\nEarth is on the brink of destruction!"
\n
\n"Humanity must leave Earth—
\nOtherwise, the planet will be driven to ruin by human hands!"
\n
\nAccumulate advantages through guerrilla warfare,
\nand quietly build strength while waiting for the right moment.
\n
\nThe crimes of the Titans must be exposed—
\nHumanity must protect Mother Earth from destruction with its own hands!
\n
\nDifficulty: Normal
"""
description_zh:"""
\n“现在地球由于一部分人的欲望
\n已经陷入了即将灭亡的危机!”
\n
\n“人类非得离开地球不可——
\n不这样的话,地球就会被人类之手引向毁灭!”
\n
\n在游击战中不断积累优势,
\n在暗中积蓄力量等待时机。
\n
\n提坦斯的恶行必须被揭露——
\n人类必须亲手保护地球母亲不被毁灭!
\n
\n上手难度:普通
"""

iconImage:ROOT:Resource/Image/Icon/Faction_AEUG_0087_1.png
isVisible:if (memory.readyOK==false or self.resource().FactionIndex==1020101)
playSoundToPlayer:ROOT:Resource/Sound/VC/AEUG_BKS/AEUG_BKS_Pick.ogg:2

highPriorityQueue:true
removeAllQueuedItemsWithoutRefund:true

setResourcesWithLogic:FactionIndex=1020101
temporarilyAddTags:"""
AEUG_0087,HQ_ResGen
"""
addGlobalTeamTags:"""
AEUG_0087,Tech_AEUG_0087_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2
"""







[action_ChoseFaction_TITANS_0087]
@copyFromSection:template_ChoseFaction
text:TITANS[0087]
text_zh:提坦斯[0087]

description:"""
\n"The flames of war on the battlefield are still consuming the Earth.
\nTo save the planet, those vile Spacenoids must be dealt with."
\n
\n"And to purge this incompetent Federation government—
\nWe have risen up!"
\n
\nSuppress the enemy with new mass-production units,
\nand pierce through the battlefield with cutting-edge TMS.
\n
\nEarth must be governed by our hands—
\nWe hereby declare war on Zeon and all opposition forces!
\n
\nDifficulty: Normal
"""
description_zh:"""
\n“战场的战火此刻仍在蚕食着地球
\n为了拯救地球,需要将那些污秽宇宙居民处理掉”
\n
\n“还有为了把这些无能的联邦政府肃清——
\n我们站起来了!”
\n
\n以新型量产机镇压敌军,
\n并以最先端的TMS穿插于战场。
\n
\n地球必须由我们之手进行管理——
\n我们将对吉翁与反对派进行宣战宣告!
\n
\n上手难度:普通
"""

iconImage:ROOT:Resource/Image/Icon/Faction_TITANS_0087_1.png
isVisible:if (memory.readyOK==false or self.resource().FactionIndex==1020201)
playSoundToPlayer:ROOT:Resource/Sound/VC/TITANS_JMTF_Pick/TITANS_JMTF_Pick.ogg:2

highPriorityQueue:true
removeAllQueuedItemsWithoutRefund:true

setResourcesWithLogic:FactionIndex=1020201
temporarilyAddTags:"""
TITANS_0087
"""
addGlobalTeamTags:"""
TITANS_0087,Tech_TITANS_0087_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2
"""
















[action_ChoseFaction_NEO_ZEON_0087]
@copyFromSection:template_ChoseFaction
text:NEO ZEON[0087]
text_zh:新吉翁[0087]

description:"""
\n"The future of humanity
\nshould be guided by the Spacenoids who have already grasped the power of space!"
\n
\n"We of Axis shall follow the will of Lady Mineva’s lineage—
\nFree humanity from Earth’s gravity, and pass judgment upon this war!"
\n
\nProfit from the war through diplomacy,
\nand always be ready to seize the fruits of victory!
\n
\nThe efforts we made while dwelling in the darkness of the past—
\nYou shall come to understand them!
\n
\nDifficulty: Hard
"""
description_zh:"""
\n“人类的未来
\n应该要由已经掌握宇宙力量的宇宙居民来掌握!”
\n
\n“我们阿克西斯将跟随密涅瓦大人的根源——
\n从地球的重力中将人类解放,对这场战斗降下审判!”
\n
\n利用外交在战争中获利,
\n并随时准备夺得胜利的果实!
\n
\n过去我们进入黑暗世界之中所做过的努力——
\n便让你们知道吧!
\n
\n上手难度:困难
"""

iconImage:ROOT:Resource/Image/Icon/Faction_NEO_ZEON_0087_1.png
isVisible:if (memory.readyOK==false or self.resource().FactionIndex==1020301)
playSoundToPlayer:ROOT:Resource/Sound/VC/NEO_ZEON_HAM/NEO_ZEON_HAM_Pick.ogg:2

highPriorityQueue:true
removeAllQueuedItemsWithoutRefund:true

setResourcesWithLogic:FactionIndex=1020301
temporarilyAddTags:"""
NEO_ZEON_0087
