
[core]
copyFrom:"""
ROOT:Units/Buildings/Factory/Mod/Factory.ini,
ROOT:Units/Buildings/Factory/UnitList/NEO_ZEON_0087/NEO_ZEON_0087_UnitList_Land.ini,
ROOT:Units/Buildings/Factory/UnitList/TITANS_0087/TITANS_0087_UnitList_Land.ini,
ROOT:Units/Buildings/Factory/UnitList/AEUG_0087/AEUG_0087_UnitList_Land.ini,
ROOT:Template/Building/Skill/Upgrade.gw
"""


tags:Building,SLChangeFaction,CanBeTargetUnit,CanProduceBuilding,Factory_AEUG_0087_Land,Factory,AEUG,0087
name:Factory_AEUG_0087_Land
displayText:Land Factory[AEUG][0087]
displayText_zh:陆军工厂[AEUG][0087]

footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10

maxHp: 90000

@global Money=1000
@global Resource=2000
@global buildTime=10


exit_x:0
exit_y:25
exit_moveAwayAmount:0

[hiddenAction_Building_GetDone]
temporarilyAddTags:Factory_T1



[ai]
buildPriority: 0.15
maxEachBase:3
maxGlobal:12
noneInBaseExtraPriority: 0.2
noneGlobalExtraPriority: 0.4


[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Light_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Light.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
teamColors:true
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Work_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:if self.queueSize()>0
image:ROOT:Units/Buildings/Factory/Image/Factory_1_ON.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Faction_1]
layer:beforeBody
order:2
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Resource/Image/Icon/Faction_AEUG_0087_2.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.2
xOffsetRelative:-15.5
yOffsetRelative:-9.5


[decal_Body_2]
@copyFromSection:decal_Body_1
xOffsetRelative:15.5
[decal_Light_2]
@copyFromSection:decal_Light_1
xOffsetRelative:15.5
[decal_Work_2]
@copyFromSection:decal_Work_1
xOffsetRelative:15.5
[decal_Faction_2]
@copyFromSection:decal_Faction_1
xOffsetRelative:15.5



