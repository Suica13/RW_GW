
[core]
copyFrom:"""
ROOT:Units/Buildings/Factory/Mod/Factory.ini,
ROOT:Units/Buildings/Factory/UnitList/NEO_ZEON_0087/NEO_ZEON_0087_UnitList_Mega.ini,
