[core]
dont_load:true

tags:CanProduceSlot
name:Common_BuildingSlot_Faction

@memory autoProduceCD:float

[hiddenAction_ConvertCantSelect]
autoTrigger:"""
if self.attachment(slot='Building').hp>0
"""
convertTo:Common_BuildingSlot

[hiddenAction_Get_AutoProduce]
autoTriggerOnEvent:newMessage(withTag="AutoProduce")
alsoTriggerAction:"""

"""







[template_AutoProduce]
@define AutoProduceIndexMin=0
@define AutoProduceIndexMax=0
@define UnitID=Test
@define Money=0
@define Resource=0
@define NearNumber=1
@define CanBuild=true
@define TileMode=0
@define OtherVisible= (true)

ai_isDisabled:true
requireConditional:"""
if self.attachment(slot='Building').hp<=0 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMin} 
and eventData("AutoProduceIndex",type="float")<${AutoProduceIndexMax} 
and self.resource.Money>=${Money} 
and self.resource.Resource>=${Resource} 
and self.Resource.Mp<self.Resource.MpMax 
and self.queueSize()<=0 
and numberOfUnitsInEnemyTeam(withTag="${UnitID}",withinrange=150)<${NearNumber}  
and (self.resource.TileMode==${TileMode} or ${TileMode}==99) 
and ${CanBuild} 
and ${OtherVisible} 
and self.globalTeamTags(includes='Unlock_${UnitID}') 
"""

addResources: Money=-${Money},Resource=-${Resource}






[template_Build_Factory]
@define UnitID=Test
@define Money=0
@define Resource=0
@define TechPoint=0
@define TileMode=0
@define OtherVisible= (true)


textAddUnitName:${UnitID}
descriptionAddFromUnit:${UnitID}
unitShownInUI:${UnitID}

allowMultipleInQueue:false

buildSpeed:1s
price:Money=${Money},Resource=${Resource},TechPoint=${TechPoint}
refundAllQueuedItems:true
ai_isDisabled:true

isLocked:if self.attachment(slot='Building').hp>0
isLockedMessage:Has Building
isLockedMessage_zh:已存在建筑

isLockedAlt:if self.resource.TileMode!=${TileMode} and ${TileMode}!=99
isVisible:if (self.resource.TileMode==${TileMode} or ${TileMode}==99) and self.globalTeamTags(includes='Unlock_${UnitID}') and ${OtherVisible}

attachments_onlyOnSlots:Building
attachments_addNewUnits:${UnitID}

setResourcesWithLogic:"""
Money=select
(
    self.isControlledByAI(),
    self.resource.Money-${Money},
    self.resource.Money
),
Resource=select
(
    self.isControlledByAI(),
    self.resource.Resource-${Resource},
    self.resource.Resource
),
TechPoint=select
(
    self.isControlledByAI(),
    self.resource.TechPoint,
    self.resource.TechPoint
)
"""








[decal_Slot]
layer:shadow
order:1
onlyWhileAlive:true
onlyTeam:own
isVisible:true
alpha:0.45
imageScale:0.15
image:ROOT:Units/Buildings/BuildingSlot/Image/BuildSlot_1.png



[decal_Text]
layer:beforeUI
order:3
onlyWhileAlive:true
onlyTeam:own
alpha:1
image:ROOT:Resource/Image/Text/Tips/Tip_BuildSlot_Small_1.png
imageScale:0.4
xOffsetAbsolute:0
yOffsetAbsolute:31
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.resource.GameStart==1
