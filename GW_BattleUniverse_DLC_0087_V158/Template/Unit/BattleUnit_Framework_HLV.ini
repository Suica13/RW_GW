
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Unit/BattleUnit_Framework.ini
"""

borrowResourcesWhileAlive:Mp=-1
transportSlotsNeeded:99

disableAllUnitCollisions:true


@global deadTargetHeight=-1000




[action_Set_AttackMode_Shoot]
autoTrigger:false
isLocked:true
isLockedMessage:No Allow To Change
isLockedMessage_zh:不允许切换

[action_Set_AttackMode_Cqb]
autoTrigger:false
isLocked:true
isLockedMessage:No Allow To Change
isLockedMessage_zh:不允许切换

[hiddenAction_BattleUnitCore_Spawn]
attachments_addNewUnits:BattleUnitCore_Aircraft

[hiddenAction_Start]
temporarilyAddTags:CanBeTargetUnit,CanLoadIntoAir,CanSupplyUnit

[hiddenAction_Check_CanCaptureUnit_True]
requireConditional:if false
[hiddenAction_Check_CanCaptureUnit_False]
requireConditional:"""
if self.hasTags(includes='CanCaptureUnit')
"""



[hiddenAction_Check_FinalHeight]
setUnitMemory:"""
finalHeight=select
(
    self.resource.TileMode==0,
    select
    (
        memory.battleUnitCore.readUnitMemory(name="tileType", type="float")==2,
        select(memory.flyUnit==1 or memory.hoverUnit==1,select(memory.pilotUnit!=null,select(self.hp>0,memory.baseHeight,select(memory.baseHeight>10,${deadTargetHeight},1)),-20),-20),
        select(memory.pilotUnit!=null,select(self.hp>0,memory.baseHeight,select(memory.baseHeight>10,${deadTargetHeight},1)),1)
    ),
    3
)
"""


[hiddenAction_AutoDelWwayPoint]
autoTrigger:"""
if self.hasActiveWaypoint(type="attackMove") 
and self.attacking.hp>0
"""
clearActiveWaypoint:true

[hiddenAction_TryAttack]
autoTrigger:"""
if self.attacking!=null and ${onAttacking}==false and ${cantAction}==false and ${onSkill}==false   
and not self.hasActiveWaypoint(type="build") 
and not self.hasActiveWaypoint(type="repair") 
and 
select
(
    self.parent.hp>0,
    select(self.parent.hasTags(includes='inVehicleCanAttack'),true,false),
    true
)
"""
sendMessageTo:self
sendMessageWithTags:Attack
sendMessageWithData:RandomWeapon=rnd(0,100)


[action_UnloadPilot]
#setResourcesWithLogic:hp=select(self.speed>self.maxMoveSpeed*0.5,self.hp-self.maxHp*0.25,self.hp)


[hiddenAction_Set_Get_PlayMoveAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayMoveReversingAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayGuardAnimation]
requireConditional:false
playAnimation:IGNORE

[movement]

movementType: AIR
moveSpeed: 1
maxTurnSpeed: 1

moveAccelerationSpeed: 0.1
moveDecelerationSpeed: 0.035
reverseSpeedPercentage:0.0

turnAcceleration: 5

heightChangeRate:1.5
targetHeightDrift:0
targetHeight:1

moveSlidingMode:false
moveSlidingDir:360
moveIgnoringBody:false

joinsGroupFormations:true

[graphics]
drawLayer:air








[core]

@memory attackEnemyBaseTimer:float
@memory allSL:unit[]
@memory targetSL:unit[]
@memory nearsetTargetSL:unit
@memory aiCheckTargetSLTimer:float


[hiddenAction_BattleUnit_AI]
autoTrigger:true
requireConditional:"""
if self.isControlledByAI()==true 
"""
alsoTriggerAction:"""
AI_CheckEnemyBase
"""


[hiddenAction_AI_CheckEnemyBase]
requireConditional:"""
if self.timeAlive>memory.aiCheckTargetSLTimer 
"""
setUnitMemory:"""
aiCheckTargetSLTimer=self.timeAlive+5
"""
alsoTriggerAction:"""
AI_CheckTargetSL
"""


#据点
[hiddenAction_AI_CheckAllSL]
autoTriggerOnEvent:created
takeResources_includeUnitsWithinRange:30000
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:StrategicLocation
takeResources_searchOnly:true
takeResources_maxUnits:100
takeResources_triggerActionForEach:AI_CheckAllSL_Step2
[hiddenAction_AI_CheckAllSL_Step2]
setUnitMemory:"""
allSL[memory.allSL.size]=thisActionTarget
"""

[hiddenAction_AI_CheckTargetSL]
requireConditional:"""
if ${onSkill}==false and ${cantAction}==false 
"""
setUnitMemory:"""
TargetSL=null,
nearsetTargetSL=null
"""
alsoTriggerAction:AI_CheckTargetSL_Step2
alsoTriggerActionRepeat:memory.allSL.size
[hiddenAction_AI_CheckTargetSL_Step2]
requireConditional:"""
if 
select
(
    self.resource().TileMode==0,
    select(memory.allSL[index].resource().TileMode==1,true,false),
    select(memory.allSL[index].resource().TileMode==0,true,false)
)
"""
setUnitMemory:"""
TargetSL[memory.TargetSL.size]=memory.allSL[index]
"""
alsoTriggerAction:AI_CheckTargetSL_Step3
alsoTriggerActionRepeat:memory.TargetSL.size
[hiddenAction_AI_CheckTargetSL_Step3]
requireConditional:"""
if index==0 or 
(
    distanceBetween(self, memory.TargetSL[index])<distanceBetween(self, memory.nearsetTargetSL)
)
"""
setUnitMemory:"""
nearsetTargetSL=memory.TargetSL[index]
"""




[decal_nearsetEnemySL_DrawLineToTarget]
layer:shadow
onlyTeam:own
order:1
alpha:0.5
drawLineTo:memory.nearsetTargetSL
color:#26ffe6
imageScale:0.25
lineWidth:2
xOffsetRelative: 0
yOffsetRelative: 0
onlyOnNonPreview:true
isVisible:if false
onlyWhileAlive:true