
[core]
dont_load:true

@memory findEnemy_ByAICD:float
@memory findSupplyPoint_ByAICD:float

@memory AILowEN:bool

[hiddenAction_BattleUnit_AI]
autoTrigger:true
requireConditional:"""
if self.isControlledByAI()==true 
"""
alsoTriggerAction:"""
RecoveEN_ByAI,
AI_CheckLowEN_T,
AI_CheckLowEN_F,
FindSupplyPoint_ByAI,
FindEnemy_ByAI
"""

[hiddenAction_RecoveEN_ByAI]
requireConditional:"""
if self.resource().AIHard>=1.8 
and not self.hasTags(includes='inBattle')
"""
setResourcesWithLogic:EN=self.resource().EN+memory.moveHightSpeedModeUseEN
[hiddenAction_AI_CheckLowEN_T]
requireConditional:"""
if memory.AILowEN==false and self.resource().EN<=memory.enMax*0.25
"""
setUnitMemory:"""
AILowEN=true
"""
[hiddenAction_AI_CheckLowEN_F]
requireConditional:"""
if memory.AILowEN==true and self.resource().EN>=memory.enMax*0.75
"""
setUnitMemory:"""
AILowEN=false
"""
alsoTriggerAction:AI_CheckLowEN_F_Step2
[hiddenAction_AI_CheckLowEN_F_Step2]
setUnitMemory:"""
attackMode=0
"""

[hiddenAction_FindSupplyPoint_ByAI]
requireConditional:"""
if 
(
    self.attacking.hp<=0 
    and self.resource.GameStart==1 
    and not self.hasActiveWaypoint(type="loadInto") 
    and not self.hasActiveWaypoint(type="attack") 
    and not self.hasActiveWaypoint(type="attackMove") 
    and not self.hasActiveWaypoint(type="touchTarget") 
    and ${onAttacking}==false 
    and self.timeAlive>memory.findSupplyPoint_ByAICD 
    and memory.AILowEN==true
)
"""
setUnitMemory:findSupplyPoint_ByAICD=self.timeAlive+3
alsoTriggerAction:FindSupplyPoint_ByAI_Step2
[hiddenAction_FindSupplyPoint_ByAI_Step2]
requireConditional:"""
if activeWaypointTarget.getOffsetRelative().numberOfUnitsInTeam(withTag="SupplyPoint",withinrange=150)<=0 
and activeWaypointTarget.getOffsetRelative().numberOfUnitsInAllyNotOwnTeam(withTag="SupplyPoint",withinrange=150)<=0 
"""
addWaypoint_prepend:true
addWaypoint_target_nearestUnit_maxRange:30000
addWaypoint_target_nearestUnit_team:ally
addWaypoint_target_nearestUnit_tagged:SupplyPoint
addWaypoint_target_mapMustBeReachable:true
addWaypoint_type:move



[hiddenAction_FindEnemy_ByAI]
requireConditional:"""
if 
(
    self.attacking.hp<=0 
    and self.timeAlive>1 
    and self.resource.GameStart==1 
    and not self.hasActiveWaypoint(type="loadInto") 
    and not self.hasActiveWaypoint(type="attack") 
    and not self.hasActiveWaypoint(type="attackMove") 
    and not self.hasActiveWaypoint(type="touchTarget") 
    and self.timeAlive>memory.findEnemy_ByAICD 
    and memory.AILowEN==false 
)
"""
setUnitMemory:findEnemy_ByAICD=self.timeAlive+3
alsoTriggerAction:"""
FindEnemyUnit_ByAI,
FindEnemySL_ByAI,
FindEnemyHQ_ByAI
"""

[hiddenAction_FindEnemyUnit_ByAI]
requireConditional:"""
if activeWaypointTarget.getOffsetRelative().numberOfUnitsInEnemyTeam(withTag="CanBeTargetUnit",withinrange=150)<=0 
"""
alsoTriggerAction:"""
FindEnemyUnit_ByAI_Normal
"""
[hiddenAction_FindEnemyUnit_ByAI_Normal]
requireConditional:"""
if (not self.tags(includes="CanCaptureUnit") or self.tags(includes="NavyUnit"))
"""
addWaypoint_prepend:true
addWaypoint_target_nearestUnit_maxRange:30000
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_tagged:CanBeTargetUnit
addWaypoint_target_mapMustBeReachable:true
addWaypoint_type:attackMove




[hiddenAction_FindEnemySL_ByAI]
requireConditional:"""
if 
self.numberOfUnitsInEnemyTeam(withTag="StrategicLocation")>0  
and activeWaypointTarget.getOffsetRelative().numberOfUnitsInEnemyTeam(withTag="StrategicLocation",withinrange=150)<=0 
and self.tags(includes="CanCaptureUnit") 
"""
addWaypoint_prepend:true
addWaypoint_target_nearestUnit_maxRange:30000
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_tagged:StrategicLocation
addWaypoint_target_mapMustBeReachable:true
addWaypoint_type:attackMove
alsoTriggerAction:FindEnemySL_ByAI_Step2
[hiddenAction_FindEnemySL_ByAI_Step2]
addWaypoint_target_fromReference:activeWaypointTarget.getOffsetRelative(x=rnd(-150,150),y=rnd(-150,150))
addWaypoint_prepend:true
addWaypoint_target_mapMustBeReachable:true
addWaypoint_type:attackMove




[hiddenAction_FindEnemyHQ_ByAI]
requireConditional:"""
if 
self.numberOfUnitsInEnemyTeam(withTag="StrategicLocation")<=0  
and activeWaypointTarget.getOffsetRelative().numberOfUnitsInEnemyTeam(withTag="HQ_NotCaptured",withinrange=250)<=0 
and self.tags(includes="CanCaptureUnit") 
"""
addWaypoint_prepend:true
addWaypoint_target_nearestUnit_maxRange:30000
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_tagged:HQ_NotCaptured
addWaypoint_target_mapMustBeReachable:true
addWaypoint_type:attackMove

