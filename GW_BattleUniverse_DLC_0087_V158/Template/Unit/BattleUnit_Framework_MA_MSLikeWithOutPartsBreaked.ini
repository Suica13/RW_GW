
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Unit/BattleUnit_Framework.ini,
ROOT:Resource/Image/Fx/Common/Common_Explosion_MA_1.gw,
ROOT:Resource/Image/Fx/Common/Common_LargeUnitDie_1.gw
"""

borrowResourcesWhileAlive:Mp=-3
transportSlotsNeeded:3


disableAllUnitCollisions:true


[hiddenAction_BattleUnitCore_Spawn]
attachments_addNewUnits:BattleUnitCore_MS



[hiddenAction_Set_Get_PlayNoPilotIdleAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayNoPilotIdleAnimation")
playAnimation:NoPilotIdle

[hiddenAction_Set_Get_PlayStartEffect]
spawnEffects:Effect_ExhaustGas_Double_1,StartLight_1
playSoundToPlayer:ROOT:Resource/Sound/SE/Unit/MS_Start_1.ogg:0.5
[hiddenAction_Set_Get_PlayCloseEffect]
playSoundToPlayer:ROOT:Resource/Sound/SE/Unit/MS_Down_1.ogg:0.5






[hiddenAction_StopAnimationWhenGetWayPointOnIdle]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional:"""
if memory.BattleUnitCore.readUnitMemory("onAttacking",type="bool")==false 
"""
stopLastAnimation:true



[hiddenAction_Set_Get_PlayMoveAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayMoveAnimation")
playAnimation:IGNORE
alsoTriggerAction:Set_Get_PlayMoveAnimation_Walk,Set_Get_PlayMoveAnimation_Boost
[hiddenAction_Set_Get_PlayMoveAnimation_Walk]
requireConditional:if memory.moveMode==0 and memory.flyUnit==0 and self.resource().tileMode==0
playAnimationIfNotPlaying:OnMovingWalk
[hiddenAction_Set_Get_PlayMoveAnimation_Boost]
requireConditional:if memory.moveMode==1 or memory.flyUnit==1 or self.resource().tileMode==1
playAnimation:OnMoving
[hiddenAction_Set_Get_PlayGuardAnimation]
requireConditional:if false




[hiddenAction_Set_Get_PlayMoveReversingAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayMoveReversingAnimation")
playAnimation:IGNORE
alsoTriggerAction:Set_Get_PlayMoveReversingAnimation_Walk,Set_Get_PlayMoveReversingAnimation_Boost
[hiddenAction_Set_Get_PlayMoveReversingAnimation_Walk]
requireConditional:if memory.moveMode==0 and memory.flyUnit==0 and self.resource().tileMode==0
playAnimationIfNotPlaying:OnMovingWalk
[hiddenAction_Set_Get_PlayMoveReversingAnimation_Boost]
requireConditional:if memory.moveMode==1 or memory.flyUnit==1 or self.resource().tileMode==1
playAnimation:OnMovingReversing


[hiddenAction_Set_Get_PlayIdleAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayIdleAnimation")
#requireConditional:if not self.tags(includes='inBattle') 
playAnimationIfNotPlaying:Common_Idle

[hiddenAction_Set_Get_PlayDazeAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayDazeAnimation")
stopLastAnimation:true
alsoTriggerAction:Set_Get_PlayDazeAnimation_Step2
[hiddenAction_Set_Get_PlayDazeAnimation_Step2]
stopLastAnimation:true
playAnimation:Common_Daze
spawnEffects:Daze_1

[hiddenAction_Set_Get_PlayStaggerAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayStaggerAnimation")
stopLastAnimation:true
alsoTriggerAction:Set_Get_PlayStaggerAnimation_Step2
[hiddenAction_Set_Get_PlayStaggerAnimation_Step2]
stopLastAnimation:true
playAnimation:Common_Stagger
spawnEffects:Stagger_1


[hiddenAction_Set_Get_PlayDodgeLAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayDodgeLAnimation")
playAnimation:Common_Dodge_L
stopLastAnimation:true
[hiddenAction_Set_Get_PlayDodgeRAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayDodgeRAnimation")
playAnimation:Common_Dodge_R
stopLastAnimation:true





[action_Set_AttackMode_Shoot]
playSoundToPlayer:ROOT:Resource/Sound/SE/Weapon/Switch/BeamSaber_Switch_1.ogg:1
[hiddenAction_Set_AttackMode_Shoot_DefaultWeapon]
setUnitMemory:nowWeaponIndex=0

[action_Set_AttackMode_Cqb]
playSoundToPlayer:ROOT:Resource/Sound/SE/Weapon/Switch/ShootWeapon_Switch_1.ogg:1
[hiddenAction_Set_AttackMode_Cqb_DefaultWeapon]
setUnitMemory:nowWeaponIndex=1



[hiddenAction_Get_RecoverByOther_Shield]
setResourcesWithLogic:"""
shield=self.shield+eventData("RecoverShield",type="float")*select(self.shield>0,1,0)
"""
[hiddenAction_Get_RecoverByOtherPer_Shield]
setResourcesWithLogic:"""
shield=self.shield+self.maxShield*eventData("RecoverShield",type="float")*select(self.shield>0,1,0)
"""





[hiddenAction_Check_FinalHeight]
setUnitMemory:"""
finalHeight=select
(
    self.resource.TileMode==0,
    select
    (
        self.hp>0,
        select
        (
            memory.battleUnitCore.readUnitMemory(name="tileType", type="float")==2,
            select(memory.flyUnit==1 or memory.hoverUnit==1,memory.baseHeight,-20),
            memory.baseHeight
        ),
        0
    ),
    1
)
"""

[hiddenAction_SpawnExplosion_Ground]
spawnEffects:Common_Explosion_MA_Ground_1

[hiddenAction_SpawnExplosion_Space]
spawnEffects:Common_Explosion_MA_Space_1

[hiddenAction_SpawnExplosion_Water]
spawnEffects:Common_Explosion_MA_Ground_1


[attack]

[movement]
movementType:AIR
moveSpeed: 1
maxTurnSpeed: 1

moveAccelerationSpeed: 0.1
moveDecelerationSpeed: 0.03
reverseSpeedPercentage:0.0

turnAcceleration: 5

heightChangeRate:1.5
targetHeightDrift:0
targetHeight:1


moveSlidingMode:true
moveSlidingDir:360
moveIgnoringBody:true

joinsGroupFormations:true

