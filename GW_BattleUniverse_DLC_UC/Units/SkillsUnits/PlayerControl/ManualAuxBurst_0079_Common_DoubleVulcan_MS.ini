[core]
name:ManualAuxBurst_0079_Common_DoubleVulcan_MS
dont_load:false
price:0
maxHp:1
mass:1
radius:0
showInEditor:false
showOnMinimap:false
isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
ignoreInUnitCapCalculation:true
disableAllUnitCollisions:true
autoTriggerCooldownTime:0.1s
autoTriggerCheckRate:everyFrame
@memory burstHQ:unit
@memory burstSerial:float

[hiddenAction_Start]
autoTriggerOnEvent:created
setUnitMemory:burstHQ=customTarget1.readUnitMemory('manualControlHQ',type='unit'),burstSerial=customTarget1.readUnitMemory('manualVulcanSerial',type='float')
alsoQueueAction:Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,Shot,End

[hiddenAction_Shot]
buildSpeed:0.075s
requireConditional:if customTarget1.hp>0 and customTarget1.teamId==self.teamId and customTarget1.readUnitMemory('manualControlEnabled',type='bool') and customTarget1.readUnitMemory('manualVulcanSerial',type='float')==memory.burstSerial and memory.burstHQ.hp>0 and memory.burstHQ.readUnitMemory('manualControlledUnit',type='unit')==customTarget1
sendMessageTo:customTarget1
sendMessageWithTags:ManualAuxShot_Common_DoubleVulcan_MS
sendMessageWithData:burstSerial=memory.burstSerial

[hiddenAction_End]
buildSpeed:0s
deleteSelf:true

[hiddenAction_Cancel]
autoTrigger:if customTarget1.hp<=0 or customTarget1.teamId!=self.teamId or not customTarget1.readUnitMemory('manualControlEnabled',type='bool') or customTarget1.readUnitMemory('manualVulcanSerial',type='float')!=memory.burstSerial or memory.burstHQ.hp<=0 or memory.burstHQ.readUnitMemory('manualControlledUnit',type='unit')!=customTarget1 or self.timeAlive>6 or customTarget1.resource.Common_DoubleVulcan_MS_ShootTimer<=0
deleteSelf:true

[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true
[attack]
canAttack:false
[movement]
movementType:AIR
moveSpeed:0
targetHeight:0
targetHeightDrift:0

[resource_Common_DoubleVulcan_MS_ShootTimer]
hidden:true
