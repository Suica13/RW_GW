[core]
dont_load:false
@memory ucTechBase:float
copyFrom:"""
ROOT:Units/TechTree/Mod/TechTree_UI_Main.gw,
ROOT:Units/TechTree/Tech/Faction/ZEON_0079/TechList_ZEON_0079.ini
"""

name:TechTree_UI_Main_ZEON_0079
displayText:TechTree Main[ZEON][0079]
displayText_zh:科技树 Main[ZEON][0079]

[template_Tech_SendAlly_Step2]
requireConditional:if thisActionTarget.globalTeamTags(includes='Tech_ZEON_0079_BaseTech')
[template_Tech_SendAlly_Step3]
requireConditional:if thisActionTarget.globalTeamTags(includes='Tech_ZEON_0079_BaseTech')

[hiddenAction_InitializeStats]
setUnitMemory:pageMax=0,pageCount=0,ucTechBase=customTarget1.customTarget1.readUnitMemory('ucEraTechBase',type='float')

[hiddenAction_ShowTechTree]
autoTriggerOnEvent:newMessage(withTag="ShowTechTree")
alsoTriggerAction:ShowTechTree_Page0
[hiddenAction_ShowTechTree_Page0]
requireConditional:if self.attachment(slot='Page').hp<=0
attachments_addNewUnits:TechTree_UI_Page_UC_ZEON_0079
attachments_onlyOnSlots:Page
[hiddenAction_GetNextPage]
autoTriggerOnEvent:newMessage(withTag="NextPage")
sendMessageTo:parent
sendMessageWithTags:UC_Next

[hiddenAction_GetLastPage]
autoTriggerOnEvent:newMessage(withTag="LastPage")
sendMessageTo:parent
sendMessageWithTags:UC_Last

[hiddenAction_UC_CloseOwnedPage]
autoTriggerOnEvent:newMessage(withTag="UC_CloseOwnedPage")
attachments_onlyOnSlots:Page
attachments_deleteNumUnits:1

[hiddenAction_UC_AI_Show]
autoTrigger:if self.isControlledByAI() and self.globalTeamTags(includes='ZEON_0079') and self.attachment(slot='Page').hp<=0
alsoTriggerAction:ShowTechTree
