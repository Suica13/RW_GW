[core]
dont_load:false
copyFrom:"""
ROOT:Units/TechTree/Mod/TechTree_Core.gw
"""
name:TechTree_Core_UC
tags:TechTree_Core
@memory ucPage:float
@memory ucPages:float
@memory ucStartEra:float

[hiddenAction_UC_Initialize]
autoTriggerOnEvent:created
setUnitMemory:ucPage=0,ucPages=0,ucStartEra=select(self.resource.FactionIndex>=1030000,2,select(self.resource.FactionIndex>=1020000,1,0))

[action_ShowTechTree_UC]
@copyFromSection:template_ShowTechTree
text:Universal Century research [%{memory.ucPages} pages]
text_zh:宇宙世纪科技树 [%{memory.ucPages}页]
isVisible:if not memory.showTechTree
isLocked:false
sendMessageTo:self
sendMessageWithTags:UC_ButtonPressed
alsoTriggerAction:UC_Open

[hiddenAction_UC_Next]
autoTriggerOnEvent:newMessage(withTag="UC_Next")
setUnitMemory:ucPage=min(memory.ucPages-1,memory.ucPage+1)
alsoQueueAction:UC_OpenDelayed

[hiddenAction_UC_Last]
autoTriggerOnEvent:newMessage(withTag="UC_Last")
setUnitMemory:ucPage=max(0,memory.ucPage-1)
alsoQueueAction:UC_OpenDelayed

[hiddenAction_UC_OpenDelayed]
buildSpeed:0.1s
alsoTriggerAction:UC_Open

[attachment_EFSF_0079]
@copyFromSection:template_TechTree_Main
onCreateSpawnUnitOf:NONE

[hiddenAction_UC_Visit_EFSF_0079]
autoTrigger:if self.globalTeamTags(includes='Tech_EFSF_0079_Start') and self.attachment(slot='EFSF_0079').hp<=0
attachments_addNewUnits:TechTree_UI_Main_EFSF_0079
attachments_onlyOnSlots:EFSF_0079
addGlobalTeamTags:UC_Visited_EFSF_0079
setUnitMemory:ucPages=max(memory.ucPages,0+1-memory.ucStartEra),ucPage=0-memory.ucStartEra,showTechTree=false
alsoTriggerAction:UC_CloseOldPages
alsoQueueAction:UC_Bootstrap_EFSF_0079

[hiddenAction_UC_Bootstrap_EFSF_0079]
buildSpeed:0.25s
sendMessageTo:self.attachment(slot='EFSF_0079')
sendMessageWithTags:Unlock_Tech_EFSF_0079_BaseTech
sendMessageWithData:byOther=1

[hiddenAction_UC_Open_EFSF_0079]
requireConditional:if memory.ucPage==0-memory.ucStartEra and self.globalTeamTags(includes='UC_Visited_EFSF_0079')
sendMessageTo:self.attachment(slot='EFSF_0079')
sendMessageWithTags:ShowTechTree

[hiddenAction_UC_CloseOldPage_EFSF_0079]
requireConditional:if memory.ucPage!=0-memory.ucStartEra
sendMessageTo:self.attachment(slot='EFSF_0079')
sendMessageWithTags:UC_CloseOwnedPage

