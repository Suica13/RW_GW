[core]
dont_load:false
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw,
ROOT:Units/BattleUnits/NahelArgamaClass/PlayerControl/Ships/NahelArgamaClass_Turret_AA.gw
"""

name:NahelArgamaClass_Turret_AA
displayText:NahelArgamaClass AA
displayText_zh:拟阿卡玛级 对空炮

maxHp: 6500

@memory NahelArgamaClass_Turret_AA_OnCD:bool
@memory NahelArgamaClass_Turret_AA_CDTimer:float
@global NahelArgamaClass_Turret_AA_CD=2
@global NahelArgamaClass_Turret_AA_EN=0.5

@global NahelArgamaClass_Turret_AA_Shoot=10
[resource_NahelArgamaClass_Turret_AA_ShootTimer]
hidden:true



#AA炮用

[decal_Burned]
imageScale:0.75
[decal_Stun]
imageScale:0.425
[decal_LowHp]
imageScale:0.5
[decal_Marker]
imageScale:0.25


[graphics]
drawLayer:ground2



[decal_NahelArgamaClass_Turret_AA]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/NahelArgamaClass/Image/NahelArgamaClass_Turret_AA_1.png
imageScale:0.85
basePositionFromTurret:NahelArgamaClass_Turret_AA






[turret_NahelArgamaClass_Turret_AA]
x:0
y:0

canShoot:true
onShoot_triggerActions:ManualShip_Consumed
canAttackCondition:if ((${onAttacking}==false and ${cantAction}==false  and (parent.resource().en>0 or memory.manualShipReserved))) and (not parent.hasTags(includes='ManualControlled') or (not parent.readUnitMemory('manualAutoAAOff',type='bool') and parent.readUnitMemory('manualControlHQ',type='unit').hp>0 and parent.readUnitMemory('manualControlHQ',type='unit').teamId==parent.teamId and parent.readUnitMemory('manualControlHQ',type='unit').hasTags(includes='HQ_NotCaptured') and parent.readUnitMemory('manualControlHQ',type='unit').readUnitMemory('manualControlledUnit',type='unit')==parent))
showRangeUIGuide:false
projectile:NahelArgamaClass_Turret_AA_Projectile
resourceUsage:NahelArgamaClass_Turret_AA_ShootTimer=1,ManualShipShotPermit=1

delay:0.2s
canAttackMaxAngle:60
limitingAngle:90
limitingRange:600
barrelX:2
barrelY:6
barrelOffsetX_onOddShots:-4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_NahelArgamaClass_Turret_AA_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:250
    |ShellAPDamage:93.75
    |DpDamage:6.25
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1.5
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:90
    |ProjectileSpread:6
    |ProjectileLife:7.5
)
"""


[hiddenAction_NahelArgamaClass_Turret_AA_CDStart]
autoTrigger:if (memory.NahelArgamaClass_Turret_AA_OnCD==false and (    (        self.resource.NahelArgamaClass_Turret_AA_ShootTimer<=0     )     or     (        self.resource.NahelArgamaClass_Turret_AA_ShootTimer<${NahelArgamaClass_Turret_AA_Shoot} and not self.hasTags(includes='inBattle')    ))) and (not parent.hasTags(includes='ManualControlled') or memory.manualShipRemaining<=0 or self.timeAlive>=memory.manualShipOrderUntil)
setUnitMemory:NahelArgamaClass_Turret_AA_OnCD=true,NahelArgamaClass_Turret_AA_CDTimer=self.timeAlive+${NahelArgamaClass_Turret_AA_CD}

[hiddenAction_NahelArgamaClass_Turret_AA_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.NahelArgamaClass_Turret_AA_OnCD==true and self.timeAlive>memory.NahelArgamaClass_Turret_AA_CDTimer
setUnitMemory:NahelArgamaClass_Turret_AA_OnCD=false
setResourcesWithLogic:NahelArgamaClass_Turret_AA_ShootTimer=${NahelArgamaClass_Turret_AA_Shoot}

[hiddenAction_NahelArgamaClass_Turret_AA_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${NahelArgamaClass_Turret_AA_EN}