buildSpeed:0s


highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
ai_isDisabled:true
extraLagHidingInUI:true

displayType:infoOnly

text:Suicide
text_zh:自毁

iconImage:ROOT:Resource/Image/Units/Button/Misc/Warning_1.png

isVisible:if memory.onSuicide==false and not parent.hasTags(includes='inHangar')

alsoTriggerAction:Get_Suicide_On

[action_Suicide_On]
pos:9000

buildSpeed:0s


highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
ai_isDisabled:true
extraLagHidingInUI:true

displayType:action

text:Stop [%{int(memory.onSuicideTimer-self.timeAlive)}s]
text_zh:停止 [%{int(memory.onSuicideTimer-self.timeAlive)}s]

iconImage:ROOT:Resource/Image/Units/Button/Misc/Warning_1.png
isGuiBlinking:true

isVisible:if memory.onSuicide==true and not parent.hasTags(includes='inHangar')

alsoTriggerAction:Get_Suicide_Off

[hiddenAction_Get_Suicide_On]
autoTriggerOnEvent:newMessage(withTag="Suicide_On")
setUnitMemory:onSuicide=true,onSuicideTimer=self.timeAlive+10

[hiddenAction_Get_Suicide_Off]
autoTriggerOnEvent:newMessage(withTag="Suicide_Off")
setUnitMemory:onSuicide=false

[hiddenAction_Check_SuicdeTimer]
autoTrigger:if memory.onSuicide==true and self.timeAlive>memory.onSuicideTimer
setUnitMemory:onSuicide=false
sendMessageTo:parent
sendMessageWithTags:TrySuicide



[action_Recycle_Off]
pos:9100

buildSpeed:0s


highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
ai_isDisabled:true
extraLagHidingInUI:true

displayType:infoOnly

text:Recycle
text_zh:回收

iconImage:ROOT:Resource/Image/Units/Button/Misc/Delself.png

isVisible:if memory.onRecycle==false and parent.readUnitMemory("canSupply",type="bool")==true and not parent.hasTags(includes='inHangar')

alsoTriggerAction:Get_Recycle_On

[action_Recycle_On]
pos:9100

buildSpeed:0s


highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
ai_isDisabled:true
extraLagHidingInUI:true

displayType:action

text:Stop [%{int(memory.onRecycleTimer-self.timeAlive)}s]
text_zh:停止 [%{int(memory.onRecycleTimer-self.timeAlive)}s]

iconImage:ROOT:Resource/Image/Units/Button/Misc/Delself.png
isGuiBlinking:true

isVisible:if memory.onRecycle==true and not parent.hasTags(includes='inHangar')

alsoTriggerAction:Get_Recycle_Off

[hiddenAction_Get_Recycle_On]
autoTriggerOnEvent:newMessage(withTag="Recycle_On")
setUnitMemory:onRecycle=true,onRecycleTimer=self.timeAlive+10

[hiddenAction_Get_Recycle_Off]
autoTriggerOnEvent:newMessage(withTag="Recycle_Off")
autoTrigger:if memory.onRecycle==true and (parent.speed>0.25 or parent.attacking.hp>0)
setUnitMemory:onRecycle=false

[hiddenAction_Check_RecycleTimer]
autoTrigger:if memory.onRecycle==true and self.timeAlive>memory.onRecycleTimer
setUnitMemory:onRecycle=false
sendMessageTo:parent
sendMessageWithTags:TryRecycle




[hiddenAction_Get_AllowAI_On]
autoTriggerOnEvent:newMessage(withTag="AllowAI_On")
setUnitMemory:allowAI=true

[hiddenAction_Get_AllowAI_Off]
autoTriggerOnEvent:newMessage(withTag="AllowAI_Off")
autoTrigger:if memory.close==true and memory.allowAI==true
setUnitMemory:allowAI=false




[hiddenAction_Get_AllowAssigned_On]
autoTriggerOnEvent:newMessage(withTag="AllowAssigned_On")
setUnitMemory:allowAssigned=true

[hiddenAction_Get_AllowAssigned_Off]
autoTriggerOnEvent:newMessage(withTag="AllowAssigned_Off")
autoTrigger:if memory.close==true and memory.allowAssigned==true
setUnitMemory:allowAssigned=false



