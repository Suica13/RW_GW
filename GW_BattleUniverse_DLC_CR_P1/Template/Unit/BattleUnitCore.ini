
[core]
copyFrom:"""
ROOT:Resource/Image/Fx/Common/Common_Flash_1.gw,
ROOT:Resource/Image/Fx/Common/Common_EnterWater_1.gw
"""

dont_load:true

tags:BattleUnitCore

name:BattleUnitCore
displayText: BattleUnitCore
