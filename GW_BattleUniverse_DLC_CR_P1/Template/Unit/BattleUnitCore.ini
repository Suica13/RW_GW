[hiddenAction_FindHQ]
autoTrigger:if memory.HQ.hp<= 0 or memory.HQ.teamId!=self.teamId
takeResources_includeUnitsWithinRange:99999
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:HQ
takeResources_searchOnly:true
takeResources_maxUnits:1
takeResources_triggerActionForEach:FindHQ_Step2
[hiddenAction_FindHQ_Step2]
setUnitMemory:HQ=thisActionTarget

[hiddenAction_Get_InitializeDone]
autoTriggerOnEvent:newMessage(withTag="InitializeDone")
setUnitMemory:"""
onDodgeBoostSpeed=1,
skillSuperArmor=0,
skillAccuracyBuff=0,
skillReactionBuff=0,
skillShootAtkBuff=0,
skillCqbAtkBuff=0,
skillShootDefBuff=0,
skillCqbDefBuff=0,
skillDpDefBuff=0,
allowAI=parent.customTarget1.readUnitMemory('allowAI',type='bool')
"""
[hiddenAction_Send_ReSetStats]
sendMessageTo:parent
sendMessageWithTags:ReSetStats



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
Send_UpdateSub,
Send_DetectEnemy,
Check_Pilot,
Check_Repair,
Check_Deconstruct,
Math_En,
Math_Speed,
Math_FinalLevel,
Math_AttackRange,
CheckCantAction,
Check_Tile,
Animator,
Check_Dead
"""

[hiddenAction_Send_UpdateSub]
sendMessageTo:parent
sendMessageWithTags:UpdateSub

[hiddenAction_Send_DetectEnemy]
requireConditional:if self.timeAlive>memory.detectEnemyCD
setUnitMemory:detectEnemyCD=self.timeAlive+1.0
sendMessageTo:parent
sendMessageWithTags:DetectEnemy

[hiddenAction_Check_Pilot]
alsoTriggerAction:"""
Check_Pilot_Need,
Check_Pilot_NoNeed
"""

[hiddenAction_Check_Pilot_NoNeed]
requireConditional:if parent.readUnitMemory('noNeedPilot',type='bool')==true
alsoTriggerAction:Check_Pilot_GetSkills_NoNeedPilot

[hiddenAction_Check_Pilot_Need]
requireConditional:if parent.readUnitMemory('noNeedPilot',type='bool')==false
alsoTriggerAction:"""
Check_Pilot_NoPilot,
Check_Pilot_NoPilot_TimeOut,
Check_Pilot_HasPilot,
Check_Pilot_GetSkills
"""
setUnitMemory:pilotUnit=parent.readUnitMemory('pilotUnit',type='unit')

[hiddenAction_Check_Pilot_NoPilot]
requireConditional:if parent.transportingCount<1 and memory.tryClose==false
setUnitMemory:"""
tryClose=true,
tryCloseTimer=self.timeAlive+select(parent.isMoving or parent.attacking.hp>0,1,0),
onSuicideTimer=select(memory.onSuicide==false,self.timeAlive+180,memory.onSuicideTimer),
onSuicide=true
"""

[hiddenAction_Check_Pilot_NoPilot_TimeOut]
requireConditional:if memory.tryClose==true and self.timeAlive>memory.tryCloseTimer and memory.close==false
setUnitMemory:tryClose=false,close=true
alsoTriggerAction:Check_Pilot_NoPilot_ChangeTeam,SetClearQueued,Send_WayPoint_Clear,Check_Pilot_GetSkills_NoPilot
[hiddenAction_Check_Pilot_NoPilot_ChangeTeam]
alsoTriggerAction:"""
Send_DeadUnload_TransportUnits,
Check_Pilot_NoPilot_ChangeTeam_Parent
"""
[hiddenAction_Check_Pilot_NoPilot_ChangeTeam_Parent]
requireConditional:if parent.attachment(withTag="Pilot")==null
sendMessageTo:parent
sendMessageWithTags:ChangeTeam
sendMessageWithData:teamID=-1
alsoTriggerAction:Check_Pilot_NoPilot_HasEnemy
[hiddenAction_Check_Pilot_NoPilot_HasEnemy]
requireConditional:if memory.lastDamageBy!=null 
sendMessageTo:memory.lastDamageBy.readUnitMemory('battleUnitCore',type='unit')
sendMessageWithTags:Killed
sendMessageWithData:"""
UnitInfo=self,
UnitLevel=parent.readUnitMemory('unitLevel',type='float')
"""

[hiddenAction_Check_Pilot_HasPilot]
requireConditional:if parent.transportingCount>0 and memory.close==true
setUnitMemory:close=false,onSuicide=false,tryClose=false

[hiddenAction_Check_Pilot_GetSkills]
requireConditional:if memory.pilotUnit!=null
setUnitMemory:"""
pilotShootSkill=memory.pilotUnit.readUnitMemory(name="pilotShootSkillFinal",type="float"),
pilotCqbSkill=memory.pilotUnit.readUnitMemory(name="pilotCqbSkillFinal",type="float"),
pilotDefSkill=memory.pilotUnit.readUnitMemory(name="pilotDefSkillFinal",type="float"),
pilotSpeedSkill=memory.pilotUnit.readUnitMemory(name="pilotSpeedSkillFinal",type="float"),
pilotAccuracySkill=memory.pilotUnit.readUnitMemory(name="pilotAccuracySkillFinal",type="float"),
pilotReactionSkill=memory.pilotUnit.readUnitMemory(name="pilotReactionSkillFinal",type="float"),
pilotLeadershipSkill=memory.pilotUnit.readUnitMemory(name="pilotLeadershipSkillFinal",type="float"),
pilotAwakeningSkill=memory.pilotUnit.readUnitMemory(name="pilotAwakeningSkillFinal",type="float")
"""

