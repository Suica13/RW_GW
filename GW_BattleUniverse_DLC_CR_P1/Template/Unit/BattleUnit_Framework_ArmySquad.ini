
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Unit/BattleUnit_Framework.ini
"""

borrowResourcesWhileAlive:Mp=-1
disableAllUnitCollisions:true


[hiddenAction_BattleUnitCore_Spawn]
attachments_addNewUnits:BattleUnitCore_ArmySquad

[action_Set_AttackMode_Shoot]
autoTrigger:false
isLocked:true
isLockedMessage:No Allow To Change
isLockedMessage_zh:不允许切换

[action_Set_AttackMode_Cqb]
autoTrigger:false
isLocked:true
isLockedMessage:No Allow To Change
isLockedMessage_zh:不允许切换


[action_UnloadPilot]
autoTrigger:false
isLocked:true
isLockedMessage:No Allow To Exit
isLockedMessage_zh:不允许脱出

[action_ChangePilotWithTarget]
isVisible:false
[hiddenAction_Get_TryChangePilotWithTarget]
requireConditional:false


[action_OverCustom_Off]
isVisible:false
[action_OverCustom_On]
isVisible:false


[hiddenAction_Get_Damage_Pilot]
requireConditional:false





[hiddenAction_SpawnExplosion_Ground]
requireConditional:false
[hiddenAction_SpawnExplosion_Space]
requireConditional:false
[hiddenAction_SpawnExplosion_Water]
requireConditional:false





[hiddenAction_BreakedBody_A]
requireConditional:if self.resource.TileMode==0
spawnEffects:breakedBody_A*4
[hiddenAction_BreakedCrotch_A]
requireConditional:if self.resource.TileMode==0
spawnEffects:breakedCrotch_A*3
[hiddenAction_BreakedHead_A]
requireConditional:if self.resource.TileMode==0
spawnEffects:breakedHead_A


[hiddenAction_BreakedBody_B]
requireConditional:if self.resource.TileMode==1
spawnEffects:breakedBody_B*4
[hiddenAction_BreakedCrotch_B]
requireConditional:if self.resource.TileMode==1
spawnEffects:breakedCrotch_B*3
[hiddenAction_BreakedHead_B]
requireConditional:if self.resource.TileMode==1
spawnEffects:breakedHead_B


[effect_breakedBody_A]
scaleFrom:0.5
scaleTo:0.4
hOffset:3
xOffsetRelativeRandom:15
yOffsetRelativeRandom:15
xSpeedRelativeRandom:0.5
ySpeedRelativeRandom:0.5
image:ROOT:Resource/Image/Weapon/Legacy/Pilot_Image_Weapon_MG_1.png
[effect_breakedBody_B]
scaleFrom:0.5
scaleTo:0.4
xOffsetRelativeRandom:15
yOffsetRelativeRandom:15
xSpeedRelativeRandom:0.5
ySpeedRelativeRandom:0.5
image:ROOT:Resource/Image/Weapon/Legacy/Pilot_Image_Weapon_MG_1.png

[effect_breakedCrotch_A]
scaleFrom:0.5
scaleTo:0.4
image:ROOT:Resource/Image/Weapon/Legacy/Pilot_Image_Weapon_BZ_1.png
[effect_breakedCrotch_B]
scaleFrom:0.5
scaleTo:0.4
image:ROOT:Resource/Image/Weapon/Legacy/Pilot_Image_Weapon_BZ_1.png

[effect_breakedHead_A]
scaleFrom:0.5
scaleTo:0.4
image:ROOT:Resource/Image/Weapon/Legacy/Pilot_Image_Weapon_S_1.png
[effect_breakedHead_B]
scaleFrom:0.5
scaleTo:0.4
image:ROOT:Resource/Image/Weapon/Legacy/Pilot_Image_Weapon_S_1.png




[hiddenAction_TryAttack]
autoTrigger:"""
if self.attacking!=null and ${onAttacking}==false and ${cantAction}==false and ${onSkill}==false   
and not self.hasActiveWaypoint(type="build") 
and not self.hasActiveWaypoint(type="repair") 
and 
select
(
    self.parent.hp>0,
    select(self.parent.hasTags(includes='inVehicleCanAttack'),true,false),
    true
)
"""
sendMessageTo:self
sendMessageWithTags:Attack
sendMessageWithData:RandomWeapon=rnd(0,100)


[action_Exit]
isLocked:if memory.tileType==2
isLockedMessage:On Water
isLockedMessage_zh:在水面上


[hiddenAction_Set_Get_PlayMoveAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayMoveReversingAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayGuardAnimation]
requireConditional:false
playAnimation:IGNORE


[attack]

isFixedFiring:false

[graphics]
drawLayer:ground2
dustEffect: false

[movement]

movementType: OVER_CLIFF
moveSpeed: 0.5
maxTurnSpeed: 0.5

moveAccelerationSpeed: 0.15
moveDecelerationSpeed: 0.5
reverseSpeedPercentage:0.6

turnAcceleration: 0.5

heightChangeRate:1
targetHeight:1

moveSlidingMode:false
moveSlidingDir:0
moveIgnoringBody:false

joinsGroupFormations:true

