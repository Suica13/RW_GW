
[core]
dont_load:true

copyFrom:"""
BattleUnit_Framework_Pilot.ini
"""



@memory deadReturnCD:float
@memory deadReturnCDTimer:float
@memory deadReturnCDBool:bool


@memory thisTimeReturnSlot:unit
@memory thisTimeReturnSlot_ACE:unit



@memory pilotBuffRuleAccuracyModifier:float
@memory pilotBuffRuleReactionModifier:float
@memory pilotBuffRuleAtkShootModifier:float
@memory pilotBuffRuleAtkCqbModifier:float
@memory pilotBuffRuleDefModifier:float
@memory pilotBuffRuleSpdModifier:float
@memory pilotBuffRuleLeadershipModifier:float
@memory pilotBuffRuleAwakeningModifier:float
@memory pilotBuffRuleExpModifier:float







[hiddenAction_UpdatePilotSkillsFinal]
autoTrigger:true
setUnitMemory:"""
pilotShootSkillFinal=memory.pilotShootSkill*memory.pilotBuffRuleAtkShootModifier*select(memory.deadReturnCDBool,0.5,1),
pilotCqbSkillFinal=memory.pilotCqbSkill*memory.pilotBuffRuleAtkCqbModifier*select(memory.deadReturnCDBool,0.5,1),
pilotDefSkillFinal=memory.pilotDefSkill*memory.pilotBuffRuleDefModifier*select(memory.deadReturnCDBool,0.5,1),
pilotSpeedSkillFinal=memory.pilotSpeedSkill*memory.pilotBuffRuleSpdModifier*select(memory.deadReturnCDBool,0.5,1),
pilotAccuracySkillFinal=memory.pilotAccuracySkill*memory.pilotBuffRuleAccuracyModifier*select(memory.deadReturnCDBool,0.5,1),
pilotReactionSkillFinal=memory.pilotReactionSkill*memory.pilotBuffRuleReactionModifier*select(memory.deadReturnCDBool,0.5,1),
pilotLeadershipSkillFinal=memory.pilotLeadershipSkill*memory.pilotBuffRuleLeadershipModifier*select(memory.deadReturnCDBool,0.5,1),
pilotAwakeningSkillFinal=memory.pilotAwakeningSkill*memory.pilotBuffRuleAwakeningModifier
"""



[hiddenAction_Check_UnitBuffRule]
autoTrigger:true
alsoTriggerAction:"""
Check_UnitBuffRule_AtkShoot,
Check_UnitBuffRule_AtkCqb,
Check_UnitBuffRule_Def,
Check_UnitBuffRule_Spd,
Check_UnitBuffRule_Accuracy,
Check_UnitBuffRule_Reaction,
Check_UnitBuffRule_Leadership,
Check_UnitBuffRule_Awakening,
Check_UnitBuffRule_Exp
"""
[hiddenAction_Check_UnitBuffRule_AtkShoot]
setUnitMemory:pilotBuffRuleAtkShootModifier=select(true,1,1)

[hiddenAction_Check_UnitBuffRule_AtkCqb]
setUnitMemory:pilotBuffRuleAtkCqbModifier=select(true,1,1)

[hiddenAction_Check_UnitBuffRule_Def]
setUnitMemory:pilotBuffRuleDefModifier=select(true,1,1)

[hiddenAction_Check_UnitBuffRule_Spd]
setUnitMemory:pilotBuffRuleSpdModifier=select(true,1,1)

[hiddenAction_Check_UnitBuffRule_Accuracy]
setUnitMemory:pilotBuffRuleAccuracyModifier=select(true,1,1)

[hiddenAction_Check_UnitBuffRule_Reaction]
setUnitMemory:pilotBuffRuleReactionModifier=select(true,1,1)

[hiddenAction_Check_UnitBuffRule_Leadership]
setUnitMemory:pilotBuffRuleLeadershipModifier=select(true,1,1)

[hiddenAction_Check_UnitBuffRule_Awakening]
setUnitMemory:pilotBuffRuleAwakeningModifier=select(true,1,1)

[hiddenAction_Check_UnitBuffRule_Exp]
setUnitMemory:pilotBuffRuleExpModifier=select(true,1,1)


[hiddenAction_Get_GiveDamageInfoExp]
@global pilotExpUp=memory.pilotBuffRuleExpModifier




[hiddenAction_BattleUnitCore_Spawn]
attachments_addNewUnits:BattleUnitCore_Pilot_ACE

[hiddenAction_InitializeStats_PilotSkills_ByChange]
temporarilyAddTags:${core.name}
[hiddenAction_InitializeStats_AddAceTags_BySpawn]
autoTriggerOnEvent:created
temporarilyAddTags:${core.name}

[hiddenAction_Check_DeadReturn]
autoTrigger:true
setUnitMemory:"""
deadReturnCDBool=select(self.timeAlive>memory.deadReturnCDTimer,false,true)
"""


[hiddenAction_Get_DeadUnloadUnit]
autoTriggerOnEvent:newMessage(withTag="DeadUnloadPilot")
disconnectFromParent:true
alsoTriggerAction:Get_DeadUnloadUnit_TryReturn_StrategicLocation,Get_DeadUnloadUnit_Exit



[hiddenAction_Get_DeadUnloadUnit_TryReturn_StrategicLocation]
addWaypoint_prepend:true
addWaypoint_type:move
addWaypoint_target_nearestUnit_team:ally
addWaypoint_target_nearestUnit_tagged:StrategicLocation

[hiddenAction_Get_DeadUnloadUnit_Exit]
sendMessageTo:self
sendMessageWithTags:TryReturn
[hiddenAction_Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot]
autoTriggerOnEvent:newMessage(withTag="TryReturn")
alsoTriggerAction:"""
Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot_A,
Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot_B
"""


[hiddenAction_Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot_A]
requireConditional:"""
if memory.thisTimeReturnSlot.tags(includes='PilotReturnSlot') and memory.thisTimeReturnSlot.hp>0
"""
clearAllWaypoints:true
alsoTriggerAction:Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot_TP

[hiddenAction_Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot_B]
requireConditional:"""
if self.numberOfUnitsInTeam(withTag='PilotReturnSlot')>0 and not memory.thisTimeReturnSlot.tags(includes='PilotReturnSlot')
"""
takeResources_includeUnitsWithinRange:30000
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:PilotReturnSlot
takeResources_searchOnly:true
takeResources_maxUnits:1000
takeResources_triggerActionForEach:Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot_B_Step2
[hiddenAction_Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot_B_Step2]
requireConditional:if thisActionTarget.hp>0
setUnitMemory:thisTimeReturnSlot=thisActionTarget
clearAllWaypoints:true
alsoTriggerAction:Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot_TP


[hiddenAction_Get_DeadUnloadUnit_TryReturn_HasPilotReturnSlot_TP]
setUnitMemory:"""
deadReturnCDTimer=self.timeAlive+memory.deadReturnCD*select(self.isControlledByAI(),0.5,1),
pilotExpCount=0
"""
teleportTo:memory.thisTimeReturnSlot.getOffsetRelative(x=rnd(-15,15),y=rnd(-15,15))
addWaypoint_prepend:true
addWaypoint_type:loadinto
addWaypoint_target_fromReference:memory.thisTimeReturnSlot
showMessageToPlayer:${core.displayText} Return To Academy!
showMessageToPlayer_zh:${core.displayText_zh} 已脱出回士官学院!
playSoundToPlayer:ROOT:Resource/Sound/SE/Action/Event/Appear_1.ogg




[hiddenAction_DeleteSelf]
showMessageToPlayer:${core.displayText} Return To BackLine(Too Tired)......
showMessageToPlayer_zh:${core.displayText_zh} 因过劳已返回后方......
playSoundToPlayer:ROOT:Resource/Sound/SE/Environment/Warning_4.ogg:0.75







[action_DeadReturnCD_Info]
pos:0

text:DeadCD[%{int(memory.deadReturnCDTimer-self.timeAlive)}s]
text_zh:疲劳冷却[%{int(memory.deadReturnCDTimer-self.timeAlive)}s]

description:Pilots Skills -50%
description_zh:驾驶员技能-50%

displayType:infoOnly

iconImage:ROOT:Resource/Image/Units/Button/Misc/DeadReturnCD_1.png

ai_isDisabled:true
isGuiBlinking:true

buildSpeed:0s

isVisible:if self.timeAlive<memory.deadReturnCDTimer




































