
[core]
dont_load:false

tags:EffectUnit,UnitTurret

name:HighMegaCannon_1_EffectUnit

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory onPlay:float
@memory HighMegaCannon_1_effectFrame:float

@memory HighMegaCannon_1_color:float
@memory HighMegaCannon_1_speed:float

@global HighMegaCannon_1_total_frames=28

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
UpdateFrame,
EndPlay
"""



[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true



[hiddenAction_SetStats]
setUnitMemory:HighMegaCannon_1_effectFrame=-1

[hiddenAction_PlayOneTime]
autoTriggerOnEvent:newMessage(withTag="PlayOneTime")
setUnitMemory:onPlay=1,HighMegaCannon_1_effectFrame=0


[hiddenAction_StopPlay]
autoTriggerOnEvent:newMessage(withTag="StopPlay")
setUnitMemory:onPlay=0,HighMegaCannon_1_effectFrame=-1

[hiddenAction_UpdateFrame]
requireConditional:if memory.onPlay==1 and memory.HighMegaCannon_1_effectFrame<=${HighMegaCannon_1_total_frames}
setUnitMemory:HighMegaCannon_1_effectFrame=memory.HighMegaCannon_1_effectFrame+0.009*memory.HighMegaCannon_1_speed


[hiddenAction_EndPlay]
requireConditional:if memory.HighMegaCannon_1_effectFrame>${HighMegaCannon_1_total_frames} or parent.readUnitMemory(name="BattleUnitCore", type="unit").readUnitMemory(name="cantAction", type="bool")==true
setUnitMemory:onPlay=0,HighMegaCannon_1_effectFrame=-1



[hiddenAction_SetSpeed]
autoTriggerOnEvent:newMessage(withTag="SetSpeed")
setUnitMemory:HighMegaCannon_1_speed=eventData("Speed",type="float")*self.Resource.BulletSpeed

[hiddenAction_SetColor_Pink]
autoTriggerOnEvent:newMessage(withTag="SetColor_Pink")
setUnitMemory:HighMegaCannon_1_color=1
[hiddenAction_SetColor_Yellow]
autoTriggerOnEvent:newMessage(withTag="SetColor_Yellow")
setUnitMemory:HighMegaCannon_1_color=2
[hiddenAction_SetColor_Blue]
autoTriggerOnEvent:newMessage(withTag="SetColor_Blue")
setUnitMemory:HighMegaCannon_1_color=5
[hiddenAction_SetColor_Red_B]
autoTriggerOnEvent:newMessage(withTag="SetColor_Red_B")
setUnitMemory:HighMegaCannon_1_color=6


[attachment_Effect_Start]
x:0
y:125
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:HighMegaCannon_1_EffectUnit_S

[attachment_Effect_Mid]
x:0
y:438.5
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:HighMegaCannon_1_EffectUnit_M

[attachment_Effect_End]
x:0
y:741
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:HighMegaCannon_1_EffectUnit_E





