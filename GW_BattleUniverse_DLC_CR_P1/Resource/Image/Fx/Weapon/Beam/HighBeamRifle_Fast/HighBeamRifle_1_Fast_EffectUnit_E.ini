
[core]
dont_load:false

tags:EffectUnit

name:HighBeamRifle_1_Fast_EffectUnit_E

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory HighBeamRifle_1_Fast_effectFrame:float
@memory HighBeamRifle_1_Fast_color:float
@global HighBeamRifle_1_Fast_total_frames=10

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
UpdateData
"""

[hiddenAction_SetStats]
setUnitMemory:HighBeamRifle_1_Fast_effectFrame=-1

[hiddenAction_UpdateData]
setUnitMemory:"""
HighBeamRifle_1_Fast_effectFrame=parent.readUnitMemory('HighBeamRifle_1_Fast_effectFrame',type='float'),
HighBeamRifle_1_Fast_color=parent.readUnitMemory('HighBeamRifle_1_Fast_color',type='float')
"""


[decal_Effect_End_Pink]
layer:beforeUI
onlyTeam:any
order:1
image: ROOT:Resource/Image/Fx/Weapon/Beam/HighBeamRifle_Fast/Image/HighBeamRifle_1_Fast_End_Pink.png

total_frames:${HighBeamRifle_1_Fast_total_frames}
frame:memory.HighBeamRifle_1_Fast_effectFrame

imageScale:0.5
imageScaleY:0.5
alpha:select(memory.HighBeamRifle_1_Fast_effectFrame>=0,1,0)

xOffsetRelative: 0
yOffsetRelative: 0
dirOffset:-90

onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if memory.HighBeamRifle_1_Fast_color==1 and self.timeAlive>1

[decal_Effect_End_Yellow]
@copyFromSection:decal_Effect_End_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/HighBeamRifle_Fast/Image/HighBeamRifle_1_Fast_End_Yellow.png
isVisible:if memory.HighBeamRifle_1_Fast_color==2 and self.timeAlive>1

[decal_Effect_End_Blue]
@copyFromSection:decal_Effect_End_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/HighBeamRifle_Fast/Image/HighBeamRifle_1_Fast_End_Blue.png
isVisible:if memory.HighBeamRifle_1_Fast_color==3 and self.timeAlive>1


[decal_Effect_End_Green]
@copyFromSection:decal_Effect_End_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/HighBeamRifle_Fast/Image/HighBeamRifle_1_Fast_End_Green.png
isVisible:if memory.HighBeamRifle_1_Fast_color==4 and self.timeAlive>1

[decal_Effect_End_Red_B]
@copyFromSection:decal_Effect_End_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/HighBeamRifle_Fast/Image/HighBeamRifle_1_Fast_End_Red_B.png
isVisible:if memory.HighBeamRifle_1_Fast_color==6 and self.timeAlive>1


[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:1
maxTurnSpeed:1
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false

