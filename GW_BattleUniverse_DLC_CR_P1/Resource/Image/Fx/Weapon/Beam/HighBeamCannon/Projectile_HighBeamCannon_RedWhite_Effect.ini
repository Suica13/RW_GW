isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:Projectile_HighBeamCannon_RedWhite_Effect_S

