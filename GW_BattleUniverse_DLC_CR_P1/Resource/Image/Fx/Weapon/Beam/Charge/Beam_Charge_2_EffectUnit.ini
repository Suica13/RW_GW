
[core]
dont_load:false

tags:EffectUnit,UnitTurret

name:Beam_Charge_2_EffectUnit

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory onPlay:float

@memory playLoop:bool

@memory beam_Charge_2_effectFrame:float

@memory beam_Charge_2_color:float
@memory beam_Charge_2_speed:float

@global beam_Charge_2_total_frames=12

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
UpdateFrame,
EndPlay
"""



[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true



[hiddenAction_SetStats]
setUnitMemory:beam_Charge_2_effectFrame=-1

[hiddenAction_PlayOneTime]
autoTriggerOnEvent:newMessage(withTag="PlayOneTime")
setUnitMemory:onPlay=1,beam_Charge_2_effectFrame=0
playSoundAtUnit:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCharge_1.ogg:2.0

[hiddenAction_PlayLoop]
autoTriggerOnEvent:newMessage(withTag="PlayLoop")
setUnitMemory:onPlay=1,beam_Charge_2_effectFrame=0,playLoop=true
playSoundAtUnit:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCharge_1.ogg:1.0

[hiddenAction_StopPlay]
autoTriggerOnEvent:newMessage(withTag="StopPlay")
setUnitMemory:onPlay=0,beam_Charge_2_effectFrame=-1,playLoop=false

[hiddenAction_UpdateFrame]
alsoTriggerAction:"""
UpdateFrame_OneTime,
UpdateFrame_Loop
"""
[hiddenAction_UpdateFrame_OneTime]
requireConditional:if memory.onPlay==1 and memory.beam_Charge_2_effectFrame<=12 and memory.playLoop==false
setUnitMemory:beam_Charge_2_effectFrame=memory.beam_Charge_2_effectFrame+0.01*memory.beam_Charge_2_speed
[hiddenAction_UpdateFrame_Loop]
requireConditional:if memory.onPlay==1 and memory.playLoop==true
alsoTriggerAction:"""
UpdateFrame_Loop_Step1,
UpdateFrame_Loop_Step2
"""
[hiddenAction_UpdateFrame_Loop_Step1]
requireConditional:if memory.beam_Charge_2_effectFrame<=6
setUnitMemory:beam_Charge_2_effectFrame=memory.beam_Charge_2_effectFrame+0.01*memory.beam_Charge_2_speed
[hiddenAction_UpdateFrame_Loop_Step2]
requireConditional:if memory.beam_Charge_2_effectFrame>6
setUnitMemory:"""
beam_Charge_2_effectFrame=
select
(
    memory.beam_Charge_2_effectFrame<10,
    memory.beam_Charge_2_effectFrame+0.01*memory.beam_Charge_2_speed,
    6
)
"""

[hiddenAction_EndPlay]
requireConditional:if memory.beam_Charge_2_effectFrame>12 or parent.readUnitMemory(name="BattleUnitCore", type="unit").readUnitMemory(name="cantAction", type="bool")==true
setUnitMemory:onPlay=0,beam_Charge_2_effectFrame=-1



[hiddenAction_SetSpeed]
autoTriggerOnEvent:newMessage(withTag="SetSpeed")
setUnitMemory:beam_Charge_2_speed=eventData("Speed",type="float")*self.Resource.BulletSpeed

[hiddenAction_SetColor_Pink]
autoTriggerOnEvent:newMessage(withTag="SetColor_Pink")
setUnitMemory:beam_Charge_2_color=1
[hiddenAction_SetColor_Yellow]
autoTriggerOnEvent:newMessage(withTag="SetColor_Yellow")
setUnitMemory:beam_Charge_2_color=2

[decal_Beam_Charge_2_Pink]
layer:beforeUI
onlyTeam:any
order:1
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_2_Pink.png

total_frames:${beam_Charge_2_total_frames}
frame:memory.beam_Charge_2_effectFrame

imageScale:0.45
alpha:select(memory.beam_Charge_2_effectFrame>=0,1,0)

yOffsetRelative:20

onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if memory.beam_Charge_2_color==1
[decal_Beam_Charge_2_Yellow]
@copyFromSection:decal_Beam_Charge_2_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_2_Yellow.png
isVisible:if memory.beam_Charge_2_color==2



[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:100
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false
