[core]
copyFrom:"""
ROOT:Units/Buildings/HQ/Mod/HQ.ini,
ROOT:Template/Building/PMC_Selection.gw
"""
overrideAndReplace:HQ_VS_CR_P1
name:HQ_VS_CR_P1

@memory pmcFactionRoll:float
@memory pmcFactionOption0:bool
@memory pmcFactionOption1:bool
@memory pmcFactionOption2:bool

[action_ChoseFaction_Info_2]
text:Cross Rays P1 / VS
text_zh:火线纵横 P1 / 对决模式

[template_ChoseFaction]
attachments_addNewUnits:UnlockedListMarker_CR_P1
attachments_onlyOnSlots:UnlockedListMarkerSlot

[action_ChoseFaction_CR_Order]
@copyFromSection:template_ChoseFaction
text:Order
text_zh:秩序
description:Cross Rays P1: base buildings only; unit roster is WIP.
description_zh:火线纵横第一阶段骨架：仅开放基础建筑，单位阵容尚未实装。
iconImage:ROOT:Resource/Image/Icon/Faction_CR_Order_1.png
isVisible:if memory.readyOK==false or self.resource().FactionIndex==9010101
setResourcesWithLogic:FactionIndex=9010101
temporarilyAddTags:CR_Order,HQ_ResGen
addGlobalTeamTags:CR_Order,Tech_CR_Order_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2

[action_ChoseFaction_CR_Resistance]
@copyFromSection:template_ChoseFaction
text:Resistance
text_zh:反抗
description:Cross Rays P1: base buildings only; unit roster is WIP.
description_zh:火线纵横第一阶段骨架：仅开放基础建筑，单位阵容尚未实装。
iconImage:ROOT:Resource/Image/Icon/Faction_CR_Resistance_1.png
isVisible:if memory.readyOK==false or self.resource().FactionIndex==9010201
setResourcesWithLogic:FactionIndex=9010201
temporarilyAddTags:CR_Resistance,HQ_ResGen
addGlobalTeamTags:CR_Resistance,Tech_CR_Resistance_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2

[action_ChoseFaction_CR_Chaos]
@copyFromSection:template_ChoseFaction
text:Chaos
text_zh:混沌
description:Cross Rays P1: base buildings only; unit roster is WIP.
description_zh:火线纵横第一阶段骨架：仅开放基础建筑，单位阵容尚未实装。
iconImage:ROOT:Resource/Image/Icon/Faction_CR_Chaos_1.png
isVisible:if memory.readyOK==false or self.resource().FactionIndex==9010301
setResourcesWithLogic:FactionIndex=9010301
temporarilyAddTags:CR_Chaos,HQ_ResGen
addGlobalTeamTags:CR_Chaos,Tech_CR_Chaos_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2

[hiddenAction_ChoseFaction_ByAI]
autoTrigger:if self.isControlledByAI() and self.resource().FactionIndex==0 and self.numberOfUnitsInAllTeams(withTag='PMC')==0
alsoTriggerAction:ChoseFaction_ByAI_CR_Order,ChoseFaction_ByAI_CR_Resistance,ChoseFaction_ByAI_CR_Chaos

[hiddenAction_ChoseFaction_ByAI_CR_Order]
requireConditional:if self.resource().FactionIndex==0 and int(self.teamID/3)*3+0==self.teamID
alsoTriggerAction:ChoseFaction_CR_Order

[hiddenAction_ChoseFaction_ByAI_CR_Resistance]
requireConditional:if self.resource().FactionIndex==0 and int(self.teamID/3)*3+1==self.teamID
alsoTriggerAction:ChoseFaction_CR_Resistance

[hiddenAction_ChoseFaction_ByAI_CR_Chaos]
requireConditional:if self.resource().FactionIndex==0
alsoTriggerAction:ChoseFaction_CR_Chaos

[hiddenAction_ConvertToFaction]
autoTrigger:if self.resource.GameStart==1 and memory.gameStartChangeFaction==false
alsoTriggerAction:ConvertToFaction_CR_Order,ConvertToFaction_CR_Resistance,ConvertToFaction_CR_Chaos
setUnitMemory:gameStartChangeFaction=true

[hiddenAction_ConvertToFaction_CR_Order]
requireConditional:if self.resource().FactionIndex==9010101
convertTo:HQ_CR_Order
attachments_addNewUnits:TechTree_Core_CR_P1
attachments_onlyOnSlots:TechTreeMarkerSlot

[hiddenAction_ConvertToFaction_CR_Resistance]
requireConditional:if self.resource().FactionIndex==9010201
convertTo:HQ_CR_Resistance
attachments_addNewUnits:TechTree_Core_CR_P1
attachments_onlyOnSlots:TechTreeMarkerSlot

[hiddenAction_ConvertToFaction_CR_Chaos]
requireConditional:if self.resource().FactionIndex==9010301
convertTo:HQ_CR_Chaos
attachments_addNewUnits:TechTree_Core_CR_P1
attachments_onlyOnSlots:TechTreeMarkerSlot

# [ORDER_DEPENDENT] One pending HQ resolves at a time, using alliance relations rather than player IDs.
# [ENGINE_WORKAROUND] globalSearchForFirstUnit excludes its caller; a temporary marker includes this HQ.
[hiddenAction_PMC_AI_Register]
autoTrigger:if self.isControlledByAI() and self.resource.FactionIndex==0 and self.numberOfUnitsInAllTeams(withTag='PMC')>0 and not self.hasTags(includes='PMC_AI_FactionPending')
temporarilyAddTags:PMC_AI_FactionPending

[hiddenAction_PMC_AI_FactionFallback]
autoTrigger:if self.isControlledByAI() and self.resource.FactionIndex==0 and self.numberOfUnitsInAllTeams(withTag='PMC')>0 and self.hasTags(includes='PMC_AI_FactionPending') and createMarker(x=0,y=0,teamId=self.teamId).globalSearchForFirstUnit(withTag='PMC_AI_FactionPending',relation='any')==self
requireConditional:if self.isControlledByAI() and self.resource.FactionIndex==0 and self.numberOfUnitsInAllTeams(withTag='PMC')>0 and self.hasTags(includes='PMC_AI_FactionPending') and createMarker(x=0,y=0,teamId=self.teamId).globalSearchForFirstUnit(withTag='PMC_AI_FactionPending',relation='any')==self
setUnitMemory:pmcFactionOption0=((self.numberOfUnitsInAllyTeam(withTag='CR_Order')>0) or (not (self.numberOfUnitsInAllyTeam(withTag='CR_Order')>0 or self.numberOfUnitsInAllyTeam(withTag='CR_Resistance')>0 or self.numberOfUnitsInAllyTeam(withTag='CR_Chaos')>0) and (not (self.numberOfUnitsInEnemyTeam(withTag='CR_Order')>0) or (self.numberOfUnitsInEnemyTeam(withTag='CR_Order')>0 and self.numberOfUnitsInEnemyTeam(withTag='CR_Resistance')>0 and self.numberOfUnitsInEnemyTeam(withTag='CR_Chaos')>0)))),pmcFactionOption1=((self.numberOfUnitsInAllyTeam(withTag='CR_Resistance')>0 and not (self.numberOfUnitsInAllyTeam(withTag='CR_Order')>0)) or (not (self.numberOfUnitsInAllyTeam(withTag='CR_Order')>0 or self.numberOfUnitsInAllyTeam(withTag='CR_Resistance')>0 or self.numberOfUnitsInAllyTeam(withTag='CR_Chaos')>0) and (not (self.numberOfUnitsInEnemyTeam(withTag='CR_Resistance')>0) or (self.numberOfUnitsInEnemyTeam(withTag='CR_Order')>0 and self.numberOfUnitsInEnemyTeam(withTag='CR_Resistance')>0 and self.numberOfUnitsInEnemyTeam(withTag='CR_Chaos')>0)))),pmcFactionOption2=((self.numberOfUnitsInAllyTeam(withTag='CR_Chaos')>0 and not (self.numberOfUnitsInAllyTeam(withTag='CR_Order')>0 or self.numberOfUnitsInAllyTeam(withTag='CR_Resistance')>0)) or (not (self.numberOfUnitsInAllyTeam(withTag='CR_Order')>0 or self.numberOfUnitsInAllyTeam(withTag='CR_Resistance')>0 or self.numberOfUnitsInAllyTeam(withTag='CR_Chaos')>0) and (not (self.numberOfUnitsInEnemyTeam(withTag='CR_Chaos')>0) or (self.numberOfUnitsInEnemyTeam(withTag='CR_Order')>0 and self.numberOfUnitsInEnemyTeam(withTag='CR_Resistance')>0 and self.numberOfUnitsInEnemyTeam(withTag='CR_Chaos')>0))))
alsoTriggerAction:PMC_AI_DrawFaction

[hiddenAction_PMC_AI_DrawFaction]
# Store one draw before dispatch. Allies copy their existing faction; enemies exclude used factions.
# More alliances than factions may reuse a faction only once every native faction is already used.
setUnitMemory:pmcFactionRoll=min((select(memory.pmcFactionOption0,1,0)+select(memory.pmcFactionOption1,1,0)+select(memory.pmcFactionOption2,1,0))-1,int(rnd(0,(select(memory.pmcFactionOption0,1,0)+select(memory.pmcFactionOption1,1,0)+select(memory.pmcFactionOption2,1,0)))))
alsoTriggerAction:PMC_AI_Pick_0,PMC_AI_Pick_1,PMC_AI_Pick_2,PMC_AI_Finish

[hiddenAction_PMC_AI_Pick_0]
requireConditional:if self.resource.FactionIndex==0 and memory.pmcFactionOption0 and memory.pmcFactionRoll>=0 and memory.pmcFactionRoll<(0+select(memory.pmcFactionOption0,1,0))
alsoTriggerAction:ChoseFaction_CR_Order

[hiddenAction_PMC_AI_Pick_1]
requireConditional:if self.resource.FactionIndex==0 and memory.pmcFactionOption1 and memory.pmcFactionRoll>=0+select(memory.pmcFactionOption0,1,0) and memory.pmcFactionRoll<(0+select(memory.pmcFactionOption0,1,0)+select(memory.pmcFactionOption1,1,0))
alsoTriggerAction:ChoseFaction_CR_Resistance

[hiddenAction_PMC_AI_Pick_2]
requireConditional:if self.resource.FactionIndex==0 and memory.pmcFactionOption2 and memory.pmcFactionRoll>=0+select(memory.pmcFactionOption0,1,0)+select(memory.pmcFactionOption1,1,0) and memory.pmcFactionRoll<(0+select(memory.pmcFactionOption0,1,0)+select(memory.pmcFactionOption1,1,0)+select(memory.pmcFactionOption2,1,0))
alsoTriggerAction:ChoseFaction_CR_Chaos

[hiddenAction_PMC_AI_Finish]
requireConditional:if self.resource.FactionIndex>0
temporarilyRemoveTags:PMC_AI_FactionPending

[hiddenAction_PMC_AI_CleanupPending]
autoTrigger:if self.hasTags(includes='PMC_AI_FactionPending') and (self.resource.FactionIndex>0 or not self.isControlledByAI() or self.numberOfUnitsInAllTeams(withTag='PMC')==0)
temporarilyRemoveTags:PMC_AI_FactionPending
