[core]
copyFrom:ROOT:Units/Buildings/HQ/Mod/HQ.ini
overrideAndReplace:HQ_VS_CR_P1
name:HQ_VS_CR_P1

[action_ChoseFaction_Info_2]
text:Cross Rays P1 / VS
text_zh:火线纵横 P1 / 对决模式

[template_ChoseFaction]
attachments_addNewUnits:UnlockedListMarker_CR_P1
attachments_onlyOnSlots:UnlockedListMarkerSlot

[action_ChoseFaction_CR_Order]
@copyFromSection:template_ChoseFaction
text:Order
text_zh:秩序
description:Cross Rays P1: base buildings only; unit roster is WIP.
description_zh:火线纵横第一阶段骨架：仅开放基础建筑，单位阵容尚未实装。
iconImage:ROOT:Resource/Image/Icon/Faction_CR_Order_1.png
isVisible:if memory.readyOK==false or self.resource().FactionIndex==9010101
setResourcesWithLogic:FactionIndex=9010101
temporarilyAddTags:CR_Order,HQ_ResGen
addGlobalTeamTags:CR_Order,Tech_CR_Order_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2

[action_ChoseFaction_CR_Resistance]
@copyFromSection:template_ChoseFaction
text:Resistance
text_zh:反抗
description:Cross Rays P1: base buildings only; unit roster is WIP.
description_zh:火线纵横第一阶段骨架：仅开放基础建筑，单位阵容尚未实装。
iconImage:ROOT:Resource/Image/Icon/Faction_CR_Resistance_1.png
isVisible:if memory.readyOK==false or self.resource().FactionIndex==9010201
setResourcesWithLogic:FactionIndex=9010201
temporarilyAddTags:CR_Resistance,HQ_ResGen
addGlobalTeamTags:CR_Resistance,Tech_CR_Resistance_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2

[action_ChoseFaction_CR_Chaos]
@copyFromSection:template_ChoseFaction
text:Chaos
text_zh:混沌
description:Cross Rays P1: base buildings only; unit roster is WIP.
description_zh:火线纵横第一阶段骨架：仅开放基础建筑，单位阵容尚未实装。
iconImage:ROOT:Resource/Image/Icon/Faction_CR_Chaos_1.png
isVisible:if memory.readyOK==false or self.resource().FactionIndex==9010301
setResourcesWithLogic:FactionIndex=9010301
temporarilyAddTags:CR_Chaos,HQ_ResGen
addGlobalTeamTags:CR_Chaos,Tech_CR_Chaos_Start,PassT0,HQ_ResGenLv2,HQ_TechGenLv2

[hiddenAction_ChoseFaction_ByAI]
autoTrigger:if self.isControlledByAI() and self.resource().FactionIndex==0
alsoTriggerAction:ChoseFaction_ByAI_CR_Order,ChoseFaction_ByAI_CR_Resistance,ChoseFaction_ByAI_CR_Chaos

[hiddenAction_ChoseFaction_ByAI_CR_Order]
requireConditional:if self.resource().FactionIndex==0 and int(self.teamID/3)*3+0==self.teamID
alsoTriggerAction:ChoseFaction_CR_Order

[hiddenAction_ChoseFaction_ByAI_CR_Resistance]
requireConditional:if self.resource().FactionIndex==0 and int(self.teamID/3)*3+1==self.teamID
alsoTriggerAction:ChoseFaction_CR_Resistance

[hiddenAction_ChoseFaction_ByAI_CR_Chaos]
requireConditional:if self.resource().FactionIndex==0
alsoTriggerAction:ChoseFaction_CR_Chaos

[hiddenAction_ConvertToFaction]
autoTrigger:if self.resource.GameStart==1 and memory.gameStartChangeFaction==false
alsoTriggerAction:ConvertToFaction_CR_Order,ConvertToFaction_CR_Resistance,ConvertToFaction_CR_Chaos
setUnitMemory:gameStartChangeFaction=true

[hiddenAction_ConvertToFaction_CR_Order]
requireConditional:if self.resource().FactionIndex==9010101
convertTo:HQ_CR_Order
attachments_addNewUnits:TechTree_Core_CR_P1
attachments_onlyOnSlots:TechTreeMarkerSlot

[hiddenAction_ConvertToFaction_CR_Resistance]
requireConditional:if self.resource().FactionIndex==9010201
convertTo:HQ_CR_Resistance
attachments_addNewUnits:TechTree_Core_CR_P1
attachments_onlyOnSlots:TechTreeMarkerSlot

[hiddenAction_ConvertToFaction_CR_Chaos]
requireConditional:if self.resource().FactionIndex==9010301
convertTo:HQ_CR_Chaos
attachments_addNewUnits:TechTree_Core_CR_P1
attachments_onlyOnSlots:TechTreeMarkerSlot
