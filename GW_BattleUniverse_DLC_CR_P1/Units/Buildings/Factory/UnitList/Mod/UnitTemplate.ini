[core]
dont_load:true

[template_AutoProduce]
@define UnitID=Type61
@define AutoProduceIndexMin=0
@define AutoProduceIndexMax=1000
@define Number:8 
requireConditional:"""
if self.globalTeamTags(includes='Unlock_${UnitID}') 
and eventData("AutoProduceIndex",type="float")>${AutoProduceIndexMin} 
and eventData("AutoProduceIndex",type="float")<${AutoProduceIndexMax} 
and self.numberOfUnitsInTeam(withTag='${UnitID}')<=${Number} 
"""

[template_AutoProduce_Step2]
@define Money=0
@define Resource=0
requireConditional:"""
if self.resource.Money>=${Money} and self.resource.Resource>=${Resource} and self.Resource.Mp<self.Resource.MpMax*1.25*self.resource.AIHard and self.queueSize()<=0
"""
addResources: Money=-${Money},Resource=-${Resource}
alsoQueueAction:IGNORE

[template_Pannel]
@define UnitID=Type61
@define FactionVisible= (true)
@define OtherVisible= (true)

pos:100

highPriorityQueue:true
allowMultipleInQueue: true
ai_isDisabled:true
displayType:infoOnly

textAddUnitName:${UnitID}
descriptionAddFromUnit:${UnitID}
unitShownInUI:${UnitID}

isVisible:"""
if memory.buildDone==true 
and self.globalTeamTags(includes='Unlock_${UnitID}') 
and ${FactionVisible} 
and ${OtherVisible} 
"""

isLocked:if not self.globalTeamTags(includes='Unlock_${UnitID}') 
isLockedMessage:Tech Locked
isLockedMessage_zh:未解锁

buildSpeed:0s
setUnitMemory:${UnitID}=select(memory.${UnitID}==true,false,true)



[template_Produce]
@define UnitID=Type61
@define Money=0
@define Resource=0
@define MoralPoint=0
@define FactionVisible= (true)
@define OtherVisible= (true)

pos:100
text: Standard Squad
text_zh: 标准小队

tags:${UnitID}
unitShownInUI:${UnitID}

allowMultipleInQueue: true
ai_isDisabled:true
displayType:queueUnit
#onlyOneUnitAtATime:true

buildSpeed:30s
price: Money=${Money},Resource=${Resource},MoralPoint=${MoralPoint}

isVisible:"""
if memory.buildDone==true 
and
(
    (
        memory.${UnitID}==true and ${FactionVisible} and ${OtherVisible} 
    ) 
    or self.queueSize(withActionTag="${UnitID}")>0
)
"""

isLocked:if not self.globalTeamTags(includes='Unlock_${UnitID}') 
isLockedMessage:Tech Locked
isLockedMessage_zh:未解锁

setResourcesWithLogic:"""
Money=select(self.isControlledByAI(),self.resource.Money-${Money},self.resource.Money),
Resource=select(self.isControlledByAI(),self.resource.Resource-${Resource},self.resource.Resource)
"""

