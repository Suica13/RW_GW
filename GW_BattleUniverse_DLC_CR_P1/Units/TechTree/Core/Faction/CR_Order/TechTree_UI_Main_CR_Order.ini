[core]
copyFrom:"""
ROOT:Units/TechTree/Mod/TechTree_UI_Main.gw,
ROOT:Units/TechTree/Tech/Faction/CR_Order/TechList_CR_Order.ini
"""
name:TechTree_UI_Main_CR_Order
displayText:TechTree Main[Order][CR_P1]
displayText_zh:科技树[秩序][CR_P1]

[hiddenAction_InitializeStats]
setUnitMemory:pageMax=0

[hiddenAction_ShowTechTree]
attachments_addNewUnits:TechTree_UI_Page_CR_Order_00
attachments_onlyOnSlots:Page

[template_Tech_SendAlly_Step2]
requireConditional:if thisActionTarget.globalTeamTags(includes='Tech_CR_Order_Start')
[template_Tech_SendAlly_Step3]
requireConditional:if thisActionTarget.globalTeamTags(includes='Tech_CR_Order_Start')

[hiddenAction_AI_CheckPage]
autoTrigger:if self.isControlledByAI() and self.globalTeamTags(includes='Tech_CR_Order_Start')
alsoTriggerAction:AI_CheckPage_ShowTechTree

[hiddenAction_AI_CheckPage_ShowTechTree]
requireConditional:if self.attachment(slot='Page').hp<=0
alsoTriggerAction:ShowTechTree
