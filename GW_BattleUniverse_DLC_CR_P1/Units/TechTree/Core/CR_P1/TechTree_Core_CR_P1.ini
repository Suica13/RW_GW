[core]
copyFrom:"""
ROOT:Units/TechTree/Mod/TechTree_Core.gw,
ROOT:Units/TechTree/Core/Faction/CR_Order/TechTree_CR_Order.gw,
ROOT:Units/TechTree/Core/Faction/CR_Resistance/TechTree_CR_Resistance.gw,
ROOT:Units/TechTree/Core/Faction/CR_Chaos/TechTree_CR_Chaos.gw
"""
overrideAndReplace:TechTree_Core_CR_P1
name:TechTree_Core_CR_P1
displayText:TechTree Core[CR_P1]
displayText_zh:科技树核心[CR_P1]

# [ORDER_DEPENDENT] Inherited created -> InitializeStats calls Start_Set_Tech.
# Match 0087: complete the faction Base through its UI/TechList, not direct unlock tags.
[hiddenAction_Start_Set_Tech]
alsoTriggerAction:"""
Start_Set_Tech_CR_Order,
Start_Set_Tech_CR_Resistance,
Start_Set_Tech_CR_Chaos
"""

[hiddenAction_Start_Set_Tech_CR_Order]
requireConditional:if self.globalTeamTags(includes='Tech_CR_Order_Start') and self.globalTeamTags(includes='PassT0')
sendMessageTo:self.attachment(slot='CR_Order')
sendMessageWithTags:Unlock_Tech_CR_Order_BaseTech
sendMessageWithData:"""
byOther=1
"""

[hiddenAction_Start_Set_Tech_CR_Chaos]
requireConditional:if self.globalTeamTags(includes='Tech_CR_Chaos_Start') and self.globalTeamTags(includes='PassT0')
sendMessageTo:self.attachment(slot='CR_Chaos')
sendMessageWithTags:Unlock_Tech_CR_Chaos_BaseTech
sendMessageWithData:"""
byOther=1
"""
[hiddenAction_Start_Set_Tech_CR_Resistance]
requireConditional:if self.globalTeamTags(includes='Tech_CR_Resistance_Start') and self.globalTeamTags(includes='PassT0')
sendMessageTo:self.attachment(slot='CR_Resistance')
sendMessageWithTags:Unlock_Tech_CR_Resistance_BaseTech
sendMessageWithData:"""
byOther=1
"""

