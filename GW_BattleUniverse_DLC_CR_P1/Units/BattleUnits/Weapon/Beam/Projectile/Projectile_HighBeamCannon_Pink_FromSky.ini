#核心
[core]
#使用模板
copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Template/Shoot_MortarProjectile_Beam_FromSky.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Hit_2_Pink.gw,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Exp_1_Pink.gw
"""

name:Projectile_HighBeamCannon_Pink_FromSky

@memory highBeamCannonFrame:float

[hiddenAction_UpdateFrame]
autoTrigger:if memory.highBeamCannonFrame<=15
setUnitMemory:highBeamCannonFrame=memory.highBeamCannonFrame+0.08*self.Resource.BulletSpeed

[decal_Projectile_Image_Start]
layer:beforeUI
onlyTeam:any
order:1
image: ROOT:Resource/Image/Fx/Weapon/Beam/HighBeamCannon/Image/HighBeamCannon_1_Pink_Start.png

total_frames:16
frame:memory.highBeamCannonFrame

basePosition:memory.firePos

imageScale:0.5
alpha:1

yOffsetRelative:130
dirOffset:-90


onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if memory.highBeamCannonFrame<=15 and self.timeAlive>0.1

[decal_Projectile_Image_Mid]
layer:beforeUI
onlyTeam:any
order:1
image: ROOT:Resource/Image/Fx/Weapon/Beam/HighBeamCannon/Image/HighBeamCannon_1_Pink_Mid.png

total_frames:16
frame:memory.highBeamCannonFrame

basePosition:memory.firePos

imageScale:0.5
alpha:1

yOffsetRelative:432
dirOffset:-90


onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if memory.highBeamCannonFrame<=15 and self.timeAlive>0.1


[decal_Projectile_Image_End]
layer:beforeUI
onlyTeam:any
order:1
image: ROOT:Resource/Image/Fx/Weapon/Beam/HighBeamCannon/Image/HighBeamCannon_1_Pink_End.png

total_frames:16
frame:memory.highBeamCannonFrame

basePosition:memory.firePos

imageScale:0.5
alpha:1

yOffsetRelative:684
dirOffset:-90

onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if memory.highBeamCannonFrame<=15 and self.timeAlive>0.1








[decal_Projectile_Image]
layer:beforeUI
order:6
onlyWhileAlive:true 
isVisible:true
imageScale:1
alpha:0
xOffsetRelative: 0
yOffsetRelative: -15
dirOffset:-90
image:ROOT:\Resource\Image\Bullet\Beam\Beam_3.png

[hiddenAction_SpawnHitEffect]
spawnEffects:Beam_Exp_1_Pink,Beam_Hit_2_Pink

[projectile_Hit_Effect]
pushForce:1000


[hiddenAction_Start_SetStats]
setHeight=500


[hiddenAction_Start_SetDir]
setUnitMemory:firePos=self.getOffsetRelative(y=-100,dirOffset=-90)

[hiddenAction_Moving_Forward]
setUnitMemory:nowTargetHeight=select(self.height>-100,self.height-memory.projectileSpeed,-100)

[hiddenAction_Check_ContactedTimer]
setUnitMemory:contactedTimer=memory.contactedTimer-0.0035

[decal_Ring_Ally_Image]
layer:beforeBody
order:0
onlyWhileAlive:true
isVisible:if self.timeAlive>0.1
alpha:1
imageScale:0.15
onlyTeam:ally
image:ROOT:Resource/Image/Ring/Ring150_Blue.png
alwaysStartHeightAtZero:true

[decal_Ring_Enemy_Image]
@copyFromSection:decal_Ring_Ally_Image
onlyTeam:enemy
image:ROOT:Resource/Image/Ring/Ring150_Red.png