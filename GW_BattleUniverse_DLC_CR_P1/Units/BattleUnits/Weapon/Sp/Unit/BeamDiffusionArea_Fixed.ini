
[core]
name:BeamDiffusionArea_Fixed
displayText:BeamDiffusionArea
displayText_zh:光束扰乱膜区域

tags:BeamDiffusionArea


showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 35
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true

showInEditor:false

autoTriggerCooldownTime:0.1s
autoTriggerCheckRate:every8Frames

@memory effectRange:float
@memory lifeTime:float
@memory BeamDiffusionAreaFrame:float

@memory xR:float
@memory yR:float

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""

"""
setUnitMemory:"""
xR=customTarget1.x-self.x,
yR=customTarget1.y-self.y,

effectRange=self.resource().ProjectileExplosionRange,
lifeTime=self.resource().ProjectileLife
"""




[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
teleportToCustomTarget1,
Check_BeamDiffusionArea,
UpdateBeamDiffusionAreaFrame
"""
[hiddenAction_teleportToCustomTarget1]
teleportTo:customTarget1.getOffsetAbsolute(x=memory.xR,y=memory.yR)
[hiddenAction_Check_BeamDiffusionArea]
takeResources_includeUnitsWithinRange:450
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:BeamBullet
takeResources_searchOnly:true
takeResources_maxUnits:200
takeResources_triggerActionForEach:Check_BeamDiffusionArea_Step2
[hiddenAction_Check_BeamDiffusionArea_Step2]
requireConditional:"""
if distanceBetween(self,thisActionTarget)<memory.effectRange
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:BeamDiffusionArea



[hiddenAction_UpdateBeamDiffusionAreaFrame]
setUnitMemory:"""
BeamDiffusionAreaFrame=select(memory.BeamDiffusionAreaFrame>=${decal_BeamDiffusionArea.total_frames}-0.1,0,memory.BeamDiffusionAreaFrame+0.1)
"""

[decal_BeamDiffusionArea]
layer:beforeBody
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Weapon/Sp/Image/BeamDiffusionArea_1.png
alpha:0.75
total_frames:4
frame:memory.BeamDiffusionAreaFrame
imageScale:2
onlyOnNonPreview:true
isVisible:if memory.BeamDiffusionAreaFrame<4
onlyWhileAlive:true






[hiddenAction_DeleteSelf]
autoTrigger:"""
if self.timeAlive>memory.lifeTime 
"""
deleteSelf:true





[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true
drawLayer:air

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:0
targetHeight:5
targetHeightDrift:0
heightChangeRate:10


[ai]
useAsTransport:false
useAsBuilder: false

