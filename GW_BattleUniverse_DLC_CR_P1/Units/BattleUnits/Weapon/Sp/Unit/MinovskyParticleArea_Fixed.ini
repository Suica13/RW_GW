
[core]
name:MinovskyParticleArea_Fixed
displayText:MinovskyParticleArea
displayText_zh:米诺夫斯基粒子区域

tags:MinovskyParticleArea


showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 35
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true

showInEditor:false

autoTriggerCooldownTime:0.1s
autoTriggerCheckRate:every8Frames

@memory effectRange:float
@memory lifeTime:float
@memory minovskyParticleAreaFrame:float

@memory xR:float
@memory yR:float

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""

"""
setUnitMemory:"""
xR=customTarget1.x-self.x,
yR=customTarget1.y-self.y,

effectRange=self.resource().ProjectileExplosionRange,
lifeTime=self.resource().ProjectileLife
"""




[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
teleportToCustomTarget1,
Check_MinovskyParticleArea,
Check_MinovskyParticleArea_Jamming,
UpdateMinovskyParticleAreaFrame
"""
[hiddenAction_teleportToCustomTarget1]
teleportTo:customTarget1.getOffsetAbsolute(x=memory.xR,y=memory.yR)
[hiddenAction_Check_MinovskyParticleArea]
takeResources_includeUnitsWithinRange:450
takeResources_includeUnitsWithinRange_team:ally
takeResources_excludeUnitsWithoutTags:BattleUnitCore
takeResources_searchOnly:true
takeResources_maxUnits:200
takeResources_triggerActionForEach:Check_MinovskyParticleArea_Step2
[hiddenAction_Check_MinovskyParticleArea_Step2]
requireConditional:"""
if distanceBetween(self,thisActionTarget)<memory.effectRange
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:MinovskyParticleArea
sendMessageWithData:"""
minovskyParticleAreaTimer=2
"""
[hiddenAction_Check_MinovskyParticleArea_Jamming]
takeResources_includeUnitsWithinRange:450
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:Missile
takeResources_searchOnly:true
takeResources_maxUnits:200
takeResources_triggerActionForEach:Check_MinovskyParticleArea_Jamming_Step2
[hiddenAction_Check_MinovskyParticleArea_Jamming_Step2]
requireConditional:"""
if distanceBetween(self,thisActionTarget)<memory.effectRange
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:Jamming



[hiddenAction_UpdateMinovskyParticleAreaFrame]
setUnitMemory:"""
minovskyParticleAreaFrame=select(memory.minovskyParticleAreaFrame>=${decal_MinovskyParticleArea.total_frames}-1,0,memory.minovskyParticleAreaFrame+1)
"""

[decal_MinovskyParticleArea]
layer:beforeBody
onlyTeam:ally
order:1
image:ROOT:Resource/Image/Fx/Weapon/Sp/Image/MinovskyParticle_1.png
alpha:0.5
total_frames:24
frame:memory.minovskyParticleAreaFrame
imageScale:2
onlyOnNonPreview:true
isVisible:if memory.minovskyParticleAreaFrame<24
onlyWhileAlive:true
[decal_MinovskyParticleArea_Enemy]
@copyFromSection:decal_MinovskyParticleArea
layer:beforeUI
alpha:0.75
onlyTeam:enemy








[hiddenAction_DeleteSelf]
autoTrigger:"""
if self.timeAlive>memory.lifeTime or customTarget1.height<1
"""
deleteSelf:true





