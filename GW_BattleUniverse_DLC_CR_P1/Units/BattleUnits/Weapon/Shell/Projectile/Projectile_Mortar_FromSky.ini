
[core]

copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Template/Shoot_MortarProjectile_Shell_FromSky.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/Explosion_Hit_1.gw
"""

name:Projectile_Mortar_FromSky


[decal_Projectile_Image]
layer:beforeUI
order:6
onlyWhileAlive:true 
isVisible:if self.height/1000<0.25 and self.timeAlive>0.1
imageScale:0.75
xOffsetRelative: 0
yOffsetRelative: -5
dirOffset:-90
image:ROOT:Resource/Image/Bullet/Shell/Cannon_1.png


[hiddenAction_SpawnHitEffect]
spawnEffects:Explosion_Hit_1_XL

[projectile_Hit_Effect]
pushForce:500


[decal_Ring_Ally_Image]
layer:beforeBody
order:0
onlyWhileAlive:true
isVisible:if self.timeAlive>0.1
alpha:1
imageScale:(1-(self.height/1000))*0.15
onlyTeam:ally
image:ROOT:Resource/Image/Ring/Ring150_Blue.png
alwaysStartHeightAtZero:true

[decal_Ring_Enemy_Image]
@copyFromSection:decal_Ring_Ally_Image
onlyTeam:enemy
image:ROOT:Resource/Image/Ring/Ring150_Red.png