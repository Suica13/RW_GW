
[core]
copyFrom:"""
ROOT:Units/Buildings/Turret/Mod/Common_Turret.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""


name:Turret_AA_A
displayText:AA Turret Type A
displayText_zh:对空炮塔 A型

@global Money=250   
@global Resource=750
@global buildTime=35

maxHp: 12500

#isUnrepairableUnit:true
[hiddenAction_Building_GetDone]
temporarilyAddTags:BuildingTurret_T1

[ai]
maxEachBase:2

[hiddenAction_InitializeStats]
setUnitMemory:"""
baseDetectRange=600,

finalShootLevel=100,
finalCqbLevel=100,
finalAccuracyLevel=125,

finalBeamDef=0,
finalShellDef=15,
finalCqbDef=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""


[decal_A]
layer:afterBody
order:1
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_AA_1_A.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
isVisible:true
imageScale:1.5
dirOffset:0
teamColors:true
[decal_B]
layer:afterBody
order:2
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_AA_1_B.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
basePositionFromTurret:Common_Turret_AA_Double
isVisible:true
imageScale:0.75
xOffsetRelative:0
yOffsetRelative:0.5
xOffsetAbsolute: 0
yOffsetAbsolute: 0
dirOffset:0
teamColors:true



[turret_Common_Turret_AA_Double]
x: 0
y: 3

canShoot:true
canAttackCondition:if memory.buildDone==true
projectile:Common_Turret_AA_Double_Projectile

delay:0.075s
canAttackMaxAngle:30
barrelX:4
barrelOffsetX_onOddShots:-8
barrelY:8
limitingRange:800
turnSpeed:3

idleSweepSpeed:0.2
idleSweepDelay:600
idleSweepAddRandomDelay:120
idleSweepAngle:45
shouldResetTurret:false

aimOffsetSpread:0
recoilOffset: -1
recoilOutTime: 10
recoilReturnTime: 5

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/Vulcan_1.ogg
shoot_sound_vol:0.2
shoot_flame:MG_Fire_1_S



[projectile_Common_Turret_AA_Double_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0
turnSpeed:0

effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:175
    |DpDamage:5
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=1
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=1
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=3.0 
    |AntiLand=1
    |AntiSpace=3.0
    |HeightChangeSpeed=2
    |HeightHitRange=35
    |ProjectileSpeed:100
    |ProjectileSpread:6
    |ProjectileLife:7.5
)
"""







[attachment_DamageChecker_1]
x:0
y:0
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:false
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:true
smoothlyBlendPositionWhenExistingUnitAdded:true

onCreateSpawnUnitOf:DamageChecker_Building
createIncompleteIfParentIs:false

onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false