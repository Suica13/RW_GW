
[core]
copyFrom:"""
ROOT:Units/Buildings/Turret/Mod/Common_Turret.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Pink.gw
"""


name:Turret_BM_A
displayText:BM Turret Type A
displayText_zh:光束炮塔 A型

displayDescription:Requires 1 Money to maintain
displayDescription_zh:需要1资金以维持

@global Money=500
@global Resource=1250
@global buildTime=40

maxHp: 20000

#isUnrepairableUnit:true

[hiddenAction_Building_GetDone]
temporarilyAddTags:BuildingTurret_T2

[ai]
maxEachBase:2
maxGlobal:8


[hiddenAction_InitializeStats]
setUnitMemory:"""
baseDetectRange=500,

finalShootLevel=100,
finalCqbLevel=100,
finalAccuracyLevel=100,

finalBeamDef=0,
finalShellDef=15,
finalCqbDef=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""



[decal_A]
layer:afterBody
order:1
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_BM_1_A.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
isVisible:true
imageScale:1.5
dirOffset:0
teamColors:true
[decal_B]
layer:afterBody
order:2
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_BM_1_B.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
basePositionFromTurret:Common_Turret_BM_Double
isVisible:true
imageScale:0.75
xOffsetAbsolute: 0
yOffsetAbsolute: 0
dirOffset:0
teamColors:true



[turret_Common_Turret_BM_Double]
x: 0
y: 3

canShoot:true
canAttackCondition:if memory.buildDone==true
projectile:Common_Turret_BM_Double_Projectile

delay:1s
canAttackMaxAngle:5
barrelX:3
barrelOffsetX_onOddShots:-6
barrelY:12
limitingRange:650
turnSpeed:1

idleSweepSpeed:0.2
idleSweepDelay:600
idleSweepAddRandomDelay:120
idleSweepAngle:45
shouldResetTurret:false

aimOffsetSpread:0
recoilOffset: -1
recoilOutTime: 10
recoilReturnTime: 5

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamGun_3.ogg
shoot_sound_vol:0.45
shoot_flame:Beam_Fire_1_Pink



[projectile_Common_Turret_BM_Double_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0
turnSpeed:0

effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamGun_Pink*1
(
    addResources=
    BeamDamage:5000
    |DpDamage:175
    |WeaponAccuracy=100 
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |PartBreakModifier=1.0
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:80
    |ProjectileSpread:1
    |ProjectileLife:30
)
"""







[attachment_DamageChecker_1]
x:0
y:0
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:false
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:true
smoothlyBlendPositionWhenExistingUnitAdded:true

onCreateSpawnUnitOf:DamageChecker_Building
createIncompleteIfParentIs:false
onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false