
[core]
copyFrom:"""
ROOT:Units/Buildings/Turret/Mod/Common_Turret.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""


name:Turret_MG_B
displayText:MG Turret Type B
displayText_zh:机枪炮塔 B型

@global Money=250
@global Resource=750
@global buildTime=40

maxHp: 30000

#isUnrepairableUnit:true

[hiddenAction_Building_GetDone]
temporarilyAddTags:BuildingTurret_T1

[ai]
maxEachBase:3


[hiddenAction_InitializeStats]
setUnitMemory:"""
baseDetectRange=550,

finalShootLevel=110,
finalCqbLevel=100,
finalAccuracyLevel=120,

finalBeamDef=20,
finalShellDef=35,
finalCqbDef=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""



[decal_A]
layer:afterBody
order:1
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_MG_1_A.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
isVisible:true
imageScale:1.5
dirOffset:0
teamColors:true
[decal_B]
layer:afterBody
order:2
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_MG_1_B.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
basePositionFromTurret:Common_Turret_MG_Double
isVisible:true
imageScale:0.75
xOffsetAbsolute: 0
yOffsetAbsolute: 0
dirOffset:0
teamColors:true



[turret_Common_Turret_MG_Double]
x: 0
y: 3

canShoot:true
canAttackCondition:if memory.buildDone==true
projectile:Common_Turret_MG_Double_Projectile

delay:0.15s
canAttackMaxAngle:5
barrelX:3
barrelOffsetX_onOddShots:-5
barrelY:12
limitingRange:700
turnSpeed:1

idleSweepSpeed:0.2
idleSweepDelay:600
idleSweepAddRandomDelay:120
idleSweepAngle:45
shouldResetTurret:false

aimOffsetSpread:0
recoilOffset: -1
recoilOutTime: 10
recoilReturnTime: 5

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_1.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1



[projectile_Common_Turret_MG_Double_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0
turnSpeed:0

effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MG*1
(
    addResources=
    ShellDamage:1200
    |ShellAPDamage:350
    |DpDamage:75
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=1.0
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=1
    |AntiLand=1
    |AntiSpace=1.0
    |HeightChangeSpeed=2.0
    |HeightHitRange=20
    |ProjectileSpeed:90
    |ProjectileSpread:5
    |ProjectileLife:30
)
"""







[attachment_DamageChecker_1]
x:0
y:0
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:false
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:true
smoothlyBlendPositionWhenExistingUnitAdded:true

onCreateSpawnUnitOf:DamageChecker_Building
createIncompleteIfParentIs:false
onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false