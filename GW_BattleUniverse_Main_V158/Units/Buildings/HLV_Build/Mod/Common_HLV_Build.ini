[core]
dont_load:true
copyFrom:"""
ROOT:Template/Building/Common_Buildings_Repair.gw,
ROOT:Template/Building/Common_Buildings.gw,
ROOT:Template/Building/Common_Buildings_ByBuild.gw,
ROOT:Template/Building/Skill/DelSelf.gw,
ROOT:Resource/Image/Fx/Common/Common_Explosion_1.gw
"""

showOnMinimap:true
price: 5000
mass: 50000

tags:Building,SLChangeFaction,CanBeTargetUnit

disableAllUnitCollisions:false

price:Money=${Money},Resource=${Resource}
buildSpeed:0s
radius: 20
fogOfWarSightRange:1

isBuilding:true

footprint: 0,0,2,2
constructionFootprint: 0,0,2,2
buildingToFootprintOffsetX:21
buildingToFootprintOffsetY:20

#canNotBeDamaged:true
autoTriggerCooldownTime:0.1s
autoTriggerCheckRate:every8frames
autoTriggerCheckWhileNotBuilt:true

isUnselectableAsTarget:true


hideScorchMark:true
numBitsOnDeath:0
effectOnDeath:none

selfBuildRate:0s
@global Money=300
@global Resource=300
@global buildTime=35

@memory done:bool


[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""

"""




[hiddenAction_InitializeStats]
autoTriggerOnEvent:created
setUnitMemory:"""
finalDetectRange=1,

finalShootLevel=100,
finalCqbLevel=100,
finalAccuracyLevel=100,

finalBeamDef=0,
finalShellDef=0,
finalCqbDef=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""

setResourcesWithLogic:"""
PilotCustom=1
"""
[hiddenAction_Die]
autoTrigger:"""
if self.hp<=0 and memory.done==false
"""
spawnEffects:Explosion_Ground_1,Crater_1
deleteSelf:true


[hiddenAction_Building_GetDone]
requireConditional:if memory.done==false
setUnitMemory:done=true
alsoQueueAction:DeleteSelf
[hiddenAction_DeleteSelf]
buildSpeed:0.1s
deleteSelf:true

[hiddenAction_Get_SLChangeFaction]
autoTriggerOnEvent:newMessage(withTag="SLChangeFaction")
requireConditional:"""
if self.numberOfUnitsInTeam(withTag="StrategicLocation",withinrange=200)<=0 
and self.numberOfUnitsInAllyNotOwnTeam(withTag="StrategicLocation",withinrange=200)<=0 
"""
switchToTeam:eventData("TeamID",type="float")


[graphics]
image:SHARED:blank.png



showEnergyBar:false
showShieldBar:false
showShotDelayBar:false
showQueueBar:false

[attack]
canAttack:true
canAttackFlyingUnits:true
canAttackLandUnits:true
canAttackUnderwaterUnits:true
canAttackNotTouchingWaterUnits:true
canOnlyAttackUnitsWithTags:CanBeTargetUnit

[movement]
movementType: BUILDING
moveSpeed:0
maxTurnSpeed:10
targetHeight:1
targetHeightDrift:0




[ai]
buildPriority: 0.05

noneInBaseExtraPriority: 0.025

noneGlobalExtraPriority: 0.075

ai_upgradePriority:0.05

maxEachBase:1
maxGlobal:3


[placementRule_NearSL]
searchTags: HQ_NotCaptured,StrategicLocation
minCount:1
checkEachTile:true

searchTeam:ally
cannotPlaceMessage:Need Near SL Or HQ
cannotPlaceMessage_zh:需要靠近据点或基地
searchDistance:400
excludeIncompleteBuildings:true
excludeNonBuildings:false
