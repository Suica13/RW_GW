[core]
copyFrom:"""
ROOT:Template/UI/Common_UI.gw
"""


name:HostOption_VS_BulletSpeed
displayText:BulletSpeed
displayText_zh:子弹速度

radius:30

autoTriggerCooldownTime:0.01s
autoTriggerCooldownTime_allowDangerousHighCPU:true

@memory speedTest:float
@memory speedTestTimer:float

[action_VS_BulletSpeed_Up50]
pos:0
text:UP 50%
text_zh:提升 50%
displayType:action
buildSpeed:0s
isVisible:true
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Plus50.png
playSoundToPlayer:ROOT:Resource/Sound/SE/System/Button/Select_1.ogg

refundAllQueuedItems:true


sendMessageTo:customTarget1.customTarget1.readUnitMemory('GM',type='unit')
sendMessageWithTags:SetGameMode_Setting_BulletSpeed_Up
alsoTriggerAction:SpeedTest_B

[action_VS_BulletSpeed_Minus50]
@copyFromSection:action_VS_BulletSpeed_Up50
text:Minus 50%
text_zh:减少 50%
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Minus50.png

sendMessageTo:customTarget1.customTarget1.readUnitMemory('GM',type='unit')
sendMessageWithTags:SetGameMode_Setting_BulletSpeed_Down
alsoTriggerAction:SpeedTest_B



[decal_Icon]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_BulletSpeed.png
imageScale:0.25
xOffsetRelative:0
yOffsetRelative:0


[decal_Selected]
layer:beforeUI
onlyWhileAlive:true
onlyOnNonPreview:true
onlyWhenSelectedByAnyPlayer:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Selected_1.png
order:2
dirOffset:0
isVisible:true
alpha:1
imageScale:0.25


[decal_Text]
layer:beforeUI
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/Button_SelectBulletSpeed_2.png
order:3
dirOffset:0
isVisible:true
alpha:1
imageScale:0.35
yOffsetRelative:45




[decal_Setting_100P]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_100P.png
imageScale:0.25
xOffsetRelative:0
yOffsetRelative:0
isVisible:if self.resource().BulletSpeed<=1.00
[decal_Setting_150P]
@copyFromSection:decal_Setting_100P
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_150P.png
isVisible:if self.resource().BulletSpeed==1.50
[decal_Setting_200P]
@copyFromSection:decal_Setting_100P
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_200P.png
isVisible:if self.resource().BulletSpeed==2.00
[decal_Setting_250P]
@copyFromSection:decal_Setting_100P
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_250P.png
isVisible:if self.resource().BulletSpeed==2.50
[decal_Setting_300P]
@copyFromSection:decal_Setting_100P
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_300P.png
isVisible:if self.resource().BulletSpeed==3.00
[decal_Setting_350P]
@copyFromSection:decal_Setting_100P
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_350P.png
isVisible:if self.resource().BulletSpeed==3.50
[decal_Setting_400P]
@copyFromSection:decal_Setting_100P
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_400P.png
isVisible:if self.resource().BulletSpeed==4.00















[decal_SpeedTest]
layer:beforeUI
order:2
image:SHARED:white_pixel.png
onlyTeam:own
color:#07f8ff
alpha:1
imageScale:1
imageScaleX:100*(memory.speedTest/100)
imageScaleY:4
xOffsetAbsolute:(50*(memory.speedTest/100))-60
yOffsetAbsolute:-22
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if true
onlyWhileAlive:true
[decal_SpeedTest_Red]
layer:beforeUI
order:1.5
image:SHARED:white_pixel.png
onlyTeam:own
color:#f74848
alpha:0.75
imageScale:1
imageScaleX:40
imageScaleY:6
xOffsetAbsolute:51-10
yOffsetAbsolute:-22
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if true
onlyWhileAlive:true
[decal_SpeedTest_Bar]
layer:beforeUI
order:1
image:SHARED:white_pixel.png
onlyTeam:own
color:#000000
alpha:1
imageScale:1
imageScaleX:104
imageScaleY:8
xOffsetAbsolute:0-10
yOffsetAbsolute:-22
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if true
onlyWhileAlive:true
[decal_SpeedTest_Bar_2]
layer:beforeUI
order:1
image:SHARED:white_pixel.png
onlyTeam:own
color:#000000
alpha:1
imageScale:1
imageScaleX:44
imageScaleY:8
xOffsetAbsolute:51-10
yOffsetAbsolute:-22
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if true
onlyWhileAlive:true


[hiddenAction_SpeedTest_A]
autoTrigger:if true
setUnitMemory:speedTest=memory.speedTest+0.5*self.resource().BulletSpeed
[hiddenAction_SpeedTest_B]
autoTrigger:if self.timeAlive>memory.speedTestTimer
setUnitMemory:speedTestTimer=self.timeAlive+2,speedTest=0