[core]
copyFrom:"""
ROOT:Template/UI/Common_UI.gw
"""


name:HostOption_VS_Setting_AllowPMCUnit
displayText:PMC Unit
displayText_zh:PMC单位

radius:30

@memory AllowPMCUnit:float

[hiddenAction_InitializeStats]
setUnitMemory:AllowPMCUnit=customTarget1.customTarget1.readUnitMemory('AllowPMCUnit',type='float')

[action_VS_Setting_AllowPMCUnit_ON]
pos:0
text:PMC Unit:ON
text_zh:PMC单位:ON
displayType:action
buildSpeed:0s
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_TurnON.png
playSoundToPlayer:ROOT:Resource/Sound/SE/System/Button/Select_1.ogg

refundAllQueuedItems:true

isVisible:if memory.AllowPMCUnit==0

setUnitMemory:"""
AllowPMCUnit=1
"""
alsoTriggerAction:VS_Setting_AllowPMCUnit_Send

[action_VS_Setting_AllowPMCUnit_OFF]
@copyFromSection:action_VS_Setting_AllowPMCUnit_ON
text:PMC Unit:OFF
text_zh:PMC单位:OFF
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_TurnOFF.png
isVisible:if memory.AllowPMCUnit==1
setUnitMemory:"""
AllowPMCUnit=0
"""


[hiddenAction_VS_Setting_AllowPMCUnit_Send]
sendMessageTo:customTarget1.customTarget1
sendMessageWithTags:Change_AllowPMCUnit
sendMessageWithData:AllowPMCUnit=memory.AllowPMCUnit

[decal_Icon]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
