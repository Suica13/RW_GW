image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Selected_1.png
order:2
dirOffset:0
isVisible:true
alpha:1
imageScale:0.3



[decal_Setting_ON]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_ON.png
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:0
isVisible:if memory.AllowPMCUnit==1
[decal_Setting_OFF]
@copyFromSection:decal_Setting_ON
