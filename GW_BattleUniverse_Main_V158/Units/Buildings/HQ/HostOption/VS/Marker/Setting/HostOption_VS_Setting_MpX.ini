[core]
copyFrom:"""
ROOT:Template/UI/Common_UI.gw
"""


name:HostOption_VS_Setting_MpX
displayText:MpX
displayText_zh:战力倍率

radius:30

@memory MpX:float

[hiddenAction_InitializeStats]
setUnitMemory:MpX=customTarget1.customTarget1.readUnitMemory('MpX',type='float')

[action_VS_Setting_MpX_Up25]
pos:0
text:UP 25%
text_zh:提升 25%
displayType:action
buildSpeed:0s
isVisible:true
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Plus25.png
playSoundToPlayer:ROOT:Resource/Sound/SE/System/Button/Select_1.ogg

refundAllQueuedItems:true

setUnitMemory:"""
MpX=select(memory.MpX+0.25>3.0,3.0,memory.MpX+0.25)
"""
alsoTriggerAction:VS_Setting_MpX_Send

[action_VS_Setting_MpX_Minus25]
@copyFromSection:action_VS_Setting_MpX_Up25
text:Minus 25%
text_zh:减少 25%
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Minus25.png
setUnitMemory:"""
MpX=select(memory.MpX-0.25<0.25,0.25,memory.MpX-0.25)
"""

[hiddenAction_VS_Setting_MpX_Send]
sendMessageTo:customTarget1.customTarget1
sendMessageWithTags:Change_MpX
sendMessageWithData:MpX=memory.MpX



[decal_Icon]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_MpX.png
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:0


[decal_Selected]
layer:beforeUI
onlyWhileAlive:true
onlyOnNonPreview:true
onlyWhenSelectedByAnyPlayer:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Selected_1.png
order:2
dirOffset:0
isVisible:true
alpha:1
imageScale:0.3





[decal_Setting_25P]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_25P.png
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:0
isVisible:if memory.MpX==0.25
