[core]
copyFrom:"""
ROOT:Template/UI/Common_UI.gw
"""


name:HostOption_VS_Setting_TechShare
displayText:TechShare
displayText_zh:科技共享

radius:30

@memory TechShare:float

[hiddenAction_InitializeStats]
setUnitMemory:TechShare=customTarget1.customTarget1.readUnitMemory('TechShare',type='float')

[action_VS_Setting_TechShare_ON]
pos:0
text:TechShare:ON
text_zh:科技共享:ON
displayType:action
buildSpeed:0s
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_TurnON.png
playSoundToPlayer:ROOT:Resource/Sound/SE/System/Button/Select_1.ogg

refundAllQueuedItems:true

isVisible:if memory.TechShare==0

setUnitMemory:"""
TechShare=1
"""
alsoTriggerAction:VS_Setting_TechShare_Send

[action_VS_Setting_TechShare_OFF]
@copyFromSection:action_VS_Setting_TechShare_ON
text:TechShare:OFF
text_zh:科技共享:OFF
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_TurnOFF.png
isVisible:if memory.TechShare==1
setUnitMemory:"""
TechShare=0
"""


[hiddenAction_VS_Setting_TechShare_Send]
sendMessageTo:customTarget1.customTarget1
sendMessageWithTags:Change_TechShare
sendMessageWithData:TechShare=memory.TechShare

[decal_Icon]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_TechShare.png
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:0


[decal_Selected]
layer:beforeUI
onlyWhileAlive:true
onlyOnNonPreview:true
onlyWhenSelectedByAnyPlayer:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Selected_1.png
order:2
dirOffset:0
isVisible:true
alpha:1
imageScale:0.3



[decal_Setting_ON]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_ON.png
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:0
isVisible:if memory.TechShare==1
[decal_Setting_OFF]
@copyFromSection:decal_Setting_ON
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_OFF.png
isVisible:if memory.TechShare==0