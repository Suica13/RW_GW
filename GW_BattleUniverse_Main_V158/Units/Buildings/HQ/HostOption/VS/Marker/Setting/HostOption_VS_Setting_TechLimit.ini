[core]
copyFrom:"""
ROOT:Template/UI/Common_UI.gw
"""


name:HostOption_VS_Setting_TechLimit
displayText:TechLimit
displayText_zh:科技上限

radius:30

@memory TechLimit:float

[hiddenAction_InitializeStats]
setUnitMemory:TechLimit=customTarget1.customTarget1.readUnitMemory('TechLimit',type='float')

[action_VS_Setting_TechLimit_UP]
pos:0
text:Up 1 Tier
text_zh:提高1个级别
displayType:action
buildSpeed:0s
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_UpT1.png
playSoundToPlayer:ROOT:Resource/Sound/SE/System/Button/Select_1.ogg

refundAllQueuedItems:true

isVisible:if true

setUnitMemory:"""
TechLimit=select(memory.TechLimit+1>3,3,memory.TechLimit+1)
"""
alsoTriggerAction:VS_Setting_TechLimit_Send

[action_VS_Setting_TechLimit_DOWN]
@copyFromSection:action_VS_Setting_TechLimit_UP
text:Down 1 Tier
text_zh:降低1个级别
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_DownT1.png
setUnitMemory:"""
TechLimit=select(memory.TechLimit-1<1,1,memory.TechLimit-1)
"""


[hiddenAction_VS_Setting_TechLimit_Send]
sendMessageTo:customTarget1.customTarget1
sendMessageWithTags:Change_TechLimit
sendMessageWithData:TechLimit=memory.TechLimit

[decal_Icon]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_TechLimit.png
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:0


[decal_Selected]
layer:beforeUI
onlyWhileAlive:true
onlyOnNonPreview:true
onlyWhenSelectedByAnyPlayer:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Selected_1.png
order:2
dirOffset:0
isVisible:true
alpha:1
imageScale:0.3



[decal_Setting_T1]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_T1.png
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:0
isVisible:if memory.TechLimit==1
[decal_Setting_T2]
@copyFromSection:decal_Setting_T1
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_T2.png
isVisible:if memory.TechLimit==2
[decal_Setting_T3]
@copyFromSection:decal_Setting_T1
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_T3.png
isVisible:if memory.TechLimit==3