[hiddenAction_Check_AllowPMCTags_F]
requireConditional:if memory.allowPMCUnit==0 and self.globalTeamTags(includes='allowPMCUnit')
removeGlobalTeamTags:allowPMCUnit




[hiddenAction_CheckDie]
autoTrigger:"""
if self.resource.GameStart==1 and memory.gameOver==false and self.hp<=0
