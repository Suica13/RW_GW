[core]
dont_load:true
copyFrom:"""
ROOT:Template/Building/Common_Buildings.gw,
ROOT:Resource/Image/Fx/Common/Common_Explosion_1.gw
"""

showOnMinimap:true
price: 5000
mass: 50000

tags:Building,SLChangeFaction,SFS_ShowUI

disableAllUnitCollisions:false

price:Money=${Money},Resource=${Resource}
buildSpeed:0s
radius: 20
fogOfWarSightRange:1

isBuilding:true

footprint: 0,0,1,1
constructionFootprint: 0,0,1,1
buildingToFootprintOffsetX:21
buildingToFootprintOffsetY:20

#canNotBeDamaged:true
autoTriggerCooldownTime:1s
autoTriggerCheckRate:every8frames
autoTriggerCheckWhileNotBuilt:true

isUnselectableAsTarget:true


disableDeathOnZeroHp:true

hideScorchMark:true
numBitsOnDeath:0
effectOnDeath:none

selfBuildRate:0s
@global Money=300
@global Resource=300

whileNeutralTransportAnyTeam:false
whileNeutralConvertToTransportedTeam:false
stayNeutral:true

showOnMinimap:false

@memory hasUnit:bool

@memory deadTime:float
@memory onDead:bool


[hiddenAction_Start_BuildDone]
autoTriggerOnEvent:created
switchToTeam:-1

[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""

"""




[hiddenAction_InitializeStats]
autoTriggerOnEvent:created
setUnitMemory:"""
finalDetectRange=1,

finalShootLevel=100,
finalCqbLevel=100,
finalAccuracyLevel=100,

finalBeamDef=0,
finalShellDef=0,
finalCqbDef=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""
[hiddenAction_Die]
autoTrigger:"""
if self.hp<=0 and memory.onDead==false
"""
setUnitMemory:"""
onDead=true,
deadTime=self.timeAlive+1
"""
[hiddenAction_Die_Real]
autoTrigger:"""
if memory.onDead==true and self.timeAlive>=memory.deadTime
"""
deleteSelf:true
spawnEffects:Explosion_Ground_1,Crater_1




[hiddenAction_Get_SFS_TransportingNewUnit]
autoTriggerOnEvent:newMessage(withTag="SFS_TransportingNewUnit")
requireConditional:if self.teamId<0
switchToTeam:eventData('teamID',type='float')




[hiddenAction_Check_Detect]
requireConditional:false
[hiddenAction_Check_DetectRange]
requireConditional:false
[hiddenAction_Check_CanBeDetect]
requireConditional:false
[hiddenAction_Get_Detected]
requireConditional:false














[graphics]
image:SHARED:blank.png

showEnergyBar:false
showShieldBar:false
showShotDelayBar:false
showQueueBar:false

[attack]
canAttack:false
canAttackFlyingUnits:true
canAttackLandUnits:true
canAttackUnderwaterUnits:true
canAttackNotTouchingWaterUnits:true
canOnlyAttackUnitsWithTags:CanBeTargetUnit

[movement]
movementType: BUILDING
moveSpeed:0
maxTurnSpeed:10
targetHeight:1
targetHeightDrift:0



[ai]
buildPriority:0


maxEachBase:0
maxGlobal:0