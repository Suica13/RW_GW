[core]
dont_load:true

@memory Cover_Common_0079_Smoke_CDTimer:float
@memory Cover_Common_0079_Smoke_Target:unit

[action_Cover_Common_0079_Smoke]
@define WarLevel=200
@define CD=300
@define Money=2000

pos:100

buildSpeed:0s

highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
ai_isDisabled:true
extraLagHidingInUI:true

displayType:action
isGuiBlinking:"""
if self.timeAlive>memory.Cover_Common_0079_Smoke_CDTimer 
and self.resource().WarLevel>${WarLevel}
"""

text:Smoke %{select(self.timeAlive<=memory.Cover_Common_0079_Smoke_CDTimer,str(int(memory.Cover_Common_0079_Smoke_CDTimer-self.timeAlive))+"s","OK")}
text_zh:烟雾弹 %{select(self.timeAlive<=memory.Cover_Common_0079_Smoke_CDTimer,str(int(memory.Cover_Common_0079_Smoke_CDTimer-self.timeAlive))+"s","OK")}

description: Call Smoke\nAreaAlly:\nReaction+50%\nAntiDetect+200m\nShootDef Up\n15s
description_zh: 在指定区域呼叫烟雾打击\n范围友军:\n反应+50%\n反侦测+200m\n射击抗性上升\持续15秒

showMessageToAllPlayers:[%{self.playerName}]Called Smoke
showMessageToAllPlayers_zh:[%{self.playerName}]呼叫了烟雾弹

iconImage:ROOT:Resource/Image/Units/Button/Cover/Cover_MinovskyParticle_1.png
playSoundGlobally:ROOT:Resource/Sound/SE/Environment/Warning_4.ogg:0.75

isLocked:if self.timeAlive<=memory.Cover_Common_0079_Smoke_CDTimer
isLockedMessage:In CD
isLockedMessage_zh:冷却中
isLockedAlt:if self.resource().WarLevel<${WarLevel}
isLockedAltMessage:WarLevel ${WarLevel}
isLockedAltMessage_zh:激烈度 ${WarLevel}

fireTurretXAtGround:MainTurret
fireTurretXAtGround_count:0

price: Money=${Money}

setUnitMemory:"""
Cover_Common_0079_Smoke_CDTimer=self.timeAlive+${CD}
"""

alsoTriggerAction:"""
Cover_Common_0079_Smoke_Step2,
Cover_Common_0079_Smoke_Send_CV_Ally,
Cover_Common_0079_Smoke_Send_CV_Enemy
"""
[hiddenAction_Cover_Common_0079_Smoke_Step2]
buildSpeed:0s
setUnitMemory:"""
Cover_Common_0079_Smoke_Target=select
(
    self.isControlledByAI==false,
    thisActionTarget,
    memory.Cover_Common_0079_Smoke_Target
)
"""
alsoTriggerAction:Cover_Common_0079_Smoke_Step3
[hiddenAction_Cover_Common_0079_Smoke_Step3]
buildSpeed:0s
fireTurretXAtGround:MainTurret
fireTurretXAtGround_withTarget:memory.Cover_Common_0079_Smoke_Target
fireTurretXAtGround_withProjectile:Cover_Common_0079_Smoke_Projectile









[projectile_Cover_Common_0079_Smoke_Projectile]
#炮弹参数
directDamage: 0
life: 1
explodeOnEndOfLife:true
speed: 0
instant:true
#描画参数
effectOnCreate:none
explodeEffect:none
#生成
spawnUnit:"""
Projectile_MortarMarker_Skill_A_SmokeArea*1
(
    offsetRandomXY=0,
    addResources=
    ShellDamage:1000
    |DpDamage:100
    |WeaponAccuracy=100
    |PartBreakModifier=0.5
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiBuilding=0.25 
    |AntiAqua=0.75
    |AntiAir=0.5 
    |AntiLand=1
    |AntiSpace=1

    |ProjectileSpeed:60
    |ProjectileSpread:25
    |ProjectileExplosionRange:80
    |ProjectileLife:70
)
"""




[hiddenAction_Cover_Common_0079_Smoke_Send_CV_Ally]
takeResources_includeUnitsWithinRange:10000
takeResources_includeUnitsWithinRange_team:ally
takeResources_excludeUnitsWithoutTags:HQ
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:Cover_Common_0079_Smoke_Send_CV_Ally_Step2
[hiddenAction_Cover_Common_0079_Smoke_Send_CV_Ally_Step2]
sendMessageTo:thisActionTarget.readUnitMemory("cvMarker",type="unit").readUnitMemory('cvUnit',type='unit')
sendMessageWithTags:Play_AllyCover

[hiddenAction_Cover_Common_0079_Smoke_Send_CV_Enemy]
takeResources_includeUnitsWithinRange:10000
takeResources_includeUnitsWithinRange_team:enemy
takeResources_excludeUnitsWithoutTags:HQ
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:Cover_Common_0079_Smoke_Send_CV_Enemy_Step2
[hiddenAction_Cover_Common_0079_Smoke_Send_CV_Enemy_Step2]
sendMessageTo:thisActionTarget.readUnitMemory("cvMarker",type="unit").readUnitMemory('cvUnit',type='unit')
sendMessageWithTags:Play_EnemyCover