
[core]
dont_load:true


tags:TileModeMarker
name: TileModeMarker
displayText: TileModeMarker

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000
armour:60


techLevel: 1
buildSpeed: 0.001
radius: 30

isUnselectable:true
canNotBeGivenOrdersByPlayer:false

showInEditor:true
disableAllUnitCollisions:true


canNotBeDamaged:true
canNotBeDirectlyAttacked:true
createNeutral:true
stayNeutral:true

@global sendRange=1000
[hiddenAction_CheckTeam]
autoTrigger:if self.teamId>=0
switchToTeam:-1

[hiddenAction_Send_Setting_TileMode]
autoTrigger:true
takeResources_includeUnitsWithinRange:${sendRange}
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:Unit,Building
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:Send_Setting_TileMode_Step2
[hiddenAction_Send_Setting_TileMode_Step2]
sendMessageTo:thisActionTarget
sendMessageWithTags:Setting_TileMode
sendMessageWithData:tileMode=0

[graphics]
total_frames: 1

image:        SHARED:blank.png
image_back:   NONE
image_wreak:  NONE

image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1

showQueueBar:false


[turret_1]
x: 0
y: 0

barrelX:0
barrelY:0

invisible:true

limitingAngle:360
aimOffsetSpread:0


shoot_flame:none
canShoot:false
projectile:1

limitingRange:5000
[projectile_1]

directDamage: 0
life: 1
explodeOnEndOfLife:true
speed: 1
instant:true
invisible:true
targetGround:true
effectOnCreate:none
explodeEffect:none
drawUnderUnits:true
image:none

[attack]
canAttack: false
canAttackFlyingUnits:true
canAttackLandUnits:true
canAttackUnderwaterUnits:true
canAttackNotTouchingWaterUnits:true
maxAttackRange:${sendRange}

[movement]
movementType: AIR
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1


[ai]
useAsTransport:false
