
[core]


tags:AggressiveNeutralMarker
name: AggressiveNeutralMarker
displayText:AggressiveNeutralMarker

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000
armour:60


techLevel: 1
buildSpeed: 0.001
radius: 25

isUnselectable:true

showInEditor:false
disableAllUnitCollisions:true


canNotBeDamaged:true
canNotBeDirectlyAttacked:true

onNewMapSpawn:mapCenter_asNeutral



@memory GM:unit

[hiddenAction_ChangeTeam]
autoTriggerOnEvent:created
switchToTeam:-2


[hiddenAction_FindGM]
autoTrigger:if memory.GM.hp<= 0
takeResources_includeUnitsWithinRange:99999
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:GameManager
takeResources_searchOnly:true
takeResources_maxUnits:1
takeResources_triggerActionForEach:FindGM_Step2
[hiddenAction_FindGM_Step2]
sendMessageTo:thisActionTarget
sendMessageWithData:unitInfo=self
sendMessageWithTags:FindGM
setUnitMemory:GM=thisActionTarget



[hiddenAction_SetBulletSpeed]
autoTrigger:if memory.GM.hp>0
setResourcesWithLogic:BulletSpeed=memory.GM.resource().BulletSpeed

[graphics]
total_frames: 1

image:        SHARED:blank.png
image_back:   NONE
image_wreak:  NONE

image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1

showQueueBar:false


[attack]
canAttack: false


[movement]
movementType: AIR
moveSpeed: 10
moveAccelerationSpeed: 10
moveDecelerationSpeed: 10

maxTurnSpeed: 10
turnAcceleration: 10


[ai]
useAsTransport:false
