
[core]
dont_load:true


tags:WeatherSystemMarker,Unit
name: WeatherSystemMarker
displayText: WeatherSystemMarker

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000
armour:60


techLevel: 1
buildSpeed: 0.001
radius: 1

isUnselectable:true
canNotBeGivenOrdersByPlayer:true

showInEditor:true
disableAllUnitCollisions:true

showOnMinimap:false

canNotBeDamaged:true
canNotBeDirectlyAttacked:true

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.1s


@memory HQ:unit

@memory weatherFrame:float
@memory nowTimeOfDayIndex:float
@memory nowWeatherIndex:float



[hiddenAction_FindHQ_WeatherSystemMarker]
autoTrigger:if memory.HQ.hp<= 0
takeResources_includeUnitsWithinRange:99999
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:HQ
takeResources_searchOnly:true
takeResources_maxUnits:1
takeResources_triggerActionForEach:FindHQ_WeatherSystemMarker_Step2
[hiddenAction_FindHQ_WeatherSystemMarker_Step2]
setUnitMemory:HQ=thisActionTarget


[hiddenAction_Get_TileMode]
autoTriggerOnEvent:newMessage(withTag="Setting_TileMode")
setResourcesWithLogic:tileMode=eventData('tileMode',type='float')

[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
GetCameraSize,
UpdateWeatherFrame,
Get_Setting_Weather,
Get_Setting_TimeOfDay
"""


[hiddenAction_GetCameraSize]
setBodyRotation:90
teleportTo:"""
self.getScreenCenterAsMarker.getOffsetAbsolute(
    x=game.cameraWidth * 0.075,
    y=game.cameraHeight * 0.05
)
"""

[hiddenAction_UpdateWeatherFrame]
setUnitMemory:weatherFrame=select(memory.weatherFrame>=4-1,0,memory.weatherFrame+1)




[hiddenAction_Get_Setting_Weather]
alsoTriggerAction:"""
Get_Setting_Weather_SetWeather_Normal,
Get_Setting_Weather_SetWeather_Rain,
Get_Setting_Weather_SetWeather_Storm,
Get_Setting_Weather_SetWeather_None
"""

[hiddenAction_Get_Setting_Weather_SetWeather_Normal]
requireConditional:"""
if memory.nowWeatherIndex!=0 and self.resource().WeatherIndex==0
"""
setUnitMemory:nowWeatherIndex=0
convertTo:WeatherSystemMarker_Normal

[hiddenAction_Get_Setting_Weather_SetWeather_Rain]
requireConditional:"""
if memory.nowWeatherIndex!=1 and self.resource().WeatherIndex==1
"""
setUnitMemory:nowWeatherIndex=1
convertTo:WeatherSystemMarker_Rain

[hiddenAction_Get_Setting_Weather_SetWeather_Storm]
requireConditional:"""
if memory.nowWeatherIndex!=2 and self.resource().WeatherIndex==2
"""
setUnitMemory:nowWeatherIndex=2
convertTo:WeatherSystemMarker_Storm

[hiddenAction_Get_Setting_Weather_SetWeather_None]
requireConditional:"""
if memory.nowWeatherIndex!=99 and self.resource().WeatherIndex==99
"""
setUnitMemory:nowWeatherIndex=99
convertTo:WeatherSystemMarker_None


[hiddenAction_Get_Setting_TimeOfDay]
setUnitMemory:nowTimeOfDayIndex=self.resource().TimeOfDayIndex







