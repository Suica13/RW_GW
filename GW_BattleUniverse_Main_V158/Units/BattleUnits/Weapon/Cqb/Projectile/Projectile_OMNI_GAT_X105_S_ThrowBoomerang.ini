
[core]

copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Template/Shoot_APProjectile_Cqb_Boomerang.ini,
ROOT:Resource/Image/Fx/Weapon/Cqb/Common/Cqb_Hit_1.gw,
ROOT:Resource/Image/Fx/Common/Common_Light_1.gw
"""

name:Projectile_OMNI_GAT_X105_S_ThrowBoomerang

maxHp:300

@memory dirFloat:float
@memory rotFrame:float


[hiddenAction_Start_randomDirFloat]
autoTriggerOnEvent:created
setUnitMemory:dirFloat=rnd(0,360)


[hiddenAction_Update_dirFloat]
autoTrigger:true
setUnitMemory:dirFloat=select(memory.dirFloat>=360,0,memory.dirFloat+25*self.Resource.BulletSpeed)

[hiddenAction_Update_rotFrame]
autoTrigger:true
setUnitMemory:"""
rotFrame=
select
(
    memory.rotFrame>=${decal_Projectile_Bot.total_frames}-0.05,
    0,
    memory.rotFrame+0.05*self.Resource.BulletSpeed
)
"""

[decal_Projectile_Bot]
layer:beforeUI
order:5
onlyWhileAlive:true 
isVisible:true
imageScale:0.5
alpha:1
total_frames:3
frame:memory.rotFrame
xOffsetRelative: 0
yOffsetRelative: 0
dirOffset:0
basePosition:self.getOffsetRelative(dirOffset=memory.dirFloat)
image:ROOT:Resource/Image/Bullet/Sp/EF_BeamSaber_Throw_Bot.png

[projectile_Hit_Effect]
explodeEffect:Cqb_Hit_1
pushForce:250
[hiddenAction_SpawnDeleteEffect]
spawnEffects:Light_25

[attachment_HitBox0]
onCreateSpawnUnitOf:Projectile_AP_Check_M


[hiddenAction_Start_SendCustomTarget1]
sendMessageWithTags:Cqb_Boomerang_OMNI_GAT_X105_S_ThrowBoomerang