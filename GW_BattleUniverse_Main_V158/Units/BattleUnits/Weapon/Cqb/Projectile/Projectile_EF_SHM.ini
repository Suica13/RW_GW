
[core]

copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Template/Shoot_RodProjectile_Cqb.ini,
ROOT:Resource/Image/Fx/Weapon/Cqb/Common/Cqb_Hit_2.gw,
ROOT:Resource/Image/Fx/Common/Common_Light_1.gw
"""

name:Projectile_EF_SHM

@memory boostFrame:float


[hiddenAction_UpdateboostFrame]
autoTrigger:true
setUnitMemory:boostFrame=select(memory.boostFrame>=${decal_Boost.total_frames}-0.05,0,memory.boostFrame+0.05)


[decal_Boost]
layer:beforeBody
order:4
isVisible:true
onlyWhileAlive:true
image:ROOT:\Resource\Image\Fx\Unit\Image\Boost_1.png
total_frames:3
frame:memory.boostFrame
xOffsetRelative: -2.5
yOffsetRelative:-12
dirOffset:0
imageScale:2
imageScaleY:1.5
alpha:0.75

[decal_Projectile_Image]
layer:beforeUI
order:6
onlyWhileAlive:true 
isVisible:true
imageScale:0.75
xOffsetRelative: 0
yOffsetRelative: -10
dirOffset:0
image:ROOT:Resource/Image/Bullet/Sp/EF_SHM.png

[hiddenAction_Send_RodSpawn]
sendMessageWithTags:RodSpawn_EF_SHM
sendMessageWithData:unitInfo=self


[projectile_Hit_Effect]
explodeEffect:Cqb_Hit_2
pushForce:5000

[hiddenAction_SpawnDeadEffect]
spawnEffects:Light_25
