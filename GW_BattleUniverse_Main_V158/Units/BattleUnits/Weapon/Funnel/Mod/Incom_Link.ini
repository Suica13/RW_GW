#核心
[core]
dont_load:true
copyFrom:"""
ROOT:Resource/Image/Fx/Common/Common_Light_1.gw,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/Explosion_Hit_1.gw
"""
tags:IncomLink
name:IncomUnit_Link

showOnMinimap:false
price: 5000
maxHp: 500
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

disableDeathOnZeroHp:true

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false


@memory IncomLinkIndex:float
@memory IncomLinkLast:unit








[hiddenAction_DelSelf]
autoTrigger:if customTarget1.hp<=0
deleteSelf:true

[hiddenAction_Send_IncomLinkSpawn]
autoTriggerOnEvent:created
sendMessageTo:customTarget1
sendMessageWithTags:IncomLinkSpawn
sendMessageWithData:unitInfo=self



[hiddenAction_Get_Spawn_IncomLinkSpawn]
autoTriggerOnEvent:newMessage(withTag="IncomLinkIndex")
setUnitMemory:"""
IncomLinkIndex=eventData("IncomLinkIndex",type="float"),
IncomLinkLast=eventData("IncomLinkLast",type="unit")
"""

[hiddenAction_Get_DelIncomLink]
autoTriggerOnEvent:newMessage(withTag="DelIncomLink")
deleteSelf:true

[hiddenAction_TryNearCustomTarget1]
autoTrigger:if self.numberOfQueuedWaypoints<1
addWaypoint_target_fromReference:customTarget1
addWaypoint_type:touchTarget

[decal_DrawLineTo_Incom]
layer:beforeBody
order:6
alpha:1
drawLineTo:customTarget1
color:#333333
imageScale:0.75
lineWidth:1
xOffsetRelative: 0
yOffsetRelative: 0
onlyOnNonPreview:true
isVisible:if self == customTarget1.readUnitMemory('Incom_LinkUnits_Last',type='unit')
onlyWhileAlive:true


[decal_DrawLineTo_LastLink]
layer:beforeBody
order:6
alpha:0.75
drawLineTo:memory.IncomLinkLast
color:#333333
imageScale:0.75
lineWidth:1
xOffsetRelative: 0
yOffsetRelative: 0
onlyOnNonPreview:true
isVisible:if true
onlyWhileAlive:true


[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true
#显示进度条
showHealthBar:false
showEnergyBar:false
showShieldBar:false
showTransportBar:false
showQueueBar:false
showShotDelayBar:false
disableLowHpFire:true
disableLowHpSmoke:true

[attack]
canAttack:false
canAttackFlyingUnits:true
canAttackLandUnits:true
canAttackNotTouchingWaterUnits:true
canAttackUnderwaterUnits:true
canOnlyAttackUnitsWithTags:CanBeTargetUnit
#固定射击/停止主动攻击
isFixedFiring:true
isMelee:false
#meleeEngangementDistance:0
disablePassiveTargeting:false
#炮台多目标
turretMultiTargeting:false
#炮塔随身体旋转
turretRotateWithBody:true
#显示攻击范围
showRangeUIGuide:true

[movement]

movementType: Air
moveSpeed:0.1
maxTurnSpeed:0
turnAcceleration:0
reverseSpeedPercentage:0

targetHeight:1
targetHeightDrift:1
heightChangeRate:1
moveSlidingMode:true
moveSlidingDir:360
moveIgnoringBody:true


[ai]
useAsTransport:false
useAsBuilder: false

