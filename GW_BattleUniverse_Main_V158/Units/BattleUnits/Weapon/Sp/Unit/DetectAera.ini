finalFogOfWarSightRange=15,
finalDetectRange=memory.finalFogOfWarSightRange*18
"""


[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
Check_DetectEnemy
"""
setUnitStats:"""
fogOfWarSightRange=memory.finalFogOfWarSightRange
"""

[hiddenAction_Check_DetectEnemy]
takeResources_includeUnitsWithinRange:${detectRange}
takeResources_includeUnitsWithinRange_team:enemy
takeResources_excludeUnitsWithoutTags:CanBeDetected
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:Check_DetectEnemy_Step2
[hiddenAction_Check_DetectEnemy_Step2]
requireConditional:"""
if not thisActionTarget.tags(includes='AntiDetect') 
and distanceBetween(self,thisActionTarget)+thisActionTarget.readUnitMemory("finalAntiDetectRange",type="float")<memory.finalDetectRange 
*select(self.height>=1 and thisActionTarget.height<1 and not self.tags(includes="Sonar"),0.5,1)
*select(self.height<1 and thisActionTarget.height>=1 and not self.tags(includes="Sonar"),0.5,1)
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:Detected
sendMessageWithData:"""
unitInfo=self
"""


