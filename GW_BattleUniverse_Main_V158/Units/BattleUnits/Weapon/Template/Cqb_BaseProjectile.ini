
[core]
dont_load:true

name:Cqb_BaseProjectile
tags:CqbBullet

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
ignoreInUnitCapCalculation:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s
autoTriggerCheckRate:every8Frames

@memory thisTimeMissTarget:bool

@memory firstTarget:unit
@memory triedDamageTarget:unit[]
@memory canAttackTimes:float


@memory finalShootLevel:float
@memory finalCqbLevel:float
@memory finalAccuracyLevel:float

@memory extraBuildingAtk:float

@memory projectileSpeed:float
@memory projectileSpread:float
@memory projectileLife:float

@memory xAbsoluteCustomTarget1:float
@memory yAbsoluteCustomTarget1:float


@memory attacker:unit


@memory LastUpdateTime:float
@memory DeltaTime:float


[hiddenAction_SetAttacker]
setUnitMemory:attacker=customTarget1.readUnitMemory('attacker',type='unit')
[hiddenAction_SetFirstTarget]
setUnitMemory:firstTarget=customTarget1.attacking



[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""
setUnitMemory:"""
xAbsoluteCustomTarget1=self.x-customTarget1.x,
yAbsoluteCustomTarget1=self.y-customTarget1.y
"""


[hiddenAction_Start]
alsoTriggerAction:"""
SetAttacker,
SetFirstTarget,
Start_SetStats,
Start_SetTarget,
Start_SetDir,
Start_SendAttackInfo
"""




[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
TeleportToCustomTarget1,
CheckDeltaTime,
Moving_Forward
"""
[hiddenAction_TeleportToCustomTarget1]
requireConditional:if self.resource().ProjectileSpeed<=0
teleportTo:customTarget1.getOffsetAbsolute(x=memory.xAbsoluteCustomTarget1,y=memory.yAbsoluteCustomTarget1)
setBodyRotation:customTarget1.dir


[hiddenAction_CheckDeltaTime]
setUnitMemory:"""
DeltaTime=1+min(self.timeAlive - memory.LastUpdateTime, 0.05),
LastUpdateTime=self.timeAlive
"""


[hiddenAction_Start_SetStats]
setUnitMemory:"""
finalShootLevel=customTarget1.readUnitMemory(name="finalShootLevel",type="float"),
finalCqbLevel=customTarget1.readUnitMemory(name="finalCqbLevel",type="float"),
finalAccuracyLevel=customTarget1.readUnitMemory(name="finalAccuracyLevel",type="float"),
extraBuildingAtk=customTarget1.readUnitMemory(name="extraBuildingAtk",type="float"),
canAttackTimes=self.Resource.ProjectileAttackTimes,
projectileSpeed=self.Resource.ProjectileSpeed*0.1*self.Resource.BulletSpeed*1.25,
projectileLife=self.Resource.ProjectileLife
"""
setUnitStats:"""
targetHeight=customTarget1.height
"""
setHeight=customTarget1.height

[hiddenAction_Start_SetTarget]
requireConditional:"""
if customTarget1.attacking.hp>0  
"""
setBodyRotation:"""
select
(
    not (directionBetween(self, customTarget1.attacking) < self.dir-15 or directionBetween(self, customTarget1.attacking) > self.dir+15),
    directionBetween(self,customTarget1.attacking),
    self.dir
)
"""
setUnitStats:targetHeight=customTarget1.attacking.height
[hiddenAction_Start_SetDir]
setBodyRotation:self.dir+rnd(-memory.projectileSpread,memory.projectileSpread)



[hiddenAction_Start_SendAttackInfo]
sendMessageTo:memory.firstTarget.readUnitMemory("battleUnitCore",type="unit")
sendMessageWithTags:AttackInfo_Bullet
sendMessageWithData:"""
bulletInfo=self,
accuracy=memory.finalAccuracyLevel,
cantDodge=self.resource.CantDodge
"""

[hiddenAction_Get_ThisTimeMissTarget]
autoTriggerOnEvent:newMessage(withTag="ThisTimeMissTarget")
setUnitMemory:"""
thisTimeMissTarget=true
"""


[hiddenAction_TryDamageTarget]
autoTriggerOnEvent:newMessage(withTag="AttackTarget")
requireConditional:"""
if not memory.triedDamageTarget.contains(eventData(name="unitInfo",type="unit").readUnitMemory('coreUnit',type='unit')) 
and memory.canAttackTimes>0 
and max(-(eventData(name="unitInfo",type="unit").height-self.height),(eventData(name="unitInfo",type="unit").height-self.height))<=self.resource().HeightHitRange 
and 
(
    not memory.triedDamageTarget.contains(eventData(name="unitInfo",type="unit"))
)
"""
setUnitMemory:"""
triedDamageTarget[memory.triedDamageTarget.size]=
select
(
    eventData(name="unitInfo",type="unit").tags(includes='GundamWarsCompatibleUnit'),
    eventData(name="unitInfo",type="unit"),
    eventData(name="unitInfo",type="unit").readUnitMemory('coreUnit',type='unit')
)
"""
sendMessageTo:eventData(name="unitInfo",type="unit")
sendMessageWithTags:TryDamage
sendMessageWithData:"""
bulletInfo=self,
accuracy=memory.finalAccuracyLevel*0.01*self.Resource.WeaponAccuracy*0.01*select(eventData(name="unitInfo",type="unit").parent==memory.firstTarget or self.resource.SubEquipmentIndex==1,1,0.75)
"""
[hiddenAction_AttackTarget]
autoTriggerOnEvent:newMessage(withTag="DoDamage")
sendMessageTo:eventData(name="damageTarget",type="unit")
sendMessageWithTags:Damage_Cqb
sendMessageWithData:"""
DpDamage=self.Resource.dpDamage*memory.finalCqbLevel*0.01,
CqbDamage=self.Resource.cqbDamage*memory.finalCqbLevel*0.01,
CqbAPDamage=self.Resource.cqbAPDamage*memory.finalCqbLevel*0.01,
CqbBeamDamage=self.Resource.cqbBeamDamage*memory.finalCqbLevel*0.01,
CqbShellDamage=self.Resource.cqbShellDamage*memory.finalCqbLevel*0.01,

PartBreakModifier=self.Resource.PartBreakModifier,
CockpitBreakModifier=self.Resource.CockpitBreakModifier,
PilotDamageModifier=self.Resource.PilotDamageModifier,
PilotTrueDamage=self.Resource.PilotTrueDamage,
AntiSizeLargeDamage=self.Resource.AntiSizeLargeDamage,
AntiSizeSmallDamage=self.Resource.AntiSizeSmallDamage,
AntiSizeLargeAccuracy=self.Resource.AntiSizeLargeAccuracy,
AntiSizeSmallAccuracy=self.Resource.AntiSizeSmallAccuracy,

Accuracy=memory.finalAccuracyLevel*0.01*self.Resource.WeaponAccuracy*0.01*select(eventData(name="damageTarget",type="unit")==memory.firstTarget or self.resource.SubEquipmentIndex==1,1,0.75),
AntiLand=self.Resource.AntiLand,
AntiAqua=self.Resource.AntiAqua,
AntiSpace=self.Resource.AntiSpace,
AntiAir=self.Resource.AntiAir,
AntiBuilding=self.Resource.AntiBuilding*memory.extraBuildingAtk,
CantDodge=self.Resource.CantDodge,
attacker=memory.attacker,
bulletInfo=self
"""
setUnitMemory:"""
canAttackTimes=memory.canAttackTimes-
select
(
    eventData(name="damageTarget",type="unit").tags(includes='GundamWarsCompatibleUnit'),
    0.25,
    1
)
"""
alsoTriggerAction:"""
SendDeBuff
"""
fireTurretXAtGround:Hit_Effect
fireTurretXAtGround_withTarget:eventData(name="damageTarget",type="unit")
[hiddenAction_SendDeBuff]
sendMessageTo:eventData(name="damageTarget",type="unit").parent.readUnitMemory('BattleUnitCore',type='unit')
sendMessageWithTags:DeBuff
sendMessageWithData:"""
burnedDamage=self.Resource.BurnedDamage,
stunDamage=self.Resource.StunDamage,
jammingDamage=self.Resource.jammingDamage,
atkDownS=self.Resource.AtkDownDamage,
defDownS=self.Resource.DefDownDamage,
speedDownM=self.Resource.SpeedDownDamage,
attacker=customTarget1,
bulletInfo=self
"""


[hiddenAction_Moving_Forward]
requireConditional:if self.resource().ProjectileSpeed>0
teleportTo:self.getOffsetRelative(y=memory.projectileSpeed * memory.DeltaTime)



[hiddenAction_DeleteSelf]
autoTrigger:if self.timeAlive>memory.projectileLife or customTarget1.readUnitMemory(name="BattleUnitCore", type="unit").readUnitMemory(name="cantAction", type="bool")==true
deleteSelf:true



