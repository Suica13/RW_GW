
[core]


copyFrom:"""
ROOT:Template/Unit/Transport_Hangar.ini
"""





name:Hangar_X12_HLV

displayText:Hangar[HLV]
displayText_zh:格纳库[HLV]



displayRadius:50
radius:35


maxTransportingUnits:12



[hiddenAction_Check_HLV_Hangar]
autoTrigger:true
alsoTriggerAction:"""
Check_HLV_Hangar_T,
Check_HLV_Hangar_F
"""
[hiddenAction_Check_HLV_Hangar_T]
requireConditional:"""
if 
(
    self.transportingCount>=${core.maxTransportingUnits}/3 
    or 
    (
        parent.readUnitMemory("Common_ReEntry_HLV_FromSpace_Active",type="bool")==true 
        or 
        parent.readUnitMemory("Common_ReEntry_HLV_Active",type="bool")==true 
    )
) 
and self.tags(includes='HLV_Hangar')
"""
temporarilyRemoveTags:HLV_Hangar
sendMessageTo:parent
sendMessageWithTags:HLV_Hanger_Ready
[hiddenAction_Check_HLV_Hangar_F]
requireConditional:"""
if self.transportingCount<${core.maxTransportingUnits}/3 and not self.tags(includes='HLV_Hangar') 
and 
(
    parent.readUnitMemory("Common_ReEntry_HLV_FromSpace_Active",type="bool")==false 
    and 
    parent.readUnitMemory("Common_ReEntry_HLV_Active",type="bool")==false 
) 
and 
(
    parent.resource().EquipmentIndex==1
)
"""
temporarilyAddTags:HLV_Hangar


[hiddenAction_GetExit]
