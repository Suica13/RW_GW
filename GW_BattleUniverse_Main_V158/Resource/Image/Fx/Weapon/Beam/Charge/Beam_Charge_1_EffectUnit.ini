
[core]
dont_load:false

tags:EffectUnit,UnitTurret

name:Beam_Charge_1_EffectUnit

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory onPlay:float
@memory beam_Charge_1_effectFrame:float

@memory beam_Charge_1_color:float
@memory beam_Charge_1_speed:float

@global beam_Charge_1_total_frames=12

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
UpdateFrame,
EndPlay
"""




[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true





[hiddenAction_SetStats]
setUnitMemory:beam_Charge_1_effectFrame=-1

[hiddenAction_PlayOneTime]
autoTriggerOnEvent:newMessage(withTag="PlayOneTime")
setUnitMemory:onPlay=1,beam_Charge_1_effectFrame=0

[hiddenAction_StopPlay]
autoTriggerOnEvent:newMessage(withTag="StopPlay")
setUnitMemory:onPlay=0,beam_Charge_1_effectFrame=-1


[hiddenAction_UpdateFrame]
requireConditional:if memory.onPlay==1 and memory.beam_Charge_1_effectFrame<=12
setUnitMemory:beam_Charge_1_effectFrame=memory.beam_Charge_1_effectFrame+0.01*memory.beam_Charge_1_speed

[hiddenAction_EndPlay]
requireConditional:if memory.beam_Charge_1_effectFrame>12 or parent.readUnitMemory(name="BattleUnitCore", type="unit").readUnitMemory(name="cantAction", type="bool")==true
setUnitMemory:onPlay=0,beam_Charge_1_effectFrame=-1



[hiddenAction_SetSpeed]
autoTriggerOnEvent:newMessage(withTag="SetSpeed")
setUnitMemory:beam_Charge_1_speed=eventData("Speed",type="float")*self.Resource.BulletSpeed

[hiddenAction_SetColor_Pink]
autoTriggerOnEvent:newMessage(withTag="SetColor_Pink")
setUnitMemory:beam_Charge_1_color=1
[hiddenAction_SetColor_Yellow]
autoTriggerOnEvent:newMessage(withTag="SetColor_Yellow")
setUnitMemory:beam_Charge_1_color=2
[hiddenAction_SetColor_Blue]
autoTriggerOnEvent:newMessage(withTag="SetColor_Blue")
setUnitMemory:beam_Charge_1_color=3
[hiddenAction_SetColor_Green]
autoTriggerOnEvent:newMessage(withTag="SetColor_Green")
setUnitMemory:beam_Charge_1_color=4
[hiddenAction_SetColor_Red]
autoTriggerOnEvent:newMessage(withTag="SetColor_Red")
setUnitMemory:beam_Charge_1_color=5
[hiddenAction_SetColor_Red_B]
autoTriggerOnEvent:newMessage(withTag="SetColor_Red_B")
setUnitMemory:beam_Charge_1_color=6

[decal_Beam_Charge_1_Pink]
layer:beforeUI
onlyTeam:any
order:1
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_1_Pink.png

total_frames:${beam_Charge_1_total_frames}
frame:memory.beam_Charge_1_effectFrame

imageScale:0.65
alpha:select(memory.beam_Charge_1_effectFrame>=0,1,0)

yOffsetRelative:20

onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if memory.beam_Charge_1_color==1 and self.timeAlive>1
[decal_Beam_Charge_1_Yellow]
@copyFromSection:decal_Beam_Charge_1_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_1_Yellow.png
isVisible:if memory.beam_Charge_1_color==2 and self.timeAlive>1
[decal_Beam_Charge_1_Blue]
@copyFromSection:decal_Beam_Charge_1_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_1_Blue.png
isVisible:if memory.beam_Charge_1_color==3 and self.timeAlive>1
[decal_Beam_Charge_1_Green]
@copyFromSection:decal_Beam_Charge_1_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_1_Green.png
isVisible:if memory.beam_Charge_1_color==4 and self.timeAlive>1
[decal_Beam_Charge_1_Red]
@copyFromSection:decal_Beam_Charge_1_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_1_Red.png
isVisible:if memory.beam_Charge_1_color==5 and self.timeAlive>1
[decal_Beam_Charge_1_Red_B]
@copyFromSection:decal_Beam_Charge_1_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_1_Red_B.png
isVisible:if memory.beam_Charge_1_color==6 and self.timeAlive>1

[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:1
maxTurnSpeed:100
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false
