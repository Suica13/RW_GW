
[core]
dont_load:true

copyFrom:"""

"""

tags:Hangar,Transport_Hangar,TransportHangar,TransportHangar_Base,UnitTurret
name:Transport_Hangar



showActionsWithMixedSelectionIfOtherUnitsHaveTag:Transport_Hangar

showOnMinimap:false
price: 0
maxHp: 1313
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 45
fogOfWarSightRange:0

ignoreInUnitCapCalculation:true


showInEditor:false

autoTriggerCooldownTime:0.1s
autoTriggerCheckRate:every8Frames

stayNeutral:true


maxTransportingUnits:2
transportUnitsRequireMovementType:AIR,LAND,WATER,OVER_CLIFF_WATER,OVER_CLIFF
transportUnitsRequireTag:CanLoadInto,CanLoadIntoSpace,CanLoadIntoAir
transportUnitsKillOnDeath:true
transportUnitsBlockOtherTransports:false
transportUnitsCanUnloadUnits:true

transportUnitsAddUnloadOption:false
transportUnitsOnTeamChangeKeepCurrentTeam:true
transportUnitsUnloadDelayBetweenEachUnit: 0.5s


exit_x:0
exit_y:20
exit_moveAwayAmount:150
exit_dirOffset:0




@global allowAI=parent.readUnitMemory('allowAI',type='bool')
@global hangarSize=12

@memory supplyUnitCD:float
@memory onDelete:bool
@memory deleteTimer:float


[hiddenAction_GetTileMode]
autoTrigger:true
setResourcesWithLogic:TileMode=parent.resource().TileMode

[action_UnloadAllUnits]
autoTriggerOnEvent:newMessage(withTag="UnloadAllUnits")
autoTrigger:"""
if ${allowAI}==true  
and self.isControlledByAI() 
and self.transportingCount>0 
and not self.isTransportUnloading() 
and 
(
    numberOfUnitsInEnemyTeam(withTag="CanBeTargetUnit",greaterThan=0,withinrange=350) 
    or numberOfUnitsInEnemyTeam(withTag="StrategicLocation",greaterThan=0,withinrange=150) 
) 
or parent.hp<=0
"""
requireConditional:if not self.isTransportUnloading() 
pos:1

buildSpeed:0s


highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
extraLagHidingInUI:true

displayType:action

text:Unload All Units
text_zh:卸载所有单位

iconImage:ROOT:Resource/Image/Units/Button/Action/Ride_4.png

isVisible:if true

isLocked:if self.transportingCount<=0
isLockedMessage:No Units
isLockedMessage_zh:没有单位
isLockedAlt:if parent.parent.tags(includes='ReEntry')
isLockedAltMessage:In ReEntry
isLockedAltMessage_zh:在突入中

startUnloadingTransport:true

[action_RepairAllUnits]
autoTriggerOnEvent:newMessage(withTag="RepairAllUnits")
pos:2

buildSpeed:0s


highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
extraLagHidingInUI:true

displayType:action

text:RepairAllUnits
text_zh:整备所有单位

iconImage:ROOT:Resource/Image/Units/Button/Misc/Repair_1.png

isVisible:if true

isLocked:if self.transportingCount<=0
isLockedMessage:No Units
isLockedMessage_zh:没有单位
isLockedAlt:if parent.parent.tags(includes='ReEntry')
isLockedAltMessage:In ReEntry
isLockedAltMessage_zh:在突入中
alsoTriggerAction:RepairAllUnits_Step2
[hiddenAction_RepairAllUnits_Step2]
takeResources_includeUnitsWithinRange:1000
takeResources_includeUnitsWithinRange_team:ally
takeResources_excludeUnitsWithoutTags:Unit
takeResources_searchOnly:true
takeResources_maxUnits:3009
takeResources_triggerActionForEach:RepairAllUnits_Step3
[hiddenAction_RepairAllUnits_Step3]
requireConditional:if thisActionTarget.parent==self
sendMessageTo:thisActionTarget
sendMessageWithTags:RepairStart



[hiddenAction_GetExit]
autoTriggerOnEvent:newMessage(withTag="Exit")
alsoTriggerAction:"""
GetExit_Slot0,
GetExit_Slot1
"""

[hiddenAction_GetExit_Slot0]
requireConditional:"""
if eventData("unitInfo",type="unit") == self.transporting(slot=0)
"""
forceUnloadTransportNow:true
forceUnloadTransportNow_onlyOnSlot:0
[hiddenAction_GetExit_Slot1]
@copyFromSection:hiddenAction_GetExit_Slot0
requireConditional:"""
if eventData("unitInfo",type="unit") == self.transporting(slot=1)
"""
forceUnloadTransportNow:true
forceUnloadTransportNow_onlyOnSlot:1
[hiddenAction_GetExit_Slot2]
isVisible:false
[hiddenAction_GetExit_Slot3]
isVisible:false



[hiddenAction_Supply]
autoTrigger:if self.timeAlive>memory.supplyUnitCD
setUnitMemory:supplyUnitCD=self.timeAlive+1
alsoTriggerAction:"""
Supply_Unit
"""
[hiddenAction_Supply_Unit]
takeResources_includeUnitsWithinRange:300
takeResources_includeUnitsWithinRange_team:ally
takeResources_excludeUnitsWithoutTags:CanSupplyUnit
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:Supply_Unit_HP,Supply_Unit_EN
[hiddenAction_Supply_Unit_HP]
requireConditional:"""
if thisActionTarget.parent==self and thisActionTarget!=self
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:RecoverByOther
sendMessageWithData:"""
RecoverHpPer=0.1
"""
[hiddenAction_Supply_Unit_EN]
requireConditional:"""
if thisActionTarget.parent==self and thisActionTarget!=self 
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:RecoverByOther
sendMessageWithData:"""
RecoverEnPer=0.2,
RecoverShieldPer=0.2,
RecoverSkillPer=0.2
"""



[attachment_UnitSlot0]
x:0
y:0
idleDir:0
resetRotationWhenNotAttacking:true
isVisible:false
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:true
smoothlyBlendPositionWhenExistingUnitAdded:true
onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:true
addTransportedUnits:true
[attachment_UnitSlot1]
@copyFromSection:attachment_UnitSlot0




[hiddenAction_DeadUnloadAllUnits]
autoTriggerOnEvent:newMessage(withTag="DeadUnloadAllUnits")
alsoTriggerAction:DeadUnloadAllUnits_CheckUnits
[hiddenAction_DeadUnloadAllUnits_CheckUnits]
takeResources_includeUnitsWithinRange:1000
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:Unit
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:"""
DeadUnloadAllUnits_CheckUnits_Damage,
DeadUnloadAllUnits_CheckUnits_Unload
"""
[hiddenAction_DeadUnloadAllUnits_CheckUnits_Damage]
requireConditional:if thisActionTarget.parent==self and parent.hp<=0
sendMessageTo:thisActionTarget
sendMessageWithTags:Damage
sendMessageWithData:"""
DamagePer=0.25,
ShieldDamagePer=0.25
"""
[hiddenAction_DeadUnloadAllUnits_CheckUnits_Unload]
requireConditional:if thisActionTarget.parent==self
sendMessageTo:thisActionTarget
sendMessageWithTags:ExitParent




[hiddenAction_ForceUnloadAllUnits]
autoTriggerOnEvent:newMessage(withTag="ForceUnloadAllUnits")
alsoTriggerAction:ForceUnloadAllUnits_CheckUnits
[hiddenAction_ForceUnloadAllUnits_CheckUnits]
takeResources_includeUnitsWithinRange:1000
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:Unit
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:"""
ForceUnloadAllUnits_CheckUnits_Unload
"""
[hiddenAction_ForceUnloadAllUnits_CheckUnits_Unload]
requireConditional:if thisActionTarget.parent==self
sendMessageTo:thisActionTarget
sendMessageWithTags:ExitParent

[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
autoTrigger:if parent.hp<=0 and memory.onDelete==false
disconnectFromParent:true
setUnitMemory:"""
onDelete=true,
deleteTimer=self.timeAlive+1
"""
alsoTriggerAction:DeadUnloadAllUnits
[hiddenAction_Check_Delete]
autoTrigger:"""
if memory.onDelete==true and self.timeAlive>memory.deleteTimer
"""
deleteSelf:true

[graphics]
image:SHARED:blank.png

showEnergyBar:false
showShieldBar:false
showShotDelayBar:false
showQueueBar:false
icon_build:ROOT:Resource/Image/Units/Button/Misc/Hangar_1.png
isVisibleToEnemies:false
[attack]
canAttack:true
canAttackFlyingUnits:true
canAttackLandUnits:true
canAttackUnderwaterUnits:true
canAttackNotTouchingWaterUnits:true
canOnlyAttackUnitsWithTags:CanBeTargetUnit

isFixedFiring:false

turretMultiTargeting:false

[movement]
movementType: Land
moveSpeed:1
maxTurnSpeed:1
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false

