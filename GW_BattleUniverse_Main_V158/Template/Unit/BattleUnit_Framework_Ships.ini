
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Unit/BattleUnit_Framework.ini,
ROOT:Template/Unit/Skill/AutoRepair.gw,
ROOT:Resource/Image/Fx/Common/Common_Explosion_MA_1.gw,
ROOT:Resource/Image/Fx/Common/Common_LargeUnitDie_1.gw
"""

mass:99999

borrowResourcesWhileAlive:Mp=-4

@memory dieSpawnEffect:bool
@memory dieSpawnEffectCD:float

@memory checkBreakedPartsTimer:float



[hiddenAction_Start]
temporarilyAddTags:CanBeTargetUnit,CanCaptureUnit,DetectedVisible,CanSupplyUnit

[hiddenAction_BattleUnitCore_Spawn]
attachments_addNewUnits:BattleUnitCore_Ships

[action_Set_AttackMode_Shoot]
autoTrigger:false
isLocked:true
isLockedMessage:No Allow To Change
isLockedMessage_zh:不允许切换

[action_Set_AttackMode_Cqb]
autoTrigger:false
isLocked:true
isLockedMessage:No Allow To Change
isLockedMessage_zh:不允许切换


[hiddenAction_Check_InBattle_Attack]
setUnitMemory:inBattleTimer=self.timeAlive+10

[hiddenAction_TryAttack]
autoTrigger:"""
if self.attacking!=null and ${onAttacking}==false and ${cantAction}==false and ${onSkill}==false   
and not self.hasActiveWaypoint(type="build") 
and not self.hasActiveWaypoint(type="repair") 
and 
select
(
    self.parent.hp>0,
    select(self.parent.hasTags(includes='inVehicleCanAttack'),true,false),
    true
)
"""
sendMessageTo:self
sendMessageWithTags:Attack
sendMessageWithData:RandomWeapon=rnd(0,100)





[hiddenAction_Get_BreakedPartsInfo]
autoTriggerOnEvent:newMessage(withTag="BreakedPartsInfo")
setUnitMemory:checkBreakedPartsTimer=self.timeAlive+0.5
[hiddenAction_Check_RepairNeed]
setUnitMemory:"""
repairNeed=select
(
    self.hp>0 and memory.checkBreakedPartsTimer>self.timeAlive,
    true,
    false
)
"""
[hiddenAction_Set_Get_RepairDone]
alsoTriggerAction:Send_RepairDoneToTurret
[hiddenAction_Send_RepairDoneToTurret]
takeResources_includeUnitsWithinRange:1000
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:UnitTurret
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:Send_RepairDoneToTurret_Step2
[hiddenAction_Send_RepairDoneToTurret_Step2]
requireConditional:if thisActionTarget.parent==self
sendMessageTo:thisActionTarget
sendMessageWithTags:RepairDone


[hiddenAction_Get_SpawnShipDeadEffect]
autoTriggerOnEvent:newMessage(withTag="SpawnShipDeadEffect")
setUnitMemory:dieSpawnEffect=true
alsoTriggerAction:"""
AllHangarUnload
"""
[hiddenAction_AllHangarUnload]
takeResources_includeUnitsWithinRange:1000
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:Hangar
takeResources_searchOnly:true
takeResources_maxUnits:300
takeResources_triggerActionForEach:AllHangarUnload_Step2
[hiddenAction_AllHangarUnload_Step2]
requireConditional:if thisActionTarget.parent==self
sendMessageTo:thisActionTarget
sendMessageWithTags:UnloadAllUnits


[hiddenAction_Die_SpawnShipDeadEffect]
autoTrigger:if memory.dieSpawnEffect==true and self.timeAlive>memory.dieSpawnEffectCD
setUnitMemory:dieSpawnEffectCD=self.timeAlive+0.2
spawnEffects:LargeUnitDie_1



[hiddenAction_SpawnExplosion_Ground]
spawnEffects:Common_Explosion_MA_Ground_1

[hiddenAction_SpawnExplosion_Space]
spawnEffects:Common_Explosion_MA_Space_1

[hiddenAction_SpawnExplosion_Water]
spawnEffects:Common_Explosion_MA_Ground_1



[hiddenAction_Set_Get_PlayMoveAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayMoveReversingAnimation]
requireConditional:false
playAnimation:IGNORE

[hiddenAction_Set_Get_PlayGuardAnimation]
requireConditional:false
playAnimation:IGNORE



[action_GetIntoNearestTransportUnit]
isVisible:false





[attack]

isFixedFiring:false

[graphics]
drawLayer:ground2
showTransportBar:false


[movement]

movementType: AIR

moveSpeed: 0.5
maxTurnSpeed: 0.5

moveAccelerationSpeed: 0.15
moveDecelerationSpeed: 0.05
reverseSpeedPercentage:0.75

turnAcceleration: 0.5

heightChangeRate:0.5
targetHeightDrift:0
targetHeight:1

moveSlidingMode:false
moveSlidingDir:0
moveIgnoringBody:false

joinsGroupFormations:true

