
[core]
copyFrom:"""
ROOT:Resource/Image/Fx/Common/Critical_1.gw,
ROOT:Resource/Image/Fx/Unit/Dodge_1.gw
"""

dont_load:false
tags:UnitTurret
name:DamageChecker_Building


showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1

showInEditor:false
stayNeutral:true

isUnselectable:true
canNotBeGivenOrdersByPlayer:false
canNotBeDamaged:true

ignoreInUnitCapCalculation:true

hideScorchMark:true






@memory thisTimeTookDamage:float
@memory thisTimeShieldTookDamage:float


@memory coreUnit:unit

@memory lastDamageBy:unit


[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
GetCoreUnit,
Start
"""

[hiddenAction_GetCoreUnit]
setUnitMemory:coreUnit=parent

[hiddenAction_Start]
isVisible:false
temporarilyAddTags:CanBeDamaged



[hiddenAction_Get_TryDamage]
autoTriggerOnEvent:newMessage(withTag="TryDamage")
requireConditional:"""
if 
(
    eventData("accuracy",type="float")*
    select
    (
        distanceBetween(parent.getOffsetRelative(y=5), eventData("bulletInfo",type="unit"))>=distanceBetween(self.getOffsetRelative(y=-5), eventData("bulletInfo",type="unit")),
        1,
        select(parent.readUnitMemory("battleUnitCore",type="unit").readUnitMemory("pilotAwakeningSkill",type="float")>=100,1.25,1.5)
    )
    >
    parent.readUnitMemory("finalReactionLevel",type="float")*rnd(0.35,1.35)*0.01
)
"""
sendMessageTo:eventData(name="bulletInfo",type="unit")
sendMessageWithTags:DoDamage
sendMessageWithData:"""
damageTarget=self
"""
[hiddenAction_TookDamage_Shoot_Beam]
autoTriggerOnEvent:newMessage(withTag="Damage_Shoot_Beam")
alsoTriggerAction:"""
MathDamage_Shoot_Beam,
MathDamage_Random,
MathDamage_Final
"""
[hiddenAction_TookDamage_Shoot_Shell]
autoTriggerOnEvent:newMessage(withTag="Damage_Shoot_Shell")
alsoTriggerAction:"""
MathDamage_Shoot_Shell,
MathDamage_Random,
MathDamage_Final
"""
[hiddenAction_TookDamage_Cqb]
autoTriggerOnEvent:newMessage(withTag="Damage_Cqb")
alsoTriggerAction:"""
MathDamage_Cqb,
MathDamage_Random,
MathDamage_Final
"""

[hiddenAction_MathDamage_Shoot_Beam]
setUnitMemory:"""
thisTimeTookDamage=
(
    eventData(name="BeamDamage",type="float")*(1-parent.readUnitMemory(name="finalBeamDef", type="float")*0.01)
    +
    eventData(name="BeamAPDamage",type="float")*(1-parent.readUnitMemory(name="finalBeamDef", type="float")/4*0.01)
)
"""
[hiddenAction_MathDamage_Shoot_Shell]
setUnitMemory:"""
thisTimeTookDamage=
(
    eventData(name="ShellDamage",type="float")*(1-parent.readUnitMemory(name="finalShellDef", type="float")*0.01)
    +
    eventData(name="ShellAPDamage",type="float")*(1-parent.readUnitMemory(name="finalShellDef", type="float")/4*0.01)
)
"""
[hiddenAction_MathDamage_Cqb]
setUnitMemory:"""
thisTimeTookDamage=
(
    eventData(name="CqbDamage",type="float")*(1-parent.readUnitMemory(name="finalCqbDef", type="float")*0.01)
    +
    eventData(name="CqbAPDamage",type="float")*(1-parent.readUnitMemory(name="finalCqbDef", type="float")/4*0.01)
    +
    eventData(name="CqbBeamDamage",type="float")*(1-parent.readUnitMemory(name="finalBeamDef", type="float")*0.01)
    +
    eventData(name="CqbShellDamage",type="float")*(1-parent.readUnitMemory(name="finalShellDef", type="float")*0.01)
)
"""
[hiddenAction_MathDamage_Random]
setUnitMemory:"""
thisTimeTookDamage=memory.thisTimeTookDamage*rnd(0.75,1)*eventData(name="AntiBuilding",type="float")
"""
[hiddenAction_MathDamage_Final]
setUnitMemory:"""
thisTimeShieldTookDamage=select
(
    parent.shield>0
    ,memory.thisTimeTookDamage*0.75
    ,0
),

thisTimeTookDamage=
(
    memory.thisTimeTookDamage
    *select
    (
        parent.shield>0
        ,select(parent.shield>0,0.25,0.75)
        ,1
    )
),
lastDamageBy=eventData(name="attacker",type="unit")
"""
alsoTriggerAction:"""
Send_Unit_Damage,
ClearThisTimeTookDamage,
ClearThisTimeShieldTookDamage
"""
[hiddenAction_Send_Unit_Damage]
sendMessageTo:parent
sendMessageWithTags:Damage
sendMessageWithData:"""
Damage=memory.thisTimeTookDamage,
ShieldDamage=memory.thisTimeShieldTookDamage,
LastDamageBy=memory.lastDamageBy
"""
[hiddenAction_ClearThisTimeTookDamage]
setUnitMemory:thisTimeTookDamage=0
[hiddenAction_ClearThisTimeShieldTookDamage]
setUnitMemory:thisTimeShieldTookDamage=0




[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true



[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: NONE




[ai]
useAsTransport:false
useAsBuilder: false


[decal_Test]
image:ROOT:Resource/Image/Ring/Ring16_Green.png
teamColors:true
isVisible:false
