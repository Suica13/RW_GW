
[core]

name:DetectMarker
tags:DetectMarker

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true

overrideAndReplace:GundamWars_Greed_Compatible_DetectMarker

showInEditor:false

autoTriggerCooldownTime:0.1s
autoTriggerCheckRate:every8Frames

@memory projectileLife:float
@memory target:unit

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
Start_SetStats,
Start_SetTarget,
Start_ClearSelf
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
teleportToTarget
"""

[hiddenAction_Start_SetStats]
isVisible:false

[hiddenAction_Start_SetTarget]
setUnitMemory:target=self.nearestUnit(withTag='CanBeDetected',withinRange=30,relation='enemy')
teleportTo:memory.target
setHeight:memory.target.height

[hiddenAction_Start_ClearSelf]
requireConditional:"""
if self.numberOfUnitsInTeam(withTag="DetectMarker",withinrange=20)>0
"""
deleteSelf:true


[hiddenAction_teleportToTarget]
requireConditional:"""
if memory.target.hp>0
"""
teleportTo:memory.target
setHeight:memory.target.height
setUnitStats:fogOfWarSightRange=select(memory.target.tags(includes='DetectedVisible') or memory.target.tags(includes='Building'),3,0)


[hiddenAction_DeleteSelf]
autoTrigger:"""
if self.timeAlive>0.1 
and 
(
    memory.target.hp<=0 
    or memory.target==null 
    or not memory.target.isInMap()  
    or memory.target.tags(includes='UnDetected') 
    or memory.target.teamId<0 
    or self.timeAlive>30 
)
"""
deleteSelf:true


[decal_Marker]
layer:shadow
onlyTeam:ally
order:1
image:ROOT:Resource/Image/Units/Hud/Marker/Marker.png
alpha:0.5
imageScale:select(memory.target.tags(includes='DetectedVisible') or memory.target.tags(includes='Building'),1,0.5)
xOffsetAbsolute:0
yOffsetAbsolute:0
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.timeAlive>0.1
onlyWhileAlive:true



[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:0
targetHeight:0
targetHeightDrift:0
heightChangeRate:0


[ai]
useAsTransport:false
useAsBuilder: false

