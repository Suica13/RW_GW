
[core]
dont_load:true


copyFrom:ROOT:Template/Unit/BattleUnit_Graphics.ini

radius:35
displayRadius:35


[decal_Shadow]
imageScale:3



[decal_Ring_Self]
layer:beforeBody
order:0
onlyTeam:own
onlyWhileAlive:true
alpha:0.65
imageScale:3.0
image:ROOT:Resource/Image/Ring/Ring16_Green.png
alwaysStartHeightAtZero:true

isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.parent.hp<=0
[decal_Ring_Ally]
@copyFromSection:decal_Ring_Self
onlyTeam:allynotown
image:ROOT:Resource/Image/Ring/Ring16_Yellow.png
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.parent.hp<=0
[decal_Ring_Enemy]
@copyFromSection:decal_Ring_Self
onlyTeam:Enemy
image:ROOT:Resource/Image/Ring/Ring16_Red.png
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.parent.hp<=0

[decal_Shadow]
alpha:0.45

[decal_Crotch]


[decal_Body]



[decal_ArmL]

[decal_ArmR]


[decal_ShoulderL]

[decal_ShoulderR]

[decal_Head]

[decal_Head_Close]

[decal_Eye]


[decal_LeftFoot]

[decal_LeftLeg]


[decal_RightFoot]

[decal_RightLeg]


[decal_Burned]
imageScale:3
[decal_Stun]
isVisible:"""
if 
memory.battleUnitCore.readUnitMemory(name="stunTimer", type="float")>memory.battleUnitCore.timeAlive  
or memory.battleUnitCore.readUnitMemory(name="takingCombo", type="bool")==true 
or self.hp<=0
"""
imageScale:2
[decal_LowHp]
isVisible:"""
if self.hp<self.maxHp*0.25 
"""
