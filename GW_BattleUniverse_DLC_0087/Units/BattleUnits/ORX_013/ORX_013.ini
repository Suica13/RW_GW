name:ORX_013
tags:ORX_013,Unit,MS,TITANS,0087,UC,ManualControlCapable
displayText:Gundam Mk-V
displayText_zh:高达Mk-V
showActionsWithMixedSelectionIfOtherUnitsHaveTag:ORX_013
maxHp:85000
maxShield:17000
@memory nowSubWeaponIndex:float
displayDescription:\nPrototype mobile suit equipped with wire-guided Incom weapons.\nBeam rifle, large beam sabers and multiple support weapons.
displayDescription_zh:"""

\n搭载双有线炮的重型试作MS，以大型军刀、腰部光束枪和导弹压制敌人。
\n优势
\n=大型光束军刀=
\n=有线炮与多种射击武装=
\n劣势
\n=造价高昂=
\n=武装依赖部件完好=
"""

