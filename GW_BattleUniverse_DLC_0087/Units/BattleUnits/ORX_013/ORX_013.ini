[hiddenAction_TITANS_ORX_013_BR_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and memory.armRBreaked==false and distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (eventData("RandomWeapon",type="float")>=0.00000 and eventData("RandomWeapon",type="float")<33.33333)
alsoTriggerAction:TITANS_ORX_013_BR_Fire

[hiddenAction_TITANS_ORX_013_CrotchBeamCannon_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and memory.headBreaked==false and distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (eventData("RandomWeapon",type="float")>=33.33333 and eventData("RandomWeapon",type="float")<66.66667)
alsoTriggerAction:TITANS_ORX_013_CrotchBeamCannon_Fire

[hiddenAction_TITANS_ORX_013_MS_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and memory.headBreaked==false and distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (eventData("RandomWeapon",type="float")>=66.66667 and eventData("RandomWeapon",type="float")<100.00000)
alsoTriggerAction:TITANS_ORX_013_MS_Fire

[hiddenAction_TITANS_ORX_013_BeamSaber_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and memory.armRBreaked==false and distanceBetween(self,self.attacking)<=60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (true)
