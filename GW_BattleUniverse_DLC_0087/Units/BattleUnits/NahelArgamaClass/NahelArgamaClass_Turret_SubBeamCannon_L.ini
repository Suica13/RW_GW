[core]
dont_load:false
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Pink.gw,
ROOT:Units/BattleUnits/NahelArgamaClass/PlayerControl/Ships/NahelArgamaClass_Turret_BeamCannon.gw
"""

name:NahelArgamaClass_Turret_SubBeamCannon_L
displayText:NahelArgamaClass SubBeamCannon
displayText_zh:拟阿卡玛级 副炮

maxHp: 45000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory NahelArgamaClass_Turret_BeamCannon_OnCD:bool
@memory NahelArgamaClass_Turret_BeamCannon_CDTimer:float
@global NahelArgamaClass_Turret_BeamCannon_CD=4.5
@global NahelArgamaClass_Turret_BeamCannon_EN=40

@global NahelArgamaClass_Turret_BeamCannon_Shoot=2
[resource_NahelArgamaClass_Turret_BeamCannon_ShootTimer]
hidden:true


[graphics]
drawLayer:ground2


[decal_NahelArgamaClass_Turret_BeamCannon]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/NahelArgamaClass/Image/NahelArgamaClass_Turret_SubBeamCannon_1.png
imageScale:1.25
basePositionFromTurret:NahelArgamaClass_Turret_BeamCannon




[turret_NahelArgamaClass_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,ManualShip_Consumed
canAttackCondition:if (${onAttacking}==false and ${cantAction}==false  and (parent.resource().en>0 or memory.manualShipReserved)) and (not memory.manualShipReserved or not parent.hasTags(includes='ManualControlled') or ${manualShipOrderReady})
showRangeUIGuide:false
projectile:NahelArgamaClass_Turret_BeamCannon_Projectile
resourceUsage:NahelArgamaClass_Turret_BeamCannon_ShootTimer=1,ManualShipShotPermit=1

delay:0.25s
canAttackMaxAngle:15
limitingAngle:120
limitingRange:1200
barrelX:0
barrelY:18
barrelOffsetX_onOddShots:0
turnSpeed:0.75

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:10
idleSweepAddRandomAngle:5
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Pink




[projectile_NahelArgamaClass_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_AP_BeamRifle_Pink*1
(
    addResources=
    BeamDamage:6000
    |BeamAPDamage:3000
    |DpDamage:325
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.5
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.5
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:55
    |ProjectileSpread:4
    |ProjectileLife:50

    |ProjectileAttackTimes:2
    |ProjectileAttackTimesDamageModifier:0.5
)
"""


[hiddenAction_NahelArgamaClass_Turret_BeamCannon_CDStart]
autoTrigger:if (memory.NahelArgamaClass_Turret_BeamCannon_OnCD==false and (    (        self.resource.NahelArgamaClass_Turret_BeamCannon_ShootTimer<=0     )     or     (        self.resource.NahelArgamaClass_Turret_BeamCannon_ShootTimer<${NahelArgamaClass_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')    ))) and (not parent.hasTags(includes='ManualControlled') or memory.manualShipRemaining<=0 or self.timeAlive>=memory.manualShipOrderUntil)
setUnitMemory:NahelArgamaClass_Turret_BeamCannon_OnCD=true,NahelArgamaClass_Turret_BeamCannon_CDTimer=self.timeAlive+${NahelArgamaClass_Turret_BeamCannon_CD}

[hiddenAction_NahelArgamaClass_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.NahelArgamaClass_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.NahelArgamaClass_Turret_BeamCannon_CDTimer
setUnitMemory:NahelArgamaClass_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:NahelArgamaClass_Turret_BeamCannon_ShootTimer=${NahelArgamaClass_Turret_BeamCannon_Shoot}

[hiddenAction_NahelArgamaClass_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${NahelArgamaClass_Turret_BeamCannon_EN}