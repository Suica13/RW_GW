tags:NahelArgamaClass,Unit,CmdUnit,Ship,AEUG,0087,UC,LargeUnit,MpUpUnit_X24,ManualControlCapable
name:NahelArgamaClass

displayText:Nahel Argama Class
displayText_zh:拟阿卡玛级

displayDescription:"""
\nAn assault landing ship that succeeded Argama during the First Neo Zeon War and served as the Gundam Team's mothership
\nIts bow-mounted hyper mega particle cannon supports breakthroughs alongside its mobile suits
\nAdvantages
\n=Hyper mega particle cannon and concentrated turret fire=
\n=Transport capacity: 12 x 3=
\n=Communication and defense commands=
\n=Out-of-combat repair and allied resupply=
\n=Free atmospheric re-entry=
\n=35% less damage from buildings=
\n=Minovsky particle dispersion=
\nDisadvantages
\n=Large hull and slow turning=
\n=Long main-cannon cooldown=
\n=Main cannon and resupply share EN reserves=
\n=-250 anti-detection range; reveals vision when detected=
\n
\n"This isn't anime!"
"""
displayDescription_zh:"""
\n第一次新吉翁战争中接替阿卡玛的强袭登陆舰，也是高达小队的活动母舰
\n舰艏搭载超级米加粒子炮，以舰炮火力和MS部队共同突破敌阵
\n优势
\n=超级米加粒子炮=
\n=密集的舰炮火力=
\n=运输力:12×3=
\n=允许通信与防御指挥=
\n=脱战自动修复与友军补给=
\n=可以自由穿梭大气层=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大，转向较慢=
\n=主炮冷却时间较长=
\n=主炮和补给共用EN储备=
\n=负250码反侦测，被发现时暴露视野=
\n
\n“这可不是动画！”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:NahelArgamaClass


displayRadius:75
radius:75

maxHp:500000
maxShield:0

