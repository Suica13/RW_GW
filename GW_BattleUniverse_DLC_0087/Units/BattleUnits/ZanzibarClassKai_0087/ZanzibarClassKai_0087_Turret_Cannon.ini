[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:ZanzibarClassKai_0087_Turret_Cannon
displayText:ZanzibarClassKai_0087 MainCannon
displayText_zh:桑吉巴尔级改[0087] 主炮

maxHp: 20000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory ZanzibarClassKai_0087_Turret_Cannon_OnCD:bool
@memory ZanzibarClassKai_0087_Turret_Cannon_CDTimer:float
@global ZanzibarClassKai_0087_Turret_Cannon_CD=9
@global ZanzibarClassKai_0087_Turret_Cannon_EN=40

@global ZanzibarClassKai_0087_Turret_Cannon_Shoot=2
[resource_ZanzibarClassKai_0087_Turret_Cannon_ShootTimer]
hidden:true


[graphics]
drawLayer:ground2


[decal_ZanzibarClassKai_0087_Turret_Cannon]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/ZanzibarClassKai_0087/Image/ZanzibarClassKai_0087_Turret_Cannon_1.png
imageScale:1.0
basePositionFromTurret:ZanzibarClassKai_0087_Turret_Cannon




[turret_ZanzibarClassKai_0087_Turret_Cannon]
x:0
y:0

canShoot:false
onShoot_triggerActions:SendEnemyTryAttack_Shoot,ZanzibarClassKai_0087_Turret_Cannon_Send_UseEN
canOnlyAttackUnitsWithoutTags:AirUnit
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false 
and memory.onSkill==false 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:ZanzibarClassKai_0087_Turret_Cannon_Projectile
resourceUsage:ZanzibarClassKai_0087_Turret_Cannon_ShootTimer=1

delay:3s
canAttackMaxAngle:3
limitingAngle:120
limitingMinRange:150
limitingRange:1200
barrelX:0
barrelY:35
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:420
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/ShellCannon_5.ogg
shoot_sound_vol:0.6
shoot_flame:BZ_Fire_1
[turret_ZanzibarClassKai_0087_Turret_Cannon_L]
@copyFromSection:turret_ZanzibarClassKai_0087_Turret_Cannon
attachedTo:ZanzibarClassKai_0087_Turret_Cannon
x:5
canShoot:true
limitingAngle:15
[turret_ZanzibarClassKai_0087_Turret_Cannon_R]
@copyFromSection:turret_ZanzibarClassKai_0087_Turret_Cannon
attachedTo:ZanzibarClassKai_0087_Turret_Cannon
x:-5
canShoot:true
limitingAngle:15



[projectile_ZanzibarClassKai_0087_Turret_Cannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Mortar_L*1
(
    addResources=
    ShellDamage:7250
    |DpDamage:500
    |WeaponAccuracy=75
    |PartBreakModifier=0.5
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1.5
    |AntiAqua=0.75
    |AntiAir=0.5 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=0.5
    |HeightHitRange=10
    |ProjectileSpeed:40
    |ProjectileSpread:0
    |ProjectileExplosionRange:75
    |ProjectileLife:50
)
"""


[hiddenAction_ZanzibarClassKai_0087_Turret_Cannon_CDStart]
autoTrigger:"""
if memory.ZanzibarClassKai_0087_Turret_Cannon_OnCD==false 
and 
(
    (
        self.resource.ZanzibarClassKai_0087_Turret_Cannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.ZanzibarClassKai_0087_Turret_Cannon_ShootTimer<${ZanzibarClassKai_0087_Turret_Cannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:ZanzibarClassKai_0087_Turret_Cannon_OnCD=true,ZanzibarClassKai_0087_Turret_Cannon_CDTimer=self.timeAlive+${ZanzibarClassKai_0087_Turret_Cannon_CD}

[hiddenAction_ZanzibarClassKai_0087_Turret_Cannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.ZanzibarClassKai_0087_Turret_Cannon_OnCD==true and self.timeAlive>memory.ZanzibarClassKai_0087_Turret_Cannon_CDTimer
setUnitMemory:ZanzibarClassKai_0087_Turret_Cannon_OnCD=false
setResourcesWithLogic:ZanzibarClassKai_0087_Turret_Cannon_ShootTimer=${ZanzibarClassKai_0087_Turret_Cannon_Shoot}



[hiddenAction_ZanzibarClassKai_0087_Turret_Cannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${ZanzibarClassKai_0087_Turret_Cannon_EN}


