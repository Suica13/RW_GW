tags:ArgamaClass,Unit,CmdUnit,Ship,AEUG,0087,UC,LargeUnit,MpUpUnit_X24
name:ArgamaClass

displayText:Argama Class
displayText_zh:阿伽玛级

displayDescription:"""
\nAn assault mobile cruiser commissioned by the AEUG and constructed by Anaheim Electronics
\nAdvantages
\n= Powerful firepower =
\n= High durability =
\n=Can ReEntry Free=
\n= Allows communication command =
\n= Allows defense command =
\n= Automatically repairs when out of combat =
\n= Transport capacity: 12x2 =
\n= Takes 35% less damage from structures =
\n= Can disperse Minovsky particles =
\nDisadvantages
\n= Massive size =
\n= -250 detection range =
\n= Reveals vision when detected =
\n
\n"Advance after regrouping!"
"""
displayDescription_zh:"""
\n由奥古委托阿纳海姆电子公司建造的强袭机动巡洋舰
\n优势
\n=火力充沛=
\n=耐久较高=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=可以自由穿梭大气层=
\n=运输力:12x2=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“合流后开始前进!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:ArgamaClass


displayRadius:75
radius:75

maxHp:375000
maxShield:0

@global cmdComRangeExtra=250
