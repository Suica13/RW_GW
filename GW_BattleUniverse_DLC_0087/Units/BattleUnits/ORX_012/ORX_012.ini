[hiddenAction_Common_Push_A_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and memory.armRBreaked==true and distanceBetween(self,self.attacking)<=60

[hiddenAction_TITANS_ORX_012_BR_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and memory.armRBreaked==false and distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (eventData("RandomWeapon",type="float")>=0.00000 and eventData("RandomWeapon",type="float")<50.00000)
alsoTriggerAction:TITANS_ORX_012_BR_Fire

[hiddenAction_TITANS_ORX_012_BeamCannon_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and memory.headBreaked==false and distanceBetween(self,self.attacking)>60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (eventData("RandomWeapon",type="float")>=50.00000 and eventData("RandomWeapon",type="float")<100.00000)
alsoTriggerAction:TITANS_ORX_012_BeamCannon_Fire

[hiddenAction_TITANS_ORX_012_BeamSaber_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and memory.armRBreaked==false and distanceBetween(self,self.attacking)<=60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (eventData("RandomWeapon",type="float")>=0.00000 and eventData("RandomWeapon",type="float")<50.00000)
alsoTriggerAction:TITANS_ORX_012_BeamSaber_Fire

[hiddenAction_TITANS_ORX_012_BeamSaber_Thrust_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:if not memory.manualControlEnabled and memory.armRBreaked==false and distanceBetween(self,self.attacking)<=60 and distanceBetween(self,self.attacking)<=memory.finalAttackRange and (eventData("RandomWeapon",type="float")>=50.00000 and eventData("RandomWeapon",type="float")<100.00000)
alsoTriggerAction:TITANS_ORX_012_BeamSaber_Thrust_Fire

