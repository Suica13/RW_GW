"""
name:ORX_012
tags:ORX_012,Unit,MS,TITANS,0087,UC,ManualControlCapable
displayText:Gundam Mk-IV
displayText_zh:高达Mk-IV
showActionsWithMixedSelectionIfOtherUnitsHaveTag:ORX_012
maxHp:80000
maxShield:15000
@memory nowSubWeaponIndex:float
displayDescription:\nPrototype mobile suit equipped with wire-guided Incom weapons.\nBeam rifle, large beam sabers and multiple support weapons.
displayDescription_zh:"""

\n搭载有线炮的试作型高达，兼顾近距离格斗与肩炮火力支援。
\n优势
\n=大型光束军刀=
\n=有线炮与多种射击武装=
\n劣势
\n=造价高昂=
\n=武装依赖部件完好=
"""

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/ORX_012.png

[hiddenAction_InitializeStats]
setUnitMemory:"""
unitLevel=8500,
enMax=1300,
dpMax=1300,
baseHeight=1,
attackMode=0,
baseAttackRange=650,
baseFogOfWarSightRange=26,
baseDetectRange=memory.baseFogOfWarSightRange*18,
baseAntiDetectRange=0,
baseMoveSpeed=0.85,
boostMoveSpeed=2.4,
baseTurnSpeed=3.5,
baseShootLevel=185,
baseCqbLevel=205,
cqbModeBuff=1.25,
baseAccuracyLevel=195,
baseReactionLevel=205,
onDodgeBoostSpeed=1.45,
partStructuralStrength=155,
cockpitSafety=155,
repairAllow=true,
baseBeamDef=25,
baseShellDef=25,
baseCqbDef=35,
baseDpDef=25,
baseSpDef=10,
baseBeamDefPlus=450,
baseShellDefPlus=450,
baseCqbDefPlus=850,
baseDpDefPlus=40,
baseSpDefPlus=50,
extraBuildingDef=1,
extraBuildingAtk=1,
flyUnit=0,
groundAdaptability=100,
cliffAdaptability=100,
waterAdaptability=85,
skyAdaptability=85,
spaceAdaptability=115
"""

[hiddenAction_InitializeAddPilot_Default]
addUnitsIntoTransport:Pilot_TITANS_0087_N_C_A*1

[hiddenAction_Set_Get_PlayStartEffect]

[hiddenAction_Set_Get_PlayCloseEffect]

[hiddenAction_PartForceBreakShield]
