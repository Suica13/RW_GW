[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:AlexandriaClass_Turret_AA_2
displayText:AlexandriaClass AA
displayText_zh:亚历山大级 对空炮

maxHp: 7500

@memory AlexandriaClass_Turret_AA_2_OnCD:bool
@memory AlexandriaClass_Turret_AA_2_CDTimer:float
@global AlexandriaClass_Turret_AA_2_CD=2
@global AlexandriaClass_Turret_AA_2_EN=0.5

@global AlexandriaClass_Turret_AA_2_Shoot=10
[resource_AlexandriaClass_Turret_AA_2_ShootTimer]
hidden:true



#AA炮用

[decal_Burned]
imageScale:0.75
[decal_Stun]
imageScale:0.425
[decal_LowHp]
imageScale:0.5
[decal_Marker]
imageScale:0.25


[graphics]
drawLayer:ground2



[decal_AlexandriaClass_Turret_AA_2]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/AlexandriaClass/Image/AlexandriaClass_Turret_AA_2.png
imageScale:1.25
basePositionFromTurret:AlexandriaClass_Turret_AA_2






[turret_AlexandriaClass_Turret_AA_2]
x:0
y:0

canShoot:true
onShoot_triggerActions:AlexandriaClass_Turret_AA_2_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:AlexandriaClass_Turret_AA_2_Projectile
resourceUsage:AlexandriaClass_Turret_AA_2_ShootTimer=1

delay:0.2s
canAttackMaxAngle:60
limitingAngle:90
limitingRange:600
barrelX:0
barrelY:6
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_AlexandriaClass_Turret_AA_2_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Vulcan*1
(
    addResources=
    ShellDamage:200
    |ShellAPDamage:75
    |DpDamage:5
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1.5
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:90
    |ProjectileSpread:6
    |ProjectileLife:7.5
)
"""


[hiddenAction_AlexandriaClass_Turret_AA_2_CDStart]
autoTrigger:"""
if memory.AlexandriaClass_Turret_AA_2_OnCD==false 
and 
(
    (
        self.resource.AlexandriaClass_Turret_AA_2_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.AlexandriaClass_Turret_AA_2_ShootTimer<${AlexandriaClass_Turret_AA_2_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:AlexandriaClass_Turret_AA_2_OnCD=true,AlexandriaClass_Turret_AA_2_CDTimer=self.timeAlive+${AlexandriaClass_Turret_AA_2_CD}

[hiddenAction_AlexandriaClass_Turret_AA_2_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.AlexandriaClass_Turret_AA_2_OnCD==true and self.timeAlive>memory.AlexandriaClass_Turret_AA_2_CDTimer
setUnitMemory:AlexandriaClass_Turret_AA_2_OnCD=false
setResourcesWithLogic:AlexandriaClass_Turret_AA_2_ShootTimer=${AlexandriaClass_Turret_AA_2_Shoot}

[hiddenAction_AlexandriaClass_Turret_AA_2_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${AlexandriaClass_Turret_AA_2_EN}