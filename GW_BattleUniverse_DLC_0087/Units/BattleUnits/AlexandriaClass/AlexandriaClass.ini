name:AlexandriaClass

displayText:Alexandria Class
displayText_zh:亚历山大级

displayDescription:"""
\nA heavy cruiser developed by the Titans, designed with strong MS deployment capability
\n
\nAdvantages
\n= Powerful armament =
\n= High durability =
\n= Can ReEntry =
\n= Enables communication command =
\n= Enables defense command =
\n= Automatically repairs when out of combat =
\n= Transport capacity: 12x2 =
\n= Receives 35% less damage from structures =
\n= Can disperse Minovsky particles =
\nDisadvantages
\n= Massive size =
\n= -250m anti-detection =
\n= Reveals vision when detected =
\n
\n“We’ve spotted an AEUG vessel!”
"""
displayDescription_zh:"""
\n提坦斯所开发的重型巡洋舰,兼顾了MS运用能力
\n优势
\n=火力充沛=
\n=耐久较高=
\n=可以打上宇宙=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=运输力:12x2=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“发现奥古的舰船了!”
"""



