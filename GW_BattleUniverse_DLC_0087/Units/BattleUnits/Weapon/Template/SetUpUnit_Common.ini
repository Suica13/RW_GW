
[core]
dont_load:true
copyFrom:"""
ROOT:Resource/Image/Fx/Common/Common_Light_1.gw,
ROOT:Resource/Image/Fx/Common/Common_Explosion_1.gw
"""
tags:SetUpUnit
name:SetUpUnit_Common

showOnMinimap:false
price: 5000
maxHp: 500
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

disableDeathOnZeroHp:true

isUnselectable:true
isUnselectableAsTarget:false
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
stayNeutral:true
ignoreInUnitCapCalculation:true

showInEditor:true

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory coreUnit:unit

@memory finalAttackRange:float

@memory finalShootLevel:float
@memory finalCqbLevel:float
@memory finalAccuracyLevel:float
@memory finalReactionLevel:float

@memory extraBuildingAtk:float
@memory extraBuildingDef:float


@memory finalBeamDef:float
@memory finalShellDef:float
@memory finalCqbDef:float

@memory finalBeamDefPlus:float
@memory finalShellDefPlus:float
@memory finalCqbDefPlus:float


@memory lastDamageBy:unit

@memory lifeTime:float



[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
InitializeStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""

"""


[hiddenAction_SetCoreUnit]
autoTriggerOnEvent:created
setUnitMemory:coreUnit=self
setResourcesWithLogic:tileMode=customTarget1.resource().tileMode


[hiddenAction_InitializeStats]
setUnitMemory:"""
finalAttackRange=customTarget1.readUnitMemory("finalAttackRange",type="float"),

finalShootLevel=customTarget1.readUnitMemory("finalShootLevel",type="float"),
finalCqbLevel=customTarget1.readUnitMemory("finalCqbLevel",type="float"),
finalAccuracyLevel=customTarget1.readUnitMemory("finalAccuracyLevel",type="float"),
finalReactionLevel=customTarget1.readUnitMemory("finalReactionLevel",type="float"),

finalBeamDef=customTarget1.readUnitMemory("finalBeamDef",type="float"),
finalShellDef=customTarget1.readUnitMemory("finalShellDef",type="float"),
finalCqbDef=customTarget1.readUnitMemory("finalCqbDef",type="float"),

finalBeamDefPlus=customTarget1.readUnitMemory("finalBeamDefPlus",type="float"),
finalShellDefPlus=customTarget1.readUnitMemory("finalShellDefPlus",type="float"),
finalCqbDefPlus=customTarget1.readUnitMemory("finalCqbDefPlus",type="float"),

extraBuildingDef=customTarget1.readUnitMemory("extraBuildingDef",type="float"),
extraBuildingAtk=customTarget1.readUnitMemory("extraBuildingAtk",type="float"),

lifeTime=10
"""
temporarilyAddTags:CanBeTargetUnit



[hiddenAction_CheckCanBeTargetUnit]
autoTrigger:true
alsoTriggerAction:"""
CheckCanBeTargetUnit_T,
CheckCanBeTargetUnit_F
"""
[hiddenAction_CheckCanBeTargetUnit_T]
requireConditional:if self.hp>0 and not self.hasTags(includes='CanBeTargetUnit') 
temporarilyAddTags:CanBeTargetUnit

[hiddenAction_CheckCanBeTargetUnit_F]
requireConditional:if self.hp<=0 and self.hasTags(includes='CanBeTargetUnit') 
temporarilyRemoveTags:CanBeTargetUnit




[hiddenAction_TookDamage]
autoTriggerOnEvent:newMessage(withTag="Damage")
setUnitStats:hp=self.hp-eventData(name="Damage",type="float")
setUnitMemory:lastDamageBy=eventData(name="LastDamageBy",type="unit")



[hiddenAction_SendEnemyTryAttack_Shoot]
sendMessageTo:self.attacking.readUnitMemory(name='BattleUnitCore',type='unit')
sendMessageWithTags:EnemyTryAttack
sendMessageWithData:UnitInfo=self




[hiddenAction_TimerOut]
autoTrigger:if self.timeAlive>=memory.lifeTime 
spawnEffects:Light_50
deleteSelf:true




[hiddenAction_Die]
autoTrigger:"""
if self.hp<=0 and self.timeAlive<memory.lifeTime
"""
alsoTriggerAction:"""
Die_Step2_Ground,
Die_Step2_Space,
Die_Step3
"""
[hiddenAction_Die_Step2_Ground]
requireConditional:if self.resource().tileMode==0
spawnEffects:Explosion_Ground_1,Crater_1
[hiddenAction_Die_Step2_Space]
requireConditional:if self.resource().tileMode==1
spawnEffects:Explosion_Space_1
[hiddenAction_Die_Step3]
deleteSelf:true

















[decal_HpBar_Self]
layer:beforeUI
order:2
image:SHARED:white_pixel.png
color:#54ffaf
onlyTeam:own
alpha:1
imageScale:1
imageScaleX:30*((self.hp/self.maxHp))
imageScaleY:3
xOffsetAbsolute:(15*((self.hp/self.maxHp)))-15
yOffsetAbsolute:20
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.hp>0 and self.hp<self.maxHp
onlyWhileAlive:true
[decal_HpBar_Ally]
@copyFromSection:decal_HpBar_Self
color:#ffeb54
onlyTeam:allynotown
[decal_HpBar_Enemy]
@copyFromSection:decal_HpBar_Self
color:#ff0b07
onlyTeam:enemy
[decal_HpBar_BackGround]
layer:beforeUI
order:1
image:SHARED:white_pixel.png
color:#000000
onlyTeam:ally
alpha:1
imageScale:1.1
imageScaleX:30
imageScaleY:5
xOffsetAbsolute:0
yOffsetAbsolute:20
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0  and self.teamId>=0 and self.hp<self.maxHp
onlyWhileAlive:true
[decal_HpBar_BackGround_Enemy]
@copyFromSection:decal_HpBar_BackGround
onlyTeam:enemy



[decal_Ring_Self]
layer:beforeBody
order:0
onlyTeam:own
onlyWhileAlive:true
isVisible:true
alpha:0.5
imageScale:1.0
image:ROOT:Resource/Image/Ring/Ring16_Green.png
alwaysStartHeightAtZero:true

isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.parent.hp<=0
[decal_Ring_Ally]
@copyFromSection:decal_Ring_Self
onlyTeam:allynotown
image:ROOT:Resource/Image/Ring/Ring16_Yellow.png
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.parent.hp<=0
[decal_Ring_Enemy]
@copyFromSection:decal_Ring_Self
onlyTeam:Enemy
image:ROOT:Resource/Image/Ring/Ring16_Red.png
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.parent.hp<=0







