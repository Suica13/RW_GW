
[core]
dont_load:true
copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Template/Shoot_BaseProjectile_Shell.ini
"""

name:Shoot_TargetProjectile_Shell


[hiddenAction_FindAttackTarget_Unit]
setUnitMemory:nowAttackTarget=self.nearestUnit(withTag='CanBeDamaged',withinRange=30,relation='enemy')
[hiddenAction_FindAttackTarget_Unit_Lag]
setUnitMemory:"""
nowAttackTarget=self.getOffsetRelative(y=-20).nearestUnit(withTag='CanBeDamaged',withinRange=30,relation='enemy')
"""

[hiddenAction_TryDamageTarget]
requireConditional:"""
if 
(
    memory.nowAttackTarget!=null 
    and 
    max(-(memory.nowAttackTarget.height-self.height),(memory.nowAttackTarget.height-self.height))<=self.resource().HeightHitRange
) 
and 
(
    not memory.triedDamageTarget.contains(memory.nowAttackTarget)
) 
and 
(
    memory.nowAttackTarget.parent==memory.firstTarget 
    or memory.nowAttackTarget==memory.firstTarget 
    or memory.nowAttackTarget.parent==memory.firstTarget.parent
)
"""

[hiddenAction_Contacted_OverTime]
autoTrigger:if self.timeAlive>memory.projectileLife*0.1+3 
deleteSelf:true