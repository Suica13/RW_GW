[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Pink.gw
"""

name:DogosseGiarClass_Turret_BeamCannon_3
displayText:DogosseGiarClass BeamCannon
displayText_zh:多戈斯·基亚 光束炮

maxHp: 35000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory DogosseGiarClass_Turret_BeamCannon_OnCD:bool
@memory DogosseGiarClass_Turret_BeamCannon_CDTimer:float
@global DogosseGiarClass_Turret_BeamCannon_CD=7
@global DogosseGiarClass_Turret_BeamCannon_EN=45

@global DogosseGiarClass_Turret_BeamCannon_Shoot=2
[resource_DogosseGiarClass_Turret_BeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2



[decal_DogosseGiarClass_Turret_BeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/DogosseGiarClass/Image/DogosseGiarClass_Turret_BeamCannon_3.png
imageScale:1.25
basePositionFromTurret:DogosseGiarClass_Turret_BeamCannon






[turret_DogosseGiarClass_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,DogosseGiarClass_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:DogosseGiarClass_Turret_BeamCannon_Projectile
resourceUsage:DogosseGiarClass_Turret_BeamCannon_ShootTimer=1

delay:0.15s
canAttackMaxAngle:15
limitingAngle:75
limitingRange:1200
barrelX:0
barrelY:6
turnSpeed:1.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:5
idleSweepAddRandomAngle:5
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Pink




[projectile_DogosseGiarClass_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_AP_BeamRifle_Pink*1
(
    addResources=
    BeamDamage:6000
    |BeamAPDamage:3000
    |DpDamage:325
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.5
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.5
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:55
    |ProjectileSpread:4
    |ProjectileLife:50

    |ProjectileAttackTimes:2
    |ProjectileAttackTimesDamageModifier:0.5
)
"""


[hiddenAction_DogosseGiarClass_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.DogosseGiarClass_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.DogosseGiarClass_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.DogosseGiarClass_Turret_BeamCannon_ShootTimer<${DogosseGiarClass_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:DogosseGiarClass_Turret_BeamCannon_OnCD=true,DogosseGiarClass_Turret_BeamCannon_CDTimer=self.timeAlive+${DogosseGiarClass_Turret_BeamCannon_CD}

[hiddenAction_DogosseGiarClass_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.DogosseGiarClass_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.DogosseGiarClass_Turret_BeamCannon_CDTimer
setUnitMemory:DogosseGiarClass_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:DogosseGiarClass_Turret_BeamCannon_ShootTimer=${DogosseGiarClass_Turret_BeamCannon_Shoot}

[hiddenAction_DogosseGiarClass_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${DogosseGiarClass_Turret_BeamCannon_EN}