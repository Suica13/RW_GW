name:DogosseGiarClass

displayText:DogosseGiar Class
displayText_zh:多戈斯·基亚级

displayDescription:"""
\nA large-scale space battleship developed by the Titans during the Gryps War to serve as a flagship
\n
\nAdvantages
\n= Powerful armament =
\n= Extremely high durability =
\n= Enables communication command =
\n= Enables defense command =
\n= Automatically repairs when out of combat =
\n= Transport capacity: 12x4 =
\n= Receives 35% less damage from structures =
\n= Can disperse Minovsky particles =
\nDisadvantages
\n= Massive size =
\n= -300m anti-detection =
\n= Reveals vision when detected =
\n
\n“Earth. To regain true power once more, the "Titans" were formed!”
"""
displayDescription_zh:"""
\n泰坦斯在格利普斯战争期间开发的一款大型宇宙战舰以用作旗舰
\n优势
\n=火力充沛=
\n=耐久极高=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=运输力:12x4=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负300码反侦测=
\n=被发现时暴露视野=
\n
\n“地球,为了再次得到真正的力量,提坦斯成立了!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:DogosseGiarClass


displayRadius:75
radius:75

maxHp:425000
maxShield:0

@global cmdComRangeExtra=250
@global cmdDefRangeExtra=250
