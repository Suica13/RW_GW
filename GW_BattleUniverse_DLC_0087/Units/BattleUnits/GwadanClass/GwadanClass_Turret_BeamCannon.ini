[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Beam_Charge_4_Yellow.gw,
ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Beam_Charge_3_Yellow.gw
"""

name:GwadanClass_Turret_BeamCannon
displayText:GwadanClass BeamCannon
displayText_zh:格瓦丹级 光束炮

maxHp: 47500

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory GwadanClass_Turret_BeamCannon_OnCD:bool
@memory GwadanClass_Turret_BeamCannon_CDTimer:float
@global GwadanClass_Turret_BeamCannon_CD=10
@global GwadanClass_Turret_BeamCannon_EN=100

@global GwadanClass_Turret_BeamCannon_Shoot=2
[resource_GwadanClass_Turret_BeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2



[decal_GwadanClass_Turret_BeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/GwadanClass/Image/GwadanClass_Turret_BeamCannon_1.png
imageScale:1.25
basePositionFromTurret:GwadanClass_Turret_BeamCannon






[turret_GwadanClass_Turret_BeamCannon]
x:0
y:0

canShoot:false
onShoot_triggerActions:SendEnemyTryAttack_Shoot,GwadanClass_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:GwadanClass_Turret_BeamCannon_Projectile
resourceUsage:GwadanClass_Turret_BeamCannon_ShootTimer=1

delay:2s
canAttackMaxAngle:15
limitingAngle:90
limitingRange:1200
barrelX:0
barrelY:27
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_2.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Charge_3_Yellow

warmup:1s
warmupStartEffect:Beam_Charge_4_Yellow
[turret_GwadanClass_Turret_BeamCannon_L]
@copyFromSection:turret_GwadanClass_Turret_BeamCannon
attachedTo:GwadanClass_Turret_BeamCannon
x:2
canShoot:true
limitingAngle:15
[turret_GwadanClass_Turret_BeamCannon_R]
@copyFromSection:turret_GwadanClass_Turret_BeamCannon
attachedTo:GwadanClass_Turret_BeamCannon
x:-2
canShoot:true
limitingAngle:15


[projectile_GwadanClass_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamCannon_Yellow*1
(
    addResources=
    BeamDamage:8000
    |BeamAPDamage:4000
    |DpDamage:450
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:35
    |ProjectileSpread:4
    |ProjectileExplosionRange:35
    |ProjectileLife:55

    |ProjectileBlastRange:75
    |ProjectileBlastDamageModifier:0.20
    |ProjectileBlastDpModifier:1
)
"""


[hiddenAction_GwadanClass_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.GwadanClass_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.GwadanClass_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.GwadanClass_Turret_BeamCannon_ShootTimer<${GwadanClass_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:GwadanClass_Turret_BeamCannon_OnCD=true,GwadanClass_Turret_BeamCannon_CDTimer=self.timeAlive+${GwadanClass_Turret_BeamCannon_CD}

[hiddenAction_GwadanClass_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.GwadanClass_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.GwadanClass_Turret_BeamCannon_CDTimer
setUnitMemory:GwadanClass_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:GwadanClass_Turret_BeamCannon_ShootTimer=${GwadanClass_Turret_BeamCannon_Shoot}

[hiddenAction_GwadanClass_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${GwadanClass_Turret_BeamCannon_EN}