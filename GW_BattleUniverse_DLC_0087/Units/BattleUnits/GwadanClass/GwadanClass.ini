tags:GwadanClass,Unit,Ship,CmdUnit,NEO_ZEON,0087,UC,LargeUnit,MpUpUnit_X48
name:GwadanClass

displayText:Gwadan Class
displayText_zh:格瓦丹级

displayDescription:"""
\nA flagship warship developed by Axis to strengthen the cohesion of Zeon remnants long confined in isolation, serving as the new Neo Zeon flagship upon returning to the Earth Sphere
\n
\nAdvantages
\n= Powerful armament =
\n= Can ReEntry =
\n= Extremely high durability =
\n= Enables communication command =
\n= Enables defense command =
\n= Automatically repairs when out of combat =
\n= Expanded communication range =
\n= Transport capacity: 12x4 =
\n= Receives 35% less damage from structures =
\n= Can disperse Minovsky particles =
\nDisadvantages
\n= Massive size =
\n= -300m anti-detection =
\n= Reveals vision when detected =
\n
\n“Long live Lady Mineva!”
"""
displayDescription_zh:"""
\n阿克西斯为了提升长期处于闭锁环境下的吉翁残党的凝聚力,而开发出的一款作为回归地球圈的新吉翁军旗舰的战舰
\n优势
\n=火力充沛=
\n=耐久极高=
\n=可以打上宇宙=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=更大的通信范围=
\n=运载力:12x4=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负350码反侦测=
\n=被发现时暴露视野=
\n
\n“密涅瓦大人,万岁!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:GwadanClass


displayRadius:75
radius:75

maxHp:500000
maxShield:0

@global cmdComRangeExtra=350
@global cmdDefRangeExtra=350
@global supplyPointRangeExtra=150

