[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""

name:ChivvayClassKai_Turret_MG
displayText:ChivvayClassKai MG
displayText_zh:契贝级改 机炮

maxHp: 5500


@memory ChivvayClassKai_Turret_MG_OnCD:bool
@memory ChivvayClassKai_Turret_MG_CDTimer:float
@global ChivvayClassKai_Turret_MG_CD=1
@global ChivvayClassKai_Turret_MG_EN=0.5

@global ChivvayClassKai_Turret_MG_Shoot=10
[resource_ChivvayClassKai_Turret_MG_ShootTimer]
hidden:true



#AA炮用

[decal_Burned]
imageScale:0.75
[decal_Stun]
imageScale:0.425
[decal_LowHp]
imageScale:0.5
[decal_Marker]
imageScale:0.25



[graphics]
drawLayer:ground2



[decal_ChivvayClassKai_Turret_MG]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/ChivvayClassKai/Image/ChivvayClassKai_Turret_MG_1.png
imageScale:0.85
basePositionFromTurret:ChivvayClassKai_Turret_MG






[turret_ChivvayClassKai_Turret_MG]
x:0
y:0

canShoot:true
onShoot_triggerActions:ChivvayClassKai_Turret_MG_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:ChivvayClassKai_Turret_MG_Projectile
resourceUsage:ChivvayClassKai_Turret_MG_ShootTimer=1

delay:0.2s
canAttackMaxAngle:60
limitingAngle:90
limitingRange:600
barrelX:2
barrelY:6
barrelOffsetX_onOddShots:-4
turnSpeed:3.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_2.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1_S




[projectile_ChivvayClassKai_Turret_MG_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MG*1
(
    addResources=
    ShellDamage:300
    |ShellAPDamage:50
    |DpDamage:10
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1.5
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:90
    |ProjectileSpread:6
    |ProjectileLife:7.5
)
"""


[hiddenAction_ChivvayClassKai_Turret_MG_CDStart]
autoTrigger:"""
if memory.ChivvayClassKai_Turret_MG_OnCD==false 
and 
(
    (
        self.resource.ChivvayClassKai_Turret_MG_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.ChivvayClassKai_Turret_MG_ShootTimer<${ChivvayClassKai_Turret_MG_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:ChivvayClassKai_Turret_MG_OnCD=true,ChivvayClassKai_Turret_MG_CDTimer=self.timeAlive+${ChivvayClassKai_Turret_MG_CD}

[hiddenAction_ChivvayClassKai_Turret_MG_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.ChivvayClassKai_Turret_MG_OnCD==true and self.timeAlive>memory.ChivvayClassKai_Turret_MG_CDTimer
setUnitMemory:ChivvayClassKai_Turret_MG_OnCD=false
setResourcesWithLogic:ChivvayClassKai_Turret_MG_ShootTimer=${ChivvayClassKai_Turret_MG_Shoot}

[hiddenAction_ChivvayClassKai_Turret_MG_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${ChivvayClassKai_Turret_MG_EN}