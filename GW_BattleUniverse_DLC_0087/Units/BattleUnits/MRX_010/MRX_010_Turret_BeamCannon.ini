[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanNotBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Yellow.gw
"""

name:MRX_010_Turret_BeamCannon
displayText:Psyco Gundam MK-II BeamCannon
displayText_zh:精神感应高达MK-II 光束加农

maxHp: 10000

isUnselectable:true
canNotBeGivenOrdersByPlayer:true

@memory MRX_010_Turret_BeamCannon_OnCD:bool
@memory MRX_010_Turret_BeamCannon_CDTimer:float
@global MRX_010_Turret_BeamCannon_CD=6
@global MRX_010_Turret_BeamCannon_EN=25

@global MRX_010_Turret_BeamCannon_Shoot=1
[resource_MRX_010_Turret_BeamCannon_ShootTimer]
hidden:true



[decal_Test]
image:ROOT:Resource/Image/Ring/Ring16_Yellow.png
isVisible:false



[turret_MRX_010_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,MRX_010_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:MRX_010_Turret_BeamCannon_Projectile
resourceUsage:MRX_010_Turret_BeamCannon_ShootTimer=1

delay:0.2s
canAttackMaxAngle:120
limitingAngle:60
limitingRange:650
barrelX:0
barrelY:0
turnSpeed:1

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:5
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Yellow




[projectile_MRX_010_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamRifle_Yellow*1
(
    addResources=
    BeamDamage:6000
    |DpDamage:150
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:60
    |ProjectileSpread:3
    |ProjectileLife:50
)
"""


[hiddenAction_MRX_010_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.MRX_010_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.MRX_010_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.MRX_010_Turret_BeamCannon_ShootTimer<${MRX_010_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:MRX_010_Turret_BeamCannon_OnCD=true,MRX_010_Turret_BeamCannon_CDTimer=self.timeAlive+${MRX_010_Turret_BeamCannon_CD}

[hiddenAction_MRX_010_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.MRX_010_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.MRX_010_Turret_BeamCannon_CDTimer
setUnitMemory:MRX_010_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:MRX_010_Turret_BeamCannon_ShootTimer=${MRX_010_Turret_BeamCannon_Shoot}

[hiddenAction_MRX_010_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${MRX_010_Turret_BeamCannon_EN}