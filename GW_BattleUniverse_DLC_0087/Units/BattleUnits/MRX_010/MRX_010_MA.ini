\n提坦斯所开发的塞克谬系统试作机,具备强大的火力
\n优势
\n=可以发射MEGA粒子炮=
\n=装备I立场=
\n=抗性极高=
\n=允许防御指挥=
\n=对付群体光束武器单位时效果极佳=
\n劣势
\n=-100米反侦测=
\n=续航较差=
\n=反应较差=
\n
\n“燃烧的新都市”
"""

