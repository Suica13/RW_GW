[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:TivvayClass_Turret_MS
displayText:TivvayClass MS
displayText_zh:契贝级 导弹

maxHp: 12000



@memory TivvayClass_Turret_MS_OnCD:bool
@memory TivvayClass_Turret_MS_CDTimer:float
@global TivvayClass_Turret_MS_CD=12
@global TivvayClass_Turret_MS_EN=12

@global TivvayClass_Turret_MS_Shoot=4
[resource_TivvayClass_Turret_MS_ShootTimer]
hidden:true




[turret_TivvayClass_Turret_MS]
x:0
y:0

canShoot:true
onShoot_triggerActions:TivvayClass_Turret_MS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:TivvayClass_Turret_MS_Projectile
resourceUsage:TivvayClass_Turret_MS_ShootTimer=1

delay:0.75s
canAttackMaxAngle:360
limitingAngle:360
limitingRange:1200
barrelX:30
barrelY:0
barrelOffsetX_onOddShots:-60
turnSpeed:0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_TivvayClass_Turret_MS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS*1
(
    addResources=
    ShellDamage:1250
    |DpDamage:125
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.25
    |AntiAir=0.25
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:35
    |ProjectileTurnspeed:1.25
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:40
)
"""


[hiddenAction_TivvayClass_Turret_MS_CDStart]
autoTrigger:"""
if memory.TivvayClass_Turret_MS_OnCD==false 
and 
(
    (
        self.resource.TivvayClass_Turret_MS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.TivvayClass_Turret_MS_ShootTimer<${TivvayClass_Turret_MS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:TivvayClass_Turret_MS_OnCD=true,TivvayClass_Turret_MS_CDTimer=self.timeAlive+${TivvayClass_Turret_MS_CD}

[hiddenAction_TivvayClass_Turret_MS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.TivvayClass_Turret_MS_OnCD==true and self.timeAlive>memory.TivvayClass_Turret_MS_CDTimer
setUnitMemory:TivvayClass_Turret_MS_OnCD=false
setResourcesWithLogic:TivvayClass_Turret_MS_ShootTimer=${TivvayClass_Turret_MS_Shoot}

[hiddenAction_TivvayClass_Turret_MS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${TivvayClass_Turret_MS_EN}