    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:55
    |ProjectileSpread:4
    |ProjectileLife:50

    |ProjectileAttackTimes:2
    |ProjectileAttackTimesDamageModifier:0.5
)
"""


[hiddenAction_SalamisClassKai_0087_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.SalamisClassKai_0087_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.SalamisClassKai_0087_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.SalamisClassKai_0087_Turret_BeamCannon_ShootTimer<${SalamisClassKai_0087_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:SalamisClassKai_0087_Turret_BeamCannon_OnCD=true,SalamisClassKai_0087_Turret_BeamCannon_CDTimer=self.timeAlive+${SalamisClassKai_0087_Turret_BeamCannon_CD}

[hiddenAction_SalamisClassKai_0087_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.SalamisClassKai_0087_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.SalamisClassKai_0087_Turret_BeamCannon_CDTimer
setUnitMemory:SalamisClassKai_0087_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:SalamisClassKai_0087_Turret_BeamCannon_ShootTimer=${SalamisClassKai_0087_Turret_BeamCannon_Shoot}

[hiddenAction_SalamisClassKai_0087_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${SalamisClassKai_0087_Turret_BeamCannon_EN}