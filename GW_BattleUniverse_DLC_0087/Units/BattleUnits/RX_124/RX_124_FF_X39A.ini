[hiddenAction_TITANS_ShieldBoostedRifle_Double_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange  
and not 
(
    memory.armRBreaked==true  
    and 
    memory.armLBreaked==true 
) 
and memory.TITANS_ShieldBoostedRifle_Double_Winch_Unit.hp<=0 
and memory.TITANS_ShieldBoostedRifle_Double_Winch_Unit_L.hp<=0 
and eventData("RandomWeapon",type="float")>35
"""

[hiddenAction_TITANS_ShieldBoostedRifle_Double_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0

[decal_TITANS_ShieldBoostedRifle_Double]
isVisible:if (memory.nowWeaponIndex==0 or memory.nowWeaponIndex==2) and memory.armRBreaked==false and memory.TITANS_ShieldBoostedRifle_Double_Winch_Unit.hp<=0 

