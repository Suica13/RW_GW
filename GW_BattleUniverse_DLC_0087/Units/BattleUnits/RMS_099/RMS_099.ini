tags:RMS_099,Unit,MS,AEUG,0087,UC
name:RMS_099

displayText:Rick Dias
displayText_zh:力克迪亚斯

displayDescription:"""
\nA high-performance mass-production unit developed by AEUG, built with the new Gundarium alloy
\nAdvantages
\n=Can equip both a bazooka and a beam gun simultaneously=
\n=High resistance to physical ammunition=
\n=Good mobility=
\nDisadvantages
\n=Relatively expensive for a mass-production unit=
\n
\n“Calling it a Gundam feels like insulting the Gundam name… let’s just call it the Rick Dias.” 
"""
displayDescription_zh:"""
\n奥古所开发的高性能量产机,采用了新型高达尼姆合金
\n优势
\n=同时装备火箭筒与光束枪=
\n=实弹抗性较高=
\n=机动性较好=
\n劣势
\n=作为量产机价格较高=
\n
\n“叫高达感觉有点侮辱高达的名号了,不如就叫他力克迪亚斯吧.”
"""

showActionsWithMixedSelectionIfOtherUnitsHaveTag:RMS_099


maxHp:55000
maxShield:0

