[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Pink.gw
"""

name:IrishClass_Turret_SubBeamCannon
displayText:IrishClass SubBeamCannon
displayText_zh:爱尔兰级 副光束炮

maxHp: 40000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory IrishClass_Turret_SubBeamCannon_OnCD:bool
@memory IrishClass_Turret_SubBeamCannon_CDTimer:float
@global IrishClass_Turret_SubBeamCannon_CD=6
@global IrishClass_Turret_SubBeamCannon_EN=40

@global IrishClass_Turret_SubBeamCannon_Shoot=1
[resource_IrishClass_Turret_SubBeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2



[decal_IrishClass_Turret_SubBeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/IrishClass/Image/IrishClass_Turret_SubBeamCannon_1.png
imageScale:1.25
basePositionFromTurret:IrishClass_Turret_SubBeamCannon






[turret_IrishClass_Turret_SubBeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,IrishClass_Turret_SubBeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:IrishClass_Turret_SubBeamCannon_Projectile
resourceUsage:IrishClass_Turret_SubBeamCannon_ShootTimer=1

delay:2s
canAttackMaxAngle:15
limitingAngle:120
limitingRange:1200
barrelX:0
barrelY:6
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Pink


[projectile_IrishClass_Turret_SubBeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_AP_BeamRifle_Pink*1
(
    addResources=
    BeamDamage:6000
    |BeamAPDamage:2000
    |DpDamage:325
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.5
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.5
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:55
    |ProjectileSpread:4
    |ProjectileLife:50

    |ProjectileAttackTimes:2
    |ProjectileAttackTimesDamageModifier:0.5
)
"""


[hiddenAction_IrishClass_Turret_SubBeamCannon_CDStart]
autoTrigger:"""
if memory.IrishClass_Turret_SubBeamCannon_OnCD==false 
and 
(
    (
        self.resource.IrishClass_Turret_SubBeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.IrishClass_Turret_SubBeamCannon_ShootTimer<${IrishClass_Turret_SubBeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:IrishClass_Turret_SubBeamCannon_OnCD=true,IrishClass_Turret_SubBeamCannon_CDTimer=self.timeAlive+${IrishClass_Turret_SubBeamCannon_CD}

[hiddenAction_IrishClass_Turret_SubBeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.IrishClass_Turret_SubBeamCannon_OnCD==true and self.timeAlive>memory.IrishClass_Turret_SubBeamCannon_CDTimer
setUnitMemory:IrishClass_Turret_SubBeamCannon_OnCD=false
setResourcesWithLogic:IrishClass_Turret_SubBeamCannon_ShootTimer=${IrishClass_Turret_SubBeamCannon_Shoot}

[hiddenAction_IrishClass_Turret_SubBeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${IrishClass_Turret_SubBeamCannon_EN}