name:IrishClass

displayText:Irish Class
displayText_zh:爱尔兰级

displayDescription:"""
\nA new main battleship developed by Anaheim based on the Salamis-class
\n
\nAdvantages
\n= Powerful armament =
\n= High durability =
\n= Can ReEntry =
\n= Enables communication command =
\n= Enables defense command =
\n= Automatically repairs when out of combat =
\n= Transport capacity: 12x2 =
\n= Receives 35% less damage from structures =
\n= Can disperse Minovsky particles =
\nDisadvantages
\n= Massive size =
\n= -250m anti-detection =
\n= Reveals vision when detected =
\n
\n“My apologies, everyone. This ship will advance to rescue Lieutenant Emma!”
"""
displayDescription_zh:"""
\n阿纳海姆基于萨拉米斯所开发的新型主力战舰
\n优势
\n=火力充沛=
\n=耐久较高=
\n=可以打上宇宙=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=运输力:12x2=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大=
\n=负250码反侦测=
\n=被发现时暴露视野=
\n
\n“对不住各位了,本舰将前进并救援艾玛中尉!”
"""



