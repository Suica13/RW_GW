[core]
dont_load:false
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw,
ROOT:Units/BattleUnits/EndraClass/PlayerControl/Ships/EndraClass_Turret_MS.gw
"""

name:EndraClass_Turret_MS
displayText:EndraClass MS
displayText_zh:恩多拉级 导弹

maxHp: 20000



@memory EndraClass_Turret_MS_OnCD:bool
@memory EndraClass_Turret_MS_CDTimer:float
@global EndraClass_Turret_MS_CD=12
@global EndraClass_Turret_MS_EN=12

@global EndraClass_Turret_MS_Shoot=4
[resource_EndraClass_Turret_MS_ShootTimer]
hidden:true




[turret_EndraClass_Turret_MS]
x:0
y:0

canShoot:true
onShoot_triggerActions:ManualShip_Consumed
canAttackCondition:if (${onAttacking}==false and ${cantAction}==false  and (parent.resource().en>0 or memory.manualShipReserved)) and (not memory.manualShipReserved or not parent.hasTags(includes='ManualControlled') or ${manualShipOrderReady})
showRangeUIGuide:false
projectile:EndraClass_Turret_MS_Projectile
resourceUsage:EndraClass_Turret_MS_ShootTimer=1,ManualShipShotPermit=1

delay:0.75s
canAttackMaxAngle:360
limitingAngle:360
limitingRange:1200
barrelX:25
barrelY:0
barrelOffsetX_onOddShots:-50
turnSpeed:0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_EndraClass_Turret_MS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS*1
(
    addResources=
    ShellDamage:3250
    |DpDamage:165
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.25
    |AntiAir=0.25
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:35
    |ProjectileTurnspeed:1.25
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:40
)
"""


[hiddenAction_EndraClass_Turret_MS_CDStart]
autoTrigger:if (memory.EndraClass_Turret_MS_OnCD==false and (    (        self.resource.EndraClass_Turret_MS_ShootTimer<=0     )     or     (        self.resource.EndraClass_Turret_MS_ShootTimer<${EndraClass_Turret_MS_Shoot} and not self.hasTags(includes='inBattle')    ))) and (not parent.hasTags(includes='ManualControlled') or memory.manualShipRemaining<=0 or self.timeAlive>=memory.manualShipOrderUntil)
setUnitMemory:EndraClass_Turret_MS_OnCD=true,EndraClass_Turret_MS_CDTimer=self.timeAlive+${EndraClass_Turret_MS_CD}

[hiddenAction_EndraClass_Turret_MS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.EndraClass_Turret_MS_OnCD==true and self.timeAlive>memory.EndraClass_Turret_MS_CDTimer
setUnitMemory:EndraClass_Turret_MS_OnCD=false
setResourcesWithLogic:EndraClass_Turret_MS_ShootTimer=${EndraClass_Turret_MS_Shoot}

[hiddenAction_EndraClass_Turret_MS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${EndraClass_Turret_MS_EN}