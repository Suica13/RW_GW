tags:EndraClass,Unit,Ship,CmdUnit,NEO_ZEON,0087,UC,LargeUnit,MpUpUnit_X8,ManualControlCapable
name:EndraClass

displayText:Endra Class
displayText_zh:恩多拉级

displayDescription:"""
\nNeo Zeon's main light cruiser, developed from the Musai class for naval combat and mobile-suit operations
\nThe class served in the First Neo Zeon War; the lead ship Endra was commanded by Mashymre Cello and later Chara Soon
\n
\nAdvantages
\n=Multiple beam cannons and missile launchers provide fire support=
\n=High durability and armor=
\n=Transport capacity: 8=
\n=Out-of-combat repair and allied resupply=
\n=Can launch into space with boosters=
\n=35% less damage from buildings=
\n=Minovsky particle dispersion=
\nDisadvantages
\n=Large hull and slow turning=
\n=Poor ground and atmospheric adaptability=
\n=Weapons and resupply share EN reserves=
\n=-250 anti-detection range; reveals vision when detected=
\n
\n"Long live Lady Haman!"
"""
displayDescription_zh:"""
\n由姆塞级发展而来的新吉翁主力轻巡洋舰，兼顾舰炮作战与MS部队运用
\n同型舰活跃于第一次新吉翁战争，首舰恩多拉曾由马士文与凯拉先后指挥
\n
\n优势
\n=多座光束炮与导弹提供火力支援=
\n=耐久与装甲较高=
\n=运载力:8=
\n=脱战自动修复与友军补给=
\n=可装备打上助推器进入宇宙=
\n=受到建筑伤害减少35%=
\n=可以散布米诺夫斯基粒子=
\n劣势
\n=体积巨大，转向较慢=
\n=地面与大气圈环境适应较差=
\n=舰炮与补给共用EN储备=
\n=负250码反侦测，被发现时暴露视野=
\n
\n“哈曼大人，万岁！”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:EndraClass


