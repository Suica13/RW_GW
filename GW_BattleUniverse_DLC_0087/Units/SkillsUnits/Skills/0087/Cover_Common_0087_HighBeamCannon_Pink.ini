fireTurretXAtGround:MainTurret
fireTurretXAtGround_count:0

price: Money=${Money}

setUnitMemory:"""
Cover_Common_0087_HighBeamCannon_Pink_CDTimer=self.timeAlive+${CD}
"""

alsoTriggerAction:"""
Cover_Common_0087_HighBeamCannon_Pink_Step2,
Cover_Common_0087_HighBeamCannon_Pink_Send_CV_Ally,
Cover_Common_0087_HighBeamCannon_Pink_Send_CV_Enemy
"""
