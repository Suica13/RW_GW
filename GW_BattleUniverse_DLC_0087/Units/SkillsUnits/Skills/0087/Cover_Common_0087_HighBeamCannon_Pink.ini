buildSpeed:0s
setUnitMemory:"""
Cover_Common_0087_HighBeamCannon_Pink_Target=select
(
    self.isControlledByAI==false,
    thisActionTarget,
    memory.Cover_Common_0087_HighBeamCannon_Pink_Target
)
"""
