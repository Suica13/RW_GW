@define CD=300
@define Money=5000

pos:100

buildSpeed:0s

highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
ai_isDisabled:true
extraLagHidingInUI:true

displayType:action
isGuiBlinking:"""
if self.timeAlive>memory.Cover_Common_0087_HighBeamCannon_Pink_CDTimer 
and self.resource().WarLevel>${WarLevel}
"""

text:Cover Artillery %{select(self.timeAlive<=memory.Cover_Common_0087_HighBeamCannon_Pink_CDTimer,str(int(memory.Cover_Common_0087_HighBeamCannon_Pink_CDTimer-self.timeAlive))+"s","OK")}
text_zh:支援炮击 %{select(self.timeAlive<=memory.Cover_Common_0087_HighBeamCannon_Pink_CDTimer,str(int(memory.Cover_Common_0087_HighBeamCannon_Pink_CDTimer-self.timeAlive))+"s","OK")}

description: Call Artillery Support\nLow Damage For Buildings
description_zh: 在指定区域呼叫炮击支援\n对建筑物造成的伤害较低

showMessageToAllPlayers:[%{self.playerName}]Called Artillery Support
showMessageToAllPlayers_zh:[%{self.playerName}]呼叫了炮击支援

iconImage:ROOT:Resource/Image/Units/Button/Cover/Cover_Artillery_1.png
playSoundGlobally:ROOT:Resource/Sound/SE/Environment/Warning_4.ogg:0.75

isLocked:if self.timeAlive<=memory.Cover_Common_0087_HighBeamCannon_Pink_CDTimer
