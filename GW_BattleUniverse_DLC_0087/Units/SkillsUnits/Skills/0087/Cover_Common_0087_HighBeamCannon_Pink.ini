[core]
dont_load:true

@memory Cover_Common_0087_HighBeamCannon_Pink_CDTimer:float
@memory Cover_Common_0087_HighBeamCannon_Pink_Target:unit

[action_Cover_Common_0087_HighBeamCannon_Pink]
