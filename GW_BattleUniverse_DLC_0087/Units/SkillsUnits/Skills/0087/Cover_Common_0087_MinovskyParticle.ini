[core]
dont_load:true

@memory Cover_Common_0087_MinovskyParticle_CDTimer:float
@memory Cover_Common_0087_MinovskyParticle_Target:unit

[action_Cover_Common_0087_MinovskyParticle]
@define WarLevel=200
@define CD=300
@define Money=2000

pos:100

buildSpeed:0s

highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:true
alwaysSinglePress:true
ai_isDisabled:true
extraLagHidingInUI:true

displayType:action
isGuiBlinking:"""
if self.timeAlive>memory.Cover_Common_0087_MinovskyParticle_CDTimer 
and self.resource().WarLevel>${WarLevel}
"""

text:MinovskyParticle %{select(self.timeAlive<=memory.Cover_Common_0087_MinovskyParticle_CDTimer,str(int(memory.Cover_Common_0087_MinovskyParticle_CDTimer-self.timeAlive))+"s","OK")}
text_zh:米诺夫斯基粒子 %{select(self.timeAlive<=memory.Cover_Common_0087_MinovskyParticle_CDTimer,str(int(memory.Cover_Common_0087_MinovskyParticle_CDTimer-self.timeAlive))+"s","OK")}

description: AreaAlly:\nReaction+15%(MS+30%)\nAntiDetect+200m\nShootDef Up\n45s
description_zh: 范围友军:\n反应+15%(MS+30%)\n反侦测+200m\n射击抗性上升\持续45秒

showMessageToAllPlayers:[%{self.playerName}]Used MinovskyParticle
showMessageToAllPlayers_zh:[%{self.playerName}]散布了米诺夫斯基粒子

iconImage:ROOT:Resource/Image/Units/Button/Cover/Cover_MinovskyParticle_1.png
playSoundGlobally:ROOT:Resource/Sound/SE/Environment/Warning_4.ogg:0.75

isLocked:if self.timeAlive<=memory.Cover_Common_0087_MinovskyParticle_CDTimer
isLockedMessage:In CD
isLockedMessage_zh:冷却中
isLockedAlt:if self.resource().WarLevel<${WarLevel}
isLockedAltMessage:WarLevel ${WarLevel}
isLockedAltMessage_zh:激烈度 ${WarLevel}

fireTurretXAtGround:MainTurret
fireTurretXAtGround_count:0

price: Money=${Money}

setUnitMemory:"""
Cover_Common_0087_MinovskyParticle_CDTimer=self.timeAlive+${CD}
"""

alsoTriggerAction:"""
Cover_Common_0087_MinovskyParticle_Step2,
Cover_Common_0087_MinovskyParticle_Send_CV_Ally,
Cover_Common_0087_MinovskyParticle_Send_CV_Enemy
"""
[hiddenAction_Cover_Common_0087_MinovskyParticle_Step2]
buildSpeed:0s
setUnitMemory:"""
Cover_Common_0087_MinovskyParticle_Target=select
(
    self.isControlledByAI==false,
    thisActionTarget,
    memory.Cover_Common_0087_MinovskyParticle_Target
)
"""
alsoTriggerAction:Cover_Common_0087_MinovskyParticle_Step3
[hiddenAction_Cover_Common_0087_MinovskyParticle_Step3]
