[core]
dont_load:true

name:Common_MainBuildList



[template_canBuild]
@define UnitID=Test
@define TileMode=0
@define OtherVisible= (true)

name:${UnitID}

isLockedAlt:"""
if 
(
    (
        self.resource.TileMode!=${TileMode} 
        and 
        ${TileMode}!=99
    )   
    and (self.resource.AutoTileMode==0 or self.isControlledByAI())
) 
and 
(
    self.globalTeamTags(includes='Unlock_${UnitID}') 
    and 
    ${OtherVisible}
)
"""
isVisible:if (self.resource.TileMode==${TileMode} or ${TileMode}==99 or self.resource.AutoTileMode==1) and self.globalTeamTags(includes='Unlock_${UnitID}') and ${OtherVisible}