tags:GAT_X103,Unit,MS,OMNI,CE71,SEED
name:GAT_X103

displayText:Buster Gundam
displayText_zh:暴风高达

displayDescription:"""
\nOne of the products of the cooperation between the Earth Alliance and Morgenroete, with extremely strong artillery combat capability
\nAdvantages
\n=Equipped with Phase Shift armor=
\n=Extremely strong in ranged combat=
\n=Equipped with both beam and ballistic weapons=
\nDisadvantages
\n=Extremely expensive=
\n=Almost no melee capability=
\n
\n“Fighting the OMNI doesn’t count as defection!”
"""
displayDescription_zh:"""
\n地球联合与曙光社合作的产物之一,具备很强的炮击战能力
\n优势
\n=搭载PS装甲=
\n=射击战非常优秀=
\n=同时装备光束与实弹武器=
\n劣势
\n=价格极其昂贵=
\n=几乎没有格斗能力=
\n
\n“打联合的话,就不算叛逃!”
"""


showActionsWithMixedSelectionIfOtherUnitsHaveTag:GAT_X103


maxHp:32000
maxShield:0
