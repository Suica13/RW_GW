[hiddenAction_OMNI_GAT_X103_MS_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=500 
and not 
(
    memory.armLBreaked==true 
    and 
    memory.armRBreaked==true 
) 
and eventData("RandomWeapon",type="float")>35 
and eventData("RandomWeapon",type="float")<=50 
"""



[hiddenAction_OMNI_GAT_X103_BR_HyperSniper_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>120  
and distanceBetween(self,self.attacking)<=memory.finalAttackRange 
and not 
(
    memory.armLBreaked==true 
    and 
    memory.armRBreaked==true 
) 
and eventData("RandomWeapon",type="float")>20 
and eventData("RandomWeapon",type="float")<=35 
"""
[hiddenAction_OMNI_GAT_X103_BR_HyperSniper_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=2
[decal_OMNI_GAT_X103_HyperSniper_RailGun]
isVisible:if memory.armLBreaked==false and memory.nowWeaponIndex==2
[decal_OMNI_GAT_X103_HyperSniper_BR]
