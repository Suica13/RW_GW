[hiddenAction_OMNI_GAT_X103_BR_Trigger]
autoTriggerOnEvent:newMessage(withTag="Attack")
requireConditional:"""
if distanceBetween(self,self.attacking)>60  
and distanceBetween(self,self.attacking)<=500 
and memory.armLBreaked==false 
and eventData("RandomWeapon",type="float")>75 
"""
[hiddenAction_OMNI_GAT_X103_BR_SetWeaponIndex]
setUnitMemory:nowWeaponIndex=0
[decal_OMNI_GAT_X103_BR]
isVisible:if memory.armLBreaked==false and memory.nowWeaponIndex==0



[hiddenAction_OMNI_GAT_X103_Railgun_Trigger]
