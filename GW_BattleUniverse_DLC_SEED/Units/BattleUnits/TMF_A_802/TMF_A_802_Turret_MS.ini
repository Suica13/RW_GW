[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanNotBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:TMF_A_802_Turret_MS
displayText:TMF_A_802 MS
displayText_zh:巴库 导弹发射器

maxHp: 7500


@memory TMF_A_802_Turret_MS_OnCD:bool
@memory TMF_A_802_Turret_MS_CDTimer:float
@global TMF_A_802_Turret_MS_CD=4.5
@global TMF_A_802_Turret_MS_EN=10

@global TMF_A_802_Turret_MS_Shoot=7
[resource_TMF_A_802_Turret_MS_ShootTimer]
hidden:true



[graphics]
drawLayer:ground2



[decal_TMF_A_802_Turret_MS]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar') and parent.resource().EquipmentIndex==1
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/TMF_A_802/Image/TMF_A_802_MS_1.png
imageScale:0.85
basePositionFromTurret:TMF_A_802_Turret_MS






[turret_TMF_A_802_Turret_MS]
x:0
y:0

canShoot:true
onShoot_triggerActions:TMF_A_802_Turret_MS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0 
and parent.resource().EquipmentIndex==1
"""
showRangeUIGuide:false
projectile:TMF_A_802_Turret_MS_Projectile
resourceUsage:TMF_A_802_Turret_MS_ShootTimer=1

delay:0.1s
canAttackMaxAngle:60
limitingAngle:90
limitingRange:600
barrelX:5
barrelY:5
barrelOffsetX_onOddShots:-10
turnSpeed:4.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_TMF_A_802_Turret_MS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS_Red*1
(
    addResources=
    ShellDamage:1250
    |DpDamage:35
    |WeaponAccuracy=75
    |PartBreakModifier=1.0
    |CockpitBreakModifier=1.0
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=1
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:35
    |ProjectileTurnspeed:1.0
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:40

    |EquipmentIndex:1
    |EquipmentIndex2:150
)
"""


[hiddenAction_TMF_A_802_Turret_MS_CDStart]
autoTrigger:"""
if memory.TMF_A_802_Turret_MS_OnCD==false 
and 
(
    (
        self.resource.TMF_A_802_Turret_MS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.TMF_A_802_Turret_MS_ShootTimer<${TMF_A_802_Turret_MS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:TMF_A_802_Turret_MS_OnCD=true,TMF_A_802_Turret_MS_CDTimer=self.timeAlive+${TMF_A_802_Turret_MS_CD}

[hiddenAction_TMF_A_802_Turret_MS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.TMF_A_802_Turret_MS_OnCD==true and self.timeAlive>memory.TMF_A_802_Turret_MS_CDTimer
setUnitMemory:TMF_A_802_Turret_MS_OnCD=false
setResourcesWithLogic:TMF_A_802_Turret_MS_ShootTimer=${TMF_A_802_Turret_MS_Shoot}

[hiddenAction_TMF_A_802_Turret_MS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${TMF_A_802_Turret_MS_EN}