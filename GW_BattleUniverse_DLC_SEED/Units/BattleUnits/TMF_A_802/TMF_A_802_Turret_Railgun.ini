[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanNotBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/Railgun_Fire_1.gw
"""

name:TMF_A_802_Turret_Railgun
displayText:TMF_A_802 Railgun
displayText_zh:巴库 轨道炮

maxHp: 7500


@memory TMF_A_802_Turret_Railgun_OnCD:bool
@memory TMF_A_802_Turret_Railgun_CDTimer:float
@global TMF_A_802_Turret_Railgun_CD=2.5
@global TMF_A_802_Turret_Railgun_EN=25

@global TMF_A_802_Turret_Railgun_Shoot=2
[resource_TMF_A_802_Turret_Railgun_ShootTimer]
hidden:true



[graphics]
drawLayer:ground2



[decal_TMF_A_802_Turret_Railgun]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar') and parent.resource().EquipmentIndex==0
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/TMF_A_802/Image/TMF_A_802_Railgun_1.png
imageScale:0.85
basePositionFromTurret:TMF_A_802_Turret_Railgun






[turret_TMF_A_802_Turret_Railgun]
x:0
y:0

canShoot:true
onShoot_triggerActions:TMF_A_802_Turret_Railgun_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0 
and parent.resource().EquipmentIndex==0
"""
showRangeUIGuide:false
projectile:TMF_A_802_Turret_Railgun_Projectile
resourceUsage:TMF_A_802_Turret_Railgun_ShootTimer=1

delay:0.2s
canAttackMaxAngle:60
limitingAngle:90
limitingRange:600
barrelX:8
barrelY:11
barrelOffsetX_onOddShots:-16
turnSpeed:4.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/Railgun_1.ogg
shoot_sound_vol:0.5
shoot_flame:Railgun_Fire_1




[projectile_TMF_A_802_Turret_Railgun_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_RailShell*1
(
    addResources=
    ShellAPDamage:1000
    |ShellDamage:2500
    |DpDamage:150
    |WeaponAccuracy=85
    |PartBreakModifier=0.75
    |CockpitBreakModifier=1.25
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiAqua=1 
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=0.5
    |HeightChangeSpeed=2
    |HeightHitRange=20
    |ProjectileSpeed:80
    |ProjectileSpread:1
    |ProjectileExplosionRange:30
    |ProjectileLife:25
)
"""


[hiddenAction_TMF_A_802_Turret_Railgun_CDStart]
autoTrigger:"""
if memory.TMF_A_802_Turret_Railgun_OnCD==false 
and 
(
    (
        self.resource.TMF_A_802_Turret_Railgun_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.TMF_A_802_Turret_Railgun_ShootTimer<${TMF_A_802_Turret_Railgun_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:TMF_A_802_Turret_Railgun_OnCD=true,TMF_A_802_Turret_Railgun_CDTimer=self.timeAlive+${TMF_A_802_Turret_Railgun_CD}

[hiddenAction_TMF_A_802_Turret_Railgun_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.TMF_A_802_Turret_Railgun_OnCD==true and self.timeAlive>memory.TMF_A_802_Turret_Railgun_CDTimer
setUnitMemory:TMF_A_802_Turret_Railgun_OnCD=false
setResourcesWithLogic:TMF_A_802_Turret_Railgun_ShootTimer=${TMF_A_802_Turret_Railgun_Shoot}

[hiddenAction_TMF_A_802_Turret_Railgun_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${TMF_A_802_Turret_Railgun_EN}