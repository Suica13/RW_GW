tags:TMF_A_802,Unit,MS,ZAFT,CE71,SEED
name:TMF_A_802

displayText:BuCUE
displayText_zh:巴库

displayDescription:"""
\nAn assault-type MS developed by ZAFT for ground combat
\nAdvantages
\n=Extremely high mobility=
\n=Powerful firepower=
\nDisadvantages
\n=Mobility becomes very poor if the legs are damaged=
\n=High supply consumption when moving=
\n
\n“I don’t care how it is in space—,here the BuCUE is king.”
"""
displayDescription_zh:"""
\n扎夫特军所开发的地面战用突击MS
\n优势
\n=机动性极高=
\n=火力充沛=
\n劣势
\n=腿部损坏后机动性很差=
\n=移动补给消耗量较大=
\n
\n“在宇宙怎么样我不管,这这里巴库就是王者”
"""


showActionsWithMixedSelectionIfOtherUnitsHaveTag:TMF_A_802


maxHp:16000
maxShield:0

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/TMF_A_802.png


