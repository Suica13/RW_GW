\nAdvantages
\n=Versatile=
\n=Equipped with Phase Shift armor=
\n=Excellent in both ranged and melee combat=
\nDisadvantages
\n=Extremely expensive=
\n
\n“Found you, Strike Gundam! You even managed to scratch my face!” 
"""
