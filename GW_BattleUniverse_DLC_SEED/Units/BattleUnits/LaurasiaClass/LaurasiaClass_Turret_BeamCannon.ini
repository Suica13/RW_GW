[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Green.gw
"""

name:LaurasiaClass_Turret_BeamCannon
displayText:LaurasiaClass BeamCannon
displayText_zh:罗拉西亚级 光束炮

maxHp: 15000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory LaurasiaClass_Turret_BeamCannon_OnCD:bool
@memory LaurasiaClass_Turret_BeamCannon_CDTimer:float
@global LaurasiaClass_Turret_BeamCannon_CD=8
@global LaurasiaClass_Turret_BeamCannon_EN=40

@global LaurasiaClass_Turret_BeamCannon_Shoot=2
[resource_LaurasiaClass_Turret_BeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2



[decal_LaurasiaClass_Turret_BeamCannon]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/LaurasiaClass/Image/LaurasiaClass_Turret_BeamCannon_1.png
imageScale:1.25
basePositionFromTurret:LaurasiaClass_Turret_BeamCannon






[turret_LaurasiaClass_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,LaurasiaClass_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:LaurasiaClass_Turret_BeamCannon_Projectile
resourceUsage:LaurasiaClass_Turret_BeamCannon_ShootTimer=1

delay:0.2s
canAttackMaxAngle:15
limitingAngle:150
limitingRange:1200
barrelX:3
barrelY:17
barrelOffsetX_onOddShots:-6
turnSpeed:0.75

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.1
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Green




[projectile_LaurasiaClass_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_AP_BeamRifle_Green*1
(
    addResources=
    BeamDamage:5500
    |DpDamage:150
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.5
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.5
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:45
    |ProjectileSpread:4
    |ProjectileLife:50

    |ProjectileAttackTimes:2
    |ProjectileAttackTimesDamageModifier:0.5
)
"""


[hiddenAction_LaurasiaClass_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.LaurasiaClass_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.LaurasiaClass_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.LaurasiaClass_Turret_BeamCannon_ShootTimer<${LaurasiaClass_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:LaurasiaClass_Turret_BeamCannon_OnCD=true,LaurasiaClass_Turret_BeamCannon_CDTimer=self.timeAlive+${LaurasiaClass_Turret_BeamCannon_CD}

[hiddenAction_LaurasiaClass_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.LaurasiaClass_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.LaurasiaClass_Turret_BeamCannon_CDTimer
setUnitMemory:LaurasiaClass_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:LaurasiaClass_Turret_BeamCannon_ShootTimer=${LaurasiaClass_Turret_BeamCannon_Shoot}

[hiddenAction_LaurasiaClass_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${LaurasiaClass_Turret_BeamCannon_EN}