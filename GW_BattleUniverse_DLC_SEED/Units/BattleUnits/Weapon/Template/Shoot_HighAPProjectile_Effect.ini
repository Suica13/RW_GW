
[core]
dont_load:true
name:Shoot_HighAPProjectile_Effect
tags:ShootBullet

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s


@memory projectileLife:float
@memory projectileSpeed:float
@memory projectileSpread:float

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""


[hiddenAction_Start]
alsoTriggerAction:"""
Start_SetStats,
Start_SetTarget,
Start_SetDir
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
Check_StartExplosion
"""

[hiddenAction_Start_SetStats]
setUnitMemory:"""
projectileLife=self.Resource.ProjectileLife*0.75,
projectileSpeed=self.Resource.ProjectileSpeed,
projectileSpread=self.Resource.ProjectileSpread
"""
setUnitStats:"""
targetHeight=customTarget1.height
"""
setHeight=customTarget1.height


[hiddenAction_Start_SetTarget]
requireConditional:"""
if customTarget1.attacking!=null 
and not (directionBetween(self, customTarget1.attacking) < self.dir-15 or directionBetween(self, customTarget1.attacking) > self.dir+15) 
"""
setBodyRotation:directionBetween(self,customTarget1.attacking)
[hiddenAction_Start_SetDir]
setBodyRotation:self.dir+rnd(-memory.projectileSpread,memory.projectileSpread)

[hiddenAction_Check_StartExplosion]
requireConditional:if self.timeAlive>memory.projectileLife*0.1
alsoTriggerAction:SpawnDeleteEffect,DeleteSelf

[hiddenAction_SpawnDeleteEffect]
isVisible:false

[hiddenAction_Delete_NotInMap]
autoTrigger:if not self.isInMap()
alsoTriggerAction:DeleteSelf

[hiddenAction_DeleteSelf]
deleteSelf:true


[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:0
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false

