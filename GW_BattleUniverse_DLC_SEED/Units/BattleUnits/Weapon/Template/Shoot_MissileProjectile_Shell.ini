
[core]
dont_load:true

copyFrom:"""

"""

name:Shoot_MissileProjectile_Shell
tags:Missile,ShootBullet

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:false
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
ignoreInUnitCapCalculation:true

disableDeathOnZeroHp:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s
autoTriggerCheckRate:every8Frames

@memory thisTimeMissTarget:bool

@memory firstTarget:unit
@memory nowAttackTarget:unit
@memory attackTargets:unit[]
@memory attackTargetsBlast:unit[]
@memory contacted:bool
@memory contactedTimer:float




@memory finalShootLevel:float
@memory finalCqbLevel:float
@memory finalAccuracyLevel:float

@memory projectileLife:float
@memory projectileSpeed:float
@memory projectileTurnspeed:float
@memory projectileSpread:float
@memory projectileExplosionRange:float

@memory extraBuildingAtk:float


@memory attacker:unit

@memory triedDamageTarget:unit[]

@memory LastUpdateTime:float
@memory DeltaTime:float


@memory getJamming:bool

[hiddenAction_SetAttacker]
setUnitMemory:attacker=customTarget1.readUnitMemory('attacker',type='unit')
[hiddenAction_SetFirstTarget]
setUnitMemory:firstTarget=customTarget1.attacking


[hiddenAction_Get_Jamming]
autoTriggerOnEvent:newMessage(withTag="Jamming")
setUnitMemory:getJamming=true

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""


[hiddenAction_Start]
alsoTriggerAction:"""
SetAttacker,
SetFirstTarget,
Start_SetStats,
Start_SetTarget,
Start_SetDir,
Start_SendAttackInfo
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
CheckDeltaTime,
Moving_Forward,
Moving_Rotation,
Moving_Height,
Check_ContactedTimer,
FindAttackTarget
"""
[hiddenAction_CheckDeltaTime]
setUnitMemory:"""
DeltaTime=1+min(self.timeAlive - memory.LastUpdateTime, 0.05),
LastUpdateTime=self.timeAlive
"""

[hiddenAction_Start_SetStats]
setUnitMemory:"""
finalShootLevel=customTarget1.readUnitMemory(name="finalShootLevel",type="float"),
finalCqbLevel=customTarget1.readUnitMemory(name="finalCqbLevel",type="float"),
finalAccuracyLevel=customTarget1.readUnitMemory(name="finalAccuracyLevel",type="float"),
extraBuildingAtk=customTarget1.readUnitMemory(name="extraBuildingAtk",type="float"),
projectileLife=self.Resource.ProjectileLife*rnd(0.85,1.15),
projectileSpeed=self.Resource.ProjectileSpeed*0.1*rnd(0.75,1.25)*self.Resource.BulletSpeed,
projectileTurnspeed=self.Resource.ProjectileTurnspeed*rnd(0.75,1.25)*self.Resource.BulletSpeed,
projectileSpread=self.Resource.ProjectileSpread,
projectileExplosionRange=self.Resource.ProjectileExplosionRange
"""
setHeight=customTarget1.height


[hiddenAction_Start_SetTarget]
requireConditional:"""
if customTarget1.attacking!=null 
"""
setUnitMemory:firstTarget=customTarget1.attacking
setUnitStats:targetHeight=customTarget1.attacking.height
alsoTriggerAction:Start_SetTarget_Random
[hiddenAction_Start_SetTarget_Random]
requireConditional:if self.resource().EquipmentIndex==1
setUnitMemory:"""
firstTarget=memory.firstTarget.getOffsetRelative
(
    x=rnd(-1*self.resource().EquipmentIndex2,self.resource().EquipmentIndex2),
    y=rnd(-1*self.resource().EquipmentIndex2,self.resource().EquipmentIndex2)
)
.nearestUnit(withTag='CanBeDamaged',withinRange=300,relation='ally')
"""

[hiddenAction_Start_SetDir]
setBodyRotation:self.dir+rnd(-memory.projectileSpread,memory.projectileSpread)


[hiddenAction_Start_SendAttackInfo]
sendMessageTo:memory.firstTarget.parent.readUnitMemory("battleUnitCore",type="unit")
sendMessageWithTags:AttackInfo_Bullet
sendMessageWithData:"""
bulletInfo=self,
accuracy=memory.finalAccuracyLevel,
cantDodge=self.resource.CantDodge
"""

[hiddenAction_Get_ThisTimeMissTarget]
autoTriggerOnEvent:newMessage(withTag="ThisTimeMissTarget")
setUnitMemory:"""
finalAccuracyLevel=memory.finalAccuracyLevel*0.75,
thisTimeMissTarget=true
"""

[hiddenAction_FindAttackTarget]
alsoTriggerAction:"""
FindAttackTarget_Unit,
FindAttackTarget_Unit_Lag
"""

[hiddenAction_FindAttackTarget_Unit]
requireConditional:if memory.nowAttackTarget==null
setUnitMemory:nowAttackTarget=self.nearestUnit(withTag='CanBeDamaged',withinRange=30,relation='enemy')
alsoTriggerAction:Check_StartExplosion
[hiddenAction_FindAttackTarget_Unit_Lag]
requireConditional:if memory.nowAttackTarget==null and memory.DeltaTime>=1.025
setUnitMemory:nowAttackTarget=self.getOffsetRelative(y=-30).nearestUnit(withTag='CanBeDamaged',withinRange=30,relation='enemy')
alsoTriggerAction:Check_StartExplosion

[hiddenAction_Check_StartExplosion]
requireConditional:"""
if memory.contacted==false 
"""
alsoTriggerAction:TryDamageTarget

[hiddenAction_TryDamageTarget]
requireConditional:"""
if 
(
    memory.nowAttackTarget!=null 
    and 
    max(-(memory.nowAttackTarget.height-self.height),(memory.nowAttackTarget.height-self.height))<=self.resource().HeightHitRange
) 
and 
(
    not memory.triedDamageTarget.contains(memory.nowAttackTarget)
) 
"""
setUnitMemory:"""
triedDamageTarget[memory.triedDamageTarget.size]=memory.nowAttackTarget
"""
sendMessageTo:memory.nowAttackTarget
sendMessageWithTags:TryDamage
sendMessageWithData:"""
bulletInfo=self,
accuracy=memory.finalAccuracyLevel*0.01*self.Resource.WeaponAccuracy*0.01*select(memory.nowAttackTarget.parent==memory.firstTarget or self.resource.SubEquipmentIndex==1,1,0.75)
"""


[hiddenAction_Check_ContactedTimer]
requireConditional:if memory.contacted==true
setUnitMemory:contactedTimer=memory.contactedTimer-0.01

[hiddenAction_AttackTarget]
autoTriggerOnEvent:newMessage(withTag="DoDamage")
autoTrigger:"""
if memory.contacted==false and  
(
    self.timeAlive>memory.projectileLife*0.1 
    or 
    numberOfUnitsInEnemyTeam(withTag="BlockWall",withinrange=20)>0
)
"""
setUnitMemory:"""
contacted=true,
contactedTimer=0.02
"""
alsoTriggerAction:"""
SpawnHitEffect,
CheckNearEnemy_Unit
"""


[hiddenAction_CheckNearEnemy_Unit]
takeResources_includeUnitsWithinRange_team:enemy
takeResources_includeUnitsWithinRange:150
takeResources_excludeUnitsWithoutTags:CanBeDamaged
takeResources_maxUnits:50
takeResources_searchOnly:true
takeResources_triggerActionForEach:CheckNearEnemy_Step2,CheckNearEnemy_Step2_Blast,SendDeBuff

[hiddenAction_CheckNearEnemy_Step2]
requireConditional:"""
if 
(
    not memory.attackTargets.contains(thisActionTarget.readUnitMemory('coreUnit',type='unit')) 
    and 
    select
    (
        thisActionTarget.readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit')!=null,
        not memory.attackTargets.contains(thisActionTarget.readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit')),
        true
    )
) 
and distanceBetween(self, thisActionTarget)<=memory.projectileExplosionRange 
and max(-(thisActionTarget.height-self.height),(thisActionTarget.height-self.height))<=self.resource().HeightHitRange
"""
setUnitMemory:"""
attackTargets[memory.attackTargets.size]=thisActionTarget.readUnitMemory('coreUnit',type='unit'),
attackTargets[memory.attackTargets.size+1]=select
(
    thisActionTarget.readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit')!=null,
    thisActionTarget.readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit'),
    null
)
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:Damage_Shoot_Shell
sendMessageWithData:"""
DpDamage=self.Resource.dpDamage*memory.finalShootLevel*0.01,
ShellDamage=self.Resource.ShellDamage*memory.finalShootLevel*0.01*
select
(
    distanceBetween(self, thisActionTarget)>memory.projectileExplosionRange+40,
    0.75,
    max(1-distanceBetween(self, thisActionTarget)/(memory.projectileExplosionRange+40),0.75)
),

ShellAPDamage=self.Resource.ShellAPDamage*memory.finalShootLevel*0.01*
select
(
    distanceBetween(self, thisActionTarget)>memory.projectileExplosionRange+40,
    0.75,
    max(1-distanceBetween(self, thisActionTarget)/(memory.projectileExplosionRange+40),0.75)
),

PartBreakModifier=self.Resource.PartBreakModifier,
CockpitBreakModifier=self.Resource.CockpitBreakModifier,
PilotDamageModifier=self.Resource.PilotDamageModifier,
PilotTrueDamage=self.Resource.PilotTrueDamage,
AntiSizeLargeDamage=self.Resource.AntiSizeLargeDamage,
AntiSizeSmallDamage=self.Resource.AntiSizeSmallDamage,
AntiSizeLargeAccuracy=self.Resource.AntiSizeLargeAccuracy,
AntiSizeSmallAccuracy=self.Resource.AntiSizeSmallAccuracy,

Accuracy=memory.finalAccuracyLevel*0.01*self.Resource.WeaponAccuracy*0.01*select(thisActionTarget.parent==memory.firstTarget or self.resource.SubEquipmentIndex==1,1,0.75)*select(memory.getJamming,0.75,1),
AntiLand=self.Resource.AntiLand,
AntiAqua=self.Resource.AntiAqua,
AntiSpace=self.Resource.AntiSpace,
AntiAir=self.Resource.AntiAir,
AntiBuilding=self.Resource.AntiBuilding*memory.extraBuildingAtk,
CantDodge=self.Resource.CantDodge,
attacker=memory.attacker,
bulletInfo=self
"""
fireTurretXAtGround:Hit_Effect
fireTurretXAtGround_withTarget:memory.nowAttackTarget
[hiddenAction_CheckNearEnemy_Step2_Blast]
requireConditional:"""
if 
(
    not memory.attackTargetsBlast.contains(thisActionTarget.readUnitMemory('coreUnit',type='unit')) 
    and 
    select
    (
        thisActionTarget.readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit')!=null,
        not memory.attackTargetsBlast.contains(thisActionTarget.readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit')),
        true
    )
)
and distanceBetween(self, thisActionTarget)<=self.resource().ProjectileBlastRange*select(thisActionTarget.parent.readUnitMemory("flyUnit",type="float")==1,0.75,1)  
and max(-(thisActionTarget.height-self.height),(thisActionTarget.height-self.height))<=self.resource().HeightHitRange
"""
setUnitMemory:"""
attackTargetsBlast[memory.attackTargetsBlast.size]=thisActionTarget.readUnitMemory('coreUnit',type='unit'),
attackTargetsBlast[memory.attackTargetsBlast.size+1]=select
(
    thisActionTarget.readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit')!=null,
    thisActionTarget.readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit'),
    null
)
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:Damage_Shoot_Shell_Blast
sendMessageWithData:"""
DpDamage=self.Resource.dpDamage*memory.finalShootLevel*0.01*self.resource.ProjectileBlastDpModifier,

ShellDamage=self.Resource.ShellDamage*memory.finalShootLevel*0.01*self.resource.ProjectileBlastDamageModifier*
select
(
    distanceBetween(self, thisActionTarget)>self.resource().ProjectileBlastRange+40,
    0.75,
    max(1-distanceBetween(self, thisActionTarget)/(self.resource().ProjectileBlastRange+40),0.75)
),

ShellAPDamage=self.Resource.ShellAPDamage*memory.finalShootLevel*0.01*self.resource.ProjectileBlastDamageModifier*
select
(
    distanceBetween(self, thisActionTarget)>self.resource().ProjectileBlastRange+40,
    0.75,
    max(1-distanceBetween(self, thisActionTarget)/(self.resource().ProjectileBlastRange+40),0.75)
),

PartBreakModifier=self.Resource.PartBreakModifier*self.resource.ProjectileBlastDamageModifier,
CockpitBreakModifier=self.Resource.CockpitBreakModifier*self.resource.ProjectileBlastDamageModifier,
PilotDamageModifier=self.Resource.PilotDamageModifier*self.resource.ProjectileBlastDamageModifier,
PilotTrueDamage=self.Resource.PilotTrueDamage*self.resource.ProjectileBlastDamageModifier,
AntiSizeLargeDamage=self.Resource.AntiSizeLargeDamage,
AntiSizeSmallDamage=self.Resource.AntiSizeSmallDamage,
AntiSizeLargeAccuracy=self.Resource.AntiSizeLargeAccuracy,
AntiSizeSmallAccuracy=self.Resource.AntiSizeSmallAccuracy,

Accuracy=memory.finalAccuracyLevel*0.01*self.Resource.WeaponAccuracy*0.01*select(memory.getJamming,0.75,1),
AntiLand=self.Resource.AntiLand,
AntiAqua=self.Resource.AntiAqua,
AntiSpace=self.Resource.AntiSpace,
AntiAir=self.Resource.AntiAir,
AntiBuilding=self.Resource.AntiBuilding*memory.extraBuildingAtk,
CantDodge=self.Resource.CantDodge,
attacker=memory.attacker,
bulletInfo=self
"""
[hiddenAction_SendDeBuff]
sendMessageTo:thisActionTarget.parent.readUnitMemory('BattleUnitCore',type='unit')
sendMessageWithTags:DeBuff
sendMessageWithData:"""
burnedDamage=self.Resource.BurnedDamage,
stunDamage=self.Resource.StunDamage,
jammingDamage=self.Resource.jammingDamage,
atkDownS=self.Resource.AtkDownDamage,
defDownS=self.Resource.DefDownDamage,
speedDownM=self.Resource.SpeedDownDamage,
attacker=customTarget1,
bulletInfo=self
"""


[hiddenAction_SpawnHitEffect]
isVisible:false

[hiddenAction_Moving_Forward]
requireConditional:if memory.contacted==false
teleportTo:self.getOffsetRelative(y=memory.projectileSpeed * memory.DeltaTime)
[hiddenAction_Moving_Rotation]
requireConditional:"""
if memory.contacted==false 
and memory.firstTarget.hp>0 
and memory.firstTarget.readUnitMemory('opticalCamouflageTimer',type='float')<=0 
and self.timeAlive>0.25 
and memory.getJamming==false 
and memory.thisTimeMissTarget==false
"""
setBodyRotation:"""
select
(
    distanceBetween(self.getOffsetRelative(x=-memory.projectileTurnspeed*self.Resource.BulletSpeed,y=1), memory.firstTarget)>distanceBetween(self.getOffsetRelative(x=memory.projectileTurnspeed*self.Resource.BulletSpeed,y=1), memory.firstTarget),
    self.dir+memory.projectileTurnspeed*self.Resource.BulletSpeed,
    self.dir-memory.projectileTurnspeed*self.Resource.BulletSpeed
)
"""
[hiddenAction_Moving_Height]
requireConditional:"""
if memory.firstTarget!=null 
and max(-(self.height-memory.firstTarget.height),(self.height-memory.firstTarget.height))>=self.resource().HeightHitRange/2 
and memory.thisTimeMissTarget==false
"""
setHeight:"""
select
(
    self.height<memory.firstTarget.height,
    self.height+self.Resource.HeightChangeSpeed*self.Resource.BulletSpeed,
    self.height-self.Resource.HeightChangeSpeed*self.Resource.BulletSpeed
)
"""

[hiddenAction_Delete_NotInMap]
autoTrigger:if not self.isInMap()
alsoTriggerAction:DeleteSelf

[hiddenAction_DeleteSelf]
autoTrigger:if memory.contactedTimer<0 and memory.contacted==true
deleteSelf:true

[turret_Hit_Effect]
x:0
y:0
canShoot:false
projectile:Hit_Effect
aimOffsetSpread:0
recoilOffset: 0
recoilOutTime: 0
recoilReturnTime: 0
shoot_flame:none

[projectile_Hit_Effect]

directDamage: 0
life: 1
explodeOnEndOfLife:true
speed: 100


lightSize:0.75
lightColor:#ff57e9
effectOnCreate:none
explodeEffect:none

[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true
showHealthBar:false
disableLowHpFire:true
disableLowHpSmoke:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:0
targetHeight:0
targetHeightDrift:0
heightChangeRate:0


[ai]
useAsTransport:false
useAsBuilder: false

