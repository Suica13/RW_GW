
[core]
dont_load:true
name:Cqb_BaseProjectileCheck
tags:CqbBullet

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
ignoreInUnitCapCalculation:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.001s
autoTriggerCheckRate:every8Frames



[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""

"""


[hiddenAction_Update]
autoTrigger:if self.timeAlive>0.01
alsoTriggerAction:CheckNearEnemy_Unit,CheckNearEnemy_Wall,CheckNearEnemy_Missile

[hiddenAction_CheckNearEnemy_Unit]
takeResources_includeUnitsWithinRange_team:enemy
takeResources_includeUnitsWithinRange:35
takeResources_excludeUnitsWithoutTags:CanBeDamaged
takeResources_maxUnits:10
takeResources_searchOnly:true
takeResources_triggerActionForEach:CheckNearEnemy_Step2
[hiddenAction_CheckNearEnemy_Wall]
requireConditional:if self.height<=5
@copyFromSection:hiddenAction_CheckNearEnemy_Unit
takeResources_excludeUnitsWithoutTags:Wall
[hiddenAction_CheckNearEnemy_Step2]
sendMessageTo:customTarget1
sendMessageWithTags:AttackTarget
sendMessageWithData:unitInfo=thisActionTarget


[hiddenAction_CheckNearEnemy_Missile]
@copyFromSection:hiddenAction_CheckNearEnemy_Unit
takeResources_excludeUnitsWithoutTags:Missile
takeResources_triggerActionForEach:CheckNearEnemy_Missile_Step2
[hiddenAction_CheckNearEnemy_Missile_Step2]
sendMessageTo:customTarget1
sendMessageWithTags:AttackMissile
sendMessageWithData:unitInfo=thisActionTarget

[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:1
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false

