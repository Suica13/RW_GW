[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Fire_1_Green.gw
"""

name:NazcaClass_Turret_BeamCannon
displayText:NazcaClass BeamCannon
displayText_zh:纳斯卡级 光束炮

maxHp: 9000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false

@memory NazcaClass_Turret_BeamCannon_OnCD:bool
@memory NazcaClass_Turret_BeamCannon_CDTimer:float
@global NazcaClass_Turret_BeamCannon_CD=5
@global NazcaClass_Turret_BeamCannon_EN=40

@global NazcaClass_Turret_BeamCannon_Shoot=1
[resource_NazcaClass_Turret_BeamCannon_ShootTimer]
hidden:true

[graphics]
drawLayer:ground2







[turret_NazcaClass_Turret_BeamCannon]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,NazcaClass_Turret_BeamCannon_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:NazcaClass_Turret_BeamCannon_Projectile
resourceUsage:NazcaClass_Turret_BeamCannon_ShootTimer=1

delay:0.2s
canAttackMaxAngle:15
limitingAngle:150
limitingRange:1200
barrelX:0
barrelY:6
turnSpeed:1.0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:360
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/BeamCannon_1.ogg
shoot_sound_vol:0.5
shoot_flame:Beam_Fire_1_Green




[projectile_NazcaClass_Turret_BeamCannon_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_BeamRifle_Green*1
(
    addResources=
    BeamDamage:5500
    |DpDamage:150
    |WeaponAccuracy=75
    |PartBreakModifier=1
    |CockpitBreakModifier=1
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.5
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.5
    |AntiBuilding=1
    |AntiAqua=0.5
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:45
    |ProjectileSpread:3
    |ProjectileLife:50
)
"""


[hiddenAction_NazcaClass_Turret_BeamCannon_CDStart]
autoTrigger:"""
if memory.NazcaClass_Turret_BeamCannon_OnCD==false 
and 
(
    (
        self.resource.NazcaClass_Turret_BeamCannon_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.NazcaClass_Turret_BeamCannon_ShootTimer<${NazcaClass_Turret_BeamCannon_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:NazcaClass_Turret_BeamCannon_OnCD=true,NazcaClass_Turret_BeamCannon_CDTimer=self.timeAlive+${NazcaClass_Turret_BeamCannon_CD}

[hiddenAction_NazcaClass_Turret_BeamCannon_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.NazcaClass_Turret_BeamCannon_OnCD==true and self.timeAlive>memory.NazcaClass_Turret_BeamCannon_CDTimer
setUnitMemory:NazcaClass_Turret_BeamCannon_OnCD=false
setResourcesWithLogic:NazcaClass_Turret_BeamCannon_ShootTimer=${NazcaClass_Turret_BeamCannon_Shoot}

[hiddenAction_NazcaClass_Turret_BeamCannon_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${NazcaClass_Turret_BeamCannon_EN}