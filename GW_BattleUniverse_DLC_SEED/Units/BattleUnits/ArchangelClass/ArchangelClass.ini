tags:ArchangelClass,Unit,CmdUnit,Ship,OMNI,CE71,SEED,LargeUnit,MpUpUnit_X16
name:ArchangelClass

displayText:Archangel
displayText_zh:大天使号

displayDescription:"""
\nA new amphibious warship jointly developed by the Earth Alliance and Orb
\nAdvantages
\n=Can ReEntry Free=
\n=Powerful firepower=
\n=Extremely high durability=
\n=Allows communication command=
\n=Allows defense command=
\n=Automatically repairs when out of combat=
\n=Transport capacity: 8x2=
\n=Receives 35% less damage from structures=
\nDisadvantages
\n=Massive size=
\n=-250m anti-detection=
\n=Reveals vision when detected=
\n
\n“Battle stations!”
"""
displayDescription_zh:"""
\n联合与奥布合作建造的新型两栖战舰
\n优势
\n=火力充沛=
\n=耐久极高=
\n=允许通信指挥=
\n=允许防御指挥=
\n=脱战自动修复=
\n=可以自由穿梭大气层=
\n=运输力:8x2=
\n=受到建筑伤害减少35%=
\n劣势
\n=体积巨大=
\n=负300码反侦测=
\n=被发现时暴露视野=
\n
\n“第一战斗配置!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:ArchangelClass


displayRadius:75
radius:75

maxHp:165000
maxShield:0

@global cmdComRangeExtra=150
@global cmdDefRangeExtra=150
@global supplyPointRangeExtra=150

[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/ArchangelClass.png
drawLayer:air

[attack]
isFixedFiring:false
turretMultiTargeting:true


[movement]
movementType: AIR

