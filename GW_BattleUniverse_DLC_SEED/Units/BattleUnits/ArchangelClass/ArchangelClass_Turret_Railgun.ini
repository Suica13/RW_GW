[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/Railgun_Fire_1.gw
"""

name:ArchangelClass_Turret_Railgun
displayText:ArchangelClass Railgun
displayText_zh:大天使号 磁轨炮

maxHp: 15000

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory ArchangelClass_Turret_Railgun_OnCD:bool
@memory ArchangelClass_Turret_Railgun_CDTimer:float
@global ArchangelClass_Turret_Railgun_CD=8
@global ArchangelClass_Turret_Railgun_EN=40

@global ArchangelClass_Turret_Railgun_Shoot=2
[resource_ArchangelClass_Turret_Railgun_ShootTimer]
hidden:true


[graphics]
drawLayer:ground2

[decal_ArchangelClass_Turret_Railgun]
layer:beforeBody
order:1
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/ArchangelClass/Image/ArchangelClass_Turret_Railgun_1.png
imageScale:1.25
basePositionFromTurret:ArchangelClass_Turret_Railgun



[turret_ArchangelClass_Turret_Railgun]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,ArchangelClass_Turret_Railgun_Send_UseEN
canOnlyAttackUnitsWithoutTags:AirUnit
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false 
and memory.onSkill==false 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:ArchangelClass_Turret_Railgun_Projectile
resourceUsage:ArchangelClass_Turret_Railgun_ShootTimer=1

delay:3s
canAttackMaxAngle:3
limitingAngle:35
limitingMinRange:150
limitingRange:1200
barrelX:0
barrelY:35
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:5
idleSweepAddRandomAngle:5
idleSweepDelay:420
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:Resource/Sound/SE/Weapon/Fire/Railgun_1.ogg
shoot_sound_vol:0.85
shoot_flame:Railgun_Fire_1



[projectile_ArchangelClass_Turret_Railgun_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_RailShell*1
(
    addResources=
    ShellAPDamage:6000
    |ShellDamage:2000
    |DpDamage:200
    |WeaponAccuracy=85
    |PartBreakModifier=0.75
    |CockpitBreakModifier=1.25
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiAqua=1 
    |AntiAir=0.75 
    |AntiLand=1
    |AntiSpace=1
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=0.5
    |HeightChangeSpeed=2
    |HeightHitRange=20
    |ProjectileSpeed:75
    |ProjectileSpread:1
    |ProjectileExplosionRange:30
    |ProjectileLife:25
)
"""


[hiddenAction_ArchangelClass_Turret_Railgun_CDStart]
autoTrigger:"""
if memory.ArchangelClass_Turret_Railgun_OnCD==false 
and 
(
    (
        self.resource.ArchangelClass_Turret_Railgun_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.ArchangelClass_Turret_Railgun_ShootTimer<${ArchangelClass_Turret_Railgun_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:ArchangelClass_Turret_Railgun_OnCD=true,ArchangelClass_Turret_Railgun_CDTimer=self.timeAlive+${ArchangelClass_Turret_Railgun_CD}

[hiddenAction_ArchangelClass_Turret_Railgun_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.ArchangelClass_Turret_Railgun_OnCD==true and self.timeAlive>memory.ArchangelClass_Turret_Railgun_CDTimer
setUnitMemory:ArchangelClass_Turret_Railgun_OnCD=false
setResourcesWithLogic:ArchangelClass_Turret_Railgun_ShootTimer=${ArchangelClass_Turret_Railgun_Shoot}



[hiddenAction_ArchangelClass_Turret_Railgun_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${ArchangelClass_Turret_Railgun_EN}


