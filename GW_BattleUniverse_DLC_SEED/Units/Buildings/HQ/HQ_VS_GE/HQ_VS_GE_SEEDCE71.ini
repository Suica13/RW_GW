# [ORDER_DEPENDENT] One pending HQ resolves at a time, using alliance relations rather than player IDs.
# [ENGINE_WORKAROUND] globalSearchForFirstUnit excludes its caller; a temporary marker includes this HQ.
[hiddenAction_PMC_AI_Register]
autoTrigger:if self.isControlledByAI() and self.resource.FactionIndex==0 and self.numberOfUnitsInAllTeams(withTag='PMC')>0 and not self.hasTags(includes='PMC_AI_FactionPending')
temporarilyAddTags:PMC_AI_FactionPending

[hiddenAction_PMC_AI_FactionFallback]
autoTrigger:if self.isControlledByAI() and self.resource.FactionIndex==0 and self.numberOfUnitsInAllTeams(withTag='PMC')>0 and self.hasTags(includes='PMC_AI_FactionPending') and createMarker(x=0,y=0,teamId=self.teamId).globalSearchForFirstUnit(withTag='PMC_AI_FactionPending',relation='any')==self
requireConditional:if self.isControlledByAI() and self.resource.FactionIndex==0 and self.numberOfUnitsInAllTeams(withTag='PMC')>0 and self.hasTags(includes='PMC_AI_FactionPending') and createMarker(x=0,y=0,teamId=self.teamId).globalSearchForFirstUnit(withTag='PMC_AI_FactionPending',relation='any')==self
setUnitMemory:pmcFactionOption0=((self.numberOfUnitsInAllyTeam(withTag='OMNI_CE71')>0) or (not (self.numberOfUnitsInAllyTeam(withTag='OMNI_CE71')>0 or self.numberOfUnitsInAllyTeam(withTag='ZAFT_CE71')>0) and (not (self.numberOfUnitsInEnemyTeam(withTag='OMNI_CE71')>0) or (self.numberOfUnitsInEnemyTeam(withTag='OMNI_CE71')>0 and self.numberOfUnitsInEnemyTeam(withTag='ZAFT_CE71')>0)))),pmcFactionOption1=((self.numberOfUnitsInAllyTeam(withTag='ZAFT_CE71')>0 and not (self.numberOfUnitsInAllyTeam(withTag='OMNI_CE71')>0)) or (not (self.numberOfUnitsInAllyTeam(withTag='OMNI_CE71')>0 or self.numberOfUnitsInAllyTeam(withTag='ZAFT_CE71')>0) and (not (self.numberOfUnitsInEnemyTeam(withTag='ZAFT_CE71')>0) or (self.numberOfUnitsInEnemyTeam(withTag='OMNI_CE71')>0 and self.numberOfUnitsInEnemyTeam(withTag='ZAFT_CE71')>0))))
alsoTriggerAction:PMC_AI_DrawFaction

[hiddenAction_PMC_AI_DrawFaction]
# Store one draw before dispatch. Allies copy their existing faction; enemies exclude used factions.
# More alliances than factions may reuse a faction only once every native faction is already used.
setUnitMemory:pmcFactionRoll=min((select(memory.pmcFactionOption0,1,0)+select(memory.pmcFactionOption1,1,0))-1,int(rnd(0,(select(memory.pmcFactionOption0,1,0)+select(memory.pmcFactionOption1,1,0)))))
alsoTriggerAction:PMC_AI_Pick_0,PMC_AI_Pick_1,PMC_AI_Finish

[hiddenAction_PMC_AI_Pick_0]
requireConditional:if self.resource.FactionIndex==0 and memory.pmcFactionOption0 and memory.pmcFactionRoll>=0 and memory.pmcFactionRoll<(0+select(memory.pmcFactionOption0,1,0))
alsoTriggerAction:ChoseFaction_OMNI_CE71

[hiddenAction_PMC_AI_Pick_1]
requireConditional:if self.resource.FactionIndex==0 and memory.pmcFactionOption1 and memory.pmcFactionRoll>=0+select(memory.pmcFactionOption0,1,0) and memory.pmcFactionRoll<(0+select(memory.pmcFactionOption0,1,0)+select(memory.pmcFactionOption1,1,0))
alsoTriggerAction:ChoseFaction_ZAFT_CE71

[hiddenAction_PMC_AI_Finish]
requireConditional:if self.resource.FactionIndex>0
temporarilyRemoveTags:PMC_AI_FactionPending

[hiddenAction_PMC_AI_CleanupPending]
autoTrigger:if self.hasTags(includes='PMC_AI_FactionPending') and (self.resource.FactionIndex>0 or not self.isControlledByAI() or self.numberOfUnitsInAllTeams(withTag='PMC')==0)
temporarilyRemoveTags:PMC_AI_FactionPending
