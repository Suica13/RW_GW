
[core]
copyFrom:"""
ROOT:Template/Building/Skill/SupplyPoint.gw,
ROOT:Units/Buildings/Factory/Mod/Factory.ini,
ROOT:Units/Buildings/Factory/UnitList/OMNI_CE71/OMNI_CE71_UnitList_Aqua.ini,
ROOT:Units/Buildings/Factory/UnitList/ZAFT_CE71/ZAFT_CE71_UnitList_Aqua.ini
"""


tags:Building,SLChangeFaction,AquaBuilding,CanBeTargetUnit,CanProduceBuilding,Factory_ZAFT_CE71_Aqua,Factory_Aqua,Factory,ZAFT,CE71
name:Factory_ZAFT_CE71_Aqua
displayText:Aqua Factory[ZAFT][CE71]
displayText_zh:海军工厂[ZAFT][CE71]

footprint: -2,-1,2,1
constructionFootprint: -2,-1,2,1
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:10

@global Money=500
@global Resource=1500
@global buildTime=15
@global supplyPointHpExtra=0.5
@global supplyPointEnExtra=0.5
@global supplyPointShieldExtra=0.5
@global supplyPointSkillExtra=0.5

exit_x:0
exit_y:25
exit_moveAwayAmount:0

[hiddenAction_Building_GetDone]
temporarilyAddTags:Factory_T1
[hiddenAction_Supply_CheckTags]
requireConditional:false

[ai]
buildPriority: 0.05
maxEachBase:1
maxGlobal:4
noneInBaseExtraPriority: 0.15
noneGlobalExtraPriority: 0.15

[movement]
movementType:WATER

[placementRule_NearSL]
searchDistance:600

[hiddenAction_Die]
spawnEffects:Explosion_Water_1

[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Aqua.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.6
xOffsetRelative:8
yOffsetRelative:2
[decal_Light_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Aqua_Light.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
teamColors:true
imageScale:0.6
xOffsetRelative:8
yOffsetRelative:2
[decal_Work_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:if self.queueSize()>0
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Aqua_ON.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.6
xOffsetRelative:8
yOffsetRelative:2
[decal_Faction_1]
layer:beforeBody
order:2
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Resource/Image/Icon/Faction_ZAFT_CE71_2.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.125
xOffsetRelative:30.5
yOffsetRelative:21



