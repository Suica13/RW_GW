
[core]
copyFrom:"""
ROOT:Units/Buildings/Factory/Mod/Factory.ini,
ROOT:Units/Buildings/Factory/UnitList/ZAFT_CE71/ZAFT_CE71_UnitList_Land.ini,
ROOT:Units/Buildings/Factory/UnitList/OMNI_CE71/OMNI_CE71_UnitList_Land.ini,
ROOT:Template/Building/Skill/Upgrade.gw
"""


tags:Building,SLChangeFaction,CanBeTargetUnit,CanProduceBuilding,Factory_OMNI_CE71_Land,Factory,OMNI,CE71
name:Factory_OMNI_CE71_Land
displayText:Land Factory[OMNI][CE71]
displayText_zh:陆军工厂[OMNI][CE71]

footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10

@global Money=500
@global Resource=1500
@global buildTime=15


exit_x:0
exit_y:25
exit_moveAwayAmount:0

[hiddenAction_Building_GetDone]
temporarilyAddTags:Factory_T1

[action_UpgardeToFactory_OMNI_CE71_Air]
@copyFromSection:template_Upgrade
@define UnitID=Factory_OMNI_CE71_Air
@define CustomRule=(true)
@define Money=250
@define Resource=500
buildSpeed:10s
pos:9999




[ai]
buildPriority: 0.15
maxEachBase:3
maxGlobal:12
noneInBaseExtraPriority: 0.2
noneGlobalExtraPriority: 0.4


[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Light_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Factory/Image/Factory_1_Light.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
teamColors:true
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Work_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:if self.queueSize()>0
image:ROOT:Units/Buildings/Factory/Image/Factory_1_ON.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.7
xOffsetRelative:-15.5
yOffsetRelative:7.5
[decal_Faction_1]
layer:beforeBody
order:2
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Resource/Image/Icon/Faction_OMNI_CE71_2.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.2
xOffsetRelative:-15.5
yOffsetRelative:-9.5


[decal_Body_2]
@copyFromSection:decal_Body_1
xOffsetRelative:15.5
[decal_Light_2]
@copyFromSection:decal_Light_1
xOffsetRelative:15.5
[decal_Work_2]
@copyFromSection:decal_Work_1
xOffsetRelative:15.5
[decal_Faction_2]
@copyFromSection:decal_Faction_1
xOffsetRelative:15.5


