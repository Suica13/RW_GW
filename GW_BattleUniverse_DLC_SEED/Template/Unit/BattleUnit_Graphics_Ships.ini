
[core]
dont_load:true

disableAllUnitCollisions:true


[graphics]

icon_zoomed_out:ROOT:\Resource\Image\Units\Zoom\MS.png
image:SHARED:blank.png
image_wreak:SHARED:blank.png
image_shadow:auto
image_shield:SHARED:blank.png
icon_zoomed_out_neverShow:false
shadowOffsetX:0
shadowOffsetY:0
drawLayer:ground

total_frames:1

showHealthBar:false
showEnergyBar:false
showShieldBar:false

showQueueBar:false
showShotDelayBar:false

disableLowHpFire:true
disableLowHpSmoke:true

imageScale:1
turretImageScale:1



[decal_Shadow]
layer:beforeBody
order:0
onlyWhileAlive:true
isVisible:if memory.HideGraphics<=0 and self.height>1 and parent.hp<=0
alpha:0.65/self.height*25
imageScale:0.65
image:ROOT:Resource/Image/Ring/Shadow.png
alwaysStartHeightAtZero:true
onlyOnNonPreview:true



[arm_1]
hidden:false

x: 0
y: 0

dust_effect: false
[decal_Body]
layer:beforeBody
order:4
onlyWhileAlive:true
onlyOnNonPreview:true
basePositionFromLegEnd:arm1
isVisible:"""
if true
"""

[decal_Boost]
@define skillRules=false
layer:beforeBody
order:4
isVisible:"""
if self.speed>0.1 
and parent.hp<=0 
and distanceBetween(self.getOffsetRelative(x=0,y=0.1),activeWaypointTarget)<=distanceBetween(self,activeWaypointTarget) 
or ${skillRules}
"""
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:\Resource\Image\Fx\Unit\Image\Boost_1.png
total_frames:3
frame:memory.boostFrame
basePositionFromLegEnd:arm1
xOffsetRelative: -2.5
yOffsetRelative:-9
dirOffset:0
imageScale:2
imageScaleY:1.5
alpha:0.75





[decal_Burned]
layer:beforeUI
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Unit/Image/Burned_1.png
alpha:0.85
total_frames:5
frame:memory.burnedFrame
imageScale:4.5
onlyOnNonPreview:true
isVisible:if memory.battleUnitCore.readUnitMemory(name="burnedTimer", type="float")>memory.battleUnitCore.timeAlive  
onlyWhileAlive:true
[decal_Stun]
layer:beforeUI
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Unit/Image/Stun_1.png
alpha:0.85
total_frames:5
frame:memory.stunFrame
imageScale:2.75
onlyOnNonPreview:true
isVisible:if memory.battleUnitCore.readUnitMemory(name="stunTimer", type="float")>memory.battleUnitCore.timeAlive or memory.battleUnitCore.readUnitMemory(name="takingCombo", type="bool")==true
onlyWhileAlive:true
[decal_LowHp]
layer:beforeUI
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Unit/Image/LowHp_1.png
alpha:0.75
total_frames:8
frame:memory.lowHpFrame
imageScale:3.0
onlyOnNonPreview:true
isVisible:if self.hp<self.maxHp*0.25
onlyWhileAlive:true









[decal_Marker]
layer:shadow
onlyTeam:enemy
order:1
image:ROOT:Resource/Image/Units/Hud/Marker/Marker.png
alpha:0.25
imageScale:2.5
xOffsetAbsolute:0
yOffsetAbsolute:0
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.timeAlive>0.1 and not self.tags(includes='UnDetected')
onlyWhileAlive:true

[effect_breakedBody_A]
attachedToUnit:false
image:${decal_Body.image}
life:4000
physics:true
physicsGravity:0.5
priority:high
liveAfterAttachedDies:true
drawUnderUnits:true
color:#bda89d
alpha:1
scaleFrom:1.25
scaleTo:1.15
[effect_breakedCrotch_A]
@copyFromSection:effect_breakedBody_A
image:${decal_Crotch.image}
[effect_breakedHead_A]
@copyFromSection:effect_breakedBody_A
image:${decal_Head.image}
[effect_breakedArmL_A]
@copyFromSection:effect_breakedBody_A
image:${decal_ArmL.image}
[effect_breakedArmR_A]
@copyFromSection:effect_breakedBody_A
image:${decal_ArmR.image}
[effect_breakedLegL_A]
@copyFromSection:effect_breakedBody_A
image:${decal_LeftLeg.image}
[effect_breakedLegR_A]
@copyFromSection:effect_breakedBody_A
image:${decal_RightLeg.image}

[effect_breakedBody_B]
attachedToUnit:false
image:${decal_Body.image}
life:3000
priority:high
liveAfterAttachedDies:true
drawUnderUnits:true
color:#bda89d
alpha:1
hOffset:0
scaleFrom:1.25
scaleTo:0.95
[effect_breakedCrotch_B]
@copyFromSection:effect_breakedBody_B
image:${decal_Crotch.image}
[effect_breakedHead_B]
@copyFromSection:effect_breakedBody_B
image:${decal_Head.image}
[effect_breakedArmL_B]
@copyFromSection:effect_breakedHead_B
image:${decal_ArmL.image}
[effect_breakedArmR_B]
@copyFromSection:effect_breakedHead_B
image:${decal_ArmR.image}
[effect_breakedLegL_B]
@copyFromSection:effect_breakedHead_B
image:${decal_LeftLeg.image}
[effect_breakedLegR_B]
@copyFromSection:effect_breakedHead_B
image:${decal_RightLeg.image}