
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Unit/BattleUnit_Framework.ini
"""

borrowResourcesWhileAlive:Mp=-3
transportSlotsNeeded:3


disableAllUnitCollisions:true

@memory headBreaked:bool
@memory backpackBreaked:bool
@memory armLBreaked:bool
@memory armRBreaked:bool
@memory legLBreaked:bool
@memory legRBreaked:bool

[hiddenAction_BattleUnitCore_Spawn]
attachments_addNewUnits:BattleUnitCore_MS



[hiddenAction_Set_Get_PlayNoPilotIdleAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayNoPilotIdleAnimation")
playAnimation:NoPilotIdle

[hiddenAction_Set_Get_PlayStartEffect]
spawnEffects:Effect_ExhaustGas_Double_1,StartLight_1
playSoundToPlayer:ROOT:Resource/Sound/SE/Unit/MS_Start_1.ogg:0.5
[hiddenAction_Set_Get_PlayCloseEffect]
playSoundToPlayer:ROOT:Resource/Sound/SE/Unit/MS_Down_1.ogg:0.5








[hiddenAction_AttackMode_Cqb_WhenHasTarget]
requireConditional:false




[hiddenAction_StopAnimationWhenGetWayPointOnIdle]
autoTriggerOnEvent:newWaypointGivenByPlayer
requireConditional:"""
if memory.BattleUnitCore.readUnitMemory("onAttacking",type="bool")==false 
"""
stopLastAnimation:true



[hiddenAction_Set_Get_PlayMoveAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayMoveAnimation")
playAnimation:IGNORE
alsoTriggerAction:Set_Get_PlayMoveAnimation_Boost
[hiddenAction_Set_Get_PlayMoveAnimation_Boost]
requireConditional:if true
playAnimation:OnMoving
[hiddenAction_Set_Get_PlayGuardAnimation]
requireConditional:if false




[hiddenAction_Set_Get_PlayMoveReversingAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayMoveReversingAnimation")
playAnimation:IGNORE
alsoTriggerAction:Set_Get_PlayMoveReversingAnimation_Boost
[hiddenAction_Set_Get_PlayMoveReversingAnimation_Boost]
requireConditional:if true
playAnimation:OnMovingReversing


[hiddenAction_Set_Get_PlayIdleAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayIdleAnimation")
#requireConditional:if not self.tags(includes='inBattle') 
playAnimationIfNotPlaying:Common_Idle

[hiddenAction_Set_Get_PlayDazeAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayDazeAnimation")
stopLastAnimation:true
alsoTriggerAction:Set_Get_PlayDazeAnimation_Step2
[hiddenAction_Set_Get_PlayDazeAnimation_Step2]
stopLastAnimation:true
playAnimation:Common_Daze
spawnEffects:Daze_1

[hiddenAction_Set_Get_PlayStaggerAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayStaggerAnimation")
stopLastAnimation:true
alsoTriggerAction:Set_Get_PlayStaggerAnimation_Step2
[hiddenAction_Set_Get_PlayStaggerAnimation_Step2]
stopLastAnimation:true
playAnimation:Common_Stagger
spawnEffects:Stagger_1


[hiddenAction_Set_Get_PlayDodgeLAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayDodgeLAnimation")
playAnimation:Common_Dodge_L
stopLastAnimation:true
[hiddenAction_Set_Get_PlayDodgeRAnimation]
autoTriggerOnEvent:newMessage(withTag="PlayDodgeRAnimation")
playAnimation:Common_Dodge_R
stopLastAnimation:true





[action_Set_AttackMode_Shoot]
playSoundToPlayer:ROOT:Resource/Sound/SE/Weapon/Switch/BeamSaber_Switch_1.ogg:1
[hiddenAction_Set_AttackMode_Shoot_DefaultWeapon]
setUnitMemory:nowWeaponIndex=0

[action_Set_AttackMode_Cqb]
playSoundToPlayer:ROOT:Resource/Sound/SE/Weapon/Switch/ShootWeapon_Switch_1.ogg:1
[hiddenAction_Set_AttackMode_Cqb_DefaultWeapon]
setUnitMemory:nowWeaponIndex=1



[hiddenAction_Get_RecoverByOther_Shield]
setResourcesWithLogic:"""
shield=self.shield+eventData("RecoverShield",type="float")*select(self.shield>0,1,0)
"""
[hiddenAction_Get_RecoverByOtherPer_Shield]
setResourcesWithLogic:"""
shield=self.shield+self.maxShield*eventData("RecoverShield",type="float")*select(self.shield>0,1,0)
"""





[hiddenAction_Check_RepairNeed]
setUnitMemory:"""
repairNeed=select
(
    memory.headBreaked==true 
    or memory.backpackBreaked==true 
    or memory.armLBreaked==true 
    or memory.armRBreaked==true 
    or memory.legLBreaked==true 
    or memory.legRBreaked==true 
    or (self.maxShield>0 and self.shield<=0),
    true,
    false
)
"""

[hiddenAction_Set_Get_RepairDone]
autoTriggerOnEvent:newMessage(withTag="RepairDone")
setUnitMemory:"""
headBreaked=false,
backpackBreaked=false,
armLBreaked=false,
armRBreaked=false,
legLBreaked=false,
legRBreaked=false,
repairNeed=false
"""
setResourcesWithLogic:shield=self.shield+self.maxShield*0.5
[hiddenAction_Get_Damage]
alsoTriggerAction:Check_InBattle_Attack,Get_Damage_BreakParts_Check,Get_Damage_Pilot

[hiddenAction_Get_Damage_BreakParts_Check]
requireConditional:"""
if 
rnd(0,101)*eventData("Damage",type="float")/self.maxHp*2*(1-self.hp/self.maxHp)*eventData("PartBreakModifier",type="float")>5*memory.partStructuralStrength/100 
or 
rnd(0,101)*eventData("DamagePer",type="float")*2*(1-self.hp/self.maxHp)*eventData("PartBreakModifier",type="float")>5*memory.partStructuralStrength/100 
"""
setUnitMemory:randomBreakPartsIndex=int(rnd(0,71))
alsoTriggerAction:"""
Get_Damage_BreakParts_Head,
Get_Damage_BreakParts_Backpack,
Get_Damage_BreakParts_ArmL,
Get_Damage_BreakParts_ArmR,
Get_Damage_BreakParts_LegL,
Get_Damage_BreakParts_LegR,
Send_TryClearQueued
"""
[hiddenAction_Get_Damage_BreakParts_Head]
requireConditional:"""
if memory.headBreaked==false 
and 
(
    memory.randomBreakPartsIndex>=0 
    and 
    memory.randomBreakPartsIndex<15
)
"""
spawnEffects:PartsBreaked
alsoTriggerAction:BreakedHead_A,BreakedHead_B
[hiddenAction_Get_Damage_BreakParts_Backpack]
requireConditional:"""
if memory.backpackBreaked==false 
and 
(
    memory.randomBreakPartsIndex>=15 
    and 
    memory.randomBreakPartsIndex<30
)
"""
spawnEffects:PartsBreaked
[hiddenAction_Get_Damage_BreakParts_ArmL]
requireConditional:"""
if memory.armLBreaked==false 
and 
(
    memory.randomBreakPartsIndex>=30 
    and 
    memory.randomBreakPartsIndex<40
)
"""
spawnEffects:PartsBreaked
alsoTriggerAction:BreakedArmL_A,BreakedArmL_B
[hiddenAction_Get_Damage_BreakParts_ArmR]
requireConditional:"""
if memory.armRBreaked==false 
and 
(
    memory.randomBreakPartsIndex>=40 
    and 
    memory.randomBreakPartsIndex<50
)
"""
spawnEffects:PartsBreaked
alsoTriggerAction:BreakedArmR_A,BreakedArmR_B
[hiddenAction_Get_Damage_BreakParts_LegL]
requireConditional:"""
if memory.legRBreaked==false 
and 
(
    memory.randomBreakPartsIndex>=50 
    and 
    memory.randomBreakPartsIndex<60
)
"""
spawnEffects:PartsBreaked
alsoTriggerAction:BreakedLegL_A,BreakedLegL_B
[hiddenAction_Get_Damage_BreakParts_LegR]
requireConditional:"""
if memory.legRBreaked==false 
and 
(
    memory.randomBreakPartsIndex>=60 
    and 
    memory.randomBreakPartsIndex<70
)
"""
spawnEffects:PartsBreaked
alsoTriggerAction:BreakedLegR_A,BreakedLegR_B



[hiddenAction_BreakParts_ForceBoostMode]
autoTrigger:if memory.legLBreaked==true or memory.legRBreaked==true
setUnitMemory:moveMode=1


[hiddenAction_LowPartsForceCqbMode]
autoTrigger:true
requireConditional:false
setUnitMemory:attackMode=1


[hiddenAction_BreakedBody_A]

[hiddenAction_BreakedCrotch_A]

[hiddenAction_BreakedHead_A]
requireConditional:if self.resource.TileMode==0 and memory.headBreaked==false
setUnitMemory:headBreaked=true

[hiddenAction_BreakedArmL_A]
requireConditional:if self.resource.TileMode==0 and  memory.armLBreaked==false
setUnitMemory:armLBreaked=true

[hiddenAction_BreakedArmR_A]
requireConditional:if self.resource.TileMode==0 and  memory.armRBreaked==false
setUnitMemory:armRBreaked=true

[hiddenAction_BreakedLegL_A]
requireConditional:if self.resource.TileMode==0 and  memory.legLBreaked==false
setUnitMemory:legLBreaked=true

[hiddenAction_BreakedLegR_A]
requireConditional:if self.resource.TileMode==0 and  memory.legRBreaked==false
setUnitMemory:legRBreaked=true



[hiddenAction_BreakedBody_B]

[hiddenAction_BreakedCrotch_B]

[hiddenAction_BreakedHead_B]
requireConditional:if self.resource.TileMode==1 and  memory.headBreaked==false
setUnitMemory:headBreaked=true

[hiddenAction_BreakedArmL_B]
requireConditional:if self.resource.TileMode==1 and memory.armLBreaked==false
setUnitMemory:armLBreaked=true

[hiddenAction_BreakedArmR_B]
requireConditional:if self.resource.TileMode==1 and memory.armRBreaked==false
setUnitMemory:armRBreaked=true

[hiddenAction_BreakedLegL_B]
requireConditional:if self.resource.TileMode==1 and memory.legLBreaked==false
setUnitMemory:legLBreaked=true

[hiddenAction_BreakedLegR_B]
requireConditional:if self.resource.TileMode==1 and memory.legRBreaked==false
setUnitMemory:legRBreaked=true





[attack]

[movement]
movementType:AIR
moveSpeed: 1
maxTurnSpeed: 1

moveAccelerationSpeed: 0.1
moveDecelerationSpeed: 0.05
reverseSpeedPercentage:0.0

turnAcceleration: 5

heightChangeRate:1.5
targetHeightDrift:1
targetHeight:35


moveSlidingMode:true
moveSlidingDir:360
moveIgnoringBody:true

joinsGroupFormations:true

