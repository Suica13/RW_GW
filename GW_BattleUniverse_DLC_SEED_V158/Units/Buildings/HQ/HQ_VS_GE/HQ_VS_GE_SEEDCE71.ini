
[core]
copyFrom:"""
ROOT:Units/Buildings/HQ/Mod/HQ.ini
"""
overrideAndReplace:HQ_VS_GE_SEEDCE71
name: HQ_VS_GE_SEEDCE71


[hiddenAction_ChoseFaction_ByAI]
autoTrigger:if self.isControlledByAI()==true and self.resource().FactionIndex==0
alsoTriggerAction:"""
ChoseFaction_ByAI_OMNI_CE71,
ChoseFaction_ByAI_ZAFT_CE71
"""
[hiddenAction_ChoseFaction_ByAI_OMNI_CE71]
requireConditional:if numberOfUnitsInEnemyTeam(withTag="ZAFT_CE71")>0
alsoTriggerAction:ChoseFaction_OMNI_CE71

[hiddenAction_ChoseFaction_ByAI_ZAFT_CE71]
requireConditional:if numberOfUnitsInEnemyTeam(withTag="OMNI_CE71")>0
alsoTriggerAction:ChoseFaction_ZAFT_CE71


[template_ChoseFaction]
attachments_addNewUnits:UnlockedListMarker_CE71
attachments_onlyOnSlots:UnlockedListMarkerSlot

[action_ChoseFaction_Info_2]
pos:201
text:SEED CE71
text_zh:SEED CE71

[action_ChoseFaction_OMNI_CE71]
@copyFromSection:template_ChoseFaction
text:OMNI[CE71]
text_zh:地球联合军[CE71]

description:"""
\n"For the preservation of a pure humanity—
\nWe shall cleanse this world of those who defy nature!"
\n
\n"We of the Earth Alliance, guided by Blue Cosmos—
\nShall purge the Coordinators and restore rightful order to mankind!"
\n
\nWith overwhelming industry and endless resources,
\nWe shall drown the enemy in the tides of war!
\n
\nThis is no mere conflict—
\nIt is a crusade to protect the future of true humanity!
\n
\nDifficulty: Normal
"""
description_zh:"""
\n“为了守护纯粹的人类——
\n我们将肃清一切违背自然之物!”
\n
\n“在蓝色宇宙的引导下,地球联合将彻底清除调整者——
\n将人类引回真正正确的秩序!”
\n
\n凭借压倒性的工业与无尽的资源,
\n让敌人淹没于战争的洪流之中!
\n
\n这不仅仅是一场战争——
\n而是为了守护真正人类未来的圣战!
\n
\n上手难度:普通
"""

iconImage:ROOT:Resource/Image/Icon/Faction_OMNI_CE71_1.png
isVisible:if (memory.readyOK==false or self.resource().FactionIndex==1110101)
#playSoundToPlayer:ROOT:Resource/Sound/VC/EF_REVIL/REVIL_Pick.ogg:1.5

highPriorityQueue:true
removeAllQueuedItemsWithoutRefund:true

setResourcesWithLogic:FactionIndex=1110101
temporarilyAddTags:"""
OMNI_CE71
"""
addGlobalTeamTags:"""
OMNI_CE71,Tech_OMNI_CE71_Start,PassT0
"""

[action_ChoseFaction_ZAFT_CE71]
@copyFromSection:template_ChoseFaction
text:ZAFT[CE71]
text_zh:扎夫特军[CE71]

description:"""
\n"Humanity will never change—
\nConflict is the only truth that binds this world together."
\n
\n"We of ZAFT shall carve our path through destiny—
\nEven if this world must burn for its sins!"
\n
\nWith superior evolution and unmatched mobile suits,
\nWe shall surpass and destroy those bound by the Earth!"
\n
\nWar, hatred, despair—
\nThese are the proof of humanity’s existence!"
\n
\nDifficulty: Normal
"""
description_zh:"""
\n“人类是不会改变的——
\n纷争,才是维系这个世界的唯一真实!”
\n
\n“我们扎夫特将亲手开辟命运之路——
\n哪怕这个世界必须为其罪孽而燃烧!”
\n
\n以进化的力量与压倒性的机动战士,
\n超越并毁灭被地球束缚之人!
\n
\n战争、仇恨与绝望——
\n正是人类存在的证明!”
\n
\n上手难度:普通
"""

iconImage:ROOT:Resource/Image/Icon/Faction_ZAFT_CE71_1.png
isVisible:if (memory.readyOK==false or self.resource().FactionIndex==1110201)
#playSoundToPlayer:ROOT:Resource/Sound/VC/ZN_GIHREN/GIHREN_Pick.ogg:1.5

highPriorityQueue:true
removeAllQueuedItemsWithoutRefund:true

setResourcesWithLogic:FactionIndex=1110201
temporarilyAddTags:"""
ZAFT_CE71
"""
