\n=Range increases after deployment=
\n=Capable of bombardment=  
\n=Extremely long range=  
\nWeaknesses  
\n=Lacks melee capability=  
\n=Cannot attack air targets=  
\n  
\n"Artillery operation ready!"
"""
displayDescription_zh:"""
\n一款地球联合和奥布均有使用的自行火炮
\n优势
\n=部署后获得长射程=
\n=可以进行炮击=
\n=射程极远=
\n劣势
\n=缺乏近战能力=
\n=无法对空=
\n
\n“炮击作业准备就绪!”
"""



