"""





tags:Agile,Unit,Aircraft,ZAFT,CE71,SEED
name:Agile

displayText:Agile
displayText_zh:阿吉利

displayDescription:"""
\nZAFT's ground-attack helicopter  
\nStrengths  
\n=Strong against ground targets=  
\nWeaknesses  
\n=No anti-air capability=  
\n  
\n"Leave the base defense mission to me!"
"""
displayDescription_zh:"""
\n扎夫特对地直升机
\n优势
\n=强对地=
\n劣势
\n=无法对空=
\n
\n“北边的家伙就交给我!”
"""



showActionsWithMixedSelectionIfOtherUnitsHaveTag:Agile


maxHp:3750
maxShield:0


[graphics]
icon_build:ROOT:Resource/Image/Units/Icon/Agile.png


[attack]
isFixedFiring:true

[movement]
moveSlidingMode:true
moveSlidingDir:360
moveIgnoringBody:true


[hiddenAction_InitializeStats]
setUnitMemory:"""
unitLevel=250,

enMax=300,
dpMax=1000,

baseHeight=35,

lowEnDoNotAutoCqb=true,
attackMode=0,
attackTargetMode=1,
baseAttackRange=450,
