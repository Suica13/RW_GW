baseDetectRange=450,
baseAntiDetectRange=0,

baseMoveSpeed=1.0,
boostMoveSpeed=1.65,
baseTurnSpeed=1.65,

baseShootLevel=110,
baseCqbLevel=100,
cqbModeBuff=1.0,

baseAccuracyLevel=100,
baseReactionLevel=110,

partStructuralStrength=100,
cockpitSafety=200,

baseBeamDef=5,
baseShellDef=5,
baseCqbDef=5,
baseDpDef=5,
baseSpDef=0,

extraBuildingDef=1,
extraBuildingAtk=1,

flyUnit=1,
groundAdaptability=10,
cliffAdaptability=10,
waterAdaptability=10,
skyAdaptability=100,
spaceAdaptability=10
"""

[hiddenAction_InitializeAddPilot_Default]
addUnitsIntoTransport:Pilot_ZAFT_CE71_N_C_A*1

[hiddenAction_TurnToCloseState]
convertTo:Agile_CloseState
[hiddenAction_TurnToIdleState]
convertTo:Agile

[hiddenAction_TurnToOverLine_T]
convertTo:Agile_OverLine
[hiddenAction_TurnToOverLine_F]
convertTo:Agile

[hiddenAction_Set_Get_PlayStartEffect]
[hiddenAction_Set_Get_PlayCloseEffect]



