tags:GAT_X207,Unit,MS,OMNI,CE71,SEED
name:GAT_X207

displayText:Blitz Gundam
displayText_zh:迅雷高达

displayDescription:"""
\nOne of the products of the cooperation between the Earth Alliance and Morgenroete, developed as a blitz warfare MS
\nAdvantages
\n=Equipped with Phase Shift armor=
\n=Suitable for stealth operations=
\n=Can use optical camouflage=
\nDisadvantages
\n=Extremely expensive=
\n=Low durability=
\n
\n“I can try to go around.”
"""
displayDescription_zh:"""
\n地球联合与曙光社合作的产物之一,作为闪击战用MS被开发
\n优势
\n=搭载PS装甲=
\n=适合隐蔽作战=
\n=可以使用光学迷彩=
\n劣势
\n=价格极其昂贵=
\n=耐久较差=
\n
\n“我可以试试看绕过去”
"""


showActionsWithMixedSelectionIfOtherUnitsHaveTag:GAT_X207


maxHp:32000
maxShield:0
@global PSAHpMax=20000



[hiddenAction_ActivePSA]
setUnitMemory:"""
PSAActive=
select
(
    memory.PSAHP>0 and memory.PSASwitchBool==true and memory.onOpticalCamouflage==false,
    true,
    false
)
