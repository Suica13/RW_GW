[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:LaurasiaClass_Turret_Railgun_2
displayText:LaurasiaClass Railgun
displayText_zh:罗拉西亚级 线性炮

maxHp: 7500

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory LaurasiaClass_Turret_Railgun_2_OnCD:bool
@memory LaurasiaClass_Turret_Railgun_2_CDTimer:float
@global LaurasiaClass_Turret_Railgun_2_CD=6
@global LaurasiaClass_Turret_Railgun_2_EN=25

@global LaurasiaClass_Turret_Railgun_2_Shoot=1
[resource_LaurasiaClass_Turret_Railgun_2_ShootTimer]
hidden:true


[graphics]
drawLayer:ground2


[decal_LaurasiaClass_Turret_Railgun_2]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/LaurasiaClass/Image/LaurasiaClass_Turret_RailGun_2.png
imageScale:1.25
basePositionFromTurret:LaurasiaClass_Turret_Railgun_2




[turret_LaurasiaClass_Turret_Railgun_2]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,LaurasiaClass_Turret_Railgun_2_Send_UseEN
canOnlyAttackUnitsWithoutTags:AirUnit
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false 
and memory.onSkill==false 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:LaurasiaClass_Turret_Railgun_2_Projectile
resourceUsage:LaurasiaClass_Turret_Railgun_2_ShootTimer=1

delay:3s
canAttackMaxAngle:3
limitingAngle:120
limitingMinRange:150
limitingRange:1200
barrelX:0
barrelY:4
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:420
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Bazooka_1.ogg
shoot_sound_vol:0.35
shoot_flame:BZ_Fire_1



[projectile_LaurasiaClass_Turret_Railgun_2_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Bazooka_S*1
(
    addResources=
    ShellDamage:2350
    |DpDamage:175
    |WeaponAccuracy=95
    |PartBreakModifier=0.75
    |CockpitBreakModifier=2.35
    |PilotDamageModifier=2.35
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=0.25  
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=20
    |ProjectileSpeed:60
    |ProjectileSpread:2
    |ProjectileExplosionRange:30
    |ProjectileLife:25
)
"""


[hiddenAction_LaurasiaClass_Turret_Railgun_2_CDStart]
autoTrigger:"""
if memory.LaurasiaClass_Turret_Railgun_2_OnCD==false 
and 
(
    (
        self.resource.LaurasiaClass_Turret_Railgun_2_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.LaurasiaClass_Turret_Railgun_2_ShootTimer<${LaurasiaClass_Turret_Railgun_2_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:LaurasiaClass_Turret_Railgun_2_OnCD=true,LaurasiaClass_Turret_Railgun_2_CDTimer=self.timeAlive+${LaurasiaClass_Turret_Railgun_2_CD}

[hiddenAction_LaurasiaClass_Turret_Railgun_2_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.LaurasiaClass_Turret_Railgun_2_OnCD==true and self.timeAlive>memory.LaurasiaClass_Turret_Railgun_2_CDTimer
setUnitMemory:LaurasiaClass_Turret_Railgun_2_OnCD=false
setResourcesWithLogic:LaurasiaClass_Turret_Railgun_2_ShootTimer=${LaurasiaClass_Turret_Railgun_2_Shoot}



[hiddenAction_LaurasiaClass_Turret_Railgun_2_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${LaurasiaClass_Turret_Railgun_2_EN}


