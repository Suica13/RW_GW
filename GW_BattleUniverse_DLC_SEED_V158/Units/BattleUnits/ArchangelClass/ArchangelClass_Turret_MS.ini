[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:ArchangelClass_Turret_MS
displayText:ArchangelClass MS
displayText_zh:大天使号 导弹

maxHp: 7500



@memory ArchangelClass_Turret_MS_OnCD:bool
@memory ArchangelClass_Turret_MS_CDTimer:float
@global ArchangelClass_Turret_MS_CD=12
@global ArchangelClass_Turret_MS_EN=12

@global ArchangelClass_Turret_MS_Shoot=9
[resource_ArchangelClass_Turret_MS_ShootTimer]
hidden:true



[turret_ArchangelClass_Turret_MS]
x:0
y:0

canShoot:true
onShoot_triggerActions:ArchangelClass_Turret_MS_Send_UseEN
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false  
and parent.height>=0 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:ArchangelClass_Turret_MS_Projectile
resourceUsage:ArchangelClass_Turret_MS_ShootTimer=1

delay:0.75s
canAttackMaxAngle:360
limitingAngle:60
limitingRange:1200
barrelX:3
barrelY:0
barrelOffsetX_onOddShots:-6
turnSpeed:0

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:15
idleSweepAddRandomAngle:10
idleSweepDelay:240
idleSweepAddRandomDelay:120
idleSweepSpeed:0.25
idleSweepCondition:if false

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.2
shoot_flame:BZ_Fire_1_S




[projectile_ArchangelClass_Turret_MS_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS*1
(
    addResources=
    ShellDamage:1200
    |DpDamage:100
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=0.5
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=1
    |AntiAir=1
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:35
    |ProjectileTurnspeed:1.25
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:45
)
"""


[hiddenAction_ArchangelClass_Turret_MS_CDStart]
autoTrigger:"""
if memory.ArchangelClass_Turret_MS_OnCD==false 
and 
(
    (
        self.resource.ArchangelClass_Turret_MS_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.ArchangelClass_Turret_MS_ShootTimer<${ArchangelClass_Turret_MS_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:ArchangelClass_Turret_MS_OnCD=true,ArchangelClass_Turret_MS_CDTimer=self.timeAlive+${ArchangelClass_Turret_MS_CD}

[hiddenAction_ArchangelClass_Turret_MS_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.ArchangelClass_Turret_MS_OnCD==true and self.timeAlive>memory.ArchangelClass_Turret_MS_CDTimer
setUnitMemory:ArchangelClass_Turret_MS_OnCD=false
setResourcesWithLogic:ArchangelClass_Turret_MS_ShootTimer=${ArchangelClass_Turret_MS_Shoot}

[hiddenAction_ArchangelClass_Turret_MS_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${ArchangelClass_Turret_MS_EN}