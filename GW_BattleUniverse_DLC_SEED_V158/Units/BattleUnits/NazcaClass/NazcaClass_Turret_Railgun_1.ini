[core]
copyFrom:"""
ROOT:Template/Unit/Turret/Turret_CanBeTarget.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""

name:NazcaClass_Turret_Railgun_1
displayText:NazcaClass Railgun
displayText_zh:纳斯卡级 线性炮

maxHp: 7500

isUnselectable:false
canNotBeGivenOrdersByPlayer:false


@memory NazcaClass_Turret_Railgun_1_OnCD:bool
@memory NazcaClass_Turret_Railgun_1_CDTimer:float
@global NazcaClass_Turret_Railgun_1_CD=7
@global NazcaClass_Turret_Railgun_1_EN=25

@global NazcaClass_Turret_Railgun_1_Shoot=2
[resource_NazcaClass_Turret_Railgun_1_ShootTimer]
hidden:true


[graphics]
drawLayer:ground2


[decal_NazcaClass_Turret_Railgun_1]
layer:beforeBody
order:5
isVisible:if not parent.hasTags(includes='inHangar')
onlyWhileAlive:true
image:ROOT:Units/BattleUnits/NazcaClass/Image/NazcaClass_Turret_RailGun_1.png
imageScale:1.25
basePositionFromTurret:NazcaClass_Turret_Railgun_1




[turret_NazcaClass_Turret_Railgun_1]
x:0
y:0

canShoot:true
onShoot_triggerActions:SendEnemyTryAttack_Shoot,NazcaClass_Turret_Railgun_1_Send_UseEN
canOnlyAttackUnitsWithoutTags:AirUnit
canAttackCondition:"""
if ${onAttacking}==false and ${cantAction}==false 
and memory.onSkill==false 
and parent.resource().en>0
"""
showRangeUIGuide:false
projectile:NazcaClass_Turret_Railgun_1_Projectile
resourceUsage:NazcaClass_Turret_Railgun_1_ShootTimer=1

delay:0.5s
canAttackMaxAngle:3
limitingAngle:120
limitingMinRange:150
limitingRange:1200
barrelX:2
barrelY:4
barrelOffsetX_onOddShots:-4
turnSpeed:0.5

aimOffsetSpread:0
recoilOffset:0
recoilOutTime:0
recoilReturnTime:0

idleSweepAngle:8
idleSweepAddRandomAngle:10
idleSweepDelay:420
idleSweepAddRandomDelay:120
idleSweepSpeed:0.15
idleSweepCondition:if self.hp>0 and parent.hp>0

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Bazooka_1.ogg
shoot_sound_vol:0.35
shoot_flame:BZ_Fire_1



[projectile_NazcaClass_Turret_Railgun_1_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0

lightSize:0
effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Bazooka_S*1
(
    addResources=
    ShellDamage:2750
    |DpDamage:175
    |WeaponAccuracy=95
    |PartBreakModifier=0.75
    |CockpitBreakModifier=2.35
    |PilotDamageModifier=2.35
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=0.25  
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=20
    |ProjectileSpeed:60
    |ProjectileSpread:2
    |ProjectileExplosionRange:30
    |ProjectileLife:25
)
"""


[hiddenAction_NazcaClass_Turret_Railgun_1_CDStart]
autoTrigger:"""
if memory.NazcaClass_Turret_Railgun_1_OnCD==false 
and 
(
    (
        self.resource.NazcaClass_Turret_Railgun_1_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.NazcaClass_Turret_Railgun_1_ShootTimer<${NazcaClass_Turret_Railgun_1_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:NazcaClass_Turret_Railgun_1_OnCD=true,NazcaClass_Turret_Railgun_1_CDTimer=self.timeAlive+${NazcaClass_Turret_Railgun_1_CD}

[hiddenAction_NazcaClass_Turret_Railgun_1_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.NazcaClass_Turret_Railgun_1_OnCD==true and self.timeAlive>memory.NazcaClass_Turret_Railgun_1_CDTimer
setUnitMemory:NazcaClass_Turret_Railgun_1_OnCD=false
setResourcesWithLogic:NazcaClass_Turret_Railgun_1_ShootTimer=${NazcaClass_Turret_Railgun_1_Shoot}



[hiddenAction_NazcaClass_Turret_Railgun_1_Send_UseEN]
sendMessageTo:parent
sendMessageWithTags:UseEN
sendMessageWithData:useEN=${NazcaClass_Turret_Railgun_1_EN}


