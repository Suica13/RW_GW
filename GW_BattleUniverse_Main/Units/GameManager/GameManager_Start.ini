
[core]
copyFrom:"""
ROOT:Units/GameManager/Mod/GameManager.ini
"""
name: GameManager_Start

onNewMapSpawn:mapCenter_asNeutral









[hiddenAction_SetGameMode_Setting_Get_BulletSpeed_Up]
autoTriggerOnEvent:newMessage(withTag="SetGameMode_Setting_BulletSpeed_Up")
setResourcesWithLogic:BulletSpeed=select(self.Resource.BulletSpeed+0.5>4,1,self.Resource.BulletSpeed+0.5)
alsoTriggerAction:SetGameMode_Setting_Get_BulletSpeed_ToHQ
alsoTriggerActionRepeat:memory.playersHQ.size

[hiddenAction_SetGameMode_Setting_Get_BulletSpeed_Down]
autoTriggerOnEvent:newMessage(withTag="SetGameMode_Setting_BulletSpeed_Down")
setResourcesWithLogic:BulletSpeed=select(self.Resource.BulletSpeed-0.5<0,4,self.Resource.BulletSpeed-0.5)
alsoTriggerAction:SetGameMode_Setting_Get_BulletSpeed_ToHQ
alsoTriggerActionRepeat:memory.playersHQ.size

[hiddenAction_SetGameMode_Setting_Get_BulletSpeed_ToHQ]
sendMessageTo:memory.playersHQ[index]
sendMessageWithTags:SetGameMode_Setting_BulletSpeed
sendMessageWithData:BulletSpeed=self.Resource.BulletSpeed




[hiddenAction_SetGameMode_Setting_Get_GameMode_Step_1]
autoTriggerOnEvent:newMessage(withTag="Setting_GameMode")
setUnitMemory:"""
gameMainMode=eventData('gameMainMode',type='float'),
gameSubMode=eventData('gameSubMode',type='float'),
stageIndex=eventData('stageIndex',type='float'),
resStart=eventData('resStart',type='float'),
mpStart=eventData('mpStart',type='float'),
techStart=eventData('techStart',type='float'),
resX=eventData('resX',type='float'),
mpX=eventData('mpX',type='float'),
techX=eventData('techX',type='float'),
autoTech=eventData('autoTech',type='float'),
techLimit=eventData('techLimit',type='float'),
techShare=eventData('techShare',type='float'),
allowACEUnit=eventData('allowACEUnit',type='float'),
allowPMCUnit=eventData('allowPMCUnit',type='float')
"""
alsoTriggerAction:"""
SetGameMode_Setting_Get_GameMode_Step_2,
SetGameMode_Setting_Get_GameMode_Step_3
"""
[hiddenAction_SetGameMode_Setting_Get_GameMode_Step_2]
alsoTriggerAction:SetGameMode_Setting_Get_GameMode_Step_2_SendToAllPlayers
alsoTriggerActionRepeat:memory.playersHQ.size
[hiddenAction_SetGameMode_Setting_Get_GameMode_Step_2_SendToAllPlayers]
sendMessageTo:memory.playersHQ[index]
sendMessageWithTags:Setting_GameMode
sendMessageWithData:"""
gameMainMode=memory.gameMainMode,
gameSubMode=memory.gameSubMode,
stageIndex=memory.stageIndex,
resStart=memory.resStart,
mpStart=memory.mpStart,
techStart=memory.techStart,
resX=memory.resX,
mpX=memory.mpX,
techX=memory.techX,
autoTech=memory.autoTech,
techLimit=memory.techLimit,
techShare=memory.techShare,
allowACEUnit=memory.allowACEUnit,
allowPMCUnit=memory.allowPMCUnit
"""
[hiddenAction_SetGameMode_Setting_Get_GameMode_Step_3]
alsoTriggerAction:"""
SetGameMode_Setting_Get_GameMode_Step_3_VS
"""
[hiddenAction_SetGameMode_Setting_Get_GameMode_Step_3_VS]
requireConditional:if memory.gameMainMode==1
convertTo:GameManager_VS








