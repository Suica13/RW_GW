playerNum=memory.playerNum+1
"""

[hiddenAction_Start_SetHost]
autoTrigger:if self.timeAlive>1 and memory.checkStartOK==false
setUnitMemory:checkStartOK=true,hostHQ=memory.playersHQ[0]
alsoTriggerAction:"""
SetGameMode_Setting_Get_TileMode_Step2,
Start_SetHost_Step2
"""
alsoTriggerActionRepeat:memory.playersHQ.size
[hiddenAction_Start_SetHost_Step2]
setUnitMemory:"""
hostHQ=select
(
    memory.playersHQ[index].hp>0 and not memory.playersHQ[index].isControlledByAI(),
    select(memory.hostHQ.hp>0 and not memory.hostHQ.isControlledByAI(),memory.hostHQ,memory.playersHQ[index]),
    memory.hostHQ
)
"""
alsoTriggerAction:Start_SetHost_Step3
alsoTriggerOrQueueActionConditional:if memory.playersHQ.size-1==index
[hiddenAction_Start_SetHost_Step3]
sendMessageTo:memory.hostHQ
sendMessageWithTags:SetHost


[hiddenAction_Start_Get_TileMode]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start_Get_TileMode_Ground,
Start_Get_TileMode_Space
"""
[hiddenAction_Start_Get_TileMode_Space]
requireConditional:if self.numberOfUnitsInAllTeams(withTag="MapMarker_Space")>0
setResourcesWithLogic:TileMode=1
[hiddenAction_Start_Get_TileMode_Ground]
requireConditional:if self.numberOfUnitsInAllTeams(withTag="MapMarker_Ground")>0
setResourcesWithLogic:TileMode=0

[hiddenAction_SetGameMode_Setting_Get_TileMode]
autoTriggerOnEvent:newMessage(withTag="Setting_TileMode")
setResourcesWithLogic:TileMode=eventData('tileMode',type='float')
alsoTriggerAction:SetGameMode_Setting_Get_TileMode_Step2
[hiddenAction_SetGameMode_Setting_Get_TileMode_Step2]
takeResources_includeUnitsWithinRange:999999
takeResources_includeUnitsWithinRange_team:any
takeResources_searchOnly:true
takeResources_maxUnits:10000
takeResources_triggerActionForEach:SetGameMode_Setting_Get_TileMode_Step3
[hiddenAction_SetGameMode_Setting_Get_TileMode_Step3]
sendMessageTo:thisActionTarget
sendMessageWithTags:Setting_TileMode
sendMessageWithData:TileMode=self.resource.TileMode




[hiddenAction_Get_AutoTileMode]
autoTriggerOnEvent:newMessage(withTag="Setting_AutoTileMode")
setResourcesWithLogic:AutoTileMode=eventData('AutoTileMode',type='float')
alsoTriggerAction:SetGameMode_Setting_AutoTileMode_Step2
[hiddenAction_SetGameMode_Setting_AutoTileMode_Step2]
takeResources_includeUnitsWithinRange:999999
takeResources_includeUnitsWithinRange_team:any
takeResources_searchOnly:true
takeResources_maxUnits:10000
takeResources_triggerActionForEach:SetGameMode_Setting_AutoTileMode_Step3
[hiddenAction_SetGameMode_Setting_AutoTileMode_Step3]
sendMessageTo:thisActionTarget
sendMessageWithTags:Setting_AutoTileMode
sendMessageWithData:AutoTileMode=1



[hiddenAction_SetBulletSpeedWhenX0]
autoTrigger:if self.resource().BulletSpeed<1
setResourcesWithLogic:BulletSpeed=1



[hiddenAction_Update]
autoTrigger:true
sendMessageTo:self
sendMessageWithTags:Update










