[core]
#天气系统相关

#时间
[hiddenAction_TimeOfDayCheck]
autoTriggerOnEvent:newMessage(withTag='Update')
alsoTriggerAction:"""
TimeOfDayCheck_UpdateTimer
"""
[hiddenAction_TimeOfDayCheck_UpdateTimer]
requireConditional:if self.timeAlive>memory.nowTimeOfDayTimer and memory.lockTimeOfDay==false
setUnitMemory:"""
nowTimeOfDayTimer=self.timeAlive+60,
nowTimeOfDayIndex=select(memory.nowTimeOfDayIndex>=7,0,memory.nowTimeOfDayIndex+1)
"""
alsoTriggerAction:"""
WeatherSystemInfo_Setting_TimeOfDay_Send
"""

#天气
[hiddenAction_WeatherCheck]
autoTriggerOnEvent:newMessage(withTag='Update')
alsoTriggerAction:"""
WeatherCheck_UpdateTimer
"""
[hiddenAction_WeatherCheck_UpdateTimer]
requireConditional:if self.timeAlive>memory.nowWeatherTimer and memory.lockWeather==false
setUnitMemory:"""
nowWeatherTimer=self.timeAlive+120,
nowWeatherRandom=rnd(0,100)
"""
alsoTriggerAction:"""
WeatherCheck_UpdateWeather_Common,
WeatherSystemInfo_Setting_Weather_Send
"""
[hiddenAction_WeatherCheck_UpdateWeather_Common]
alsoTriggerAction:"""
WeatherCheck_UpdateWeather_Normal,
WeatherCheck_UpdateWeather_Rain,
WeatherCheck_UpdateWeather_Storm
"""
[hiddenAction_WeatherCheck_UpdateWeather_Normal]
requireConditional:if memory.nowWeatherRandom<=75
setUnitMemory:nowWeatherIndex=0
[hiddenAction_WeatherCheck_UpdateWeather_Rain]
requireConditional:if memory.nowWeatherRandom>75 and memory.nowWeatherRandom<=90
setUnitMemory:nowWeatherIndex=1
[hiddenAction_WeatherCheck_UpdateWeather_Storm]
requireConditional:if memory.nowWeatherRandom>90
setUnitMemory:nowWeatherIndex=2








