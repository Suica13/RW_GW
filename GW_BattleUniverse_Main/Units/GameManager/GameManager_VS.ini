
[core]
copyFrom:"""
ROOT:Units/GameManager/Mod/GameManager.ini
"""
name: GameManager_VS

[hiddenAction_CheckGameReady]
autoTrigger:if memory.gameReady==false
setUnitMemory:gameReady=true
alsoTriggerAction:CheckGameReady_SetGameMainMode




[hiddenAction_CheckGameReady_SetGameMainMode]
alsoTriggerAction:"""
CheckGameReady_SetGameMainMode_GE,
CheckGameReady_SetGameMainMode_CR
"""

[hiddenAction_CheckGameReady_SetGameMainMode_GE]
requireConditional:if memory.gameMainMode==1
alsoTriggerAction:"""
GameReady_SetGameMainMode_GE_ShowStartMessage
"""
[hiddenAction_GameReady_SetGameMainMode_GE_ShowStartMessage]
alsoTriggerAction:"""
GameReady_SetGameMainMode_Common_ShowStartMessage,
GameReady_SetGameMainMode_GE_ShowStartMessage_Step_1
"""
[hiddenAction_GameReady_SetGameMainMode_GE_ShowStartMessage_Step_1]
showMessageToAllPlayers:GameMode: VS Mode / GE Mode  TileMap:%{select(self.resource.TileMode==0,"Ground","Space")}
showMessageToAllPlayers_zh:游戏模式:标准模式 / 起源模式  地图:%{select(self.resource.TileMode==0,"地面","宇宙")}
playSoundGlobally:ROOT:Resource/Sound/SE/System/Event/GameSet_1.ogg:1.5



[hiddenAction_CheckGameReady_SetGameMainMode_CR]
requireConditional:if memory.gameMainMode==2
alsoTriggerAction:"""
GameReady_SetGameMainMode_CR_ShowStartMessage
"""
[hiddenAction_GameReady_SetGameMainMode_CR_ShowStartMessage]
alsoTriggerAction:"""
GameReady_SetGameMainMode_Common_ShowStartMessage,
GameReady_SetGameMainMode_CR_ShowStartMessage_Step_1
"""
[hiddenAction_GameReady_SetGameMainMode_CR_ShowStartMessage_Step_1]
showMessageToAllPlayers:GameMode: VS Mode / CR Mode  TileMap:%{select(self.resource.TileMode==0,"Ground","Space")}
showMessageToAllPlayers_zh:游戏模式:标准模式 / 纵横火线模式  地图:%{select(self.resource.TileMode==0,"地面","宇宙")}
playSoundGlobally:ROOT:Resource/Sound/SE/System/Event/GameSet_1.ogg:1.5



[hiddenAction_GameReady_SetGameMainMode_Common_ShowStartMessage]
alsoTriggerAction:"""
GameReady_SetGameMainMode_Common_ShowStartMessage_Step_1,
GameReady_SetGameMainMode_Common_ShowStartMessage_Step_2,
GameReady_SetGameMainMode_Common_ShowStartMessage_Step_3,
GameReady_SetGameMainMode_Common_ShowStartMessage_Step_4,
GameReady_SetGameMainMode_Common_ShowStartMessage_Step_5,
GameReady_SetGameMainMode_Common_ShowStartMessage_Step_6
"""
[hiddenAction_GameReady_SetGameMainMode_Common_ShowStartMessage_Step_1]
showMessageToAllPlayers:ResX:%{str(memory.resX*100)}%/MpX:%{str(memory.mpX*100)}%/techX:%{str(memory.techX*100)}%
