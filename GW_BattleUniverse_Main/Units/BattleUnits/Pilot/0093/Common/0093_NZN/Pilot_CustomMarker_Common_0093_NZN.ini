[core]
copyFrom:"""
ROOT:Units/BattleUnits/Pilot/Mod/Pilot_CustomMarker_Common.ini
"""
name:Pilot_CustomMarker_Common_0093_NZN

# [ORDER_DEPENDENT] Preserve the existing skill-transfer/message conversion chain.
[hiddenAction_Send_TryTransform_PilotCustomChange_Step3]
setUnitMemory:changePilotSkillsBool=true

[hiddenAction_Start_PilotCustomChange]
autoTriggerOnEvent:newMessage(withTag="PilotCustomChange")
alsoTriggerAction:"""
Send_TryTransform_PilotCustomChange_Step3,
Start_PilotCustomChange_Pilot_0093_NZN_N_C,
Start_PilotCustomChange_Pilot_0093_NZN_O_C
"""

[hiddenAction_Start_PilotCustomChange_Pilot_0093_NZN_N_C]
requireConditional:if customTarget1.resource.PilotType==1101 or customTarget1.resource.PilotType==1001
convertTo:Pilot_0093_NZN_N_C_A

[hiddenAction_Start_PilotCustomChange_Pilot_0093_NZN_O_C]
requireConditional:if customTarget1.resource.PilotType==2101 or customTarget1.resource.PilotType==2001
convertTo:Pilot_0093_NZN_O_C_A
