
[core]

copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Template/Shoot_BombProjectile_Shell.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/Explosion_Hit_1.gw
"""

name:Projectile_Bomb


[decal_Projectile_Image]
layer:beforeUI
order:6
onlyWhileAlive:true 
isVisible:true
imageScale:1
xOffsetRelative: 0
yOffsetRelative: -5
dirOffset:0
image:ROOT:\Resource\Image\Bullet\Shell\Grenade_2.png

[decal_Shadow]
layer:beforeBody
order:0
onlyWhileAlive:true
isVisible:if self.height>=0
alpha:0.65
imageScale:0.25
image:ROOT:Resource/Image/Ring/Shadow.png
alwaysStartHeightAtZero:true

[hiddenAction_Check_Height]
autoTrigger:true
setUnitStats:targetHeight=select(self.height>0,self.height-10*self.Resource.BulletSpeed,0)

[hiddenAction_SpawnHitEffect]
spawnEffects:Explosion_Hit_1

[projectile_Hit_Effect]
pushForce:250
