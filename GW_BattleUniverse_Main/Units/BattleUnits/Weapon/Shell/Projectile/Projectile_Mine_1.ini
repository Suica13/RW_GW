
[core]

copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Template/Shoot_ExplosionProjectile_Shell.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/Explosion_Hit_1.gw
"""

name:Projectile_Mine_1

@memory sizeFloat:float
@memory dirFloat:float

@memory imageFrame:float

[hiddenAction_Start_randomDirFloat]
autoTriggerOnEvent:created
setUnitMemory:dirFloat=rnd(0,360)

[hiddenAction_Update_sizeFloat]
autoTrigger:true
setUnitMemory:sizeFloat=select(memory.sizeFloat>=0.5,0.5,memory.sizeFloat+0.005*self.Resource.BulletSpeed)

[hiddenAction_Update_dirFloat]
autoTrigger:true
setUnitMemory:dirFloat=select(memory.dirFloat>=360,0,memory.dirFloat+0.5*self.Resource.BulletSpeed)

[decal_Projectile_Image]
layer:beforeUI
order:6
onlyWhileAlive:true 
isVisible:if self.timeAlive>0.02
imageScale:memory.sizeFloat
basePosition:self.getOffsetRelative(dirOffset=memory.dirFloat)
image:ROOT:Resource/Image/Bullet/Sp/Mine_1.png
total_frames:2
frame:memory.imageFrame
[hiddenAction_CheckImageFrame]
autoTrigger:true
setUnitMemory:imageFrame=select(memory.imageFrame>=1,0,memory.imageFrame+1)



[hiddenAction_SpawnHitEffect]
spawnEffects:Explosion_Hit_1


[projectile_Hit_Effect]
pushForce:1500

[hiddenAction_FindAttackTarget_Unit]
setUnitMemory:nowAttackTarget=self.nearestUnit(withTag='CanBeDamaged',withinRange=40,relation='enemy')