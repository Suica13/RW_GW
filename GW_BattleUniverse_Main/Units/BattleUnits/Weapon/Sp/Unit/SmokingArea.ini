"""




[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
Check_SmokingArea,
UpdateSmokingAreaFrame
"""

[hiddenAction_Check_SmokingArea]
takeResources_includeUnitsWithinRange:300
takeResources_includeUnitsWithinRange_team:ally
takeResources_excludeUnitsWithoutTags:BattleUnitCore
takeResources_searchOnly:true
takeResources_maxUnits:200
takeResources_triggerActionForEach:Check_SmokingArea_Step2
[hiddenAction_Check_SmokingArea_Step2]
requireConditional:"""
if distanceBetween(self,thisActionTarget)<memory.effectRange
"""
sendMessageTo:thisActionTarget
sendMessageWithTags:SmokingArea
sendMessageWithData:"""
smokingAreaTimer=2
"""



[hiddenAction_UpdateSmokingAreaFrame]
setUnitMemory:"""
smokingAreaFrame=select
(
    self.timeAlive>memory.lifeTime-2.5,
    select(memory.smokingAreaFrame<24,24,select(memory.smokingAreaFrame<31,memory.smokingAreaFrame+0.5,31)),
    select
    (
        memory.smokingAreaFrame<14,
        memory.smokingAreaFrame+0.5,
        select
        (
            memory.smokingAreaFrame>=16.5 and memory.smokingAreaFrame<22,
            memory.smokingAreaFrame+0.5,
            16.5
        )
    )
)
"""

[decal_SmokingArea]
layer:beforeBody
onlyTeam:ally
