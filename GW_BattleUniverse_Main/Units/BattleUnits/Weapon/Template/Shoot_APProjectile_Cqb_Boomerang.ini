
[core]
dont_load:true

name:Shoot_APProjectile_Cqb_Boomerang
tags:ShootBullet,CqbBullet

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true
canNotBeDirectlyAttacked:true
ignoreInUnitCapCalculation:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory thisTimeMissTarget:bool

@memory goBack:bool

@memory triedDamageTarget:unit[]
@memory nowAttackTimes:float
@memory damageMultiplier:float

@memory firstTarget:unit
@memory nowAttackTarget:unit
@memory targetHeight:float

@memory finalShootLevel:float
@memory finalCqbLevel:float
@memory finalAccuracyLevel:float

@memory projectileLife:float
@memory projectileSpeed:float
@memory projectileTurnspeed:float
@memory projectileSpread:float

@memory extraBuildingAtk:float

@memory attacker:unit

@memory LastUpdateTime:float
@memory DeltaTime:float

[hiddenAction_SetAttacker]
setUnitMemory:attacker=customTarget1.readUnitMemory('attacker',type='unit')
[hiddenAction_SetFirstTarget]
setUnitMemory:firstTarget=customTarget1.attacking

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""
[hiddenAction_Start]
alsoTriggerAction:"""
SetAttacker,
SetFirstTarget,
CheckDeltaTime,
Start_SetStats,
Start_SetTarget,
Start_SetDir,
Start_SendAttackInfo
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
Moving_Forward,
Moving_Height,
Moving_Check_GoBack,
Moving_Rotation_Go,
Moving_Rotation_Back,
Check_StartExplosion
"""

[hiddenAction_CheckDeltaTime]
setUnitMemory:"""
DeltaTime=1+min(self.timeAlive - memory.LastUpdateTime, 0.05),
LastUpdateTime=self.timeAlive
"""

[hiddenAction_Start_SendCustomTarget1]
autoTriggerOnEvent:created
sendMessageTo:customTarget1
sendMessageWithTags:Cqb_Boomerang
sendMessageWithData:unitInfo=self

[hiddenAction_Start_SetStats]
setUnitMemory:"""
damageMultiplier=1,
finalShootLevel=customTarget1.readUnitMemory(name="finalShootLevel",type="float"),
finalCqbLevel=customTarget1.readUnitMemory(name="finalCqbLevel",type="float"),
finalAccuracyLevel=customTarget1.readUnitMemory(name="finalAccuracyLevel",type="float"),
extraBuildingAtk=customTarget1.readUnitMemory(name="extraBuildingAtk",type="float"),
projectileLife=self.Resource.ProjectileLife*0.75,
projectileSpeed=self.Resource.ProjectileSpeed*0.1*self.Resource.BulletSpeed*1.25,
projectileTurnspeed=self.Resource.ProjectileTurnspeed*rnd(0.75,1.25)*self.Resource.BulletSpeed,
projectileSpread=self.Resource.ProjectileSpread
"""
setHeight=customTarget1.height

[hiddenAction_Start_SetTarget]
requireConditional:"""
if customTarget1.attacking.hp>0  
"""
setBodyRotation:"""
select
(
    not (directionBetween(self, customTarget1.attacking) < self.dir-15 or directionBetween(self, customTarget1.attacking) > self.dir+15),
    directionBetween(self,customTarget1.attacking),
    self.dir
)
"""
setUnitStats:targetHeight=customTarget1.attacking.height
setUnitMemory:targetHeight=customTarget1.attacking.height

[hiddenAction_Start_SetDir]
setBodyRotation:self.dir+rnd(-memory.projectileSpread,memory.projectileSpread)


[hiddenAction_Start_SendAttackInfo]
sendMessageTo:memory.firstTarget.readUnitMemory("battleUnitCore",type="unit")
sendMessageWithTags:AttackInfo_Bullet
sendMessageWithData:"""
bulletInfo=self,
accuracy=memory.finalAccuracyLevel,
cantDodge=self.resource.CantDodge
"""

[hiddenAction_Get_ThisTimeMissTarget]
autoTriggerOnEvent:newMessage(withTag="ThisTimeMissTarget")
setUnitMemory:"""
thisTimeMissTarget=true
"""


[hiddenAction_TryDamageTarget]
autoTriggerOnEvent:newMessage(withTag="AttackTarget")
requireConditional:"""
if 
(
    not memory.triedDamageTarget.contains(eventData(name="unitInfo",type="unit").readUnitMemory('coreUnit',type='unit')) 
    and 
    select
    (
        eventData(name="unitInfo",type="unit").readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit')!=null,
        not memory.triedDamageTarget.contains(eventData(name="unitInfo",type="unit").readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit')),
        true
    )
) 
and max(-(eventData(name="unitInfo",type="unit").height-self.height),(eventData(name="unitInfo",type="unit").height-self.height))<=self.resource().HeightHitRange 
"""
setUnitMemory:"""
triedDamageTarget[memory.triedDamageTarget.size]=eventData(name="unitInfo",type="unit").readUnitMemory('coreUnit',type='unit'),
triedDamageTarget[memory.triedDamageTarget.size+1]=select
(
    eventData(name="unitInfo",type="unit").readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit')!=null,
    eventData(name="unitInfo",type="unit").readUnitMemory('coreUnit',type='unit').readUnitMemory('coreUnit',type='unit'),
    null
)
"""
sendMessageTo:eventData(name="unitInfo",type="unit")
sendMessageWithTags:TryDamage
sendMessageWithData:"""
bulletInfo=self,
accuracy=memory.finalAccuracyLevel*0.01*self.Resource.WeaponAccuracy*0.01*select(eventData(name="unitInfo",type="unit").parent==memory.firstTarget or self.resource.SubEquipmentIndex==1,1,0.75)
"""

[hiddenAction_AttackTarget]
autoTriggerOnEvent:newMessage(withTag="DoDamage")
sendMessageTo:eventData(name="damageTarget",type="unit")
sendMessageWithTags:Damage_Cqb
sendMessageWithData:"""
DpDamage=self.Resource.dpDamage*memory.finalCqbLevel*0.01*memory.damageMultiplier,
CqbDamage=self.Resource.CqbDamage*memory.finalCqbLevel*0.01*memory.damageMultiplier,
CqbAPDamage=self.Resource.CqbAPDamage*memory.finalCqbLevel*0.01*memory.damageMultiplier,
CqbBeamDamage=self.Resource.CqbBeamDamage*memory.finalCqbLevel*0.01*memory.damageMultiplier,
CqbShellDamage=self.Resource.CqbShellDamage*memory.finalCqbLevel*0.01*memory.damageMultiplier,

PartBreakModifier=self.Resource.PartBreakModifier,
CockpitBreakModifier=self.Resource.CockpitBreakModifier,
PilotDamageModifier=self.Resource.PilotDamageModifier,
PilotTrueDamage=self.Resource.PilotTrueDamage,
AntiSizeLargeDamage=self.Resource.AntiSizeLargeDamage,
AntiSizeSmallDamage=self.Resource.AntiSizeSmallDamage,
AntiSizeLargeAccuracy=self.Resource.AntiSizeLargeAccuracy,
AntiSizeSmallAccuracy=self.Resource.AntiSizeSmallAccuracy,

Accuracy=memory.finalAccuracyLevel*0.01*self.Resource.WeaponAccuracy*0.01*select(eventData(name="damageTarget",type="unit")==memory.firstTarget or self.resource.SubEquipmentIndex==1,1,0.75),
AntiLand=self.Resource.AntiLand,
AntiAqua=self.Resource.AntiAqua,
AntiSpace=self.Resource.AntiSpace,
AntiAir=self.Resource.AntiAir,
AntiBuilding=self.Resource.AntiBuilding*memory.extraBuildingAtk,
CantDodge=self.Resource.CantDodge,
attacker=memory.attacker,
bulletInfo=self
"""
fireTurretXAtGround:Hit_Effect
fireTurretXAtGround_withTarget:eventData(name="damageTarget",type="unit")
alsoTriggerAction:SendDeBuff,ChangeNowAttackTimes
[hiddenAction_SendDeBuff]
sendMessageTo:eventData(name="damageTarget",type="unit").parent.readUnitMemory('BattleUnitCore',type='unit')
sendMessageWithTags:DeBuff
sendMessageWithData:"""
burnedDamage=self.Resource.BurnedDamage,
stunDamage=self.Resource.StunDamage,
jammingDamage=self.Resource.jammingDamage,
atkDownS=self.Resource.AtkDownDamage,
defDownS=self.Resource.DefDownDamage,
speedDownM=self.Resource.SpeedDownDamage,
attacker=customTarget1,
bulletInfo=self
"""

[hiddenAction_ChangeNowAttackTimes]
setUnitMemory:"""
nowAttackTimes=memory.nowAttackTimes+1,
damageMultiplier=memory.damageMultiplier*self.resource.ProjectileAttackTimesDamageModifier
"""

[hiddenAction_Moving_Forward]
teleportTo:self.getOffsetRelative(y=memory.projectileSpeed * memory.DeltaTime)
[hiddenAction_Moving_Height]
requireConditional:"""
if max(-(self.height-memory.targetHeight),(self.height-memory.targetHeight))>=self.resource().HeightHitRange/2
"""
setHeight:"""
select
(
    self.height<memory.targetHeight,
    self.height+self.Resource.HeightChangeSpeed*self.Resource.BulletSpeed,
    self.height-self.Resource.HeightChangeSpeed*self.Resource.BulletSpeed
)
"""
[hiddenAction_Moving_Check_GoBack]
requireConditional:"""
if self.timeAlive>memory.projectileLife*0.1*0.5 and memory.goBack==false
"""
setUnitMemory:goBack=true

[hiddenAction_Moving_Rotation_Go]
requireConditional:if memory.firstTarget!=null and self.timeAlive>0.15 and memory.goBack==false
setBodyRotation:"""
select
(
    distanceBetween(self.getOffsetRelative(x=-memory.projectileTurnspeed*self.Resource.BulletSpeed,y=1), memory.firstTarget)>distanceBetween(self.getOffsetRelative(x=memory.projectileTurnspeed*self.Resource.BulletSpeed,y=1), memory.firstTarget),
    self.dir+memory.projectileTurnspeed*self.Resource.BulletSpeed,
    self.dir-memory.projectileTurnspeed*self.Resource.BulletSpeed
)
"""

[hiddenAction_Moving_Rotation_Back]
requireConditional:if memory.goBack==true
setBodyRotation:"""
select
(
    distanceBetween(self.getOffsetRelative(x=-memory.projectileTurnspeed*self.Resource.BulletSpeed,y=1), customTarget1)>distanceBetween(self.getOffsetRelative(x=memory.projectileTurnspeed*self.Resource.BulletSpeed,y=1), customTarget1),
    self.dir+memory.projectileTurnspeed*self.Resource.BulletSpeed,
    self.dir-memory.projectileTurnspeed*self.Resource.BulletSpeed
)
"""

[hiddenAction_Check_StartExplosion]
requireConditional:"""
if self.timeAlive>memory.projectileLife*0.1 
or memory.nowAttackTimes>=self.resource().ProjectileAttackTimes 
or 
(
    memory.goBack==true and distanceBetween(self, customTarget1)<20
)
"""
alsoTriggerAction:SpawnDeleteEffect,DeleteSelf

[hiddenAction_SpawnDeleteEffect]
isVisible:false

[hiddenAction_Delete_NotInMap]
autoTrigger:if not self.isInMap()
alsoTriggerAction:DeleteSelf

[hiddenAction_DeleteSelf]
deleteSelf:true

[hiddenAction_DeleteSelf_ByBlockWall]
autoTrigger:if numberOfUnitsInEnemyTeam(withTag="BlockWall",withinrange=15)>0
deleteSelf:true


[attachment_HitBox0]
x:0
y:0
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:false
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:false


[turret_Hit_Effect]
x:0
y:0
canShoot:false
projectile:Hit_Effect
aimOffsetSpread:0
recoilOffset: 0
recoilOutTime: 0
recoilReturnTime: 0
shoot_flame:none

[projectile_Hit_Effect]

directDamage: 0
life: 1
explodeOnEndOfLife:true
speed: 100


lightSize:0.75
lightColor:#ff57e9
explodeEffect:none


[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:0
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false

