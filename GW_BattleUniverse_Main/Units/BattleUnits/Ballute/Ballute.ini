@global Common_ReEntry_MS_FromSpace_ActiveTime:120
[hiddenAction_Common_ReEntry_MS_FromSpace_Fire_Step_Forward]
teleportTo:"""
self.getOffsetRelative
(
    y = 3 * self.resource.bulletSpeed *
        select(
            memory.Common_ReEntry_MS_FromSpace_CanBeTargetUnit==false,
            (distanceBetween(self, memory.Common_ReEntry_MS_FromSpace_AimTarget) / 2000),
            1
        )
)
