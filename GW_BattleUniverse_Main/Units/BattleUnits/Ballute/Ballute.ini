[hiddenAction_Common_ReEntry_MS_FromSpace_AimTarget_FindByAI]
autoTrigger:"""
if ${allowAI}==true and self.isControlledByAI() and ${onSkill}==false
"""

setUnitMemory:Common_ReEntry_MS_FromSpace_AimTarget=memory.nearsetTargetSL.getOffsetRelative(x=rnd(-50,50),y=rnd(-50,50))






[core]

@memory attackEnemyBaseTimer:float
