requireConditional:"""
if self.isControlledByAI()==true 
"""
alsoTriggerAction:"""
AI_CheckEnemyBase
"""


[hiddenAction_AI_CheckEnemyBase]
requireConditional:"""
if self.timeAlive>memory.aiCheckTargetSLTimer 
"""
setUnitMemory:"""
aiCheckTargetSLTimer=self.timeAlive+5
"""
alsoTriggerAction:"""
AI_CheckTargetSL
"""


#据点
[hiddenAction_AI_CheckAllSL]
autoTriggerOnEvent:created
takeResources_includeUnitsWithinRange:30000
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:StrategicLocation
takeResources_searchOnly:true
takeResources_maxUnits:100
takeResources_triggerActionForEach:AI_CheckAllSL_Step2
[hiddenAction_AI_CheckAllSL_Step2]
setUnitMemory:"""
allSL[memory.allSL.size]=thisActionTarget
"""

[hiddenAction_AI_CheckTargetSL]
requireConditional:"""
if ${onSkill}==false and ${cantAction}==false 
"""
setUnitMemory:"""
TargetSL=null,
nearsetTargetSL=null
"""
alsoTriggerAction:AI_CheckTargetSL_Step2
alsoTriggerActionRepeat:memory.allSL.size
[hiddenAction_AI_CheckTargetSL_Step2]
requireConditional:"""
if 
select
(
    self.resource().TileMode==0,
    select(memory.allSL[index].resource().TileMode==1,true,false),
    select(memory.allSL[index].resource().TileMode==0,true,false)
)
"""
setUnitMemory:"""
TargetSL[memory.TargetSL.size]=memory.allSL[index]
"""
alsoTriggerAction:AI_CheckTargetSL_Step3
alsoTriggerActionRepeat:memory.TargetSL.size
[hiddenAction_AI_CheckTargetSL_Step3]
requireConditional:"""
if index==0 or 
(
    distanceBetween(self, memory.TargetSL[index])<distanceBetween(self, memory.nearsetTargetSL)
)
