[core]
dont_load:true
copyFrom:"""
ROOT:Template/Building/Common_Buildings_Repair.gw,
ROOT:Template/Building/Common_Buildings.gw,
ROOT:Template/Building/Common_Buildings_ByBuild.gw,
ROOT:Template/Building/Skill/DelSelf.gw,
ROOT:Resource/Image/Fx/Common/Common_Explosion_1.gw
"""

showOnMinimap:true
price:Money=${Money},Resource=${Resource}
mass: 50000

tags:Building,CanBeTargetUnit,BuildingTurret

disableAllUnitCollisions:false

buildSpeed:0s
radius: 15
fogOfWarSightRange:15

isBuilding:true

footprint: 0,0,1,1
constructionFootprint: 0,0,1,1
buildingToFootprintOffsetX:21
buildingToFootprintOffsetY:20

#canNotBeDamaged:true
autoTriggerCooldownTime:0.1s
autoTriggerCheckRate:every8frames
autoTriggerCheckWhileNotBuilt:true

disableDeathOnZeroHp:true

hideScorchMark:true
numBitsOnDeath:0
effectOnDeath:none
selfBuildRate:0s

displayDescription:Requires 0.5 Money to maintain
displayDescription_zh:需要0.5资金以维持

@memory HQ:unit

@global Money=99999
@global Resource=99999
@global buildTime=30



[hiddenAction_FindHQ]
autoTrigger:if memory.HQ.hp<= 0 or memory.HQ.teamId!=self.teamId
takeResources_includeUnitsWithinRange:99999
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:HQ
takeResources_searchOnly:true
takeResources_maxUnits:1
takeResources_triggerActionForEach:FindHQ_Step2
[hiddenAction_FindHQ_Step2]
setUnitMemory:HQ=thisActionTarget

[hiddenAction_Start_BuildDone]
autoTriggerOnEvent:created
ai_isDisabled:true

[hiddenAction_Update]
autoTrigger:true
ai_isDisabled:true
alsoTriggerAction:"""

"""




[hiddenAction_InitializeStats]
autoTriggerOnEvent:created
ai_isDisabled:true
setUnitMemory:"""
baseDetectRange=${core.fogOfWarSightRange}*18,

finalShootLevel=100,
finalCqbLevel=100,
finalAccuracyLevel=100,

finalBeamDef=0,
finalShellDef=0,
finalCqbDef=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""



[hiddenAction_Get_TileModeAuto]
autoTrigger:true
setResourcesWithLogic:"""
tileMode=select
(
    self.resource.AutoTileMode==0,
    memory.HQ.resource.TileMode,
    self.resource().TileMode
)
"""



[hiddenAction_Die]
ai_isDisabled:true
autoTrigger:"""
if self.hp<=0
"""
alsoTriggerAction:"""
Die_Step2_Ground,
Die_Step2_Space,
Die_Step3
"""
[hiddenAction_Die_Step2_Ground]
requireConditional:if self.resource().tileMode==0
spawnEffects:Explosion_Ground_1,Crater_1
[hiddenAction_Die_Step2_Space]
requireConditional:if self.resource().tileMode==1
spawnEffects:Explosion_Space_1
[hiddenAction_Die_Step3]
deleteSelf:true

















[decal_HpBar_Self]
layer:beforeUI
order:2
image:SHARED:white_pixel.png
color:#54ffaf
onlyTeam:own
alpha:1
imageScale:1
imageScaleX:30*((self.hp/self.maxHp))
imageScaleY:3
xOffsetAbsolute:(15*((self.hp/self.maxHp)))-15
yOffsetAbsolute:20
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.hp>0 and self.hp<self.maxHp
onlyWhileAlive:true
[decal_HpBar_Ally]
@copyFromSection:decal_HpBar_Self
color:#ffeb54
onlyTeam:allynotown
[decal_HpBar_Enemy]
@copyFromSection:decal_HpBar_Self
color:#ff0b07
onlyTeam:enemy
[decal_HpBar_BackGround]
layer:beforeUI
order:1
image:SHARED:white_pixel.png
color:#000000
onlyTeam:ally
alpha:1
imageScale:1.1
imageScaleX:30
imageScaleY:5
xOffsetAbsolute:0
yOffsetAbsolute:20
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.teamId!=1 and self.hp<self.maxHp
onlyWhileAlive:true
[decal_HpBar_BackGround_Enemy]
@copyFromSection:decal_HpBar_BackGround
onlyTeam:enemy



[decal_Ring_Self]
layer:beforeBody
order:0
onlyTeam:own
onlyWhileAlive:true
isVisible:true
alpha:0.5
imageScale:1.0
image:ROOT:Resource/Image/Ring/Ring16_Green.png
alwaysStartHeightAtZero:true

isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.parent.hp<=0
[decal_Ring_Ally]
@copyFromSection:decal_Ring_Self
onlyTeam:allynotown
image:ROOT:Resource/Image/Ring/Ring16_Yellow.png
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.parent.hp<=0
[decal_Ring_Enemy]
@copyFromSection:decal_Ring_Self
onlyTeam:Enemy
image:ROOT:Resource/Image/Ring/Ring16_Red.png
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.parent.hp<=0





[graphics]
image:SHARED:blank.png

showHealthBar:false
showEnergyBar:false
showShieldBar:false
showShotDelayBar:false
showQueueBar:false

[attack]
canAttack:true
canAttackFlyingUnits:true
canAttackLandUnits:true
canAttackUnderwaterUnits:true
canAttackNotTouchingWaterUnits:true
canOnlyAttackUnitsWithTags:CanBeTargetUnit,CanBeTargetUnitSpace,DamageAbleParts
canOnlyAttackUnitsWithoutTags:UnDetected

[movement]
movementType: BUILDING
moveSpeed:0
maxTurnSpeed:10
targetHeight:1
targetHeightDrift:0



[ai]
buildPriority: 0.1

noneInBaseExtraPriority: 0.05

noneGlobalExtraPriority: 0.1

ai_upgradePriority:0.05

maxEachBase:2
maxGlobal:24


[placementRule_NearSL]
searchTags: HQ_NotCaptured,StrategicLocation,SupplyPoint
minCount:1
checkEachTile:true

searchTeam:ally
cannotPlaceMessage:Need Near SL Or HQ Or SupplyPoint
cannotPlaceMessage_zh:需要靠近据点或基地或补给点
searchDistance:400
excludeIncompleteBuildings:true
excludeNonBuildings:false
