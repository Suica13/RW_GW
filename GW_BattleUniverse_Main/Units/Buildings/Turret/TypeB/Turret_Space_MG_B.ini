
[core]
copyFrom:"""
ROOT:Units/Buildings/Turret/Mod/Common_Turret.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/MG_Fire_1.gw
"""


name:Turret_Space_MG_B
displayText:MG Turret Type B[S]
displayText_zh:机枪炮塔 B型[宇]

@global Money=450
@global Resource=950
@global buildTime=40

maxHp: 32000

#isUnrepairableUnit:true

[hiddenAction_Building_GetDone]
temporarilyAddTags:BuildingTurret_T1

[ai]
maxEachBase:3
maxGlobal:12


[hiddenAction_InitializeStats]
setUnitMemory:"""
baseDetectRange=550,

finalShootLevel=110,
finalCqbLevel=100,
finalAccuracyLevel=120,

finalBeamDef=20,
finalShellDef=35,
finalCqbDef=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""



[decal_A]
layer:afterBody
order:1
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Space/Turret_Space_Common_1.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
basePositionFromTurret:Common_Turret_MG_Double
isVisible:true
imageScale:0.75
dirOffset:0
teamColors:true
[decal_B]
layer:afterBody
order:2
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Space/Turret_Space_MG_1.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
basePositionFromTurret:Common_Turret_MG_Double
isVisible:true
imageScale:0.75
xOffsetAbsolute: 0
yOffsetAbsolute: 0
dirOffset:0
teamColors:true



[turret_Common_Turret_MG_Double]
x: 0
y: 0

canShoot:true
canAttackCondition:if memory.buildDone==true
projectile:Common_Turret_MG_Double_Projectile

delay:0.15s
canAttackMaxAngle:5
barrelX:2
barrelOffsetX_onOddShots:-4
barrelY:5
limitingRange:800
turnSpeed:1

idleSweepSpeed:0.2
idleSweepDelay:600
idleSweepAddRandomDelay:120
idleSweepAngle:45
shouldResetTurret:false

aimOffsetSpread:0
recoilOffset: -0.5
recoilOutTime: 3
recoilReturnTime: 3

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\MachineGun_1.ogg
shoot_sound_vol:0.3
shoot_flame:MG_Fire_1



[projectile_Common_Turret_MG_Double_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0
turnSpeed:0

effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MG*1
(
    addResources=
    ShellDamage:1500
    |ShellAPDamage:500
    |DpDamage:60
    |WeaponAccuracy=100
    |PartBreakModifier=1.0
    |CockpitBreakModifier=1.0
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=1
    |AntiLand=1
    |AntiSpace=1.0
    |HeightChangeSpeed=2.0
    |HeightHitRange=20
    |ProjectileSpeed:85
    |ProjectileSpread:5
    |ProjectileLife:25
)
"""







[attachment_DamageChecker_1]
x:0
y:0
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:false
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:true
smoothlyBlendPositionWhenExistingUnitAdded:true

onCreateSpawnUnitOf:DamageChecker_Building
createIncompleteIfParentIs:false
onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false

[movement]
movementType:OVER_CLIFF_WATER