
[core]
copyFrom:"""
ROOT:Units/Buildings/Turret/Mod/Common_Turret.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""


name:Turret_MS_B
displayText:MS Turret Type B
displayText_zh:导弹炮塔 B型

maxHp: 35000

@global Money=450
@global Resource=1000
@global buildTime=50


@memory Common_Turret_MS_Double_OnCD:bool
@memory Common_Turret_MS_Double_CDTimer:float
@global Common_Turret_MS_Double_CD=5
@global Common_Turret_MS_Double_Shoot=4
[resource_Common_Turret_MS_Double_ShootTimer]
hidden:true



[hiddenAction_Building_GetDone]
temporarilyAddTags:BuildingTurret_T2

[ai]
maxEachBase:2
maxGlobal:8


[hiddenAction_InitializeStats]
setUnitMemory:"""
baseDetectRange=650,

finalShootLevel=110,
finalCqbLevel=100,
finalAccuracyLevel=135,

finalBeamDef=20,
finalShellDef=35,
finalCqbDef=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""



[decal_A]
layer:afterBody
order:1
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_MS_1_A.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
isVisible:true
imageScale:1.5
dirOffset:0
teamColors:true
[decal_B]
layer:afterBody
order:2
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_MS_1_B.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
basePositionFromTurret:Common_Turret_MS_Double
isVisible:true
imageScale:0.75
xOffsetAbsolute: 0
yOffsetAbsolute: 0
dirOffset:0
teamColors:true



[turret_Common_Turret_MS_Double]
x: 0
y: 3

canShoot:true
canAttackCondition:if memory.buildDone==true
projectile:Common_Turret_MS_Double_Projectile
resourceUsage:Common_Turret_MS_Double_ShootTimer=1

delay:0.2s
canAttackMaxAngle:35
barrelX:6
barrelOffsetX_onOddShots:-12
barrelY:-2
limitingRange:850
turnSpeed:1

idleSweepSpeed:0.2
idleSweepDelay:600
idleSweepAddRandomDelay:120
idleSweepAngle:45
shouldResetTurret:false

aimOffsetSpread:0
recoilOffset: -0.5
recoilOutTime: 3
recoilReturnTime: 3

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Missile_1.ogg
shoot_sound_vol:0.4
shoot_flame:BZ_Fire_1_S



[projectile_Common_Turret_MS_Double_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0
turnSpeed:0

effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_MS*1
(
    addResources=
    ShellDamage:7500
    |DpDamage:75
    |WeaponAccuracy=125
    |PartBreakModifier=1.0
    |CockpitBreakModifier=1.0
    |PilotDamageModifier=1
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=0.75
    |AntiAqua=0.75
    |AntiAir=1.5
    |AntiLand=1
    |AntiSpace=1.0
    |HeightHitRange=20
    |HeightChangeSpeed=2
    |ProjectileSpeed:65
    |ProjectileTurnspeed:3.5
    |ProjectileSpread:0
    |ProjectileExplosionRange:35
    |ProjectileLife:20
)
"""




[hiddenAction_Common_Turret_MS_Double_CDStart]
autoTrigger:"""
if memory.Common_Turret_MS_Double_OnCD==false 
and 
(
    (
        self.resource.Common_Turret_MS_Double_ShootTimer<=0 
    ) 
    or 
    (
        self.resource.Common_Turret_MS_Double_ShootTimer<${Common_Turret_MS_Double_Shoot} and not self.hasTags(includes='inBattle')
    )
)
"""
setUnitMemory:Common_Turret_MS_Double_OnCD=true,Common_Turret_MS_Double_CDTimer=self.timeAlive+${Common_Turret_MS_Double_CD}

[hiddenAction_Common_Turret_MS_Double_CDEnd]
autoTriggerOnEvent:created
autoTrigger:if memory.Common_Turret_MS_Double_OnCD==true and self.timeAlive>memory.Common_Turret_MS_Double_CDTimer
setUnitMemory:Common_Turret_MS_Double_OnCD=false
setResourcesWithLogic:Common_Turret_MS_Double_ShootTimer=${Common_Turret_MS_Double_Shoot}









[attachment_DamageChecker_1]
x:0
y:0
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:false
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:true
smoothlyBlendPositionWhenExistingUnitAdded:true

onCreateSpawnUnitOf:DamageChecker_Building
createIncompleteIfParentIs:false
onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false