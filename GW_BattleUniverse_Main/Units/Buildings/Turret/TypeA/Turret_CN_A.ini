
[core]
copyFrom:"""
ROOT:Units/Buildings/Turret/Mod/Common_Turret.ini,
ROOT:Resource/Image/Fx/Weapon/Shell/Common/BZ_Fire_1.gw
"""


name:Turret_CN_A
displayText:CN Turret Type A
displayText_zh:加农炮塔 A型

@global Money=450
@global Resource=1250
@global buildTime=50

maxHp: 20000

#isUnrepairableUnit:true
[hiddenAction_Building_GetDone]
temporarilyAddTags:BuildingTurret_T1

[ai]
maxEachBase:2
maxGlobal:8

[hiddenAction_InitializeStats]
setUnitMemory:"""
baseDetectRange=500,

finalShootLevel=100,
finalCqbLevel=100,
finalAccuracyLevel=100,

finalBeamDef=0,
finalShellDef=25,
finalCqbDef=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""


[decal_A]
layer:afterBody
order:1
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_CN_1_A.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
isVisible:true
imageScale:1.5
dirOffset:0
teamColors:true
[decal_B]
layer:afterBody
order:2
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_CN_1_B.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
basePositionFromTurret:Common_Turret_CN
isVisible:true
imageScale:0.75
xOffsetAbsolute: 0
yOffsetAbsolute: 0
dirOffset:0
teamColors:true
[decal_C]
layer:afterBody
order:3
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Turret/Image/Ground/Turret_CN_1_C.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
basePositionFromTurret:Common_Turret_CN
isVisible:true
imageScale:0.75
xOffsetAbsolute: 0
yOffsetAbsolute: 0
dirOffset:0
teamColors:true



[turret_Common_Turret_CN]
x: 0
y: 3

canShoot:true
canAttackCondition:if memory.buildDone==true
projectile:Common_Turret_CN_Projectile

delay:3s
canAttackMaxAngle:5
barrelX:0
barrelY:12
limitingRange:750
turnSpeed:1

idleSweepSpeed:0.2
idleSweepDelay:600
idleSweepAddRandomDelay:120
idleSweepAngle:45
shouldResetTurret:false

aimOffsetSpread:0
recoilOffset: -1
recoilOutTime: 10
recoilReturnTime: 5

shoot_sound:ROOT:\Resource\Sound\SE\Weapon\Fire\Bazooka_1.ogg
shoot_sound_vol:0.4
shoot_flame:BZ_Fire_1



[projectile_Common_Turret_CN_Projectile]

directDamage: 0
life: 0
explodeOnEndOfLife:true
speed: 0
turnSpeed:0

effectOnCreate:none
explodeEffect:none

spawnUnit:"""
Projectile_Bazooka_S_Target*1
(
    addResources=
    ShellDamage:10000
    |DpDamage:450
    |WeaponAccuracy=85
    |PartBreakModifier=1.25
    |CockpitBreakModifier=0.75
    |PilotDamageModifier=0.75
    |PilotTrueDamage=0
    |AntiSizeLargeDamage=1.25
    |AntiSizeSmallDamage=0.75
    |AntiSizeLargeAccuracy=1.25
    |AntiSizeSmallAccuracy=0.75
    |AntiBuilding=1
    |AntiAqua=0.75
    |AntiAir=0.75
    |AntiLand=1
    |AntiSpace=1
    |HeightChangeSpeed=2
    |HeightHitRange=25
    |ProjectileSpeed:70
    |ProjectileSpread:0
    |ProjectileExplosionRange:50
    |ProjectileLife:30
)
"""







[attachment_DamageChecker_1]
x:0
y:0
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:false
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:true
smoothlyBlendPositionWhenExistingUnitAdded:true

onCreateSpawnUnitOf:DamageChecker_Building
createIncompleteIfParentIs:false

onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false


[decal_HpBar_Self]
yOffsetAbsolute:25
[decal_HpBar_BackGround]
yOffsetAbsolute:25


[decal_Ring_Self]
imageScale:1.75