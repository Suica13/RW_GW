
[core]
copyFrom:"""
ROOT:Template/Building/Skill/SupplyPoint.gw,
ROOT:Template/Building/Skill/LaunchAllUnits.gw,
ROOT:Units/Buildings/SupplyDepot/Mod/SupplyDepot.ini
"""


tags:Building,CanBeTargetUnit,SupplyDepot,SupplyDepot_Common_T1
name:SupplyDepot_Common_T1
displayText:SupplyDepot[T1]
displayText_zh:补给站[T1]

displayDescription:Requires 2 Money to maintain\n+9 MpMax\nProvides supplies to nearby units and repairs idle units
displayDescription_zh:需要2资金以维持\n战力上限+9\n为周围单位提供补给并维修闲置单位

footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10

@global Money=250
@global Resource=500
@global buildTime=10
@global supplyPointRangeExtra=100
@global supplyPointHpExtra=2
@global supplyPointEnExtra=2
@global supplyPointShieldExtra=2
@global supplyPointSkillExtra=2

exit_x:0
exit_y:25
exit_moveAwayAmount:0

[hiddenAction_Building_GetDone]
temporarilyAddTags:SupplyDepot_T1



[hiddenAction_Supply_Active]
setUnitMemory:"""
supplyPointActive=memory.buildDone
"""

[ai]
upgradedFrom:SupplyDepot

[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/SupplyDepot/Image/SupplyDepot_1.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:8
[decal_Light]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/SupplyDepot/Image/SupplyDepot_1_Light.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
teamColors:true
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:8


[hiddenAction_Building_GetDone]
attachments_onlyOnSlots:Hangar_1
attachments_addNewUnits:Hangar_X8*1

[attachment_Hangar_1]
x:0
y:0
idleDir:180
height:1
resetRotationWhenNotAttacking:true
rotateWithParent:true
canAttack:false
prioritizeParentsMainTarget:false
onlyAttackParentsMainTarget:false

isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:true
isUnselectable:false
showAllActionsFrom:false
smoothlyBlendPositionWhenExistingUnitAdded:true
onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false