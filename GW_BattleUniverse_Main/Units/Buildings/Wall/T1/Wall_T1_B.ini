
[core]
copyFrom:ROOT:Units/Buildings/Wall/Mod/Common_Wall.ini

name:Wall_T1_B
displayText:Wall[T1] B
displayText_zh:墙壁[T1] B


footprint: 0,-1,1,1
constructionFootprint: 0,-1,1,1
buildingToFootprintOffsetX:20
buildingToFootprintOffsetY:10


@global Money=300
@global Resource=500
@global buildTime=35

maxHp: 30000

[ai]
upgradedFrom:Wall_T1_B




[hiddenAction_Building_GetDone]
autoTriggerOnEvent:newMessage(withTag="BuildDone")
convertTo:Wall_T1_B_Done

[hiddenAction_InitializeStats]
setUnitMemory:"""
finalShootLevel=100,
finalCqbLevel=100,
finalAccuracyLevel=100,

finalBeamDef=25,
finalShellDef=25,
finalCqbDef=0,

finalBeamDefPlus=250,
finalShellDefPlus=250,
finalCqbDefPlus=0,

extraBuildingDef=1,
extraBuildingAtk=1
"""



[decal_A]
layer:afterBody
order:2
onlyWhileAlive:true 
image:ROOT:Units/Buildings/Wall/Image/Wall_T1_B.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
isVisible:true
imageScale:1
xOffsetRelative: 0
yOffsetRelative: 0
dirOffset:0




[attachment_DamageChecker_0]
x:0
y:10
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:true
smoothlyBlendPositionWhenExistingUnitAdded:true
onCreateSpawnUnitOf:DamageChecker_Building
onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false
[attachment_DamageChecker_1]
@copyFromSection:attachment_DamageChecker_0
y:-10










[ai]
lowPriorityTargetForOtherUnits:true