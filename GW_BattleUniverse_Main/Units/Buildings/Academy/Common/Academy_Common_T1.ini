
[core]
copyFrom:"""
ROOT:Units/Buildings/Academy/Mod/Academy.ini,
ROOT:Template/Building/Skill/Upgrade.gw
"""


tags:Building,CanBeTargetUnit,Academy,Academy_Common_T1
name:Academy_Common_T1
displayText:Officer Academy[T1]
displayText_zh:士官学院[T1]
displayDescription:Requires 2 Money to maintain\nCan train pilots\nand choose skill orientations for pilots assigned to new units from nearby factories
displayDescription_zh:需要2资金以维持\n可以训练驾驶员\n并可为周围工厂新单位配属的驾驶员选择技能倾向

footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10


@global Money=2000
@global Resource=500
@global buildTime=20

[hiddenAction_Building_GetDone]
temporarilyAddTags:Academy_T1
setResourcesWithLogic:PilotLevel=1
attachments_addNewUnits:Hangar_X8_PilotSlot*1
attachments_onlyOnSlots:Hangar_1



[action_UpgardeToAcademy_T2]
@copyFromSection:template_Upgrade
@define UnitID=Academy_Common_T2
@define CustomRule=(true)
@define Money=1000
@define Resource=250
buildSpeed:15s
temporarilyAddTags:Academy_T2
temporarilyRemoveTags:Academy_T1

[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Academy/Image/Academy_Common_T1.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.65
xOffsetRelative:0
yOffsetRelative:0




[hiddenAction_Get_AutoProduce]
autoTriggerOnEvent:newMessage(withTag="AutoProduce")
