
[core]
copyFrom:"""
ROOT:Units/Buildings/Academy/Mod/Academy.ini
"""


tags:Building,CanBeTargetUnit,Academy,Academy_Common_T2
name:Academy_Common_T2
displayText:Officer Academy[T2]
displayText_zh:士官学院[T2]
displayDescription:Requires 4 Money to maintain\nCan train pilots\nand choose skill orientations for pilots assigned to new units from nearby factories
displayDescription_zh:需要4资金以维持\n可以训练驾驶员\n并可为周围工厂新单位配属的驾驶员选择技能倾向

footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10

maxHp: 80000

@global Money=3000
@global Resource=750
@global buildTime=25

[hiddenAction_Building_GetDone]
temporarilyAddTags:Academy_T2
setResourcesWithLogic:PilotLevel=2
attachments_addNewUnits:Hangar_X8_PilotSlot*1
attachments_onlyOnSlots:Hangar_1

[decal_Body_1]
layer:beforeBody
order:1
onlyWhileAlive:true
basePositionFromLegEnd:arm1
isVisible:true
image:ROOT:Units/Buildings/Academy/Image/Academy_Common_T2.png
alpha:select(memory.buildDone==false,select(self.isInMap(),(memory.buildTimer/${buildTime})+0.25,1),1)
imageScale:0.65
xOffsetRelative:0
yOffsetRelative:0




[hiddenAction_Get_AutoProduce]
