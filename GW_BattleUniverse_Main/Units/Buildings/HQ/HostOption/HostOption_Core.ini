[core]
copyFrom:"""
ROOT:Units/Buildings/HQ/HostOption/Mod/HostOption_Core.gw
"""


name:HostOption_Core
displayText:Core
displayText_zh:核心

isUnselectable:true

#============================Menu

[hiddenAction_Get_SetTileGround]
autoTriggerOnEvent:newMessage(withTag="SetTileGround")
sendMessageTo:memory.GM
sendMessageWithTags:Setting_TileMode
sendMessageWithData:tileMode=0
alsoTriggerAction:"""
DeleteMain,
AddMain_Menu_2
"""

[hiddenAction_Get_SetTileSpace]
autoTriggerOnEvent:newMessage(withTag="SetTileSpace")
sendMessageTo:memory.GM
sendMessageWithTags:Setting_TileMode
sendMessageWithData:tileMode=1
alsoTriggerAction:"""
DeleteMain,
AddMain_Menu_2
"""

[hiddenAction_Get_SetTileAuto]
autoTriggerOnEvent:newMessage(withTag="SetTileAuto")
alsoTriggerAction:"""
DeleteMain,
AddMain_Menu_2
"""

[hiddenAction_AddMain_Menu_2]
attachments_onlyOnSlots:Main
attachments_addNewUnits:HostOption_Main_Menu_2


#============================Menu2

[hiddenAction_Get_VS]
autoTriggerOnEvent:newMessage(withTag="VS")
alsoTriggerAction:"""
DeleteMain,
AddMain_VS
"""

[hiddenAction_Get_Stage]
autoTriggerOnEvent:newMessage(withTag="Stage")


[hiddenAction_AddMain_VS]
attachments_onlyOnSlots:Main
attachments_addNewUnits:HostOption_Main_VS
setUnitMemory:"""
nowStageUIPage=0,
gameMainMode=1,
gameSubMode=0,
stageIndex=0,
resStart=6000,
mpStart=60,
techStart=0,
resX=1,
mpX=1,
techX=1,
autoTech=0,
techShare=1,
techLimit=3,
allowACEUnit=1,
allowPMCUnit=1
"""

#============================VS

[hiddenAction_Get_VS_GE]
autoTriggerOnEvent:newMessage(withTag="VS_GE")
alsoTriggerAction:"""
DeleteMain,
AddMain_VS_GE_Ground,
AddMain_VS_GE_Space
"""
setUnitMemory:"""
gameSubMode=1
"""

[hiddenAction_Get_VS_CR]
autoTriggerOnEvent:newMessage(withTag="VS_CR")
setUnitMemory:"""
gameSubMode=2
"""

[hiddenAction_AddMain_VS_GE_Ground]
requireConditional:if customTarget1.resource().tileMode==0
setUnitMemory:"""
nowStageUIPageMax=3
"""
alsoTriggerAction:ShowVS_GE
[hiddenAction_AddMain_VS_GE_Space]
requireConditional:if customTarget1.resource().tileMode==1
setUnitMemory:"""
nowStageUIPageMax=3
"""
alsoTriggerAction:ShowVS_GE




[hiddenAction_GetNextPage]
autoTriggerOnEvent:newMessage(withTag="NextPage")
setUnitMemory:"""
nowStageUIPage=
select
(
    memory.nowStageUIPage+1>memory.nowStageUIPageMax,
    0,
    memory.nowStageUIPage+1
)
"""
alsoTriggerAction:ShowVS_GE

[hiddenAction_GetLastPage]
autoTriggerOnEvent:newMessage(withTag="LastPage")
setUnitMemory:"""
nowStageUIPage=
select
(
    memory.nowStageUIPage-1<0,
    memory.nowStageUIPageMax,
    memory.nowStageUIPage-1
)
"""
alsoTriggerAction:ShowVS_GE

[hiddenAction_ShowVS_GE]
alsoTriggerAction:"""
ShowVS_GE_Ground,
ShowVS_GE_Space
"""


#============================VS GE Ground Page

[hiddenAction_ShowVS_GE_Ground]
requireConditional:if customTarget1.resource().tileMode==0
alsoTriggerAction:"""
ShowVS_GE_Ground_Page0,
ShowVS_GE_Ground_Page1,
ShowVS_GE_Ground_Page2,
ShowVS_GE_Ground_Page3
"""
[hiddenAction_ShowVS_GE_Ground_Page0]
requireConditional:"""
if memory.nowStageUIPage==0
"""
attachments_addNewUnits:HostOption_Main_VS_GE_Ground_Page0
attachments_onlyOnSlots:Main
[hiddenAction_ShowVS_GE_Ground_Page1]
requireConditional:"""
if memory.nowStageUIPage==1
"""
attachments_addNewUnits:HostOption_Main_VS_GE_Ground_Page1
attachments_onlyOnSlots:Main
[hiddenAction_ShowVS_GE_Ground_Page2]
requireConditional:"""
if memory.nowStageUIPage==2
"""
attachments_addNewUnits:HostOption_Main_VS_GE_Ground_Page2
attachments_onlyOnSlots:Main

#============================VS GE Space Page

[hiddenAction_ShowVS_GE_Space]
requireConditional:if customTarget1.resource().tileMode==1
alsoTriggerAction:"""
ShowVS_GE_Space_Page0,
ShowVS_GE_Space_Page1,
ShowVS_GE_Space_Page2,
ShowVS_GE_Space_Page3
"""
[hiddenAction_ShowVS_GE_Space_Page0]
requireConditional:"""
if memory.nowStageUIPage==0
"""
attachments_addNewUnits:HostOption_Main_VS_GE_Space_Page0
attachments_onlyOnSlots:Main
[hiddenAction_ShowVS_GE_Space_Page1]
requireConditional:"""
if memory.nowStageUIPage==1
"""
attachments_addNewUnits:HostOption_Main_VS_GE_Space_Page1
attachments_onlyOnSlots:Main
[hiddenAction_ShowVS_GE_Space_Page2]
requireConditional:"""
if memory.nowStageUIPage==2
"""
attachments_addNewUnits:HostOption_Main_VS_GE_Space_Page2
attachments_onlyOnSlots:Main


#============================VS Stage

[hiddenAction_Get_VS_Stage]
autoTriggerOnEvent:newMessage(withTag="VS_Stage")
setUnitMemory:"""
stageIndex=eventData("Index",type="float")
"""
alsoTriggerAction:"""
DeleteMain,
Change_VS_Setting,
AddMain_VS_Setting
"""

[hiddenAction_Change_VS_Setting]
requireConditional:if eventData("Change_Setting",type="float")==1
setUnitMemory:"""
mpStart=eventData("mpStart",type="float"),
resStart=eventData("resStart",type="float"),
techStart=eventData("techStart",type="float")
"""

[hiddenAction_AddMain_VS_Setting]
attachments_onlyOnSlots:Main
attachments_addNewUnits:HostOption_Main_VS_Setting


#============================VS Setting

[hiddenAction_Get_VS_Confirm]
autoTriggerOnEvent:newMessage(withTag="Confirm")
alsoTriggerAction:"""
DeleteMain,
AddMain_VS_BulletSpeed
"""

[hiddenAction_AddMain_VS_BulletSpeed]
attachments_onlyOnSlots:Main
attachments_addNewUnits:HostOption_Main_VS_BulletSpeed


#============================BulletSpeed


[hiddenAction_Get_VS_StartGame]
autoTriggerOnEvent:newMessage(withTag="StartGame")
alsoTriggerAction:"""
DeleteMain,
StartGame,
DelSelf
"""

[hiddenAction_StartGame]
sendMessageTo:memory.GM
sendMessageWithTags:Setting_GameMode
sendMessageWithData:"""
gameMainMode=memory.gameMainMode,
gameSubMode=memory.gameSubMode,
stageIndex=memory.stageIndex,
resStart=memory.resStart,
mpStart=memory.mpStart,
techStart=memory.techStart,
resX=memory.resX,
mpX=memory.mpX,
techX=memory.techX,
autoTech=memory.autoTech,
techLimit=memory.techLimit,
techShare=memory.techShare,
allowPMCUnit=memory.allowPMCUnit,
allowACEUnit=memory.allowACEUnit
"""
[hiddenAction_DelSelf]
deleteSelf:true



[hiddenAction_ShowVS_GE_Ground_Page3]
requireConditional:if memory.nowStageUIPage==3
attachments_addNewUnits:HostOption_Main_VS_GE_Ground_Page3
attachments_onlyOnSlots:Main

[hiddenAction_ShowVS_GE_Space_Page3]
requireConditional:if memory.nowStageUIPage==3
attachments_addNewUnits:HostOption_Main_VS_GE_Space_Page3
attachments_onlyOnSlots:Main
