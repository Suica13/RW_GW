[core]
copyFrom:"""
ROOT:Template/UI/Common_UI.gw
"""


name:HostOption_VS_Setting_AutoTech
displayText:AutoTech
displayText_zh:自动科研

radius:30

@memory AutoTech:float

[hiddenAction_InitializeStats]
setUnitMemory:AutoTech=customTarget1.customTarget1.readUnitMemory('AutoTech',type='float')

[action_VS_Setting_AutoTech_ON]
pos:0
text:AutoTech:ON
text_zh:自动科研:ON
displayType:action
buildSpeed:0s
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_TurnON.png
playSoundToPlayer:ROOT:Resource/Sound/SE/System/Button/Select_1.ogg

refundAllQueuedItems:true

isVisible:if memory.AutoTech==0

setUnitMemory:"""
AutoTech=1
"""
alsoTriggerAction:VS_Setting_AutoTech_Send

[action_VS_Setting_AutoTech_OFF]
@copyFromSection:action_VS_Setting_AutoTech_ON
text:AutoTech:OFF
text_zh:自动科研:OFF
iconImage:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_TurnOFF.png
isVisible:if memory.AutoTech==1
setUnitMemory:"""
AutoTech=0
"""


[hiddenAction_VS_Setting_AutoTech_Send]
sendMessageTo:customTarget1.customTarget1
sendMessageWithTags:Change_AutoTech
sendMessageWithData:AutoTech=memory.AutoTech

[decal_Icon]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_AutoTech.png
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:0


[decal_Selected]
layer:beforeUI
onlyWhileAlive:true
onlyOnNonPreview:true
onlyWhenSelectedByAnyPlayer:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_Selected_1.png
order:2
dirOffset:0
isVisible:true
alpha:1
imageScale:0.3



[decal_Setting_ON]
layer:beforeUI
order:1
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_ON.png
imageScale:0.3
xOffsetRelative:0
yOffsetRelative:0
isVisible:if memory.AutoTech==1
[decal_Setting_OFF]
@copyFromSection:decal_Setting_ON
image:ROOT:Resource/Image/Text/Button/VS_Setting/Button_VS_Setting_OFF.png
isVisible:if memory.AutoTech==0