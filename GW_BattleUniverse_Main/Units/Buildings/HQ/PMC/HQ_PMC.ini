[core]
copyFrom:"""
ROOT:Units/Buildings/HQ/Mod/HQ_Faction.ini,
ROOT:Template/Building/Skill/PMC_Bonuses.gw
"""
name:HQ_PMC
dont_load:false
tags:Building,HQ,PilotTpPoint,PMC
displayText:PMC HQ
displayText_zh:PMC 指挥部
displayDescription:Borrow allied units for direct control. No construction or starting forces.
displayDescription_zh:可借用友军单位进行直接控制。暂不提供建筑建造与初始部队。
isBuilder:false
nanoBuildSpeed:0
canRepairBuildings:false

# No MainBuildList, supply/production list or starting-unit spawn is inherited.
[hiddenAction_Start_SpawnBuildingSlot_Step1]
attachments_addNewUnits:PMC_BuildingSlot

[action_PMC_Borrow]
pos:2
text:Control allied unit
text_zh:接管友军单位
description:Select an allied unit near the clicked position. It temporarily joins your team. Cancelling, switching units or pilot exit returns it to its original owner.
description_zh:点击地图上的友军机体，临时转入己方并启用直接控制。取消、切换机体或驾驶员脱出时归还原队伍。仅可选择已完成直接控制适配且未被接管的单位。
iconImage:ROOT:Resource/Image/Units/Button/Action/AI_2.png
buildSpeed:0s
highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:false
alwaysSinglePress:true
ai_isDisabled:true
isVisible:if self.hasTags(includes='HQ_NotCaptured')
requireConditional:if self.hasTags(includes='HQ_NotCaptured')
fireTurretXAtGround:MainTurret
fireTurretXAtGround_count:0
setUnitMemory:pmcBorrowCandidate=createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withTag='ManualControlCapable',withoutTag='ManualControlled',withinRange=40,relation='allyNotOwn')
alsoTriggerAction:PMC_SendBorrow

[hiddenAction_PMC_SendBorrow]
requireConditional:if memory.pmcBorrowCandidate.hp>0 and not memory.pmcBorrowCandidate.hasTags(includes='inHangar') and not memory.pmcBorrowCandidate.readUnitMemory('close',type='bool') and memory.pmcBorrowCandidate.parent.hp<=0
sendMessageTo:memory.pmcBorrowCandidate
sendMessageWithTags:PMC_Borrow
sendMessageWithData:controller=self

[ai]
useAsBuilder:false
