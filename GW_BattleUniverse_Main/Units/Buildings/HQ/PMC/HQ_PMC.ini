[core]
@memory pmcSwapCandidate:unit
@memory pmcSwapDeadline:float
copyFrom:"""
ROOT:Units/Buildings/HQ/Mod/HQ_Faction.ini,
ROOT:Template/Building/Skill/PMC_Bonuses.gw
"""
name:HQ_PMC
dont_load:false
tags:Building,HQ,HQ_NotCaptured,PilotTpPoint,PMC,PMC_HQ
displayText:PMC HQ
displayText_zh:PMC 指挥部
displayDescription:Borrow allied units for direct control. No construction or starting forces.
displayDescription_zh:可借用友军单位进行直接控制。暂不提供建筑建造与初始部队。
isBuilder:false
nanoBuildSpeed:0
canRepairBuildings:false

# No MainBuildList, supply/production list or starting-unit spawn is inherited.
[hiddenAction_Start_SpawnBuildingSlot_Step1]
attachments_addNewUnits:PMC_BuildingSlot

[action_PMC_Borrow]
pos:2
text:Control allied unit
text_zh:接管友军单位
description:Select an allied unit near the clicked position. It temporarily joins your team. Cancelling or switching units returns it to its original owner. Pilot swaps transfer control to the destination; pilot exit is disabled.
description_zh:点击地图上的友军机体，临时转入己方并启用直接控制。取消或切换机体时归还原队伍；交换驾驶员后接管目标机体，禁止驾驶员脱出。仅可选择已完成直接控制适配且未被接管的单位。
iconImage:ROOT:Resource/Image/Units/Button/Action/AI_2.png
buildSpeed:0s
highPriorityQueue:true
allowMultipleInQueue:false
canPlayerCancel:false
alwaysSinglePress:true
ai_isDisabled:true
isVisible:if self.hasTags(includes='HQ_NotCaptured')
requireConditional:if self.hasTags(includes='HQ_NotCaptured')
fireTurretXAtGround:MainTurret
fireTurretXAtGround_count:0
setUnitMemory:pmcBorrowCandidate=createMarker(x=thisActionTarget.x,y=thisActionTarget.y,teamId=self.teamId).nearestUnit(withTag='ManualControlCapable',withoutTag='ManualControlled',withinRange=40,relation='allyNotOwn')
alsoTriggerAction:PMC_SendBorrow

[hiddenAction_PMC_SendBorrow]
requireConditional:if memory.pmcBorrowCandidate.hp>0 and not memory.pmcBorrowCandidate.hasTags(includes='inHangar') and not memory.pmcBorrowCandidate.readUnitMemory('close',type='bool') and memory.pmcBorrowCandidate.parent.hp<=0
sendMessageTo:memory.pmcBorrowCandidate
sendMessageWithTags:PMC_Borrow
sendMessageWithData:controller=self

[ai]
useAsBuilder:false

# PMC is a controller HQ, never a capturable strategic objective.
[hiddenAction_CheckCapture]
autoTrigger:true
requireConditional:true
alsoTriggerAction:PMC_OperationalHQ,CheckCaptureBar_Lose

[decal_CaptureRange]
isVisible:false

[decal_CaptureRange_Ally]
isVisible:false

[decal_CaptureRange_Enemy]
isVisible:false

[decal_CaptureTimerBar]
isVisible:false

[decal_CaptureTimerBarBackground]
isVisible:false

# Only an authorized completed pilot swap can hand the controller to its destination.
[hiddenAction_PMC_SwapControl]
alsoQueueAction:PMC_SwapBorrowWait
autoTriggerOnEvent:newMessage(withTag='PMC_SwapControl')
requireConditional:if self.hasTags(includes='HQ_NotCaptured') and (memory.manualControlledUnit.hp<=0 or memory.manualControlledUnit==eventSource) and eventSource.readUnitMemory('pmcSwapHQ',type='unit')==self and eventSource.readUnitMemory('pmcSwapTarget',type='unit')==eventData('unitInfo',type='unit') and eventSource.readUnitMemory('pmcSwapOutgoing',type='unit').parent==eventData('unitInfo',type='unit') and eventSource.readUnitMemory('pmcSwapIncoming',type='unit').parent==eventSource
setUnitMemory:pmcSwapCandidate=eventData('unitInfo',type='unit'),pmcSwapDeadline=self.timeAlive+6
alsoTriggerAction:NONE

# Let the existing pilot/core status update settle before requesting the new lease.
# This retry exists only during a swap, not as a per-unit automatic poll.
[hiddenAction_PMC_SwapBorrowWait]
allowMultipleInQueue:true
buildSpeed:0.2s
highPriorityQueue:false
alsoTriggerAction:PMC_SwapBorrowTry,PMC_SwapBorrowContinue

[hiddenAction_PMC_SwapBorrowTry]
requireConditional:if memory.pmcSwapCandidate.hp>0 and memory.manualControlledUnit.hp<=0 and not memory.pmcSwapCandidate.readUnitMemory('close',type='bool') and memory.pmcSwapCandidate.readUnitMemory('pilotUnit',type='unit').parent==memory.pmcSwapCandidate
setUnitMemory:pmcBorrowCandidate=memory.pmcSwapCandidate
alsoTriggerAction:PMC_SendBorrow

[hiddenAction_PMC_SwapBorrowContinue]
requireConditional:if self.timeAlive<memory.pmcSwapDeadline and memory.pmcSwapCandidate.hp>0 and (memory.manualControlledUnit.hp<=0 or (memory.manualControlledUnit==memory.pmcSwapCandidate and not memory.pmcSwapCandidate.readUnitMemory('manualControlEnabled',type='bool')))
alsoQueueAction:PMC_SwapBorrowWait

# Preserve lease authorization and migrate old saved PMC HQs without enabling occupation.
[hiddenAction_PMC_OperationalHQ]
requireConditional:if memory.captured or not self.hasTags(includes='HQ_NotCaptured') or not self.hasTags(includes='PMC_HQ')
setUnitMemory:captured=false,captureTimer=${captureTimerMax}
temporarilyAddTags:HQ_NotCaptured,PMC_HQ

[hiddenAction_CheckCaptureBar_Lose]
requireConditional:if self.timeAlive>5 and (self.numberOfUnitsInTeam(withTag="HQ_NotCaptured")+self.numberOfUnitsInAllyNotOwnTeam(withTag="HQ_NotCaptured")-self.numberOfUnitsInTeam(withTag="PMC_HQ")-self.numberOfUnitsInAllyNotOwnTeam(withTag="PMC_HQ"))<=0
