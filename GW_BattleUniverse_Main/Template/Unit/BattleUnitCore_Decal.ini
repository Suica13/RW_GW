if parent.readUnitMemory(name="hideUI", type="float")==0 
and parent.hp>0 
and 
(
    ${pilotLevelCount}>=2 
    and 
    ${pilotLevelCount}<3
)
"""
[decal_Level_3]
@copyFromSection:decal_Level_1
image:ROOT:Resource/Image/Units/Hud/Hud_Level_3.png
isVisible:"""
if parent.readUnitMemory(name="hideUI", type="float")==0 
and parent.hp>0 
and 
(
    ${pilotLevelCount}>=3 
)
"""
[decal_NT_1]
onlyTeam:ally
layer:beforeUI
order:0
onlyWhileAlive:true
alpha:1
imageScale:0.25
image:ROOT:Resource/Image/Units/Hud/Hud_NT_1.png
isVisible:"""
if parent.readUnitMemory(name="hideUI", type="float")==0 
and parent.hp>0 
and 
(
    memory.pilotAwakeningSkill>=100
)
"""
xOffsetAbsolute:-10
yOffsetAbsolute:19
alwaysStartDirAtZero:true
onlyOnNonPreview:true


[decal_Repair]
