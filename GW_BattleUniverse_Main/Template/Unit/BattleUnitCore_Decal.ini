
[core]

dont_load:true





[decal_HpBar_Self]
layer:beforeUI
order:2
image:SHARED:white_pixel.png
color:#54ffaf
onlyTeam:own
alpha:1
imageScale:1
imageScaleX:30*((parent.hp/parent.maxHp))
imageScaleY:3
xOffsetAbsolute:(15*((parent.hp/parent.maxHp)))-15
yOffsetAbsolute:25
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if parent.readUnitMemory(name="hideUI", type="float")==0 and parent.hp>0 
onlyWhileAlive:true
[decal_HpBar_Ally]
@copyFromSection:decal_HpBar_Self
color:#ffeb54
onlyTeam:allynotown
[decal_HpBar_Enemy]
@copyFromSection:decal_HpBar_Self
color:#ff0b07
onlyTeam:enemy
alpha:select(parent.readUnitMemory("onOpticalCamouflage",type="bool"),0,1)
isVisible:if parent.readUnitMemory(name="hideUI", type="float")==0 and parent.hp>0 and not parent.tags(includes='UnDetected')
[decal_HpBar_BackGround]
layer:beforeUI
order:1
image:SHARED:white_pixel.png
color:#000000
onlyTeam:ally
alpha:1
imageScale:1.1
imageScaleX:30
imageScaleY:5
xOffsetAbsolute:0
yOffsetAbsolute:25
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if parent.readUnitMemory(name="hideUI", type="float")==0 and self.teamId!=-1
onlyWhileAlive:true
[decal_HpBar_BackGround_Enemy]
@copyFromSection:decal_HpBar_BackGround
color:#000000
onlyTeam:enemy
alpha:select(parent.readUnitMemory("onOpticalCamouflage",type="bool"),0,1)
isVisible:if parent.readUnitMemory(name="hideUI", type="float")==0 and self.teamId!=-1 and not parent.tags(includes='UnDetected')



[decal_EnBar_Self]
layer:beforeUI
order:2
image:SHARED:white_pixel.png
color:#faf06b
onlyTeam:ally
alpha:1
imageScale:1
imageScaleX:30*(select(memory.en/memory.enMax>1,1,memory.en/memory.enMax))
imageScaleY:1.5
xOffsetAbsolute:(15*select(memory.en/memory.enMax>1,1,memory.en/memory.enMax))-15
yOffsetAbsolute:28.5
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if parent.readUnitMemory(name="hideUI", type="float")==0 and memory.en>0 and memory.en>memory.enMax*0.25
onlyWhileAlive:true
[decal_EnBar_Self_Low]
@copyFromSection:decal_EnBar_Self
color:#ff00aa
isVisible:if parent.readUnitMemory(name="hideUI", type="float")==0 and memory.en>0 and memory.en<=memory.enMax*0.25
[decal_EnBar_BackGround]
layer:beforeUI
order:1
image:SHARED:white_pixel.png
onlyTeam:ally
color:#000000
alpha:1
imageScale:1.1
imageScaleX:30
imageScaleY:2.5
xOffsetAbsolute:0
yOffsetAbsolute:29
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if parent.readUnitMemory(name="hideUI", type="float")==0 and self.teamId!=-1
onlyWhileAlive:true









[decal_Level_1]
onlyTeam:ally
layer:beforeUI
order:0
onlyWhileAlive:true
alpha:1
imageScale:0.25
xOffsetAbsolute:14
yOffsetAbsolute:19
image:ROOT:Resource/Image/Units/Hud/Hud_Level_1.png
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:"""
if parent.readUnitMemory(name="hideUI", type="float")==0 
and parent.hp>0 
and 
(
    ${pilotLevelCount}>=1 
    and 
    ${pilotLevelCount}<2
)
"""
[decal_Level_2]
@copyFromSection:decal_Level_1
image:ROOT:Resource/Image/Units/Hud/Hud_Level_2.png
