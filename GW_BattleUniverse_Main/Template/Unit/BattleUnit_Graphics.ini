[decal_Boost]
@define skillRules=(true)
layer:beforeBody
order:4.1
isVisible:"""
if self.speed>0.1 
and parent.hp<=0 
and memory.moveMode==1 
and distanceBetween(self.getOffsetRelative(x=0,y=0.1),activeWaypointTarget)<=distanceBetween(self,activeWaypointTarget) 
"""
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:\Resource\Image\Fx\Unit\Image\Boost_1.png
total_frames:3
frame:memory.boostFrame
basePositionFromLegEnd:arm2
xOffsetRelative: -2.5
yOffsetRelative:-7
dirOffset:0
imageScale:2
imageScaleY:1.5
alpha:0.75
[decal_BoostReversing]
layer:beforeBody
order:4
isVisible:"""
if self.speed>0.1 
and 
(
    parent.hp<=0 
    or 
    (parent.hp<=0 and self.height>10)
)
and 
(
    (
        memory.moveMode==1 
        and distanceBetween(self.getOffsetRelative(x=0,y=0.1),activeWaypointTarget)>distanceBetween(self,activeWaypointTarget) 
    ) 
    or 
    (self.resource().TileMode==1 and memory.moveMode==0)
)
"""
onlyWhileAlive:true
onlyOnNonPreview:true
image:ROOT:\Resource\Image\Fx\Unit\Image\BoostReversing_1.png
total_frames:3
frame:memory.boostFrame
basePositionFromLegEnd:arm2
xOffsetRelative: -2.5
yOffsetRelative:-12
dirOffset:0
imageScale:2
imageScaleY:1.5
alpha:0.75
[decal_Burned]
layer:beforeUI
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Unit/Image/Burned_1.png
alpha:0.85
total_frames:5
frame:memory.burnedFrame
imageScale:1.5
onlyOnNonPreview:true
isVisible:if memory.battleUnitCore.readUnitMemory(name="burnedTimer", type="float")>memory.battleUnitCore.timeAlive
onlyWhileAlive:true
[decal_Stun]
layer:beforeUI
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Unit/Image/Stun_1.png
alpha:0.85
total_frames:5
frame:memory.stunFrame
imageScale:0.85
onlyOnNonPreview:true
isVisible:if memory.battleUnitCore.readUnitMemory(name="stunTimer", type="float")>memory.battleUnitCore.timeAlive or memory.battleUnitCore.readUnitMemory(name="takingCombo", type="bool")==true
onlyWhileAlive:true
[decal_LowHp]
layer:beforeUI
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Unit/Image/LowHp_1.png
alpha:0.75
total_frames:8
frame:memory.lowHpFrame
imageScale:1.0
onlyOnNonPreview:true
isVisible:if self.hp<self.maxHp*0.25
onlyWhileAlive:true

[decal_Marker]
layer:shadow
onlyTeam:enemy
order:1
image:ROOT:Resource/Image/Units/Hud/Marker/Marker.png
alpha:0.5
imageScale:0.5
xOffsetAbsolute:0
yOffsetAbsolute:0
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.timeAlive>0.1 and not self.tags(includes='UnDetected')
onlyWhileAlive:true



