
[core]
dont_load:true


@memory AICheckCD:float

@memory attackEnemyBaseTimer:float


@memory allSL:unit[]
@memory enemySL:unit[]
@memory nearsetEnemySL:unit
@memory aiCheckEnemySLTimer:float

@memory enemyHQ:unit[]
@memory nearsetEnemyHQ:unit

@memory ownHLV:unit[]
@memory nearsetHLVHanger:unit

@memory thisTimeWayPoint:unit

[hiddenAction_BattleUnit_AI]
autoTrigger:true
requireConditional:"""
if memory.allowAssigned==true and self.timeAlive>1
"""
alsoTriggerAction:"""
AI_CheckEnemyBase,
AI_AttackEnemyBase
"""

[hiddenAction_AI_CheckEnemyBase]
requireConditional:"""
if self.timeAlive>memory.aiCheckEnemySLTimer 
"""
setUnitMemory:"""
aiCheckEnemySLTimer=self.timeAlive+7
"""
alsoTriggerAction:"""
AI_CheckHLVHangar,
AI_CheckNearsetHLVHangar,
AI_CheckEnemySL,
AI_CheckNearsetEnemyHQ,
AI_HLV_Loadinto_Cancel
"""

#检查HLV
[hiddenAction_AI_CheckHLVHangar]
requireConditional:"""
if self.resource().AutoTileMode==1 
and parent.readUnitMemory("groundAdaptability",type="float")>=75 
and parent.readUnitMemory("spaceAdaptability",type="float")>=75 
"""
setUnitMemory:"""
ownHLV=null
"""
takeResources_includeUnitsWithinRange:10000
takeResources_includeUnitsWithinRange_team:own
takeResources_excludeUnitsWithoutTags:HLV_Hangar
takeResources_searchOnly:true
takeResources_maxUnits:100
takeResources_triggerActionForEach:AI_CheckHLVHangar_Step2
[hiddenAction_AI_CheckHLVHangar_Step2]
setUnitMemory:"""
ownHLV[memory.ownHLV.size]=thisActionTarget
"""


[hiddenAction_AI_CheckNearsetHLVHangar]
requireConditional:"""
if self.resource().AutoTileMode==1
"""
setUnitMemory:"""
nearsetHLVHanger=null
"""
shrinkArrays:ownHLV
alsoTriggerAction:AI_CheckNearsetHLVHangar_Step2
alsoTriggerActionRepeat:memory.ownHLV.size
[hiddenAction_AI_CheckNearsetHLVHangar_Step2]
requireConditional:"""
if (index==0 and self.isControlledByAI()) 
or 
(
    distanceBetween(self, memory.ownHLV[index])<distanceBetween(self, memory.nearsetHLVHanger) 
    and 
    memory.ownHLV[index].hp>0 
)
"""
setUnitMemory:"""
nearsetHLVHanger=select
(
    self.resource().TileMode==0,
    select(memory.ownHLV[index].resource().TileMode==0,memory.ownHLV[index],null),
    select(memory.ownHLV[index].resource().TileMode==1,memory.ownHLV[index],null)
)
"""


#据点
[hiddenAction_AI_CheckAllSL]
autoTriggerOnEvent:created
takeResources_includeUnitsWithinRange:30000
takeResources_includeUnitsWithinRange_team:any
takeResources_excludeUnitsWithoutTags:StrategicLocation
takeResources_searchOnly:true
takeResources_maxUnits:100
takeResources_triggerActionForEach:AI_CheckAllSL_Step2
[hiddenAction_AI_CheckAllSL_Step2]
setUnitMemory:"""
allSL[memory.allSL.size]=thisActionTarget
"""

[hiddenAction_AI_CheckEnemySL]
setUnitMemory:"""
enemySL=null,
nearsetEnemySL=null
"""
alsoTriggerAction:AI_CheckEnemySL_Step2
alsoTriggerActionRepeat:memory.allSL.size
[hiddenAction_AI_CheckEnemySL_Step2]
requireConditional:"""
if memory.allSL[index].teamName!=self.teamName 
and 
select
(
    self.resource().TileMode==0,
    select(memory.allSL[index].resource().TileMode==0,true,false),
    select(memory.allSL[index].resource().TileMode==1,true,false)
)
"""
setUnitMemory:"""
enemySL[memory.enemySL.size]=memory.allSL[index]
"""
alsoTriggerAction:"""
index>=memory.allSL.size
"""
alsoTriggerAction:AI_CheckEnemySL_Step3
alsoTriggerActionRepeat:memory.enemySL.size
[hiddenAction_AI_CheckEnemySL_Step3]
requireConditional:"""
if index==0 or 
(
    distanceBetween(self, memory.enemySL[index])<distanceBetween(self, memory.nearsetEnemySL)
)
"""
setUnitMemory:"""
nearsetEnemySL=memory.enemySL[index]
"""

#HQ
[hiddenAction_AI_CheckEnemyHQ]
autoTriggerOnEvent:created
takeResources_includeUnitsWithinRange:30000
takeResources_includeUnitsWithinRange_team:enemy
takeResources_excludeUnitsWithoutTags:HQ
takeResources_searchOnly:true
takeResources_maxUnits:100
takeResources_triggerActionForEach:AI_CheckEnemyHQ_Step2
[hiddenAction_AI_CheckEnemyHQ_Step2]
setUnitMemory:"""
enemyHQ[memory.enemyHQ.size]=thisActionTarget
"""


[hiddenAction_AI_CheckNearsetEnemyHQ]
setUnitMemory:"""
nearsetEnemyHQ=null
"""
shrinkArrays:enemyHQ
alsoTriggerAction:AI_CheckNearsetEnemyHQ_Step2
alsoTriggerActionRepeat:memory.enemyHQ.size
[hiddenAction_AI_CheckNearsetEnemyHQ_Step2]
requireConditional:"""
if 
(
    distanceBetween(self, memory.enemyHQ[index])<distanceBetween(self, memory.nearsetEnemyHQ) 
    or 
    memory.nearsetEnemyHQ.hp<=0
) 
"""
setUnitMemory:"""
nearsetEnemyHQ=select
(
    self.resource().TileMode==0,
    select(memory.enemyHQ[index].resource().TileMode==0 and memory.enemyHQ[index].tags(includes='HQ_NotCaptured'),memory.enemyHQ[index],null),
    select(memory.enemyHQ[index].resource().TileMode==1 and memory.enemyHQ[index].tags(includes='HQ_NotCaptured'),memory.enemyHQ[index],null)
)
"""

[hiddenAction_AI_AttackEnemyBase]
requireConditional:"""
if 
(
    parent.attacking.hp<=0 
    and parent.timeAlive>1 
    and parent.resource.GameStart==1 
    and not parent.hasActiveWaypoint(type="loadInto") 
    and not parent.hasActiveWaypoint(type="attack") 
    and not parent.hasActiveWaypoint(type="attackMove") 
    and not parent.hasActiveWaypoint(type="touchTarget") 
    and self.timeAlive>memory.attackEnemyBaseTimer
)
"""
setUnitMemory:"""
attackEnemyBaseTimer=self.timeAlive+5
"""
alsoTriggerAction:"""
AI_AttackEnemyBase_Attack,
AI_AttackEnemyBase_LoadInto
"""

[hiddenAction_AI_AttackEnemyBase_Attack]
requireConditional:"""
if 
(
    distanceBetween(self, memory.nearsetEnemySL)< distanceBetween(self, memory.nearsetHLVHanger) 
    and 
    distanceBetween(self, memory.nearsetEnemyHQ)< distanceBetween(self, memory.nearsetHLVHanger)
)
and 
(
    memory.enemySL.size>0 
    and memory.nearsetEnemyHQ!=null
)
or 
(
    memory.nearsetHLVHanger.hp<=0 or memory.nearsetHLVHanger.parent.readUnitMemory("battleUnitCore",type="unit").readUnitMemory("onSkill",type="bool")==true 
)
or 
(
    self.resource().AutoTileMode==0
)
"""
alsoTriggerAction:"""
AI_AttackEnemyBase_SL,
AI_AttackEnemyBase_HQ,
"""
[hiddenAction_AI_AttackEnemyBase_LoadInto]
requireConditional:"""
if 
(
    distanceBetween(self, memory.nearsetEnemySL)>= distanceBetween(self, memory.nearsetHLVHanger) 
    or 
    distanceBetween(self, memory.nearsetEnemyHQ)>= distanceBetween(self, memory.nearsetHLVHanger) 
    or 
    (
        memory.enemySL.size<=0 
        and memory.nearsetEnemyHQ==null
    )
)
and 
(
    memory.nearsetHLVHanger.hp>0 
) 
and 
(
    memory.nearsetHLVHanger.parent.readUnitMemory("battleUnitCore",type="unit").readUnitMemory("onSkill",type="bool")==false
) 
and 
(
    self.resource().AutoTileMode==1
) 
"""
alsoTriggerAction:"""
AI_AttackEnemyBase_HLV
"""


[hiddenAction_AI_AttackEnemyBase_SL]
requireConditional:"""
if parent.activeWaypointTarget.getOffsetRelative().numberOfUnitsInEnemyTeam(withTag="StrategicLocation",withinrange=150)<=0 
and 
(
    (
        memory.enemySL.size>0 
        and memory.nearsetEnemySL.resource().TileMode==self.resource().TileMode 
    )
    and not 
    (
        memory.nearsetEnemyHQ!=null 
        and memory.nearsetEnemyHQ.resource().TileMode==self.resource().TileMode 
        and distanceBetween(self, memory.nearsetEnemyHQ)< distanceBetween(self, memory.nearsetEnemySL)
    )
)
"""
sendMessageTo:parent
sendMessageWithTags:WayPoint_Unit
sendMessageWithData:"""
WayPoint_Unit=memory.nearsetEnemySL,
WayPointType=4,
ClearAllWayPoint=1
"""
[hiddenAction_AI_AttackEnemyBase_HQ]
requireConditional:"""
if parent.activeWaypointTarget.getOffsetRelative().numberOfUnitsInEnemyTeam(withTag="HQ",withinrange=150)<=0 
and 
(
    (
        memory.enemySL.size<=0 
        and memory.nearsetEnemyHQ!=null 
        and memory.nearsetEnemyHQ.resource().TileMode==self.resource().TileMode 
    )
    or  
    (   
        memory.enemySL.size>0 
        and memory.nearsetEnemySL.resource().TileMode==self.resource().TileMode 
        and distanceBetween(self, memory.nearsetEnemyHQ)< distanceBetween(self, memory.nearsetEnemySL)
    )
)
"""
sendMessageTo:parent
sendMessageWithTags:WayPoint_Unit
sendMessageWithData:"""
WayPoint_Unit=memory.nearsetEnemyHQ,
WayPointType=4,
ClearAllWayPoint=1
"""

[hiddenAction_AI_AttackEnemyBase_HLV]
requireConditional:"""
if memory.nearsetHLVHanger.hp>0 
and memory.nearsetHLVHanger.resource().TileMode==self.resource().TileMode
"""
sendMessageTo:parent
sendMessageWithTags:WayPoint_Unit
sendMessageWithData:"""
WayPoint_Unit=memory.nearsetHLVHanger,
WayPointType=5,
ClearAllWayPoint=1
"""

[hiddenAction_AI_HLV_Loadinto_Cancel]
requireConditional:"""
if parent.hasActiveWaypoint(type="loadInto") 
and parent.activeWaypointTarget.getOffsetRelative().nearestUnit(withTag="HLV",withinrange=50,relation="own").readUnitMemory("battleUnitCore",type="unit").readUnitMemory("onSkill",type="bool")==true
"""
sendMessageTo:parent
sendMessageWithTags:WayPoint_Unit
sendMessageWithData:"""
WayPoint_Unit=parent,
WayPointType=4,
ClearAllWayPoint=1
"""


[decal_nearsetEnemySL_DrawLineToTarget]
layer:shadow
onlyTeam:own
order:1
alpha:0.5
drawLineTo:memory.nearsetEnemyHQ
color:#26ffe6
imageScale:0.25
lineWidth:2
xOffsetRelative: 0
yOffsetRelative: 0
onlyOnNonPreview:true
isVisible:if false
onlyWhileAlive:true