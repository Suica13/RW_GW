
[core]
copyFrom:"""
ROOT:Template/Unit/BattleUnitCore.ini,
ROOT:Template/Unit/BattleUnitCore_Decal_Pilot.ini,
ROOT:Template/Unit/BattleUnitCore_AI.ini
"""

dont_load:false

tags:BattleUnitCore

name:BattleUnitCore_Pilot
displayText: BattleUnitCore_Pilot
displayText_zh: 战斗单位核心_Pilot

autoTriggerCooldownTime:0.5s

@memory onTeleportToSL:bool
@memory onTeleportToSLTimer:float
@memory onTeleportToSLTarget:unit

@global pilotShootSkill=parent.readUnitMemory(name="pilotShootSkillFinal",type="float")
@global pilotCqbSkill=parent.readUnitMemory(name="pilotCqbSkillFinal",type="float")
@global pilotDefSkill=parent.readUnitMemory(name="pilotDefSkillFinal",type="float")
@global pilotSpeedSkill=parent.readUnitMemory(name="pilotSpeedSkillFinal",type="float")
@global pilotAccuracySkill=parent.readUnitMemory(name="pilotAccuracySkillFinal",type="float")
@global pilotReactionSkill=parent.readUnitMemory(name="pilotReactionSkillFinal",type="float")
@global pilotLeadershipSkill=parent.readUnitMemory(name="pilotLeadershipSkillFinal",type="float")
@global pilotAwakeningSkill=parent.readUnitMemory(name="pilotAwakeningSkillFinal",type="float")

@global pilotComprehensionSkill=parent.readUnitMemory(name="pilotComprehensionSkill",type="float")
@global pilotLevelUpExpNeed=parent.readUnitMemory(name="pilotLevelUpExpNeed",type="float")
@global pilotExpCount=parent.readUnitMemory(name="pilotExpCount",type="float")
@global pilotLevelCount=parent.readUnitMemory(name="pilotLevelCount",type="float")

[hiddenAction_Check_Pilot]
requireConditional:false



[hiddenAction_Get_PilotCustomChange]
autoTriggerOnEvent:newMessage(withTag="PilotCustomChange")
sendMessageTo:parent
sendMessageWithTags:PilotCustomChange

[hiddenAction_Get_PilotCustomChangeSkills]
autoTriggerOnEvent:newMessage(withTag="PilotCustomChangeSkills")
sendMessageTo:customTarget1
sendMessageWithTags:PilotCustomChangeSkills


[hiddenAction_Check_Pilot_GetSkills]
requireConditional:true
autoTrigger:true
setUnitMemory:"""
pilotUnit=parent,

pilotShootSkill=memory.pilotUnit.readUnitMemory(name="pilotShootSkill",type="float"),
pilotCqbSkill=memory.pilotUnit.readUnitMemory(name="pilotCqbSkill",type="float"),
pilotDefSkill=memory.pilotUnit.readUnitMemory(name="pilotDefSkill",type="float"),
pilotSpeedSkill=memory.pilotUnit.readUnitMemory(name="pilotSpeedSkill",type="float"),
pilotAccuracySkill=memory.pilotUnit.readUnitMemory(name="pilotAccuracySkill",type="float"),
pilotReactionSkill=memory.pilotUnit.readUnitMemory(name="pilotReactionSkill",type="float"),
pilotLeadershipSkill=memory.pilotUnit.readUnitMemory(name="pilotLeadershipSkill",type="float"),
pilotAwakeningSkill=memory.pilotUnit.readUnitMemory(name="pilotAwakeningSkill",type="float")
"""



