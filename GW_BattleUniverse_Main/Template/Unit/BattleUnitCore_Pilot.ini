isVisible:"""
if parent.parent.hp<=0
"""



[hiddenAction_Check_Dead_Start]
setUnitMemory:inDie=true,inDieTimer=self.timeAlive+0.1
alsoTriggerAction:Send_PilotDeadInUnit
[hiddenAction_Send_PilotDeadInUnit]
requireConditional:if parent.parent!=null
sendMessageTo:parent.parent.readUnitMemory(name="BattleUnitCore",type="unit")
sendMessageWithTags:Dead_SendToHQ




[hiddenAction_CheckCantAction]
setUnitMemory:"""
cantAction=
select
(
    (
        parent.queueSize(withActionTag='Upgrade')>0 
        or memory.inDie==true 
        or memory.onDaze==true 
        or memory.onTeleportToSL==true
    ),
    true,
    false
)
"""



[hiddenAction_Get_TeleportToSL_On]
autoTriggerOnEvent:newMessage(withTag="TeleportToSL_On")
setUnitMemory:"""
onDaze=true,
onTeleportToSL=true,
onTeleportToSLTimer=select
(
    parent.numberOfUnitsInTeam(withTag='PilotTpPoint',withinrange=150)>0 
    or parent.numberOfUnitsInAllyNotOwnTeam(withTag='PilotTpPoint',withinrange=150)>0,
    self.timeAlive+1,
    self.timeAlive+10
),
onTeleportToSLTarget=eventData(name='TeleportToSLTarget',type="unit")
"""

[hiddenAction_Get_TeleportToSL_Off]
autoTriggerOnEvent:newMessage(withTag="TeleportToSL_Off")
autoTrigger:"""
if memory.onTeleportToSL==true 
and  
(
    createMarker(x=memory.onTeleportToSLTarget.x,y=memory.onTeleportToSLTarget.y,teamId=self.teamId).numberOfUnitsInTeam(withTag="PilotTpPoint",withinrange=150)<1 
    and 
    createMarker(x=memory.onTeleportToSLTarget.x,y=memory.onTeleportToSLTarget.y,teamId=self.teamId).numberOfUnitsInAllyNotOwnTeam(withTag="PilotTpPoint",withinrange=150)<1 
)
"""
setUnitMemory:onTeleportToSL=false,onDaze=false

[hiddenAction_Check_TeleportToSLTimer]
autoTrigger:if memory.onTeleportToSL==true and self.timeAlive>memory.onTeleportToSLTimer
setUnitMemory:onTeleportToSL=false,onDaze=false
sendMessageTo:parent
sendMessageWithTags:TeleportToSL_ByUnit
sendMessageWithData:UnitInfo=memory.onTeleportToSLTarget
spawnEffects:Flash_1_S
playSoundAtUnit:ROOT:Resource/Sound/SE/Action/Event/Leave_1.ogg:0.25



