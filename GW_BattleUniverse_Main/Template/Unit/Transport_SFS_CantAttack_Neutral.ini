
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Unit/Transport_SFS.ini
"""


whileNeutralTransportAnyTeam:true
whileNeutralConvertToTransportedTeam:true

[attachment_UnitSlot0]
canAttack:false


[hiddenAction_ChangeTeamToNeutralWhenNoTransportingUnit]
autoTrigger:if true
switchToTeam:select(self.transportingCount>0,self.attachment(slot="UnitSlot0").teamID,-1)

[hiddenAction_Check_SlotUnitStats]
autoTrigger:if self.transportingCount>0 and self.transporting(slot=0).readUnitMemory('close',type='bool')==true
forceUnloadTransportNow:true