
[core]
dont_load:true

copyFrom:"""
ROOT:Template/Unit/Skill/AutoRepair_Turret.gw,
ROOT:Template/Unit/Skill/CanBeDetected_NoUseBattleCore.ini,
Turret_CanNotBeTarget.ini
"""

tags:UnitTurret
name:Turret_CanBeTarget


isUnselectable:true
isUnselectableAsTarget:false
canNotBeGivenOrdersByPlayer:true
#canNotBeDamaged:true
stayNeutral:true

@memory damageToCoreModifier:float

@memory finalReactionLevel:float

@memory finalBeamDef:float
@memory finalShellDef:float
@memory finalCqbDef:float

@memory finalBeamDefPlus:float
@memory finalShellDefPlus:float
@memory finalCqbDefPlus:float

@memory extraBuildingDef:float

@memory getSupplyTimer:float

@memory burnedFrame:float
@memory lowHpFrame:float
@memory stunFrame:float


[hiddenAction_Get_Detected]
autoTriggerOnEvent:newMessage(withTag="Detected")
requireConditional:"""
if true
"""

[hiddenAction_InitializeStats]
autoTriggerOnEvent:created
setUnitMemory:"""
damageToCoreModifier=1
"""
temporarilyAddTags:CanBeTargetUnit,CanSupplyUnit


[hiddenAction_CheckCanBeTargetUnit]
autoTrigger:true
alsoTriggerAction:"""
CheckCanBeTargetUnit_T,
CheckCanBeTargetUnit_F
"""
[hiddenAction_CheckCanBeTargetUnit_T]
requireConditional:if self.hp>0 and not self.hasTags(includes='CanBeTargetUnit') and parent.hasTags(includes='CanBeTargetUnit')
temporarilyAddTags:CanBeTargetUnit

[hiddenAction_CheckCanBeTargetUnit_F]
requireConditional:if (self.hp<=0 or  not parent.hasTags(includes='CanBeTargetUnit')) and self.hasTags(includes='CanBeTargetUnit')
temporarilyRemoveTags:CanBeTargetUnit




[hiddenAction_GetStats]
setUnitMemory:"""
attackRuleMode=parent.readUnitMemory("attackRuleMode",type="float"),
close=parent.readUnitMemory("close",type="bool"),

finalAttackRange=parent.readUnitMemory("finalAttackRange",type="float"),

finalShootLevel=parent.readUnitMemory("finalShootLevel",type="float"),
finalCqbLevel=parent.readUnitMemory("finalCqbLevel",type="float"),
finalAccuracyLevel=parent.readUnitMemory("finalAccuracyLevel",type="float"),
finalReactionLevel=parent.readUnitMemory("finalReactionLevel",type="float"),

finalBeamDef=parent.readUnitMemory("finalBeamDef",type="float"),
finalShellDef=parent.readUnitMemory("finalShellDef",type="float"),
finalCqbDef=parent.readUnitMemory("finalCqbDef",type="float"),

finalBeamDefPlus=parent.readUnitMemory("finalBeamDefPlus",type="float"),
finalShellDefPlus=parent.readUnitMemory("finalShellDefPlus",type="float"),
finalCqbDefPlus=parent.readUnitMemory("finalCqbDefPlus",type="float"),

extraBuildingDef=parent.readUnitMemory("extraBuildingDef",type="float"),
extraBuildingAtk=parent.readUnitMemory("extraBuildingAtk",type="float")
"""






[hiddenAction_TookDamage]
autoTriggerOnEvent:newMessage(withTag="Damage")
setUnitStats:hp=self.hp-eventData(name="Damage",type="float")
setUnitMemory:lastDamageBy=eventData(name="LastDamageBy",type="unit")






[hiddenAction_Get_RecoverByOther]
autoTriggerOnEvent:newMessage(withTag="RecoverByOther")
setResourcesWithLogic:"""
hp=self.hp
+eventData("RecoverHp",type="float")
+self.maxHp*eventData("RecoverHpPer",type="float")
"""
alsoTriggerAction:Get_RecoverByOther_Shield,Get_RecoverByOther_GetSupply
[hiddenAction_Get_RecoverByOther_Shield]
setResourcesWithLogic:"""
shield=self.shield
+eventData("RecoverShield",type="float")
+self.maxShield*eventData("RecoverShieldPer",type="float")
"""

[hiddenAction_Get_RecoverByOther_GetSupply]
setUnitMemory:getSupplyTimer=self.timeAlive+2












[hiddenAction_Die]
autoTrigger:"""
if self.hp<=0 and memory.breaked==false
"""
setUnitMemory:breaked=true
spawnEffects:Explosion_Ground_1



[hiddenAction_Send_BreakedInfo]
autoTrigger:"""
if memory.breaked==true
"""
sendMessageTo:parent
sendMessageWithTags:BreakedPartsInfo


[hiddenAction_Get_RepairDone]
autoTriggerOnEvent:newMessage(withTag="RepairDone")
setUnitStats:hp=self.maxHp
setUnitMemory:breaked=false
















[hiddenAction_UpdateFrame]
autoTrigger:true
alsoTriggerAction:"""
UpdateBurnedFrame,
UpdateStunFrame,
UpdateLowHpFrame
"""



[hiddenAction_UpdateBurnedFrame]
setUnitMemory:burnedFrame=select(memory.burnedFrame>=${decal_Burned.total_frames}-0.5,0,memory.burnedFrame+0.5)
[hiddenAction_UpdateStunFrame]
setUnitMemory:stunFrame=select(memory.stunFrame>=${decal_Stun.total_frames}-0.5,0,memory.stunFrame+0.5)
[hiddenAction_UpdateLowHpFrame]
setUnitMemory:lowHpFrame=select(memory.lowHpFrame>=${decal_LowHp.total_frames}-0.5,0,memory.lowHpFrame+0.5)





[decal_Burned]
layer:beforeUI
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Unit/Image/Burned_1.png
alpha:0.85
total_frames:5
frame:memory.burnedFrame
imageScale:1.5
onlyOnNonPreview:true
isVisible:if false
onlyWhileAlive:true
[decal_Stun]
layer:beforeUI
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Unit/Image/Stun_1.png
alpha:0.85
total_frames:5
frame:memory.stunFrame
imageScale:0.85
onlyOnNonPreview:true
isVisible:if memory.breaked==true
onlyWhileAlive:true
[decal_LowHp]
layer:beforeUI
onlyTeam:any
order:1
image:ROOT:Resource/Image/Fx/Unit/Image/LowHp_1.png
alpha:0.75
total_frames:8
frame:memory.lowHpFrame
imageScale:1.0
onlyOnNonPreview:true
isVisible:if self.hp<self.maxHp*0.25
onlyWhileAlive:true
[decal_Marker]
layer:shadow
onlyTeam:enemy
order:1
image:ROOT:Resource/Image/Units/Hud/Marker/Marker.png
alpha:0.5
imageScale:0.5
xOffsetAbsolute:0
yOffsetAbsolute:0
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.timeAlive>0.1 and not self.tags(includes='UnDetected') and self.hp>0
onlyWhileAlive:true




[decal_HpBar_Self]
layer:beforeUI
order:2
image:SHARED:white_pixel.png
color:#54ffaf
onlyWhenSelectedByAnyPlayer:true
onlyTeam:own
alpha:1
imageScale:1
imageScaleX:30*((self.hp/self.maxHp))
imageScaleY:3
xOffsetAbsolute:(15*((self.hp/self.maxHp)))-15
yOffsetAbsolute:25
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0 and self.hp>0 
onlyWhileAlive:true
[decal_HpBar_Ally]
@copyFromSection:decal_HpBar_Self
color:#ffeb54
onlyTeam:allynotown
[decal_HpBar_Enemy]
@copyFromSection:decal_HpBar_Self
color:#ff0b07
onlyTeam:enemy
[decal_HpBar_BackGround]
layer:beforeUI
order:1
image:SHARED:white_pixel.png
color:#000000
onlyWhenSelectedByAnyPlayer:true
onlyTeam:ally
alpha:1
imageScale:1.1
imageScaleX:30
imageScaleY:5
xOffsetAbsolute:0
yOffsetAbsolute:25
alwaysStartDirAtZero:true
onlyOnNonPreview:true
isVisible:if self.readUnitMemory(name="hideUI", type="float")==0  and self.teamId>=0
onlyWhileAlive:true
[decal_HpBar_BackGround_Enemy]
@copyFromSection:decal_HpBar_BackGround
onlyTeam:enemy












[attachment_DamageCheckerCore]
x:0
y:0
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
prioritizeParentsMainTarget:true
smoothlyBlendPositionWhenExistingUnitAdded:true
onConvertKeepExistingUnitInSameSlot:true
onParentTeamChangeKeepCurrentTeam:false
onCreateSpawnUnitOf:DamageChecker_UnitTurret