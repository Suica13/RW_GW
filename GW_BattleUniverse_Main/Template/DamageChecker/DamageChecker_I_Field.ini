
[core]
copyFrom:"""
ROOT:Resource/Image/Fx/Common/Critical_1.gw,
ROOT:Resource/Image/Fx/Unit/Dodge_1.gw
"""

dont_load:false

tags:UnitTurret
name:DamageChecker_I_Field


showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true
#disableDeathOnZeroHp:true

buildSpeed: 0.001
radius: 20

showInEditor:false

isUnselectable:true
canNotBeGivenOrdersByPlayer:false
canNotBeDamaged:true
stayNeutral:true

autoTriggerCheckRate:every8Frames

numBitsOnDeath:0
effectOnDeath:none
hideScorchMark:true




@memory thisTimeDamageType:float
#0=未知 1=格斗 2=射击 3=特殊
@memory thisTimeTookDamageTile:float
@memory thisTimeTookDamageSize:float

@memory thisTimeTookDamage:float
@memory thisTimeTookDamageAP:float
@memory thisTimeShieldTookDamage:float
@memory thisTimeTookDpDamage:float

@memory thisTimeShieldBlock:bool
@memory thisTimeTookDamageFromBack:bool

@memory thisTimeReaction:float
@memory thisTimeDodge:bool

@memory coreUnit:unit

@memory lastDamageBy:unit

@memory dodgeTimer:float
@memory thisTimeDamaged:bool
@memory dodgeClearTimer:float

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
GetCoreUnit,
Start
"""

[hiddenAction_GetCoreUnit]
setUnitMemory:coreUnit=parent

[hiddenAction_Start]
isVisible:false
temporarilyAddTags:CanBeDamagedOnlyBeam

[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
CheckParentAlive,
CheckCanBeDamagedOnlyBeam,
CheckParentParentHeight
"""
[hiddenAction_CheckParentAlive]
requireConditional:if parent.hp<=0
#deleteSelf:true

[hiddenAction_CheckCanBeDamagedOnlyBeam]
alsoTriggerAction:"""
CheckCanBeDamagedOnlyBeamTrue,
CheckCanBeDamagedOnlyBeamFalse
"""
[hiddenAction_CheckCanBeDamagedOnlyBeamTrue]
requireConditional:if (parent.parent.hp<=0 or parent.parent.tags(includes="ShowSlot")) and parent.readUnitMemory("I_FieldActive",type="bool")==true and not self.tags(includes='CanBeDamagedOnlyBeam')
temporarilyAddTags:CanBeDamagedOnlyBeam

[hiddenAction_CheckCanBeDamagedOnlyBeamFalse]
requireConditional:if ((parent.parent.hp>0 and not parent.parent.tags(includes="ShowSlot")) or parent.readUnitMemory("I_FieldActive",type="bool")==false) and self.tags(includes='CanBeDamagedOnlyBeam')
temporarilyRemoveTags:CanBeDamagedOnlyBeam

[hiddenAction_CheckParentParentHeight]
setHeight:"""
select
(
    parent.parent.hp>0,
    parent.parent.height,
    parent.height
)
"""


[hiddenAction_Get_TryDamage]
autoTriggerOnEvent:newMessage(withTag="TryDamage")
setUnitMemory:"""
thisTimeDamaged=
(
    eventData("accuracy",type="float")*
    select
    (
        distanceBetween(parent.getOffsetRelative(y=5), eventData("bulletInfo",type="unit"))>=distanceBetween(self.getOffsetRelative(y=-5), eventData("bulletInfo",type="unit")),
        1,
        select(parent.readUnitMemory("battleUnitCore",type="unit").readUnitMemory("pilotAwakeningSkill",type="float")>=100,1.25,1.5)
    )
    >
    parent.readUnitMemory("finalReactionLevel",type="float")*rnd(0.35,1.35)*0.01
    *(1+(memory.dodgeTimer*0.030))
)
"""
alsoTriggerAction:"""
Get_TryDamage_F,
Get_TryDamage_T
"""
[hiddenAction_Get_TryDamage_T]
requireConditional:"""
if memory.thisTimeDamaged==true
"""
setUnitMemory:"""
thisTimeDamaged=false,
dodgeTimer=memory.dodgeTimer+select(memory.dodgeTimer<=8,1,0),
dodgeClearTimer=self.timeAlive+10
"""
sendMessageTo:eventData(name="bulletInfo",type="unit")
sendMessageWithTags:DoDamage
sendMessageWithData:"""
damageTarget=self
"""
[hiddenAction_Get_TryDamage_F]
requireConditional:"""
if memory.thisTimeDamaged==false
"""
setUnitMemory:"""
dodgeTimer=0
"""
[hiddenAction_AutoClearDodgeTimer]
autoTrigger:true
requireConditional:"""
if memory.dodgeTimer>0 and self.timeAlive>memory.dodgeClearTimer
"""
setUnitMemory:dodgeTimer=0

[hiddenAction_TookDamage_Shoot_Beam_Blast]
autoTriggerOnEvent:newMessage(withTag="Damage_Shoot_Beam_Blast")
requireConditional:if not parent.tags(includes='ExplosiveReactiveArmor_Beam')
alsoTriggerAction:TookDamage_Shoot_Beam
[hiddenAction_TookDamage_Shoot_Beam]
autoTriggerOnEvent:newMessage(withTag="Damage_Shoot_Beam")
alsoTriggerAction:"""
MathDamage_Tile,
MathDamage_Size,
MathThisTimeTookDamageFromBack,
MathThisTimeShieldBlock,
MathThisTimeDodge,
MathDamage_Shoot_Beam,
MathDamage_Shoot_Beam_AP,
MathDamage_FromBack,
MathDamage_Dodge,
MathDamage_Size,
MathDamage_UnDetected,
MathDamage_Zero,
MathDamage_Random,
MathDamage_Pilot,
MathDamage_Pilot_ACE,
MathDamage_ReEntry,
MathDamage_Final
"""
setUnitMemory:"""
thisTimeDamageType=2,
thisTimeReaction=rnd(0,parent.readUnitMemory(name="finalReactionLevel",type="float"))
"""


[hiddenAction_MathDamage_Tile]
setUnitMemory:"""
thisTimeTookDamageTile=1*
select
(
    parent.resource().TileMode==0,
    select
    (
        parent.height>=10,
        eventData(name="AntiAir",type="float"),
        select
        (
            parent.height<1,
            eventData(name="AntiAqua",type="float"),
            eventData(name="AntiLand",type="float")
        )
    ),
    eventData(name="AntiSpace",type="float")
)
"""
[hiddenAction_MathDamage_Size]
setUnitMemory:"""
thisTimeTookDamageSize=1
*select
(
    parent.tags(includes='LargeUnit'),
    eventData(name="AntiSizeLargeDamage",type="float"),
    1
)
*select
(
    parent.tags(includes='SmallUnit'),
    eventData(name="AntiSizeSmallDamage",type="float"),
    1
)
"""
[hiddenAction_MathThisTimeTookDamageFromBack]
setUnitMemory:"""
thisTimeTookDamageFromBack=select
(
    distanceBetween(self.getOffsetRelative(y=0), eventData(name="bulletInfo",type="unit"))>distanceBetween(self.getOffsetRelative(y=-20), eventData(name="bulletInfo",type="unit")),
    true,
    false
)
"""
[hiddenAction_MathThisTimeDodge]
requireConditional:"""
if memory.thisTimeReaction
*select
(
    memory.thisTimeTookDamageFromBack==true,
    0.5,
    1
)
*0.01
*rnd(0.25,0.75)
>=
eventData(name="Accuracy",type="float")
*select
(
    parent.tags(includes='LargeUnit'),
    eventData(name="AntiSizeLargeAccuracy",type="float"),
    1
)
*select
(
    parent.tags(includes='SmallUnit'),
    eventData(name="AntiSizeSmallAccuracy",type="float"),
    1
)
"""
setUnitMemory:thisTimeDodge=true

[hiddenAction_MathThisTimeShieldBlock]
requireConditional:"""
if parent.readUnitMemory("finalShieldBlockPR",type="float")*100>rnd(0,101) and parent.shield>0
"""
setUnitMemory:thisTimeShieldBlock=true

[hiddenAction_MathDamage_Shoot_Beam]
setUnitMemory:"""
thisTimeTookDamage=
(
    memory.thisTimeTookDamage+
    (
        eventData(name="BeamDamage",type="float")
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        -parent.readUnitMemory(name="finalBeamDefPlus", type="float")
    )*
    (
        1-parent.readUnitMemory(name="finalBeamDef", type="float")*0.01
    )
),
thisTimeTookDpDamage=
(
    memory.thisTimeTookDpDamage+
    (
        eventData(name="DpDamage",type="float")
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        -parent.readUnitMemory(name="finalDpDefPlus", type="float")
    )*
    (
        1-parent.readUnitMemory(name="finalDpDef", type="float")*0.01
    )
)
*select
(
    parent.readUnitMemory("flyUnit",type="float")==1 and parent.height>=15,
    1.25,
    1
)
"""
[hiddenAction_MathDamage_Shoot_Beam_AP]
setUnitMemory:"""
thisTimeTookDamage=
(
    memory.thisTimeTookDamage+
    (
        eventData(name="BeamAPDamage",type="float")
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        *
        (
            1-parent.readUnitMemory(name="finalBeamDef", type="float")/4*0.01
        )
    )
),
thisTimeTookDamageAP=
(
    memory.thisTimeTookDamageAP+
    (
        eventData(name="BeamAPDamage",type="float")
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        *
        (
            1-parent.readUnitMemory(name="finalBeamDef", type="float")/4*0.01
        )
    )
)
"""

[hiddenAction_MathDamage_FromBack]
requireConditional:"""
if 
memory.thisTimeTookDamageFromBack==true and memory.thisTimeDodge==false
"""
setUnitMemory:"""
thisTimeTookDamage=memory.thisTimeTookDamage*1.25,
thisTimeTookDamageAP=memory.thisTimeTookDamageAP*1.25,
thisTimeTookDpDamage=memory.thisTimeTookDpDamage*1.25
"""
spawnEffects:Critical_1
[hiddenAction_MathDamage_Dodge]
requireConditional:"""
if memory.thisTimeDodge==true
"""
setUnitMemory:"""
thisTimeTookDamage=memory.thisTimeTookDamage*select(eventData(name="CantDodge",type="float")==0,0.35,0.7),
thisTimeTookDamageAP=memory.thisTimeTookDamageAP*select(eventData(name="CantDodge",type="float")==0,0.35,0.7),
thisTimeTookDpDamage=memory.thisTimeTookDpDamage*select(eventData(name="CantDodge",type="float")==0,0.35,0.7)
"""
spawnEffects:Dodge_1
[hiddenAction_MathDamage_UnDetected]
setUnitMemory:"""
thisTimeTookDamage=memory.thisTimeTookDamage
*select
(
    parent.tags(includes='UnDetected'),
    0.5,
    1
),
thisTimeTookDamageAP=memory.thisTimeTookDamageAP
*select
(
    parent.tags(includes='UnDetected'),
    0.5,
    1
),
thisTimeTookDpDamage=memory.thisTimeTookDpDamage
*select
(
    parent.tags(includes='UnDetected'),
    0.5,
    1
)
"""
[hiddenAction_MathDamage_Zero]
setUnitMemory:"""
thisTimeTookDamage=select(memory.thisTimeTookDamage<0,0,memory.thisTimeTookDamage),
thisTimeTookDamageAP=select(memory.thisTimeTookDamageAP<0,0,memory.thisTimeTookDamageAP),
thisTimeTookDpDamage=select(memory.thisTimeTookDpDamage<0,0,memory.thisTimeTookDpDamage)
"""
[hiddenAction_MathDamage_Random]
setUnitMemory:"""
thisTimeTookDamage=memory.thisTimeTookDamage*rnd(0.75,1),
thisTimeTookDamageAP=memory.thisTimeTookDamageAP*rnd(0.75,1),
thisTimeTookDpDamage=memory.thisTimeTookDpDamage*rnd(0.75,1)
"""
[hiddenAction_MathDamage_Pilot]
requireConditional:if memory.coreUnit.readUnitMemory("pilotUnit",type="unit").hp>0
setUnitMemory:"""
thisTimeTookDamage=memory.thisTimeTookDamage*
(
    1-
    select
    (
        memory.coreUnit.tags(includes='CmdUnit'),
        (memory.coreUnit.readUnitMemory("pilotUnit",type="unit").readUnitMemory("pilotLeadershipSkill",type="float")-100),
        (memory.coreUnit.readUnitMemory("pilotUnit",type="unit").readUnitMemory("pilotDefSkill",type="float")-100)
    )*0.2*0.01
),
thisTimeTookDamageAP=memory.thisTimeTookDamageAP*
(
    1-
    select
    (
        memory.coreUnit.tags(includes='CmdUnit'),
        (memory.coreUnit.readUnitMemory("pilotUnit",type="unit").readUnitMemory("pilotLeadershipSkill",type="float")-100),
        (memory.coreUnit.readUnitMemory("pilotUnit",type="unit").readUnitMemory("pilotDefSkill",type="float")-100)
    )*0.2*0.01
),
thisTimeTookDpDamage=memory.thisTimeTookDpDamage*
(
    1-
    select
    (
        memory.coreUnit.tags(includes='CmdUnit'),
        (memory.coreUnit.readUnitMemory("pilotUnit",type="unit").readUnitMemory("pilotLeadershipSkill",type="float")-100),
        (memory.coreUnit.readUnitMemory("pilotUnit",type="unit").readUnitMemory("pilotDefSkill",type="float")-100)
    )*0.1*0.01
)
"""
[hiddenAction_MathDamage_Pilot_ACE]
requireConditional:if memory.coreUnit.readUnitMemory("pilotUnit",type="unit").tags(includes='Pilot_ACE')
setUnitMemory:"""
thisTimeTookDamage=memory.thisTimeTookDamage*0.5,
thisTimeShieldTookDamage=memory.thisTimeShieldTookDamage*0.5,
thisTimeTookDpDamage=memory.thisTimeTookDpDamage*0.75
"""
[hiddenAction_MathDamage_ReEntry]
requireConditional:if parent.tags(includes='ReEntry')
setUnitMemory:"""
thisTimeTookDamage=memory.thisTimeTookDamage*1.5,
thisTimeShieldTookDamage=memory.thisTimeShieldTookDamage*1.5
"""
[hiddenAction_MathDamage_Final]
setUnitMemory:"""
thisTimeTookDamage=memory.thisTimeTookDamage,

thisTimeTookDpDamage=memory.thisTimeTookDpDamage,

lastDamageBy=eventData(name="attacker",type="unit")
"""
alsoTriggerAction:"""
Send_Unit_Damage,
Send_BattleUnitCore_LastDamageBy,
Send_I_Field_Damage,
ClearThisTimeTookDamageInfo
"""
[hiddenAction_Send_Unit_Damage]
sendMessageTo:parent
sendMessageWithTags:Damage
sendMessageWithData:"""
Damage=memory.thisTimeTookDamage*(1-parent.readUnitMemory("I_FieldLevel",type="float"))+memory.thisTimeTookDamageAP*0.5,
DpDamage=memory.thisTimeTookDpDamage*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
ShieldDamage=memory.thisTimeShieldTookDamage*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
BackAttack=memory.thisTimeTookDamageFromBack,

PartBreakModifier=eventData(name="PartBreakModifier",type="float")*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
CockpitBreakModifier=eventData(name="CockpitBreakModifier",type="float")*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
PilotDamageModifier=eventData(name="PilotDamageModifier",type="float")*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
PilotTrueDamage=eventData(name="PilotTrueDamage",type="float")*(1-parent.readUnitMemory("I_FieldLevel",type="float"))
"""
[hiddenAction_Send_BattleUnitCore_LastDamageBy]
sendMessageTo:parent.readUnitMemory(name="BattleUnitCore", type="unit")
sendMessageWithTags:LastDamageBy
sendMessageWithData:"""
UnitLevel=parent.readUnitMemory(name="unitLevel",type="float"),
UnitHpMax=parent.maxHp,
Damage=memory.thisTimeTookDamage*(1-parent.readUnitMemory("I_FieldLevel",type="float"))+memory.thisTimeTookDamageAP*0.5,
DpDamage=memory.thisTimeTookDpDamage*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
DamageType=memory.thisTimeDamageType,
Miss=memory.thisTimeDodge,
PartBreakModifier=eventData(name="PartBreakModifier",type="float")*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
CockpitBreakModifier=eventData(name="CockpitBreakModifier",type="float")*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
PilotDamageModifier=eventData(name="PilotDamageModifier",type="float")*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
PilotTrueDamage=eventData(name="PilotTrueDamage",type="float")*(1-parent.readUnitMemory("I_FieldLevel",type="float")),
LastDamageBy=memory.lastDamageBy
"""
[hiddenAction_Send_I_Field_Damage]
sendMessageTo:parent
sendMessageWithTags:I_Field_Damage
sendMessageWithData:"""
Damage=memory.thisTimeTookDamage*(parent.readUnitMemory("I_FieldLevel",type="float"))+memory.thisTimeTookDamageAP*0.5,
DpDamage=memory.thisTimeTookDpDamage*(parent.readUnitMemory("I_FieldLevel",type="float")),
ShieldDamage=memory.thisTimeShieldTookDamage*(parent.readUnitMemory("I_FieldLevel",type="float")),
BackAttack=memory.thisTimeTookDamageFromBack
"""
[hiddenAction_ClearThisTimeTookDamageInfo]
setUnitMemory:"""
thisTimeTookDamage=0,
thisTimeTookDamageAP=0,
thisTimeShieldTookDamage=0,
thisTimeTookDpDamage=0,
thisTimeTookDamageFromBack=false,
thisTimeShieldBlock=false,
thisTimeDamageType=0,
thisTimeTookDamageTile=0,
thisTimeTookDamageSize=0,
thisTimeDodge=false
"""




[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true



[graphics]
image:SHARED:blank.png
disableLowHpFire:true
disableLowHpSmoke:true
showQueueBar:false
showHealthBar:false
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: NONE




[ai]
useAsTransport:false
useAsBuilder: false

[decal_Test]
image:ROOT:Resource/Image/Ring/Ring16_Blue.png
isVisible:false