
[core]
copyFrom:"""
ROOT:Template/DamageChecker/DamageChecker.ini
"""

name:DamageChecker_UnitTurret
[hiddenAction_CheckCanBeDamagedTrue]
requireConditional:if (parent.parent.parent.hp<=0 or parent.parent.parent.tags(includes="ShowSlot")) and parent.hp>0 and not self.tags(includes='CanBeDamaged')
temporarilyAddTags:CanBeDamaged

[hiddenAction_CheckCanBeDamagedFalse]
requireConditional:if (parent.parent.parent.hp>0 and not parent.parent.parent.tags(includes="ShowSlot") or parent.hp<=0) and self.tags(includes='CanBeDamaged')
temporarilyRemoveTags:CanBeDamaged



[hiddenAction_MathDamage_Final]
alsoTriggerAction:"""
Send_Unit_Damage,
Send_BattleUnitCore_LastDamageBy,

Send_Unit_Damage_ToCore,
Send_BattleUnitCore_LastDamageBy_ToCore,

ClearThisTimeTookDamageInfo
"""




[hiddenAction_Send_Unit_Damage_ToCore]
@copyFromSection:hiddenAction_Send_Unit_Damage
sendMessageTo:parent.parent
sendMessageWithData:"""
Damage=memory.thisTimeTookDamage*parent.readUnitMemory("damageToCoreModifier",type="float"),
DpDamage=memory.thisTimeTookDpDamage*parent.readUnitMemory("damageToCoreModifier",type="float"),
ShieldDamage=memory.thisTimeShieldTookDamage*parent.readUnitMemory("damageToCoreModifier",type="float"),
BackAttack=memory.thisTimeTookDamageFromBack
"""
[hiddenAction_Send_BattleUnitCore_LastDamageBy_ToCore]
@copyFromSection:hiddenAction_Send_BattleUnitCore_LastDamageBy
sendMessageTo:parent.parent.readUnitMemory(name="BattleUnitCore", type="unit")
sendMessageWithData:"""
UnitLevel=parent.parent.readUnitMemory(name="unitLevel",type="float"),
UnitHpMax=parent.parent.maxHp,
Damage=memory.thisTimeTookDamage*parent.readUnitMemory("damageToCoreModifier",type="float"),
DpDamage=memory.thisTimeTookDpDamage*parent.readUnitMemory("damageToCoreModifier",type="float"),
DamageType=memory.thisTimeDamageType*parent.readUnitMemory("damageToCoreModifier",type="float"),
Miss=memory.thisTimeDodge
"""