
[core]
copyFrom:"""
ROOT:Template/DamageChecker/DamageChecker.ini
"""

name:DamageChecker_PSA

@memory psa_damage:float

[hiddenAction_TookDamage_Shoot_Shell_Blast]
autoTriggerOnEvent:newMessage(withTag="Damage_Shoot_Shell_Blast")
requireConditional:if not parent.tags(includes='ExplosiveReactiveArmor_Shell')
alsoTriggerAction:TookDamage_Shoot_Shell
[hiddenAction_TookDamage_Shoot_Shell]
autoTriggerOnEvent:newMessage(withTag="Damage_Shoot_Shell")
alsoTriggerAction:"""
MathDamage_Tile,
MathDamage_Size,
MathThisTimeTookDamageFromBack,
MathThisTimeShieldBlock,
MathThisTimeDodge,
MathDamage_Shoot_Shell,
MathDamage_Shoot_Shell_AP,
MathDamage_FromBack,
MathDamage_Dodge,
MathDamage_Size,
MathDamage_UnDetected,
MathDamage_Zero,
MathDamage_Random,
MathDamage_Pilot,
MathDamage_Pilot_ACE,
MathDamage_ReEntry,
MathDamage_Final
"""
setUnitMemory:"""
thisTimeDamageType=2,
thisTimeReaction=rnd(0,parent.readUnitMemory(name="finalReactionLevel",type="float"))
"""


[hiddenAction_MathDamage_Shoot_Shell]
setUnitMemory:"""
psa_damage=
(
    memory.psa_damage+
    (
        eventData(name="ShellDamage",type="float")
        *select(parent.readUnitMemory("PSAActive",type="bool")==true,parent.readUnitMemory("PSALevel",type="float"),0)
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        -parent.readUnitMemory(name="finalShellDefPlus", type="float")
    )*
    (
        1-parent.readUnitMemory(name="finalShellDef", type="float")*0.01
    )
)
*select
(
    parent.tags(includes='ExplosiveReactiveArmor_Shell'),
    0.85,
    1
),
thisTimeTookDamage=
(
    memory.thisTimeTookDamage+
    (
        eventData(name="ShellDamage",type="float")
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        -parent.readUnitMemory(name="finalShellDefPlus", type="float")
    )*
    (
        1-parent.readUnitMemory(name="finalShellDef", type="float")*0.01
    )
)
*select
(
    parent.tags(includes='ExplosiveReactiveArmor_Shell'),
    0.85,
    1
),
thisTimeShieldTookDamage=
(
    memory.thisTimeShieldTookDamage+
    (
        eventData(name="ShellDamage",type="float")
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        -parent.readUnitMemory(name="shieldShellDefPlus", type="float")
    )*
    (
        1-parent.readUnitMemory(name="shieldShellDef", type="float")*0.01
    )*
    select(parent.shield>0 and memory.thisTimeShieldBlock==true,parent.readUnitMemory(name="finalShieldSize", type="float"),0)
),
thisTimeTookDpDamage=
(
    memory.thisTimeTookDpDamage+
    (
        eventData(name="DpDamage",type="float")
        *select(parent.readUnitMemory("PSAActive",type="bool")==true,(1-(parent.readUnitMemory("PSALevel",type="float")/4)),1)
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        -parent.readUnitMemory(name="finalDpDefPlus", type="float")
        -select(parent.shield>0 and memory.thisTimeShieldBlock==true,parent.readUnitMemory(name="shieldDpDefPlus", type="float"),0)
    )*
    (
        1-parent.readUnitMemory(name="finalDpDef", type="float")*0.01
    )
    *select
    (
        parent.shield>0 and memory.thisTimeShieldBlock==true,
        1-parent.readUnitMemory(name="shieldDpDef", type="float")*0.01,
        1
    )
)
*select
(
    parent.readUnitMemory("flyUnit",type="float")==1 and parent.height>=15,
    1.25,
    1
)
*select
(
    parent.tags(includes='ExplosiveReactiveArmor_Shell'),
    0.85,
    1
)
"""
[hiddenAction_MathDamage_Shoot_Shell_AP]
setUnitMemory:"""
psa_damage=
(
    memory.psa_damage+
    (
        eventData(name="ShellAPDamage",type="float")
        *select(parent.readUnitMemory("PSAActive",type="bool")==true,parent.readUnitMemory("PSALevel",type="float")/4,0)
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        *
        (
            1-parent.readUnitMemory(name="finalShellDef", type="float")/4*0.01
        )
    )
),
thisTimeTookDamage=
(
    memory.thisTimeTookDamage+
    (
        eventData(name="ShellAPDamage",type="float")
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        *
        (
            1-parent.readUnitMemory(name="finalShellDef", type="float")/4*0.01
        )
    )
)
"""
[hiddenAction_MathDamage_Cqb]
setUnitMemory:"""
psa_damage=
(
    memory.psa_damage+
    (
        (
            eventData(name="CqbShellDamage",type="float")
            *select(parent.readUnitMemory("PSAActive",type="bool")==true,parent.readUnitMemory("PSALevel",type="float")/2,0)
            *memory.thisTimeTookDamageTile
            *memory.thisTimeTookDamageSize
            -parent.readUnitMemory(name="finalCqbDefPlus", type="float")
        )*
        (
            1-parent.readUnitMemory(name="finalShellDef", type="float")*0.01
        )
    )
),
thisTimeTookDamage=
(
    memory.thisTimeTookDamage+
    (
        (
            eventData(name="CqbDamage",type="float")
            *memory.thisTimeTookDamageTile
            *memory.thisTimeTookDamageSize
            -parent.readUnitMemory(name="finalCqbDefPlus", type="float")
        )*
        (
            1-parent.readUnitMemory(name="finalCqbDef", type="float")*0.01
        )

        +
        (
            eventData(name="CqbBeamDamage",type="float")
            *memory.thisTimeTookDamageTile
            *memory.thisTimeTookDamageSize
            -parent.readUnitMemory(name="finalCqbDefPlus", type="float")
        )*
        (
            1-parent.readUnitMemory(name="finalBeamDef", type="float")*0.01
        )

        +
        (
            eventData(name="CqbShellDamage",type="float")
            *memory.thisTimeTookDamageTile
            *memory.thisTimeTookDamageSize
            -parent.readUnitMemory(name="finalCqbDefPlus", type="float")
        )*
        (
            1-parent.readUnitMemory(name="finalShellDef", type="float")*0.01
        )
    )
),
thisTimeShieldTookDamage=
(
    memory.thisTimeShieldTookDamage+
    (
        (
            eventData(name="BeamDamage",type="float")
            *memory.thisTimeTookDamageTile
            *memory.thisTimeTookDamageSize
            -parent.readUnitMemory(name="shieldBeamDefPlus", type="float")
        )*
        (
            1-parent.readUnitMemory(name="shieldBeamDef", type="float")*0.01
        )
        +
        (
            eventData(name="ShellDamage",type="float")
            *memory.thisTimeTookDamageTile
            *memory.thisTimeTookDamageSize
            -parent.readUnitMemory(name="shieldShellDefPlus", type="float")
        )*
        (
            1-parent.readUnitMemory(name="shieldShellDef", type="float")*0.01
        )
        +
        (
            eventData(name="CqbDamage",type="float")
            *memory.thisTimeTookDamageTile
            *memory.thisTimeTookDamageSize
            -parent.readUnitMemory(name="shieldCqbDefPlus", type="float")
        )*
        (
            1-parent.readUnitMemory(name="shieldCqbDef", type="float")*0.01
        )
    )*
    select(parent.shield>0 and memory.thisTimeShieldBlock==true,parent.readUnitMemory(name="finalShieldSize", type="float"),0)
),
thisTimeTookDpDamage=
(
    memory.thisTimeTookDpDamage+
    (
        eventData(name="DpDamage",type="float")
        *memory.thisTimeTookDamageTile
        *memory.thisTimeTookDamageSize
        -parent.readUnitMemory(name="finalDpDefPlus", type="float")
        -select(parent.shield>0 and memory.thisTimeShieldBlock==true,parent.readUnitMemory(name="shieldDpDefPlus", type="float"),0)
    )*
    (
        1-parent.readUnitMemory(name="finalDpDef", type="float")*0.01
    )
    *select
    (
        parent.shield>0 and memory.thisTimeShieldBlock==true,
        1-parent.readUnitMemory(name="shieldDpDef", type="float")*0.01,
        1
    )
)
"""
[hiddenAction_MathDamage_FromBack]
setUnitMemory:"""
psa_damage=memory.psa_damage*1.25,
thisTimeTookDamage=memory.thisTimeTookDamage*1.25,
thisTimeShieldTookDamage=memory.thisTimeShieldTookDamage*1.25,
thisTimeTookDpDamage=memory.thisTimeTookDpDamage*1.25
"""
[hiddenAction_MathDamage_Dodge]
setUnitMemory:"""
psa_damage=memory.psa_damage*select(eventData(name="CantDodge",type="float")==0,0.35,0.7),
thisTimeTookDamage=memory.thisTimeTookDamage*select(eventData(name="CantDodge",type="float")==0,0.35,0.7),
thisTimeShieldTookDamage=memory.thisTimeShieldTookDamage*select(eventData(name="CantDodge",type="float")==0,0.35,0.7),
thisTimeTookDpDamage=memory.thisTimeTookDpDamage*select(eventData(name="CantDodge",type="float")==0,0.35,0.7)
"""
[hiddenAction_MathDamage_UnDetected]
setUnitMemory:"""
psa_damage=memory.psa_damage
*select
(
    parent.tags(includes='UnDetected'),
    0.5,
    1
),
thisTimeTookDamage=memory.thisTimeTookDamage
*select
(
    parent.tags(includes='UnDetected'),
    0.5,
    1
),
thisTimeShieldTookDamage=memory.thisTimeShieldTookDamage
*select
(
    parent.tags(includes='UnDetected'),
    0.5,
    1
),
thisTimeTookDpDamage=memory.thisTimeTookDpDamage
*select
(
    parent.tags(includes='UnDetected'),
    0.5,
    1
)
"""
[hiddenAction_MathDamage_Zero]
setUnitMemory:"""
psa_damage=select(memory.psa_damage<0,0,memory.psa_damage),
thisTimeTookDamage=select(memory.thisTimeTookDamage<0,0,memory.thisTimeTookDamage),
thisTimeShieldTookDamage=select(memory.thisTimeShieldTookDamage<0,0,memory.thisTimeShieldTookDamage),
thisTimeTookDpDamage=select(memory.thisTimeTookDpDamage<0,0,memory.thisTimeTookDpDamage)
"""
[hiddenAction_MathDamage_Random]
setUnitMemory:"""
psa_damage=memory.psa_damage*rnd(0.75,1),
thisTimeTookDamage=memory.thisTimeTookDamage*rnd(0.75,1),
thisTimeShieldTookDamage=memory.thisTimeShieldTookDamage*rnd(0.75,1),
thisTimeTookDpDamage=memory.thisTimeTookDpDamage*rnd(0.75,1)
"""

[hiddenAction_MathDamage_Final]
setUnitMemory:"""
thisTimeTookDamage=
max
(
    memory.thisTimeTookDamage
    -select
    (
        parent.shield>0,
        memory.thisTimeShieldTookDamage,
        0
    ) 
    -select 
    (
        parent.readUnitMemory("PSAActive",type="bool")==true,
        memory.psa_damage,
        0
    ),
    0
),

thisTimeTookDpDamage=
(
    memory.thisTimeTookDpDamage
),

lastDamageBy=eventData(name="attacker",type="unit")
"""
[hiddenAction_ClearThisTimeTookDamageInfo]
alsoTriggerAction:PSA_SendDamage
[hiddenAction_PSA_SendDamage]
sendMessageTo:parent
sendMessageWithTags:psa_damage
sendMessageWithData:"""
Damage=memory.psa_damage
"""
alsoTriggerAction:PSA_ClearDamage
[hiddenAction_PSA_ClearDamage]
setUnitMemory:"""
psa_damage=0
"""
