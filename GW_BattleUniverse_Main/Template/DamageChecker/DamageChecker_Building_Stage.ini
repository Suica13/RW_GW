
[core]
copyFrom:"""
DamageChecker_Building.ini
"""

name:DamageChecker_Building_Stage

@memory nearestUnit:unit

[hiddenAction_CheckNearestUnit]
autoTrigger:if self.numberOfUnitsInAllTeams(withTag="CanCaptureUnit",withinrange=80)>0 
setUnitMemory:nearestUnit=self.nearestUnit(withTag='CanCaptureUnit',withinRange=80)
alsoTriggerAction:CheckNearestUnit_UpdateTeam
[hiddenAction_CheckNearestUnit_UpdateTeam]
requireConditional:if memory.nearestUnit.height<=5
switchToTeam:"""
select
(
    memory.nearestUnit.teamId>=0 and memory.nearestUnit.hp>0,
    memory.nearestUnit.teamId,
    parent.teamId
)
"""
alsoTriggerAction:"""
CheckNearestUnit_SendParentCover
"""
[hiddenAction_CheckNearestUnit_SendParentCover]
sendMessageTo:parent
sendMessageWithTags:CoverTarget
sendMessageWithData:Unit=memory.nearestUnit.readUnitMemory('battleUnitCore',type='unit')
