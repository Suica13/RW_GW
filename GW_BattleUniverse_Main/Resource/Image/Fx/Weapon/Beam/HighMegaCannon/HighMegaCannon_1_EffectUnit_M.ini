
[core]
dont_load:false

tags:EffectUnit,UnitTurret

name:HighMegaCannon_1_EffectUnit_M

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory HighMegaCannon_1_effectFrame:float
@memory HighMegaCannon_1_color:float
@global HighMegaCannon_1_total_frames=28

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""

[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
GetColor,
ChangeColor
"""

[hiddenAction_SetStats]
setUnitMemory:HighMegaCannon_1_effectFrame=-1

[hiddenAction_GetColor]
setUnitMemory:"""
HighMegaCannon_1_color=parent.readUnitMemory('HighMegaCannon_1_color',type='float')
"""

[hiddenAction_ChangeColor]
alsoTriggerAction:"""
ChangeColor_Pink,
ChangeColor_Yellow,
ChangeColor_Blue
"""
[hiddenAction_ChangeColor_Pink]
requireConditional:if memory.HighMegaCannon_1_color==1
convertTo:HighMegaCannon_1_EffectUnit_M_Pink
[hiddenAction_ChangeColor_Yellow]
requireConditional:if memory.HighMegaCannon_1_color==2
convertTo:HighMegaCannon_1_EffectUnit_M_Yellow
[hiddenAction_ChangeColor_Blue]
requireConditional:if memory.HighMegaCannon_1_color==5
convertTo:HighMegaCannon_1_EffectUnit_M_Blue


[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:1
maxTurnSpeed:1
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false


[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true

