
[core]

copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Template/Shoot_HighAPProjectile_Effect.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Hit_2_Green.gw
"""

name:Projectile_BeamSniper_Green_Effect

@memory highBeamCannonFrame:float
[hiddenAction_UpdateFrame]
autoTrigger:if memory.highBeamCannonFrame<=8
setUnitMemory:highBeamCannonFrame=memory.highBeamCannonFrame+0.1*self.Resource.BulletSpeed*self.resource().ProjectileSpeed


[attachment_Effect_Start]
x:0
y:185
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:Projectile_BeamSniper_Green_Effect_S

[attachment_Effect_Mid]
x:0
y:530
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:Projectile_BeamSniper_Green_Effect_M

[attachment_Effect_End]
x:0
y:885
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:Projectile_BeamSniper_Green_Effect_E

[decal_Effect_Start]
layer:beforeUI
onlyTeam:own
order:1
image: ROOT:Resource/Image/Fx/Weapon/Beam/Sniper/Image/BeamSniper_1_Start_Green.png

total_frames:9
frame:memory.highBeamCannonFrame

imageScale:1
imageScaleX:1.25
imageScaleY:1.25
alpha:1

yOffsetRelative:185
dirOffset:-90


onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if memory.highBeamCannonFrame<=9 and self.timeAlive>0.03


[decal_Effect_Mid]
