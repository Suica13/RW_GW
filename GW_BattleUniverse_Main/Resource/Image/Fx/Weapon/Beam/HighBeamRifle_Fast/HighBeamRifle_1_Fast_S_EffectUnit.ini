
[core]
dont_load:false

tags:EffectUnit,UnitTurret

name:HighBeamRifle_1_Fast_S_EffectUnit

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory onPlay:float
@memory HighBeamRifle_1_Fast_S_effectFrame:float

@memory HighBeamRifle_1_Fast_S_color:float
@memory HighBeamRifle_1_Fast_S_speed:float

@global HighBeamRifle_1_Fast_S_total_frames=10

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
UpdateFrame,
EndPlay
"""



[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true



[hiddenAction_SetStats]
setUnitMemory:HighBeamRifle_1_Fast_S_effectFrame=-1

[hiddenAction_PlayOneTime]
autoTriggerOnEvent:newMessage(withTag="PlayOneTime")
setUnitMemory:onPlay=1,HighBeamRifle_1_Fast_S_effectFrame=0

[hiddenAction_StopPlay]
autoTriggerOnEvent:newMessage(withTag="StopPlay")
setUnitMemory:onPlay=0,HighBeamRifle_1_Fast_S_effectFrame=-1

[hiddenAction_UpdateFrame]
requireConditional:if memory.onPlay==1 and memory.HighBeamRifle_1_Fast_S_effectFrame<=${HighBeamRifle_1_Fast_S_total_frames}
setUnitMemory:HighBeamRifle_1_Fast_S_effectFrame=memory.HighBeamRifle_1_Fast_S_effectFrame+0.009*memory.HighBeamRifle_1_Fast_S_speed

[hiddenAction_EndPlay]
requireConditional:if memory.HighBeamRifle_1_Fast_S_effectFrame>${HighBeamRifle_1_Fast_S_total_frames} or parent.readUnitMemory(name="BattleUnitCore", type="unit").readUnitMemory(name="cantAction", type="bool")==true
setUnitMemory:onPlay=0,HighBeamRifle_1_Fast_S_effectFrame=-1



[hiddenAction_SetSpeed]
autoTriggerOnEvent:newMessage(withTag="SetSpeed")
setUnitMemory:HighBeamRifle_1_Fast_S_speed=eventData("Speed",type="float")*self.Resource.BulletSpeed

[hiddenAction_SetColor_Pink]
autoTriggerOnEvent:newMessage(withTag="SetColor_Pink")
setUnitMemory:HighBeamRifle_1_Fast_S_color=1

[hiddenAction_SetColor_Yellow]
autoTriggerOnEvent:newMessage(withTag="SetColor_Yellow")
setUnitMemory:HighBeamRifle_1_Fast_S_color=2

[hiddenAction_SetColor_Blue]
autoTriggerOnEvent:newMessage(withTag="SetColor_Blue")
setUnitMemory:HighBeamRifle_1_Fast_S_color=3

[hiddenAction_SetColor_Green]
autoTriggerOnEvent:newMessage(withTag="SetColor_Green")
setUnitMemory:HighBeamRifle_1_Fast_S_color=4

[hiddenAction_SetColor_Red_B]
autoTriggerOnEvent:newMessage(withTag="SetColor_Red_B")
setUnitMemory:HighBeamRifle_1_Fast_S_color=6


[attachment_Effect_Start]
x:0
y:65
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:HighBeamRifle_1_Fast_S_EffectUnit_S

[attachment_Effect_End]
x:0
y:215
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:HighBeamRifle_1_Fast_S_EffectUnit_E















