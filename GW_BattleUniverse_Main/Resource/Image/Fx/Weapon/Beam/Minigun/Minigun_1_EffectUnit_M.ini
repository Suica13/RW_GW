
[core]
dont_load:false

tags:EffectUnit

name:Minigun_1_EffectUnit_M

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory Minigun_1_effectFrame:float
@memory Minigun_1_color:float
@global Minigun_1_total_frames=28

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
UpdateData
"""

[hiddenAction_SetStats]
setUnitMemory:Minigun_1_effectFrame=-1

[hiddenAction_UpdateData]
setUnitMemory:"""
Minigun_1_effectFrame=parent.readUnitMemory('Minigun_1_effectFrame',type='float'),
Minigun_1_color=parent.readUnitMemory('Minigun_1_color',type='float')
"""


[decal_Effect_Start_Pink]
layer:beforeUI
onlyTeam:notOwn
order:1
image: SHARED:blank.png

total_frames:${Minigun_1_total_frames}
frame:memory.Minigun_1_effectFrame

imageScale:0.5
imageScaleY:0.5
alpha:select(memory.Minigun_1_effectFrame>=0,1,0)

xOffsetRelative: 0
yOffsetRelative: 0
dirOffset:-90

onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if memory.Minigun_1_color==1 and self.timeAlive>1

[decal_Effect_Start_Yellow]
@copyFromSection:decal_Effect_Start_Pink
image: SHARED:blank.png
isVisible:if memory.Minigun_1_color==2 and self.timeAlive>1

[decal_Effect_Start_Green]
@copyFromSection:decal_Effect_Start_Pink
image: SHARED:blank.png
isVisible:if memory.Minigun_1_color==4 and self.timeAlive>1

[decal_Effect_Start_Red_B]
@copyFromSection:decal_Effect_Start_Pink
image: SHARED:blank.png
isVisible:if memory.Minigun_1_color==6 and self.timeAlive>1

[decal_Effect_Start_Shell]
@copyFromSection:decal_Effect_Start_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Minigun/Image/Minigun_1_Mid_Shell.png
isVisible:if memory.Minigun_1_color==10 and self.timeAlive>1

[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:1
maxTurnSpeed:1
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false

