
[core]
dont_load:false

copyFrom:"""
ROOT:Resource/Image/Fx/Common/Common_Flash_1.gw
"""

tags:EffectUnit,UnitTurret

name:Beam_Charge_4_EffectUnit

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory onPlay:float

@memory playLoop:bool

@memory Beam_Charge_4_effectFrame:float

@memory Beam_Charge_4_color:float
@memory Beam_Charge_4_speed:float
@memory Beam_Charge_4_size:float

@global Beam_Charge_4_total_frames=12

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
UpdateFrame,
EndPlay
"""



[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true



[hiddenAction_SetStats]
setUnitMemory:Beam_Charge_4_effectFrame=-1

[hiddenAction_PlayOneTime]
autoTriggerOnEvent:newMessage(withTag="PlayOneTime")
setUnitMemory:onPlay=1,Beam_Charge_4_effectFrame=0
spawnEffects:Flash_1_S

[hiddenAction_PlayLoop]
autoTriggerOnEvent:newMessage(withTag="PlayLoop")
setUnitMemory:onPlay=1,Beam_Charge_4_effectFrame=0,playLoop=true
playSoundAtUnit:ROOT:Resource/Sound/SE/Action/Common/CriticalAttack_1.ogg:1.0
spawnEffects:Flash_1_S

[effect_Flash_1_S]
yOffsetRelative:20

[hiddenAction_StopPlay]
autoTriggerOnEvent:newMessage(withTag="StopPlay")
setUnitMemory:onPlay=0,Beam_Charge_4_effectFrame=-1,playLoop=false


[hiddenAction_UpdateFrame]
alsoTriggerAction:"""
UpdateFrame_OneTime,
UpdateFrame_Loop
"""
[hiddenAction_UpdateFrame_OneTime]
requireConditional:if memory.onPlay==1 and memory.Beam_Charge_4_effectFrame<=12 and memory.playLoop==false
setUnitMemory:Beam_Charge_4_effectFrame=memory.Beam_Charge_4_effectFrame+0.01*memory.Beam_Charge_4_speed
[hiddenAction_UpdateFrame_Loop]
requireConditional:if memory.onPlay==1 and memory.playLoop==true
setUnitMemory:"""
Beam_Charge_4_effectFrame=
select
(
    memory.Beam_Charge_4_effectFrame<11.09,
    memory.Beam_Charge_4_effectFrame+0.01*memory.Beam_Charge_4_speed,
    0
)
"""

[hiddenAction_EndPlay]
requireConditional:if memory.Beam_Charge_4_effectFrame>12 or parent.readUnitMemory(name="BattleUnitCore", type="unit").readUnitMemory(name="cantAction", type="bool")==true
setUnitMemory:onPlay=0,Beam_Charge_4_effectFrame=-1



[hiddenAction_SetSpeed]
autoTriggerOnEvent:newMessage(withTag="SetSpeed")
setUnitMemory:Beam_Charge_4_speed=eventData("Speed",type="float")*self.Resource.BulletSpeed

[hiddenAction_SetSize]
autoTriggerOnEvent:newMessage(withTag="SetSize")
setUnitMemory:Beam_Charge_4_size=eventData('Size',type='float')

[hiddenAction_SetColor_Pink]
autoTriggerOnEvent:newMessage(withTag="SetColor_Pink")
setUnitMemory:Beam_Charge_4_color=1
[hiddenAction_SetColor_Yellow]
autoTriggerOnEvent:newMessage(withTag="SetColor_Yellow")
setUnitMemory:Beam_Charge_4_color=2
[hiddenAction_SetColor_Blue]
autoTriggerOnEvent:newMessage(withTag="SetColor_Blue")
setUnitMemory:Beam_Charge_4_color=3
[hiddenAction_SetColor_Green]
autoTriggerOnEvent:newMessage(withTag="SetColor_Green")
setUnitMemory:Beam_Charge_4_color=4

[decal_Beam_Charge_4_Pink]
layer:beforeUI
onlyTeam:any
order:1
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_4_Pink.png

total_frames:${Beam_Charge_4_total_frames}
frame:memory.Beam_Charge_4_effectFrame

imageScale:0.45*memory.Beam_Charge_4_size
alpha:select(memory.Beam_Charge_4_effectFrame>=0,1,0)

yOffsetRelative:20

onlyOnNonPreview:true
onlyWhileAlive:true
isVisible:if memory.Beam_Charge_4_color==1 and self.timeAlive>1
[decal_Beam_Charge_4_Yellow]
@copyFromSection:decal_Beam_Charge_4_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_4_Yellow.png
isVisible:if memory.Beam_Charge_4_color==2 and self.timeAlive>1
[decal_Beam_Charge_4_Blue]
@copyFromSection:decal_Beam_Charge_4_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_4_Blue.png
isVisible:if memory.Beam_Charge_4_color==3 and self.timeAlive>1
[decal_Beam_Charge_4_Green]
@copyFromSection:decal_Beam_Charge_4_Pink
image: ROOT:Resource/Image/Fx/Weapon/Beam/Charge/Image/Beam_Charge_4_Green.png
isVisible:if memory.Beam_Charge_4_color==4 and self.timeAlive>1



[graphics]
image:SHARED:blank.png
icon_zoomed_out_neverShow:true

[attack]
canAttack:false


[movement]
movementType: Air
moveSpeed:0
maxTurnSpeed:100
targetHeight:1
targetHeightDrift:0



[ai]
useAsTransport:false
useAsBuilder: false

