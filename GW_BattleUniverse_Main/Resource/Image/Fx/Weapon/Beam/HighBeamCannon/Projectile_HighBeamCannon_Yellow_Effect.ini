
[core]

copyFrom:"""
ROOT:Units/BattleUnits/Weapon/Template/Shoot_HighAPProjectile_Effect.ini,
ROOT:Resource/Image/Fx/Weapon/Beam/Common/Beam_Hit_2_Yellow.gw
"""

name:Projectile_HighBeamCannon_Yellow_Effect

@memory highBeamCannonFrame:float

[hiddenAction_UpdateFrame]
autoTrigger:if memory.highBeamCannonFrame<=15
setUnitMemory:highBeamCannonFrame=memory.highBeamCannonFrame+0.1*self.Resource.BulletSpeed*self.resource().ProjectileSpeed

[attachment_Effect_Start]
x:0
y:130
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:Projectile_HighBeamCannon_Yellow_Effect_S

[attachment_Effect_Mid]
x:0
y:432
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:Projectile_HighBeamCannon_Yellow_Effect_M

[attachment_Effect_End]
x:0
y:684
isVisible:true
keepAliveWhenParentDies:false
canBeAttackedAndDamaged:false
isUnselectable:true
canAttack:false
showAllActionsFrom:true
onConvertKeepExistingUnitInSameSlot:true
idleDir:0
resetRotationWhenNotAttacking:true
onCreateSpawnUnitOf:Projectile_HighBeamCannon_Yellow_Effect_E




[decal_Effect_Start]
layer:beforeUI
onlyTeam:own
order:1
image: ROOT:Resource/Image/Fx/Weapon/Beam/HighBeamCannon/Image/HighBeamCannon_1_Yellow_Start.png

total_frames:16
frame:memory.highBeamCannonFrame

imageScale:0.5
alpha:1

yOffsetRelative:130
dirOffset:-90


onlyOnNonPreview:true
