
[core]
dont_load:false

tags:EffectUnit,UnitTurret

name:LargeHighMegaCannon_1_EffectUnit

showOnMinimap:false
price: 5000
maxHp: 99999
mass: 50000

disableAllUnitCollisions:true

buildSpeed: 0.001
radius: 1
fogOfWarSightRange:0

isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDamaged:true

showInEditor:false

autoTriggerCooldownTime_allowDangerousHighCPU:true
autoTriggerCooldownTime:0.01s

@memory onPlay:float
@memory LargeHighMegaCannon_1_effectFrame:float

@memory LargeHighMegaCannon_1_color:float
@memory LargeHighMegaCannon_1_speed:float

@global LargeHighMegaCannon_1_total_frames=28

[hiddenAction_Awake]
autoTriggerOnEvent:created
alsoTriggerAction:"""
Start
"""

[hiddenAction_Start]
alsoTriggerAction:"""
SetStats
"""



[hiddenAction_Update]
autoTrigger:true
alsoTriggerAction:"""
UpdateFrame,
EndPlay
"""



[hiddenAction_Get_UnitTurretRemove]
autoTriggerOnEvent:newMessage(withTag="UnitTurretRemove")
deleteSelf:true



[hiddenAction_SetStats]
setUnitMemory:LargeHighMegaCannon_1_effectFrame=-1

[hiddenAction_PlayOneTime]
autoTriggerOnEvent:newMessage(withTag="PlayOneTime")
setUnitMemory:onPlay=1,LargeHighMegaCannon_1_effectFrame=0
playSoundAtUnit:ROOT:\Resource\Sound\SE\Weapon\Fire\BeamCannon_2.ogg:3.0

[hiddenAction_StopPlay]
autoTriggerOnEvent:newMessage(withTag="StopPlay")
setUnitMemory:onPlay=0,LargeHighMegaCannon_1_effectFrame=-1


[hiddenAction_UpdateFrame]
requireConditional:if memory.onPlay==1 and memory.LargeHighMegaCannon_1_effectFrame<=${LargeHighMegaCannon_1_total_frames}
setUnitMemory:LargeHighMegaCannon_1_effectFrame=memory.LargeHighMegaCannon_1_effectFrame+0.009*memory.LargeHighMegaCannon_1_speed

[hiddenAction_EndPlay]
requireConditional:if memory.LargeHighMegaCannon_1_effectFrame>${LargeHighMegaCannon_1_total_frames} or parent.readUnitMemory(name="BattleUnitCore", type="unit").readUnitMemory(name="cantAction", type="bool")==true
setUnitMemory:onPlay=0,LargeHighMegaCannon_1_effectFrame=-1



[hiddenAction_SetSpeed]
autoTriggerOnEvent:newMessage(withTag="SetSpeed")
setUnitMemory:LargeHighMegaCannon_1_speed=eventData("Speed",type="float")*self.Resource.BulletSpeed

[hiddenAction_SetColor_Pink]
autoTriggerOnEvent:newMessage(withTag="SetColor_Pink")
setUnitMemory:LargeHighMegaCannon_1_color=1
[hiddenAction_SetColor_Yellow]
autoTriggerOnEvent:newMessage(withTag="SetColor_Yellow")
setUnitMemory:LargeHighMegaCannon_1_color=2



